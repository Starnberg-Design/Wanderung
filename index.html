<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wanderkanal – Prototyp</title>
<style>
:root{--bg:#0e1b15;--panel:#16281f;--panel2:#1d3529;--line:#2c4a3a;--txt:#e8f1ea;--dim:#9db5a5;--acc:#4cc38a;--acc2:#2f9e6b;--warn:#ffb54a;--bad:#ff7a59;--blue:#4aa8e8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
h1,h2,h3,h4{margin:0 0 .5em}h2{font-size:1.35em}h3{font-size:1.1em}
small,.dim{color:var(--dim)}
button,select,input{font:inherit;color:var(--txt)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--acc2);border-color:var(--acc);color:#fff;font-weight:600}
button.on{background:var(--acc2);border-color:var(--acc)}
button.hl{box-shadow:0 0 0 2px var(--blue)}
button.big{padding:12px 18px;font-size:1.05em}
input[type=text],input:not([type]),select{background:#0f2018;border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.screen{display:none;min-height:100vh}.screen.active{display:block}
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px}
.center h1{font-size:2.6em}.sub{color:var(--dim)}
.col{display:flex;flex-direction:column;gap:10px;min-width:240px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 12px}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}.row.gap{gap:8px;flex-wrap:wrap}
.lbl{min-width:100px;color:var(--dim)}.val{min-width:70px;text-align:center}
.sw{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid #fff3;vertical-align:middle}
.stat{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.ctl{display:flex;align-items:center;gap:6px}.pips{letter-spacing:2px;color:var(--acc);min-width:100px;text-align:center}
.hint{color:var(--dim);font-size:.9em}
#prev{display:block;margin:0 auto 10px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.hike .facts{display:flex;flex-direction:column;gap:3px;margin:8px 0 12px;font-size:.9em;color:var(--dim)}
.vid{padding:8px 0;border-bottom:1px solid var(--line)}.vbar{height:6px;background:#0f2018;border-radius:4px;margin:5px 0;overflow:hidden}.vbar i{display:block;height:100%;background:var(--acc)}.vnum{font-size:.9em}
/* Shop */
.shopgrid{display:grid;grid-template-columns:1fr 340px;gap:14px}@media(max-width:900px){.shopgrid{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.item.packed{border-color:var(--acc)}
.ico{font-size:2em;width:48px;text-align:center}.ico img{width:44px;height:44px;object-fit:contain}
.inf{flex:1;display:flex;flex-direction:column;gap:2px}
.qty{min-width:24px;text-align:center}
.side{position:sticky;top:10px;align-self:start}
.pl{list-style:none;padding:0;margin:8px 0;max-height:230px;overflow:auto;font-size:.92em}.pl li{padding:2px 0}
.meter{margin-bottom:8px}.mbar{position:relative;height:12px;background:#0f2018;border-radius:6px;overflow:visible;margin:4px 0}.mbar i{display:block;height:100%;background:var(--acc);border-radius:6px}.mbar i.warn{background:var(--warn)}.mbar i.bad{background:var(--bad)}.mbar b{position:absolute;top:-3px;width:2px;height:18px;background:#fff}
.warnbox{border-radius:8px;padding:7px 10px;margin:6px 0;font-size:.88em;border:1px solid var(--line)}
.warnbox.bad{background:#4a1f17;border-color:var(--bad)}.warnbox.warn{background:#4a3a17;border-color:var(--warn)}.warnbox.info{background:#173a4a;border-color:var(--blue)}
.badtxt{color:var(--bad);font-weight:600}
/* Hike */
#s-hike{background:#08110d}
.stagewrap{max-width:1000px;margin:0 auto;padding:8px}
#stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;user-select:none}
#cv{width:100%;height:100%;display:block;cursor:crosshair}
.ov{position:absolute;pointer-events:none}
#tl{left:10px;top:10px}#bars{left:10px;top:108px;width:170px}#tr{right:10px;top:10px}#actline{left:50%;top:10px;transform:translateX(-50%)}
.tbox{background:rgba(10,20,15,.68);backdrop-filter:blur(3px);border:1px solid #ffffff22;border-radius:10px;padding:7px 10px;font-size:.82em;line-height:1.5}
.tbox.r{text-align:right}.tbox.mid{font-size:.95em;font-weight:600}
.b{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:.95em}.b span{width:74px}.b div{flex:1;height:9px;background:#0009;border-radius:5px;overflow:hidden}.b i{display:block;height:100%;background:var(--acc)}
.b.low i{background:var(--bad)}.b.wet i{background:var(--blue)}
#toasts{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:4px;max-width:58%;pointer-events:none}
.toast{background:rgba(10,20,15,.82);border-left:3px solid var(--dim);padding:5px 9px;border-radius:6px;font-size:.82em;animation:in .25s;transition:opacity .6s}
.toast.good{border-color:var(--acc)}.toast.bad{border-color:var(--bad)}.toast.out{opacity:0}
@keyframes in{from{transform:translateX(-10px);opacity:0}to{transform:none;opacity:1}}
#dock{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}.prow canvas{flex:1;min-width:0;height:56px}#ptxt{min-width:120px;font-size:.9em;text-align:right}
.ctrls{display:grid;grid-template-columns:1fr 1.15fr 1.5fr;gap:8px}@media(max-width:860px){.ctrls{grid-template-columns:1fr}}
.cbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px}.cbox>b{display:block;margin-bottom:6px}
.chk{display:flex;gap:6px;align-items:center;font-size:.86em;margin:3px 0}
.rec input[type=range]{width:100%;accent-color:var(--acc)}.rlabels{display:flex;justify-content:space-between;font-size:.75em;color:var(--dim)}#rechint{font-size:.82em;margin:4px 0;color:var(--dim);min-height:2.4em}
.dv{font-size:.8em;background:#0f2018;border-radius:10px;padding:2px 7px}.dv.low{color:var(--warn)}.dv.dead{color:var(--bad)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:5px}.acts button{font-size:.83em;padding:6px 6px}
/* Modal */
#modal{display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.open{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--acc);border-radius:14px;padding:18px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
#modal .btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.cliplist{max-height:320px;overflow:auto}.clip{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.9em}
.rar{font-style:normal;font-size:.72em;padding:1px 6px;border-radius:8px;color:#fff;margin-left:4px}
.forecast{background:var(--panel2);border-radius:8px;padding:10px;margin:10px 0}
</style>
</head>

/* ---- Gepäck ---- */
const packedGear=()=>GEAR.filter(g=>G.packed[g.id]&&G.owned[g.id]);
const slotOf=cat=>packedGear().find(g=>g.cat===cat)||null;
function consKg(){let k=0;for(const id in G.cons){const c=gearById(id);if(c)k+=c.kg*G.cons[id]}return k}
const gearKg=()=>packedGear().reduce((a,g)=>a+g.kg,0);

/* ---- Route erzeugen ---- */
function buildRoute(hk,seed){
  const rng=mulberry32(seed);
  const stages=[];let acc=0,prev=hk.startAlt;
  hk.stages.forEach((s,i)=>{stages.push({i,b:s.b,km0:acc,km:s.km,x0:acc*PPK,x1:(acc+s.km)*PPK,a0:prev,a1:s.alt});acc+=s.km;prev=s.alt});
  const totalPx=acc*PPK;
  const N=Math.ceil((totalPx+2400)/10)+2;const elev=new Float32Array(N);
  const ph=[rng()*6.28,rng()*6.28,rng()*6.28];let si=0;
  for(let i=0;i<N;i++){
    const x=i*10;while(si<stages.length-1&&x>=stages[si].x1)si++;
    const st=stages[si];const t=clamp((x-st.x0)/(st.x1-st.x0),0,1);const s=t*t*(3-2*t);
    const amp=BIOMES[st.b].noise*hk.rough;
    elev[i]=lerp(st.a0,st.a1,s)+amp*(0.6*Math.sin(x*0.011+ph[0])+0.3*Math.sin(x*0.027+ph[1])+0.1*Math.sin(x*0.06+ph[2]));
  }
  const feats=[];let fid=0;const add=o=>{o.id=fid++;feats.push(o)};
  stages.forEach(st=>{
    const L=st.x1-st.x0;
    const nW=Math.max(1,Math.round(st.km/(st.b==='berg'?7:4.5)));
    for(let k=0;k<nW;k++)add({type:'quelle',x:st.x0+L*((k+0.25+rng()*0.5)/nW)});
    if(st.b!=='berg'){
      const nR=st.b==='tal'?1+(rng()<0.5?1:0):(rng()<0.55?1:0);
      for(let k=0;k<nR;k++)add({type:'fluss',x:st.x0+L*(0.12+rng()*0.76),bridge:rng()<0.55});
    }
    const sg=SIGHTS[st.b];add({type:'sight',x:st.x0+L*(0.25+rng()*0.5),s:sg[Math.floor(rng()*sg.length)]});
    let jx=st.x0+(1.5+rng()*2)*PPK;
    while(jx<st.x1-PPK){add({type:'junction',x:jx});jx+=(3.5+rng()*3)*PPK}
  });
  const clean=feats.filter(f=>f.x>500&&f.x<totalPx-300);
  clean.sort((a,b)=>a.x-b.x);
  // Elemente, die zu dicht beieinander liegen, entzerren
  for(let i=1;i<clean.length;i++)if(clean[i].x-clean[i-1].x<160)clean[i].x=clean[i-1].x+160;
  return {stages,elev,feats:clean,totalPx,totalKm:acc};
}
function elevAt(x){const r=H.route.elev;const f=clamp(x,0,(r.length-2)*10)/10;const i=Math.floor(f);return lerp(r[i],r[i+1],f-i)}
function gradeAt(x){return (elevAt(x+10)-elevAt(x-10))/100}
function stageAt(x){const S=H.route.stages;for(let i=0;i<S.length;i++)if(x<S[i].x1)return S[i];return S[S.length-1]}
function netAt(x){return hash(Math.floor(x/250)+77)<BIOMES[stageAt(x).b].net}

/* ---- Wetter ---- */
function setWeather(type){
  const hk=H.hk,W=WEATHER[type];
  H.weather={type,until:H.t+rnd(120,420),wind:W.wind*rnd(0.75,1.3)*hk.wind,rainI:W.rain?W.rain*rnd(0.6,1.2)*(0.7+hk.extreme*0.6):0};
  if((type==='gewitter'||type==='sturm')&&H.started)spawnIcon({kind:'storm',x:H.x+260,e:type==='gewitter'?'⛈️':'🌪️',label:type==='gewitter'?'Gewitter':'Sturm',base:26,life:9});
}
function nextWeather(prev){
  const w=H.hk.weather;let tot=0;const ent=Object.entries(w).map(([k,v])=>{v=k===prev?v*0.4:v;tot+=v;return [k,v]});
  let r=Math.random()*tot;for(const [k,v] of ent){r-=v;if(r<=0)return k}return 'wolkig';
}
function updateWeather(){if(H.t>=H.weather.until)setWeather(nextWeather(H.weather.type))}

function computeEnv(){
  const hk=H.hk;const hour=(H.t/60)%24;const st=stageAt(H.x);const B=BIOMES[st.b];
  env.hour=hour;env.stage=st;env.biome=st.b;env.alt=elevAt(H.x);env.grade=gradeAt(H.x);
  const rise=hk.sunrise,set=hk.sunset;let l;
  if(hour<rise-0.75||hour>set+0.75)l=0;
  else if(hour<rise+0.75)l=(hour-(rise-0.75))/1.5;
  else if(hour>set-0.75)l=1-(hour-(set-0.75))/1.5;
  else l=1;
  const W=WEATHER[H.weather.type];
  env.sun=clamp(l,0,1);env.light=env.sun*W.dim;env.dark=1-env.light;
  const daily=Math.sin((hour-9)/24*2*Math.PI);
  env.temp=hk.temp+hk.amp*daily-(env.alt-hk.refAlt)*0.0065+W.dT;
  env.wind=H.weather.wind*B.wind;
  env.rainI=H.weather.rainI;
  env.precip=H.weather.rainI>0.05?(env.temp<1.5?'snow':'rain'):null;
  env.fog=H.weather.type==='nebel'?0.55:0;
  env.net=netAt(H.x);
}

function startHike(hikeId){
  const hk=HIKES.find(h=>h.id===hikeId);
  const route=buildRoute(hk,(Date.now()&0xfffffff)+7);
  const gear=packedGear();
  const g={pack:slotOf('pack'),shelter:slotOf('shelter'),bag:slotOf('bag'),mat:slotOf('mat'),mid:slotOf('mid'),shell:slotOf('shell'),shoes:slotOf('shoes'),
    tools:{},phones:gear.filter(x=>x.kind==='phone'),cam:gear.find(x=>x.kind==='cam')||null,drone:gear.find(x=>x.kind==='drone')||null,
    map:gear.find(x=>x.nav==='map')||null,offline:gear.some(x=>x.nav==='offline'),gps:gear.find(x=>x.nav==='gps')||null,
    solar:gear.some(x=>x.solar),waterCap:waterCapL(),gearKg:gearKg()};
  gear.forEach(x=>{if(x.tool)g.tools[x.tool]=true});
  const dev={};
  gear.filter(x=>x.cat==='rec').forEach(x=>{dev[x.id]={batt:100,broken:false,def:x}});
  if(g.gps)dev.gps={batt:100,broken:false,def:g.gps};
  const handhelds=gear.filter(x=>x.kind==='phone'||x.kind==='cam').sort((a,b)=>b.q-a.q);
  const food={};FOODS.forEach(f=>{if(G.cons[f.id])food[f.id]=G.cons[f.id]});
  const pb=gear.reduce((a,x)=>a+(x.pb||0),0);
  H={hk,route,g,dev,food,gas:(G.cons.gas||0)*5,pb,kit:g.tools.kit?3:0,spray:g.tools.spray?2:0,fireUses:g.tools.fire?20:0,
    x:0,km:0,phase:0,t:hk.startHour*60,dayIdx:Math.floor(hk.startHour*60/1440),awakeSince:hk.startHour*60-60,
    speed:1,walking:true,auto:true,autoStop:true,
    body:{energy:100,sat:88,hyd:92,warm:100,wet:0,hp:100},
    water:{clean:g.waterCap,dirty:0},
    rec:1,activeDev:handhelds[0]?handhelds[0].id:null,droneOn:true,droneTimer:DRONE_INT[1],shot:null,
    action:null,sleep:{active:false},camp:{pitched:false,x:0},fire:{lit:false,left:0,x:0},
    inj:{blister:0,sprain:0},sick:0,lost:{on:false,km:0},safeJunction:false,
    icons:[],clips:[],animalCd:20,hikerCd:60,droneToast:0,wasted:0,passive:0,started:false,ended:false,
    stats:{walkMin:0,camps:0,sleepH:0,junctionsLost:0,fires:0,animals:0},flash:0,camElev:0,modalOpen:false};
  H.weather={type:'klar',until:0,wind:2,rainI:0};
  setWeather(pick(Object.keys(hk.weather)));
  computeEnv();
  H.camElev=env.alt;
  G.cons={};G.hikes++;
  H.started=true;
  toast('Los geht\'s! '+hk.name+' · '+H.route.totalKm+' km','good');
  save();
}

/* ---------- Hilfsfunktionen ---------- */
function loadKg(){
  let k=H.g.gearKg;
  for(const id in H.food)k+=gearById(id).kg*H.food[id];
  k+=H.gas*(GAS.kg/5);
  k+=H.water.clean+H.water.dirty;
  return k;
}
const waterTotal=()=>H.water.clean+H.water.dirty;
const nearFire=()=>H.fire.lit&&Math.abs(H.x-H.fire.x)<90;
function nearWater(){return H.route.feats.find(f=>(f.type==='quelle'||f.type==='fluss')&&Math.abs(H.x-f.x)<90)||null}
function isInjured(){return H.inj.blister>H.t||H.inj.sprain>H.t||H.sick>H.t}

function navInfo(){
  const g=H.g;let best={q:0.12,label:'Kein Navi – nach Gefühl',note:''};
  if(g.map){let q=0.6;if(env.fog)q-=0.15;if(env.dark>0.6&&!g.tools.lamp)q-=0.2;if(H.body.wet>70)q-=0.1;if(q>best.q)best={q,label:'Landkarte & Kompass',note:''}}
  let phoneNote='';
  for(const p of g.phones){
    const d=H.dev[p.id];
    if(d.broken){phoneNote='Smartphone kaputt';continue}
    if(d.batt<=0){phoneNote='Akku leer';continue}
    if(!g.offline&&!env.net){phoneNote='Kein Netz';continue}
    if(0.82>best.q)best={q:0.82,label:'Smartphone',note:''};
  }
  if(g.gps){const d=H.dev.gps;if(d.broken)phoneNote='GPS kaputt';else if(d.batt<=0)phoneNote='GPS-Akku leer';else if(0.92>best.q)best={q:0.92,label:'GPS-Gerät',note:''}}
  if(best.q<=0.12&&phoneNote)best.note=phoneNote;
  return best;
}

/* ---------- Kamera ---------- */
function deviceOK(id){const d=H.dev[id];return d&&!d.broken&&d.batt>0}
function handheld(){
  if(H.activeDev&&deviceOK(H.activeDev))return H.dev[H.activeDev];
  const alt=Object.keys(H.dev).find(id=>H.dev[id].def.kind&&(H.dev[id].def.kind==='phone'||H.dev[id].def.kind==='cam')&&deviceOK(id));
  if(alt){H.activeDev=alt;toast('Wechsel auf '+H.dev[alt].def.name);return H.dev[alt]}
  return null;
}
function shotQ(def,scenic){
  const lightF=0.55+0.45*env.light;
  const wF={klar:1.08,wolkig:1,nebel:0.72,regen:0.8,gewitter:0.85,sturm:0.8}[H.weather.type];
  return def.q*lightF*wF*scenic*rnd(0.85,1.15);
}
function scenicNow(){
  let s=BIOMES[env.biome].scenic;
  if(H.route.feats.some(f=>f.type==='sight'&&Math.abs(f.x-H.x)<400))s*=1.5;
  return s;
}
function addClip(o){o.day=G.day;o.biome=env.biome;H.clips.push(o);return o}
function startShot(dev){
  const types=['selfie','landschaft','video','talk'];const w=[2,3,3,2];
  let r=Math.random()*10,ti=0;for(;ti<4;ti++){r-=w[ti];if(r<=0)break}
  const type=types[Math.min(ti,3)];
  const dur=CLIP_TYPES[type].dur*1.3*dev.def.time*rnd(0.85,1.15);
  H.shot={type,left:dur,dur,dev:dev.def.id};
}
function launchDrone(){
  if(env.wind>9||H.weather.type==='gewitter'||env.precip==='snow'){
    if(H.t-H.droneToast>90){toast('🛸 Zu windig/ungünstig für die Drohne.');H.droneToast=H.t}
    H.droneTimer=30;return;
  }
  H.dev.drone.batt-=22;
  if(H.dev.drone.batt<35)toast('🛸 Drohnen-Akku niedrig – Powerbank nutzen („Akku laden“).');
  H.shot={type:'drone',left:10,dur:10,dev:'drone'};
  H.droneTimer=DRONE_INT[H.rec];
}
function finishShot(){
  const s=H.shot;H.shot=null;if(!s||s.noclip)return;
  const T=CLIP_TYPES[s.type];const d=H.dev[s.dev];if(!d)return;
  if(s.type==='drone'&&env.wind>6&&Math.random()<0.04){d.broken=true;toast('💥 Die Drohne ist abgestürzt!','bad');return}
  const q=shotQ(d.def,s.type==='selfie'?1:scenicNow());
  addClip({key:s.type,type:s.type,name:T.n,e:T.e,q,value:T.base*q,rar:-1});
}
function rollShots(hr){
  if(env.light<0.2||H.rec===0)return;
  if(!H.shot){const dev=handheld();if(dev&&Math.random()<SHOT_RATE[H.rec]*hr)startShot(dev)}
  if(!H.shot&&H.droneOn&&H.g.drone&&H.dev.drone&&deviceOK('drone')&&H.dev.drone.batt>=35){
    H.droneTimer=Math.min(H.droneTimer,DRONE_INT[H.rec]);
    H.droneTimer-=hr*60;
    if(H.droneTimer<=0)launchDrone();
  }
}
function setRec(v){H.rec=v;H.droneTimer=Math.min(H.droneTimer,DRONE_INT[v])}

/* ---------- Kamera-Symbole (Tiere, Sehenswürdigkeiten, Wetter …) ---------- */
function spawnIcon(o){o.max=o.life;H.icons.push(o);return o}
function captureIcon(ic){
  if(ic.taken)return;
  if(H.rec===0){toast('📷 Aufnahme ist aus – stelle den Regler höher!');return}
  const dev=handheld();
  if(!dev){toast('📷 Kein funktionierendes Aufnahmegerät!','bad');return}
  ic.taken=true;
  const q=shotQ(dev.def,1.1);
  let name,e,value,rar=-1,key;
  if(ic.kind==='animal'){name=ic.a.name;e=ic.a.e;rar=ic.a.r;value=RARITY[rar].base*q*rnd(0.95,1.2);key='tier:'+ic.a.id;H.stats.animals++}
  else if(ic.kind==='sight'){name=ic.label;e=ic.e;value=ic.base*q;key='sight:'+ic.fid}
  else if(ic.kind==='storm'){name=ic.label;e=ic.e;value=ic.base*q;key='storm:'+ic.label}
  else {name=ic.label;e=ic.e;value=ic.base*q;key='hiker:'+H.clips.length}
  if(ic.kind==='animal'&&ic.a.danger&&Math.random()<ic.a.danger){
    if(H.g.tools.spray&&H.spray>0){H.spray--;value*=1.3;toast('🧴 '+ic.a.name+' greift an – du vertreibst ihn mit Spray! Dramatische Aufnahme (+30 %).','good')}
    else attackByAnimal(ic.a);
  }
  const c=addClip({key,type:ic.kind,name,e,q,value,rar});
  H.shot={type:'video',left:2*dev.def.time,dur:2*dev.def.time,dev:dev.def.id,noclip:true};
  dev.batt=Math.max(0,dev.batt-0.8);
  const rc=rar>=0?RARITY[rar]:null;
  toast('📷 '+e+' '+name+(rc?' ('+rc.name+')':'')+' aufgenommen · Qualität '+Math.round(q*100)+' %','good');
  return c;
}
function attackByAnimal(a){
  H.body.hp=Math.max(1,H.body.hp-(a.id==='bear'?28:14));
  for(const id in H.food)H.food[id]=Math.floor(H.food[id]*0.75);
  if(Math.random()<0.35)H.inj.sprain=H.t+1440;
  toast('⚠️ '+a.name+' greift an! Du verlierst Gesundheit und Proviant.','bad');
}
function spawnAnimal(){
  const cand=ANIMALS.filter(a=>a.b.includes(env.biome));if(!cand.length)return;
  let tot=cand.reduce((s,a)=>s+a.w,0),r=Math.random()*tot,a=cand[0];
  for(const c of cand){r-=c.w;if(r<=0){a=c;break}}
  spawnIcon({kind:'animal',a,x:H.x+rnd(230,420),life:7});
  toast('👀 '+a.e+' '+a.name+' in Sicht! ('+RARITY[a.r].name+')');
}
function updateIcons(dt){
  for(const ic of H.icons){
    if(ic.kind==='sight'){ if(H.x-ic.x>220)ic.dead=true; continue }
    if(ic.taken){ic.fade=(ic.fade||0)+dt;if(ic.fade>0.8)ic.dead=true;continue}
    ic.life-=dt;
    if(ic.life<=0){
      ic.dead=true;
      if(ic.kind==='animal'&&ic.a.danger&&!(H.g.tools.spray&&H.spray>0)&&Math.random()<ic.a.danger*0.3)attackByAnimal(ic.a);
    }
  }
  H.icons=H.icons.filter(i=>!i.dead);
}
function trackSights(){
  for(const f of H.route.feats){
    if(f.type!=='sight')continue;
    const d=f.x-H.x;
    if(d<330&&d>-200&&!f.iconMade){f.iconMade=true;spawnIcon({kind:'sight',fid:f.id,x:f.x,e:f.s.e,label:f.s.n,base:f.s.v,life:1e9});toast('📍 Sehenswürdigkeit voraus: '+f.s.n)}
  }
}

/* ---------- Aktionen ---------- */
function beginAction(kind,label,dur,done,opts={}){
  H.action={kind,label,dur,left:dur,done,resume:opts.force?true:(!!opts.resume&&H.walking)};
  H.walking=false;
}
function stepAction(h){
  const a=H.action;a.left-=h;
  if(a.left<=0){H.action=null;if(a.done)a.done();if(a.resume&&!H.action&&!H.camp.pitched&&!H.sleep.active)H.walking=true}
}
function eatFood(id){
  const f=FOODS.find(x=>x.id===id);if(!f||!H.food[id])return;
  H.food[id]--;H.body.sat=clamp(H.body.sat+f.sat,0,100);
  if(f.warm)H.body.warm=clamp(H.body.warm+f.warm,0,100);
  toast('🍽️ '+f.e+' '+f.name.replace(' (kochen)','')+' gegessen','good');
}
function drinkWater(dirtyOK){
  const w=H.water;const need=(100-H.body.hyd)/33;
  let amt=Math.min(need,0.6);
  const c=Math.min(amt,w.clean);w.clean-=c;let dirt=0;
  if(dirtyOK&&c<amt){dirt=Math.min(amt-c,w.dirty);w.dirty-=dirt}
  if(c+dirt<=0.01)return;
  H.body.hyd=clamp(H.body.hyd+(c+dirt)*33,0,100);
  toast('💧 '+(c+dirt).toFixed(1).replace('.',',')+' L getrunken');
  if(dirt>0.05&&Math.random()<0.4){H.sick=H.t+480;toast('🤢 Das Wasser war verunreinigt – du bist krank (8 h).','bad')}
}
function act(kind,arg){
  if(H.action||H.sleep.active||H.ended)return;
  const g=H.g;
  switch(kind){
    case 'walk':
      if(H.camp.pitched){toast('Baue zuerst dein Lager ab.');return}
      if(H.body.energy<=0){toast('Du bist zu erschöpft – rasten oder schlafen!','bad');return}
      H.stopReason=null;H.walking=!H.walking;break;
    case 'tent':
      if(H.camp.pitched){beginAction('tent','Baut Lager ab …',15,()=>{H.camp.pitched=false;toast('Lager abgebaut.')});return}
      if(!g.shelter){toast('Du hast keine Unterkunft dabei.');return}
      if(Math.abs(env.grade)>0.09){toast('Hier ist es zu steil zum Zelten.','bad');return}
      beginAction('tent','Baut '+g.shelter.name+' auf …',g.shelter.setup,()=>{H.camp.pitched=true;H.camp.x=H.x;H.stats.camps++;toast('⛺ Lager steht.','good')});break;
    case 'sleep':
      if(!H.camp.pitched&&g.shelter){toast('Baue zuerst dein Lager auf – oder schlafe ohne Schutz (Knopf „Draußen schlafen“).');return}
      startSleep();break;
    case 'sleepOut':startSleep();break;
    case 'fire':
      if(!g.tools.fire||H.fireUses<=0){toast('Kein Feuerstarter.');return}
      if(H.fire.lit&&nearFire()){toast('Das Feuer brennt bereits.');return}
      beginAction('fire','Macht Feuer …',20,()=>{
        H.fireUses--;
        const p=env.precip?(H.camp.pitched||env.biome==='wald'?0.6:0.3):0.92;
        if(Math.random()<p){H.fire={lit:true,left:240,x:H.x+60};H.stats.fires++;toast('🔥 Das Feuer brennt.','good')}else toast('Das Holz ist zu nass – Feuer fehlgeschlagen.','bad');
      });break;
    case 'eat':
      if(!H.food[arg]){return}
      beginAction('eat','Isst …',4,()=>eatFood(arg));break;
    case 'cook':{
      const f=FOODS.find(x=>x.id===arg);if(!f||!H.food[arg])return;
      const stove=g.tools.stove&&H.gas>=1;
      if(!stove&&!nearFire()){toast('Zum Kochen brauchst du Gaskocher + Gas oder ein Feuer in der Nähe.','bad');return}
      beginAction('cook','Kocht '+f.name.replace(' (kochen)','')+' …',15,()=>{if(!nearFire())H.gas=Math.max(0,H.gas-1);eatFood(arg)});break}
    case 'drink':
      if(H.water.clean<=0.05){
        if(H.water.dirty>0.05){showModal({title:'Unbehandeltes Wasser',text:'Du hast nur unbehandeltes Wasser. Trinken kann dich krank machen (ca. 40 %). Trotzdem trinken?',buttons:[{label:'Trinken',fn:()=>beginAction('drink','Trinkt …',2,()=>drinkWater(true))},{label:'Abbrechen'}]});return}
        toast('Kein Wasser dabei!','bad');return}
      beginAction('drink','Trinkt …',2,()=>drinkWater(false));break;
    case 'refill':{
      const f=nearWater();if(!f){toast('Keine Wasserstelle in der Nähe.');return}
      if(waterTotal()>=g.waterCap-0.05){toast('Deine Behälter sind schon voll.');return}
      const autoF=f.type==='fluss'&&g.tools.filter;
      beginAction('refill','Füllt Wasser auf …',8+(autoF?6:0),()=>{
        const room=g.waterCap-waterTotal();
        if(f.type==='quelle'){H.water.clean+=room;toast('💧 Quelle: '+room.toFixed(1).replace('.',',')+' L sauberes Wasser aufgefüllt.','good')}
        else if(autoF){H.water.clean+=room;toast('🚰 Flusswasser aufgefüllt und gefiltert ('+room.toFixed(1).replace('.',',')+' L).','good')}
        else{H.water.dirty+=room;toast('💧 Flusswasser aufgefüllt (unbehandelt!) – filtern oder abkochen.')}
      },{force:H.stopReason==='water'});break}
    case 'treat':{
      if(H.water.dirty<=0.05){toast('Kein unbehandeltes Wasser.');return}
      if(g.tools.filter)beginAction('treat','Filtert Wasser …',8,()=>{H.water.clean+=H.water.dirty;H.water.dirty=0;toast('🚰 Wasser gefiltert.','good')},{force:H.stopReason==='water'});
      else if((g.tools.stove&&H.gas>=1)||nearFire())beginAction('treat','Kocht Wasser ab …',14,()=>{if(!nearFire())H.gas=Math.max(0,H.gas-1);H.water.clean+=H.water.dirty;H.water.dirty=0;toast('♨️ Wasser abgekocht.','good')});
      else toast('Zum Abkochen brauchst du Kocher + Gas oder ein Feuer, zum Filtern einen Wasserfilter.','bad');break}
    case 'charge':{
      if(H.pb<=0){toast('Keine Powerbank-Ladung mehr.');return}
      const ids=Object.keys(H.dev).filter(i=>!H.dev[i].broken&&H.dev[i].batt<90).sort((a,b)=>H.dev[a].batt-H.dev[b].batt);
      if(!ids.length){toast('Alle Geräte sind geladen.');return}
      const id=ids[0];
      beginAction('charge','Lädt '+H.dev[id].def.name+' …',20,()=>{H.dev[id].batt=100;H.pb--;toast('🔋 '+H.dev[id].def.name+' geladen.','good')});break}
    case 'aid':
      if(!g.tools.kit||H.kit<=0){toast('Kein Erste-Hilfe-Set.');return}
      if(!isInjured()){toast('Du brauchst gerade keine Behandlung.');return}
      beginAction('aid','Versorgt Verletzung …',10,()=>{H.kit--;H.inj.blister=0;H.inj.sprain=0;H.sick=0;toast('🩹 Versorgt.','good')});break;
    case 'orient':
      if(!H.lost.on){toast('Du bist auf dem richtigen Weg.');return}
      beginAction('orient','Sucht Orientierung …',15,()=>{
        const ok=Math.random()<clamp(navInfo().q+0.25+G.stats.nav*0.02,0.2,0.97);
        if(ok){H.lost.on=false;toast('🧭 Du hast den Weg wiedergefunden.','good')}
        else{H.lost.km=Math.max(0.3,H.lost.km-0.3);toast('🧭 Immer noch verirrt …','bad')}
      });break;
    case 'rescue':
      showModal({title:'Tour abbrechen?',text:'Du lässt dich abholen. Das kostet etwa 40 € und deine bisherigen Aufnahmen bleiben erhalten.',buttons:[{label:'Abbrechen & abholen lassen',fn:()=>endHike('abort')},{label:'Weiterwandern'}]});break;
  }
}

/* ---------- Schlaf ---------- */
function comfortTemp(sleeping){
  const g=H.g;
  let c=17-4-(g.mid?g.mid.ins:0)-(g.shell?g.shell.ins:0)-1.3*G.stats.kalt;
  if(sleeping)c-=(17-(g.bag?g.bag.rating:17))*0.6;
  return c;
}
function effTemp(mode){
  const g=H.g,sh=H.camp.pitched?g.shelter:null;
  let E=env.temp;
  const windP=Math.max(sh?sh.wind:0,g.shell?g.shell.wind:0);
  E-=env.wind*0.5*(1-windP);
  E-=H.body.wet/100*9;
  if(mode==='walk')E+=7;
  if(sh&&mode!=='walk')E+=sh.warm;
  if(mode==='sleep'&&g.mat)E+=g.mat.warm;
  if(mode!=='walk'&&nearFire())E+=7;
  return E;
}
function sleepQuality(){
  const g=H.g,B=H.body,sh=H.camp.pitched?g.shelter:null;
  const deficit=comfortTemp(true)-effTemp('sleep');
  let q=1-0.12*Math.max(0,deficit);
  if(!sh){q-=0.15;if(env.precip)q-=0.2;if(env.wind>12)q-=0.1}
  if(!g.mat)q-=0.1;
  if(B.wet>40)q-=(B.wet-40)/100*0.5;
  if(isInjured())q-=0.05;
  if(B.sat<25||B.hyd<25)q-=0.1;
  if(env.sun>0.6)q*=0.8;
  return clamp(q,0.25,1);
}
function sleepNeedH(){
  const hour=env.hour,bed=hour<12?hour+24:hour;
  const late=0.5*Math.max(0,bed-22);
  const awakeH=(H.t-H.awakeSince)/60;
  const extra=0.15*Math.max(0,awakeH-16);
  return clamp(4+(100-H.body.energy)/100*4+late+extra,3.5,11.5);
}
function startSleep(){
  if(H.sleep.active)return;
  const need=sleepNeedH();
  H.sleep={active:true,need,q:sleepQuality(),startE:H.body.energy,p:0,elapsed:0,qsum:0,begun:H.t};
  H.walking=false;
  toast('😴 Du schläfst ein … (Bedarf ca. '+need.toFixed(1).replace('.',',')+' h bei Qualität '+Math.round(H.sleep.q*100)+' %)');
}
function stepSleep(h){
  const S=H.sleep;S.q=sleepQuality();S.elapsed+=h;S.qsum+=S.q*h;
  S.p+=h/(S.need*60)*S.q;
  H.body.energy=lerp(S.startE,100,clamp(S.p,0,1));
  if(S.p>=1||S.elapsed>14*60)wakeUp();
}
function wakeUp(){
  const S=H.sleep;const hrs=S.elapsed/60,avg=S.qsum/S.elapsed;
  H.sleep={active:false};H.awakeSince=H.t;H.stats.sleepH+=hrs;
  H.inj.blister=Math.min(H.inj.blister,H.t+360*(H.inj.blister?1:0));
  toast('☀️ Aufgewacht nach '+hrs.toFixed(1).replace('.',',')+' h (Qualität Ø '+Math.round(avg*100)+' %). Lager abbauen nicht vergessen.','good');
  if(S.p<1)H.body.energy=Math.min(100,lerp(S.startE,100,clamp(S.p,0,1)));
}

/* ---------- Körper ---------- */
function bodyTick(mode,hr){
  const B=H.body,S=G.stats,g=H.g;
  const lf=loadKg()/capacityKg();const gr=env.grade;
  const sick=H.sick>H.t,blister=H.inj.blister>H.t,sprain=H.inj.sprain>H.t;
  if(mode==='walk'){
    let d=(11+60*Math.max(0,gr)+12*Math.max(0,-gr-0.08))*(1.3-0.1*S.aus)*(0.6+0.8*clamp(lf,0,1.4));
    if(g.tools.poles&&gr>0.03)d*=0.9;
    if(B.sat<20)d*=1.3;if(B.hyd<25)d*=1.4;if(B.warm<35)d*=1.25;if(sick)d*=1.3;if(blister||sprain)d*=1.1;
    if(H.shot&&H.shot.type!=='drone')d*=0.9;
    B.energy-=d*hr;
  }else if(mode==='rest'){
    let r=14;if(B.sat<10||B.hyd<10)r*=0.4;if(sick)r*=0.6;
    B.energy+=r*hr;
  }
  B.energy=clamp(B.energy,0,100);
  const fm=1.3-0.1*S.food,wm=1.3-0.1*S.water;
  const heat=env.temp>24?1+(env.temp-24)*0.04:1;
  B.sat-=({walk:6.5,rest:2.8,sleep:1.6}[mode])*fm*hr;
  B.hyd-=({walk:8,rest:3,sleep:1.2}[mode])*wm*heat*(sick?1.6:1)*hr;
  B.sat=clamp(B.sat,0,100);B.hyd=clamp(B.hyd,0,100);
  // Nässe
  const sh=H.camp.pitched?g.shelter:null;
  let gain=0;
  if(env.precip){
    const protect=sh?sh.rain:(g.shell?g.shell.rain:0);
    gain=22*env.rainI*(1-protect)*BIOMES[env.biome].rain*(1-(g.shoes?g.shoes.wetRes*0.2:0));
  }
  let dry=2.5+(env.sun>0.8&&(H.weather.type==='klar'||H.weather.type==='wolkig')?6:0)+(mode==='walk'?3:0)+(mode!=='walk'&&nearFire()?22:0)+(sh?2:0);
  if(gain>0)dry*=0.3;
  B.wet=clamp(B.wet+(gain-dry)*hr,0,100);
  // Wärme
  const E=effTemp(mode),c=comfortTemp(mode==='sleep');
  H.deficit=c-E;
  if(H.deficit>0)B.warm-=H.deficit*2*hr;else B.warm+=15*hr;
  B.warm=clamp(B.warm,0,100);
  if(E>c+18)B.hyd=clamp(B.hyd-2*hr,0,100);
  // Verletzungen
  if(mode==='walk'){
    if(!blister&&Math.random()<0.028*(g.shoes?g.shoes.blister:1.6)*(1+B.wet/50)*hr){H.inj.blister=H.t+1440;toast('🩹 Du hast dir eine Blase gelaufen.','bad')}
    const risky=(gr<-0.12?1:0)+(env.dark>0.6&&!g.tools.lamp?1.5:0)+(B.wet>60?0.5:0)+(env.precip?0.3:0);
    if(!sprain&&Math.random()<0.02*risky*(g.tools.poles?0.5:1)*hr){H.inj.sprain=H.t+1440;toast('🦶 Du bist umgeknickt – langsameres Gehen.','bad')}
  }
  let dhp=0;
  if(B.sat<=0)dhp-=3;if(B.hyd<=0)dhp-=6;if(B.warm<15)dhp-=4;if(B.warm<=0)dhp-=6;if(sick)dhp-=0.8;
  if(dhp===0&&B.sat>40&&B.hyd>40&&B.warm>50)dhp+=mode==='sleep'?5:mode==='rest'?2.5:1;
  B.hp=clamp(B.hp+dhp*hr,0,100);
  if(B.hp<=0&&!H.ended)endHike('rescue');
}
function deviceTick(hr){
  for(const id in H.dev){
    const d=H.dev[id],def=d.def;if(d.broken)continue;
    let drain=0;
    if(def.kind==='phone'||def.kind==='cam'){drain=def.stby;if(H.activeDev===id&&H.rec>0)drain+=def.rate*H.rec}
    else if(id==='gps')drain=1.2;
    d.batt=Math.max(0,d.batt-drain*hr);
    if(d.batt<=0&&!d.warned){d.warned=true;toast('🪫 Akku leer: '+def.name,'bad')}
    if(d.batt>10)d.warned=false;
    const p=0.5*(def.fragile||0.0005)*(env.precip?3:1)*(H.rec>0&&H.activeDev===id?1.5:1)*hr;
    if(Math.random()<p){d.broken=true;toast('💥 '+def.name+' ist kaputtgegangen!','bad')}
  }
  if(H.g.solar&&env.sun>0.6&&(H.weather.type==='klar'||H.weather.type==='wolkig')){
    const ids=Object.keys(H.dev).filter(i=>!H.dev[i].broken&&H.dev[i].batt<100).sort((a,b)=>H.dev[a].batt-H.dev[b].batt);
    if(ids.length)H.dev[ids[0]].batt=Math.min(100,H.dev[ids[0]].batt+(H.weather.type==='klar'?5:2.5)*hr);
  }
}
function autoConsume(){
  if(!H.auto||H.action||H.sleep.active)return;
  const B=H.body;
  if(B.hyd<45&&H.water.clean>0.05){beginAction('drink','Trinkt …',2,()=>drinkWater(false),{resume:true});return}
  if(B.hyd<12&&H.water.dirty>0.05){beginAction('drink','Trinkt (unbehandelt) …',2,()=>drinkWater(true),{resume:true});return}
  if(B.sat<40){
    const f=FOODS.filter(f=>!f.cook&&(H.food[f.id]||0)>0).sort((a,b)=>b.sat-a.sat)[0];
    if(f)beginAction('eat','Isst …',4,()=>eatFood(f.id),{resume:true});
  }
}

/* ---------- Ereignisse ---------- */
function navCheck(){
  if(H.safeJunction){H.safeJunction=false;toast('🪧 Wegkreuzung – der Tipp des Wanderers war richtig.');return}
  const nav=navInfo();
  const p=clamp((1-nav.q)*(1.15-0.13*G.stats.nav)+(env.fog?0.08:0)+(env.dark>0.6?0.05:0),0.01,0.85);
  if(Math.random()<p){H.lost={on:true,km:1.5+rnd(0,2.5)};H.stats.junctionsLost++;toast('🧭 Du hast dich verlaufen! Nutze „Orientieren“ oder laufe den Umweg zurück.','bad')}
  else toast('🪧 Wegkreuzung – richtig abgebogen.');
}
function checkFeatures(a,b){
  for(const f of H.route.feats){
    if(!(a<f.x&&f.x<=b))continue;
    if(f.type==='quelle'||(f.type==='fluss'&&f.bridge)){
      toast(f.type==='quelle'?'💧 Quelle – hier kannst du Wasser auffüllen.':'🌉 Du überquerst einen Fluss über eine Brücke (Wasser entnehmbar, unbehandelt).');
      if(H.autoStop&&(waterTotal()<H.g.waterCap-0.3)){H.walking=false;H.stopReason='water';toast('⏸ Gestoppt an der Wasserstelle – „Wasser auffüllen“ und es geht automatisch weiter.')}
    }else if(f.type==='fluss')riverFord(f);
    else if(f.type==='junction')navCheck();
  }
}
function riverFord(f){
  H.walking=false;
  showModal({title:'🌊 Flussfurt',text:'Kein Steg in Sicht. Du kannst durchwaten (10 Min., nass werden, Ausrutschgefahr) oder einen Umweg um die Furt gehen (35 Min., trocken).',buttons:[
    {label:'Durchwaten',fn:()=>beginAction('ford','Durchquert die Furt …',10,()=>{
      const wr=H.g.shoes?H.g.shoes.wetRes:0;
      H.body.wet=clamp(H.body.wet+35*(1-wr*0.6),0,100);
      if(Math.random()<(H.weather.type==='regen'||H.weather.type==='gewitter'?0.14:0.06)*(H.g.tools.poles?0.5:1)){H.inj.sprain=H.t+1440;toast('🌊 Du bist ausgerutscht und hast dir den Fuß verstaucht.','bad')}
      else toast('Du bist durch – die Beine sind nass.');
      H.walking=true},{resume:false})},
    {label:'Umweg gehen',fn:()=>beginAction('ford','Geht um die Furt herum …',35,()=>{H.body.energy=clamp(H.body.energy-8,0,100);toast('Trockenen Fußes drüber.');H.walking=true})}]});
}
function hikerEvent(){
  const opts=[];
  if(H.water.clean>=0.6)opts.push('water');
  if(Object.values(H.food).some(v=>v>0))opts.push('food');
  if(H.water.clean>=0.6)opts.push('trade');
  opts.push('info');
  const k=pick(opts);
  const interview=()=>spawnIcon({kind:'hiker',x:H.x+140,e:'🧑',label:'Interview',base:7,life:9});
  const done=(msg)=>{toast(msg,'good');interview()};
  H.walking=false;
  const resume=()=>{if(!H.camp.pitched)H.walking=true};
  if(k==='water')showModal({title:'🥾 Wanderer in Not',text:'Ein erschöpfter Wanderer bittet dich um 0,5 L Wasser.',buttons:[
    {label:'Wasser geben',fn:()=>{H.water.clean-=0.5;if(Math.random()<0.5){G.money+=8;done('Er bedankt sich mit 8 €. Ein kurzes Interview wäre drin!')}else done('Er bedankt sich herzlich. Ein kurzes Interview wäre drin!');resume()}},
    {label:'Ablehnen',fn:resume}]});
  else if(k==='food')showModal({title:'🥾 Wanderer ohne Proviant',text:'Ein Wanderer hat seinen Proviant verloren und fragt nach etwas zu essen.',buttons:[
    {label:'Etwas abgeben',fn:()=>{const id=Object.keys(H.food).filter(i=>H.food[i]>0).sort((a,b)=>gearById(a).sat-gearById(b).sat)[0];if(id){H.food[id]--;done('Du gibst ihm '+gearById(id).name.replace(' (kochen)','')+'. Er erzählt dir seine Wandergeschichte.')}resume()}},
    {label:'Ablehnen',fn:resume}]});
  else if(k==='trade')showModal({title:'🥾 Tauschangebot',text:'Ein Wanderer bietet dir 2 Müsliriegel für 0,5 L sauberes Wasser.',buttons:[
    {label:'Tauschen',fn:()=>{H.water.clean-=0.5;H.food.bar=(H.food.bar||0)+2;done('Tausch erledigt: +2 Müsliriegel.');resume()}},
    {label:'Ablehnen',fn:resume}]});
  else showModal({title:'🥾 Wegtipp',text:'Ein Wanderer erklärt dir den Weg zur nächsten Kreuzung.',buttons:[
    {label:'Danke!',fn:()=>{H.safeJunction=true;done('Die nächste Kreuzung findest du sicher.');resume()}}]});
}

/* ---------- Hauptschritt ---------- */
function stepSim(h){
  const hr=h/60,B=H.body;
  H.t+=h;
  const dIdx=Math.floor(H.t/1440);
  if(dIdx>H.dayIdx){H.dayIdx=dIdx;G.day++;const inc=advanceChannel();H.passive+=inc;if(inc>0.01)toast('📺 Kanal-Einnahmen über Nacht: +'+eur(inc),'good')}
  updateWeather();computeEnv();
  deviceTick(hr);
  if(H.fire.lit){H.fire.left-=h*(env.precip&&!(H.camp.pitched&&Math.abs(H.x-H.camp.x)<200)&&env.rainI>0.6?2:1);if(H.fire.left<=0){H.fire.lit=false;toast('Das Feuer ist erloschen.')}}
  let mode='rest';
  if(H.sleep.active){mode='sleep';stepSleep(h)}
  else if(H.action){stepAction(h)}
  else{
    autoConsume();
    if(H.shot){H.shot.left-=h;if(H.shot.left<=0)finishShot()}
    if(H.walking&&B.energy<=0){H.walking=false;toast('Erschöpft! Du musst rasten.','bad')}
    else if(H.walking&&!H.camp.pitched&&!H.action){
      const v=walkSpeedKmh();
      if(v>0.01){
        mode='walk';const dkm=v*hr,dpx=dkm*PPK,prev=H.x;
        H.phase+=dpx*0.16;H.stats.walkMin+=h;
        if(H.lost.on){H.lost.km-=dkm;H.wasted+=dkm;if(H.lost.km<=0){H.lost.on=false;toast('🧭 Du hast wieder auf den Weg gefunden.','good')}}
        else{
          H.x=Math.min(H.route.totalPx,H.x+dpx);H.km=H.x/PPK;checkFeatures(prev,H.x);
          if(H.x>=H.route.totalPx&&!H.ended)endHike('goal');
        }
      }
      rollShots(hr);
    }
  }
  H.moving=mode==='walk';
  trackSights();
  bodyTick(mode,hr);
  // Zufallsereignisse
  if(!H.sleep.active&&!H.ended){
    H.animalCd-=h;H.hikerCd-=h;
    if(H.animalCd<=0&&Math.random()<0.5*BIOMES[env.biome].animal*(env.sun<0.2?0.3:1)*(mode==='walk'?1:0.5)*hr){spawnAnimal();H.animalCd=25}
    if(mode==='walk'&&env.sun>0.3&&H.hikerCd<=0&&Math.random()<0.16*hr){H.hikerCd=180;hikerEvent()}
  }
}

function endHike(reason){
  if(H.ended)return;
  H.ended=true;
  if(reason!=='goal'){
    const cost=reason==='abort'?40:80;
    H.rescueCost=Math.min(cost,G.money);G.money-=H.rescueCost;
    if(reason==='rescue'){
      const d=handheld();
      if(d){const q=shotQ(d.def,1.2);H.clips.push({key:'rescue',type:'drama',name:'Dramatische Rettung',e:'🚁',q,value:40*q,rar:-1,day:G.day,biome:env.biome})}
    }
  }
  H.reason=reason;
  save();
  onHikeEnd(reason);
}

function walkSpeedKmh(){
  const S=G.stats,g=H.g,B=H.body;let v=2.8+0.4*S.tempo;
  const gr=env.grade;let m;
  if(gr>=0)m=1-2.3*gr;else m=gr>-0.1?1-gr:1.1-2.2*(-gr-0.1);
  m=clamp(m,0.3,1.15);
  const lf=loadKg()/capacityKg();
  m*=1-clamp(lf-0.45,0,1.2)*0.5*(1-0.5*(g.pack?g.pack.comfort:0));
  if(g.tools.poles&&gr>0.03)m*=1.05;
  m*=g.shoes?g.shoes.spd:0.95;
  if(H.inj.blister>H.t)m*=0.88;if(H.inj.sprain>H.t)m*=0.75;if(H.sick>H.t)m*=0.9;
  if(env.dark>0.6)m*=g.tools.lamp?0.92:0.6;
  if(B.energy<15)m*=0.6;if(B.warm<35)m*=0.9;
  if(env.precip)m*=env.precip==='snow'?0.82:0.93;
  if(env.wind>12)m*=0.85;
  if(H.shot)m*=H.shot.type==='drone'?0:0.25;
  return v*m;
}

/* ---------- Kanal-Einnahmen ---------- */
const CURVE=d=>(d+1)*Math.exp(-d/12);
const CURVE_NORM=(()=>{let s=0;for(let d=1;d<=150;d++)s+=CURVE(d);return s})();
function advanceChannel(){
  let inc=0;
  for(const v of G.videos){const d=G.day-v.day;if(d>=1&&d<=150){const x=v.total*CURVE(d)/CURVE_NORM;v.earned+=x;inc+=x;G.subs+=x*1.5}}
  G.money+=inc;G.earned+=inc;return inc;
}
function buildVideoScore(clips,promoIds){
  const groups={};
  clips.forEach(c=>{(groups[c.key]=groups[c.key]||[]).push(c.value)});
  let score=0;
  const keys=Object.keys(groups);
  keys.forEach(k=>{groups[k].sort((a,b)=>b-a).forEach((v,i)=>{score+=v*Math.pow(0.92,i)})});
  const variety=Math.min(1.6,1+0.06*Math.max(0,keys.length-1));
  return {base:score,variety,groups:keys.length};
}

const CW=960,CH=540,VS=0.75,CHAR_SX=300;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>a.map((v,i)=>Math.round(lerp(v,b[i],t)));
const rgb=(a,al)=>al===undefined?`rgb(${a[0]},${a[1]},${a[2]})`:`rgba(${a[0]},${a[1]},${a[2]},${al})`;
let camX=0;
const groundY=x=>380-(elevAt(x)-H.camElev)*VS;

function emoji(g,ch,x,y,size,alpha=1){g.save();g.globalAlpha=alpha;g.font=size+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';g.textAlign='center';g.textBaseline='alphabetic';g.fillText(ch,x,y);g.restore()}
function sprite(g,path,ch,x,y,size,alpha=1){
  const im=img(path);
  if(im){g.save();g.globalAlpha=alpha;g.drawImage(im,x-size/2,y-size,size,size*im.height/im.width);g.restore()}
  else emoji(g,ch,x,y,size,alpha);
}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function ln(g,x1,y1,x2,y2){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}

/* ---------- Charakter ---------- */
function drawHiker(g,x,y,s,o){
  const L=o.look,ph=o.phase||0,mode=o.mode||'idle';
  g.save();g.translate(x,y);g.scale(s,s);g.lineCap='round';g.lineJoin='round';
  const skin=LOOKS.skin[L.skin],hair=LOOKS.hair[L.hair],jk=LOOKS.jacket[L.jacket];
  if(mode==='sleep'){
    g.fillStyle='#4b5d3a';g.beginPath();g.ellipse(0,-7,36,9,0,0,7);g.fill();
    g.fillStyle=skin;g.beginPath();g.arc(-30,-11,7,0,7);g.fill();
    g.fillStyle=hair;g.beginPath();g.arc(-31,-14,7,Math.PI,0);g.fill();
    g.restore();return;
  }
  const walk=mode==='walk';
  const sw=walk?Math.sin(ph)*9:0,bob=walk?Math.abs(Math.sin(ph))*2.2:0;
  const drop=(mode==='sit'||mode==='work')?14:0;
  const hipY=-26+drop-bob;
  // Beine
  g.strokeStyle='#33465a';g.lineWidth=6;
  if(drop){ln(g,0,hipY,14,hipY+6);ln(g,14,hipY+6,10,-2);ln(g,0,hipY,8,hipY+8);ln(g,8,hipY+8,4,-2)}
  else{ln(g,0,hipY,-sw,-3);ln(g,0,hipY,sw,-3)}
  g.fillStyle='#2b2b2b';
  if(drop){g.beginPath();g.ellipse(12,-1,6,3,0,0,7);g.fill();g.beginPath();g.ellipse(6,-1,6,3,0,0,7);g.fill()}
  else{g.beginPath();g.ellipse(-sw+2,-2,6,3,0,0,7);g.fill();g.beginPath();g.ellipse(sw+2,-2,6,3,0,0,7);g.fill()}
  // Rucksack
  g.fillStyle=o.packColor||'#7f8c8d';rr(g,-21,hipY-36,15,32,5);g.fill();
  if(o.tent){g.fillStyle='#c0603a';rr(g,-22,hipY-42,17,7,3);g.fill()}
  // Oberkörper
  g.fillStyle=jk;rr(g,-8,hipY-35,17,33,5);g.fill();
  // Kopf
  const hx=2,hy=hipY-45;
  g.fillStyle=skin;g.beginPath();g.arc(hx,hy,8.5,0,7);g.fill();
  g.fillStyle=hair;
  if(L.style===0){g.beginPath();g.arc(hx-1,hy-1,8.6,Math.PI*1.02,Math.PI*1.95);g.fill()}
  else if(L.style===1){g.beginPath();g.arc(hx-1,hy-1,8.8,Math.PI*0.9,Math.PI*1.95);g.fill();rr(g,hx-11,hy-3,6,20,3);g.fill()}
  else{g.fillStyle='#c0392b';g.beginPath();g.arc(hx,hy-2,9,Math.PI,0);g.fill();g.fillRect(hx-8,hy-3,18,3)}
  g.fillStyle='#222';g.beginPath();g.arc(hx+4.5,hy-1,1.2,0,7);g.fill();
  // Arme & Handgeräte
  const shx=0,shy=hipY-31;
  g.strokeStyle=jk;g.lineWidth=5;
  const phone=(px,py,w=7,h=11,col='#222')=>{g.fillStyle=col;rr(g,px-w/2,py-h/2,w,h,2);g.fill();g.fillStyle='#7ec8ff';g.fillRect(px-w/2+1,py-h/2+1,w-2,h-3)};
  if(mode==='selfie'){ln(g,shx,shy,20,hipY-48);phone(22,hipY-52);g.strokeStyle='#e33';g.lineWidth=1.5;g.beginPath();g.arc(hx+3,hy+2,3,0.1,Math.PI-0.1);g.stroke()}
  else if(mode==='landschaft'){ln(g,shx,shy,22,hipY-36);phone(26,hipY-38,11,7)}
  else if(mode==='video'){ln(g,shx,shy,18,hipY-30);ln(g,shx,shy,14,hipY-26);g.fillStyle='#222';rr(g,14,hipY-40,15,10,2);g.fill();g.fillStyle='#e33';g.beginPath();g.arc(27,hipY-38,1.6,0,7);g.fill()}
  else if(mode==='talk'){ln(g,shx,shy,14,hipY-40);phone(15,hipY-44);
    g.fillStyle='#fff';rr(g,20,hipY-78,30,18,6);g.fill();g.fillStyle='#333';g.font='12px sans-serif';g.textAlign='center';g.fillText('…',35,hipY-65)}
  else if(mode==='drone'){ln(g,shx,shy,12,hipY-14);ln(g,shx,shy,8,hipY-12);g.fillStyle='#222';rr(g,4,hipY-20,16,9,3);g.fill()}
  else if(mode==='work'||mode==='sit'){ln(g,shx,shy,12,hipY-12);ln(g,shx,shy,8,hipY-10)}
  else{ln(g,shx,shy,-sw*0.7+2,hipY-12);ln(g,shx,shy,sw*0.7+4,hipY-12);
    if(o.poles){g.strokeStyle='#777';g.lineWidth=2;ln(g,sw*0.7+4,hipY-12,sw*0.7+18,-1)}}
  g.fillStyle=skin;
  g.restore();
}

/* ---------- Himmel ---------- */
function drawSky(g,tm){
  const L=env.sun,tw=1-Math.abs(2*L-1);
  let top=mix(hex('#0b1436'),hex('#4f9fe0'),L),bot=mix(hex('#1b2748'),hex('#bfe4f6'),L);
  bot=mix(bot,hex('#f4a261'),tw*0.65);top=mix(top,hex('#6b5b95'),tw*0.2);
  const gray={klar:0,wolkig:0.2,nebel:0.65,regen:0.5,gewitter:0.72,sturm:0.45}[H.weather.type];
  const gc=mix(hex('#3b4653'),hex('#8d9aa5'),L);
  top=mix(top,gc,gray);bot=mix(bot,gc,gray*0.9);
  const gr=g.createLinearGradient(0,0,0,CH*0.75);gr.addColorStop(0,rgb(top));gr.addColorStop(1,rgb(bot));
  g.fillStyle=gr;g.fillRect(0,0,CW,CH);
  // Sterne
  if(L<0.6&&(H.weather.type==='klar'||H.weather.type==='wolkig')){
    g.fillStyle='#fff';
    for(let i=0;i<70;i++){g.globalAlpha=(1-L)*(0.35+0.5*hash(i*5+2))*(H.weather.type==='klar'?1:0.4);g.fillRect(hash(i)*CW,hash(i+300)*CH*0.55,1.6,1.6)}
    g.globalAlpha=1;
  }
  // Sonne / Mond
  const hk=H.hk,h=env.hour;
  const df=(h-hk.sunrise)/(hk.sunset-hk.sunrise);
  if(df>-0.05&&df<1.05){
    const sx=CW*clamp(df,0,1),sy=CH*0.62-Math.sin(clamp(df,0,1)*Math.PI)*CH*0.5;
    const gl=g.createRadialGradient(sx,sy,4,sx,sy,90);gl.addColorStop(0,'rgba(255,240,180,0.7)');gl.addColorStop(1,'rgba(255,240,180,0)');
    g.fillStyle=gl;g.fillRect(sx-90,sy-90,180,180);
    g.fillStyle='#fff4b0';g.beginPath();g.arc(sx,sy,20,0,7);g.fill();
  }else{
    const nl=(h>=hk.sunset?h-hk.sunset:h+24-hk.sunset)/(24-(hk.sunset-hk.sunrise));
    const mx=CW*clamp(nl,0,1),my=CH*0.6-Math.sin(clamp(nl,0,1)*Math.PI)*CH*0.45;
    g.fillStyle='#eef1f8';g.beginPath();g.arc(mx,my,15,0,7);g.fill();
    g.fillStyle='rgba(20,30,60,0.35)';g.beginPath();g.arc(mx+5,my-2,13,0,7);g.fill();
  }
  // Wolken
  const n={klar:2,wolkig:7,nebel:5,regen:10,gewitter:11,sturm:11}[H.weather.type];
  const cc=mix(mix(hex('#ffffff'),hex('#7f8791'),gray*1.1),hex('#2b3244'),1-L);
  for(let i=0;i<n;i++){
    const par=0.06+0.03*(i%3);
    let cx=((hash(i*9)*1400-camX*par+tm*(6+env.wind*2)*(0.4+0.2*(i%3)))%1500+1500)%1500-200;
    const cy=30+hash(i*3+1)*150,sc=0.8+hash(i*7)*1.1;
    g.fillStyle=rgb(cc,0.88);
    for(const [dx,dy,r] of [[0,0,26],[28,6,20],[-26,8,19],[10,-10,18]]){g.beginPath();g.ellipse(cx+dx*sc,cy+dy*sc,r*sc*1.3,r*sc*0.8,0,0,7);g.fill()}
  }
}
function drawRange(g,par,baseY,amp,col,seed,L){
  const c=mix(hex(col),hex('#0f1830'),(1-L)*0.7);
  g.fillStyle=rgb(mix(c,hex('#cfd8e0'),env.fog*0.6));
  g.beginPath();g.moveTo(0,CH);
  for(let x=0;x<=CW;x+=8){
    const wx=x+camX*par;
    const y=baseY-amp*(0.5+0.32*Math.sin(wx*0.0031+seed)+0.22*Math.sin(wx*0.0087+seed*2.3)+0.1*Math.sin(wx*0.021+seed*4));
    g.lineTo(x,y);
  }
  g.lineTo(CW,CH);g.closePath();g.fill();
}

/* ---------- Gelände ---------- */
function snowAmt(){return env.precip==='snow'?0.55:clamp((env.alt-2300)/500,0,0.6)}
function drawTerrain(g){
  const sn=snowAmt(),L=env.light;
  const x0=Math.floor(camX/12)*12;
  for(let x=x0;x<camX+CW+12;x+=12){
    const st=stageAt(x);let col=hex(BIOMES[st.b].ground);
    if(env.precip==='rain'||H.weather.type==='regen')col=mix(col,hex('#2f3b33'),0.15);
    col=mix(col,hex('#f1f4f8'),sn);
    const y1=groundY(x),y2=groundY(x+12),sx=x-camX;
    g.fillStyle=rgb(col);
    g.beginPath();g.moveTo(sx,y1);g.lineTo(sx+13,y2);g.lineTo(sx+13,CH);g.lineTo(sx,CH);g.closePath();g.fill();
    g.fillStyle=rgb(mix(col,hex('#3d2c1c'),0.6),0.55);
    g.beginPath();g.moveTo(sx,y1+16);g.lineTo(sx+13,y2+16);g.lineTo(sx+13,CH);g.lineTo(sx,CH);g.closePath();g.fill();
  }
  // Pfad
  g.strokeStyle=rgb(mix(hex('#c9b48a'),hex('#f1f4f8'),sn*0.7));g.lineWidth=5;g.lineJoin='round';g.beginPath();
  for(let x=x0;x<camX+CW+12;x+=12){const sx=x-camX,y=groundY(x)+2;if(x===x0)g.moveTo(sx,y);else g.lineTo(sx,y)}
  g.stroke();
}
function drawDecor(g,tm){
  const CELL=36,c0=Math.floor((camX-80)/CELL),c1=Math.floor((camX+CW+80)/CELL);
  const sn=snowAmt();
  for(let cx=c0;cx<=c1;cx++){
    const wx=cx*CELL+hash(cx*7)*26;if(wx<80||wx>H.route.totalPx+300)continue;
    const st=stageAt(wx),B=BIOMES[st.b],y=groundY(wx),sx=wx-camX;
    if(H.route.feats.some(f=>Math.abs(f.x-wx)<70))continue;
    const r=hash(cx*13+1),sc=0.75+hash(cx*5+3)*0.7;
    if(r<B.tree){
      const dk=mix(hex(st.b==='fjaell'?'#a8853a':'#2f6b34'),hex('#0f1830'),(1-env.light)*0.4);
      if(st.b==='wald'&&hash(cx*3)<0.35){ // Laubbaum
        g.fillStyle='#5b3d24';g.fillRect(sx-3*sc,y-26*sc,6*sc,26*sc);
        g.fillStyle=rgb(mix(hex('#3f8a3a'),hex('#f1f4f8'),sn*0.5));g.beginPath();g.arc(sx,y-38*sc,20*sc,0,7);g.arc(sx-12*sc,y-30*sc,14*sc,0,7);g.arc(sx+12*sc,y-30*sc,14*sc,0,7);g.fill();
      }else{ // Nadelbaum / Birke
        g.fillStyle='#5b3d24';g.fillRect(sx-2.5*sc,y-14*sc,5*sc,14*sc);
        const cl=mix(hex('#245c33'),hex('#f1f4f8'),sn*0.6);g.fillStyle=rgb(st.b==='fjaell'?dk:cl);
        for(let k=0;k<3;k++){const w=(22-k*5)*sc,yy=y-(10+k*17)*sc;g.beginPath();g.moveTo(sx-w,yy);g.lineTo(sx+w,yy);g.lineTo(sx,yy-24*sc);g.closePath();g.fill()}
      }
    }else if(st.b==='berg'||st.b==='fjaell'){
      if(r<B.tree+0.22){g.fillStyle=rgb(mix(hex('#7c8088'),hex('#f1f4f8'),sn));g.beginPath();g.ellipse(sx,y-4*sc,14*sc,9*sc,0,Math.PI,0);g.fill()}
    }else if(r<B.tree+0.3){
      g.fillStyle=rgb(mix(hex('#4c8f3b'),hex('#f1f4f8'),sn));g.beginPath();g.arc(sx,y-5*sc,7*sc,Math.PI,0);g.fill();
      if(st.b==='wiese'&&hash(cx*11)<0.5){g.fillStyle=pick(['#fff','#f7d84a','#e57ab8']);g.fillRect(sx+3,y-9*sc,2.5,2.5)}
    }
  }
}
function drawFeatures(g,tm){
  const gs=H.route.feats.concat([{type:'start',x:120},{type:'finish',x:H.route.totalPx}]);
  for(const f of gs){
    const sx=f.x-camX;if(sx<-120||sx>CW+120)continue;const y=groundY(f.x);
    if(f.type==='quelle'){
      g.fillStyle='#8a8d90';g.beginPath();g.ellipse(sx,y-6,20,10,0,Math.PI,0);g.fill();

function drawCamp(g,tm){

    const sh=H.g.shelter,sx=H.camp.x-70-camX,y=groundY(H.camp.x-70);

      g.fillStyle='#5f7f55';g.beginPath();g.moveTo(sx-46,y);g.lineTo(sx-30,y-42);g.lineTo(sx+52,y-24);g.lineTo(sx+52,y);g.closePath();g.fill();
      g.strokeStyle='#3d2c1c';g.lineWidth=3;ln(g,sx-30,y-42,sx-30,y);ln(g,sx+52,y-24,sx+52,y);
    }else{
      const col=sh.id==='tentW'?'#c65a2e':sh.id==='tentUL'?'#4a90c8':'#d97b2b';
      g.fillStyle=col;g.beginPath();g.moveTo(sx-50,y);g.lineTo(sx,y-52);g.lineTo(sx+50,y);g.closePath();g.fill();
      g.fillStyle=glow?'#ffd98a':'#2b2b2b';g.beginPath();g.moveTo(sx-14,y);g.lineTo(sx,y-30);g.lineTo(sx+14,y);g.closePath();g.fill();
      g.strokeStyle='rgba(0,0,0,0.3)';g.lineWidth=2;ln(g,sx,y-52,sx,y-30);
    }

    g.fillStyle=gl;g.beginPath();g.arc(sx,y-14,120,0,7);g.fill();
    g.fillStyle='#6d4726';g.save();g.translate(sx,y-3);g.rotate(0.3);g.fillRect(-14,-2,28,5);g.rotate(-0.6);g.fillRect(-14,-2,28,5);g.restore();
    for(let k=0;k<3;k++){const fl=Math.sin(tm*14+k*2)*3;g.fillStyle=['#e25822','#f4a52f','#ffe08a'][k];g.beginPath();g.moveTo(sx-9+k*3,y-4);g.quadraticCurveTo(sx+fl,y-22-k*-4-(3-k)*4,sx+9-k*3,y-4);g.fill()}

function drawIcons(g,tm){
  for(const ic of H.icons){
    const sx=ic.x-camX;if(sx<-60||sx>CW+60)continue;const gy=groundY(ic.x);
    let by;

      const bob=Math.sin(tm*4+ic.x)*1.5;
      sprite(g,'animals/'+ic.a.id,ic.a.e,sx,gy-2+bob,30+ic.a.r*4,ic.taken?0.4:1);
      by=gy-64-ic.a.r*3;
    }else if(ic.kind==='sight'){by=gy-92}
    else if(ic.kind==='storm'){emoji(g,ic.e,sx,gy-60+Math.sin(tm*3)*3,44);by=gy-130}
    else{emoji(g,ic.e,sx,gy-2,30);by=gy-64}
    const on=H.rec>0&&!ic.taken;const pulse=1+Math.sin(tm*8)*0.07;
    const r=17*pulse;ic.sx=sx;ic.sy=by;ic.r=22;
    g.save();
    g.fillStyle=ic.taken?'rgba(80,200,120,0.9)':on?'rgba(255,255,255,0.95)':'rgba(150,150,150,0.75)';
    g.beginPath();g.arc(sx,by,r,0,7);g.fill();
    if(ic.kind==='animal'&&!ic.taken&&on){g.strokeStyle=RARITY[ic.a.r].color;g.lineWidth=3.5;g.beginPath();g.arc(sx,by,r+3,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(ic.life/ic.max,0,1));g.stroke()}
    else if(!ic.taken&&on&&ic.kind!=='sight'){g.strokeStyle='#ff9800';g.lineWidth=3;g.beginPath();g.arc(sx,by,r+3,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(ic.life/ic.max,0,1));g.stroke()}
    emoji(g,ic.taken?'✔️':'📷',sx,by+7,20);
    if(ic.kind==='animal'&&!ic.taken){g.fillStyle=RARITY[ic.a.r].color;g.font='bold 10px sans-serif';g.textAlign='center';const t=RARITY[ic.a.r].name;const w=g.measureText(t).width+8;rr(g,sx-w/2,by-r-17,w,13,4);g.fill();g.fillStyle='#fff';g.fillText(t,sx,by-r-7)}
    g.restore();
  }
}

/* ---------- Wetter-Partikel ---------- */
function drawWeatherFx(g,tm){
  if(env.precip){
    const snow=env.precip==='snow',n=Math.floor(60+env.rainI*160);
    g.strokeStyle=snow?'rgba(255,255,255,0.9)':'rgba(190,210,235,0.65)';g.fillStyle='rgba(255,255,255,0.9)';g.lineWidth=1.2;
    const slant=clamp(env.wind*2.2,3,30)*(snow?0.6:1);
    for(let i=0;i<n;i++){
      const sp=snow?60+hash(i)*40:520+hash(i)*220;
      const px=((hash(i*3)*(CW+200)+tm*slant*(snow?5:14)*(0.6+hash(i+9)*0.4))%(CW+200))-100;
      const py=((hash(i*5+1)*CH+tm*sp)%CH);
      if(snow){g.beginPath();g.arc(px,py,1.6+hash(i)*1.5,0,7);g.fill()}
      else{g.beginPath();g.moveTo(px,py);g.lineTo(px-slant*0.5,py+12);g.stroke()}
    }
  }
  if(H.weather.type==='gewitter'){
    if(Math.random()<0.004)H.flash=1;
  }
  if(H.flash>0){g.fillStyle=`rgba(255,255,255,${H.flash*0.7})`;g.fillRect(0,0,CW,CH);H.flash=Math.max(0,H.flash-0.06)}
}

/* ---------- Gesamtszene ---------- */
function charMode(){
  if(H.sleep.active)return 'sleep';
  if(H.shot)return H.shot.type==='drone'?'drone':H.shot.type;
  if(H.action){return ['cook','eat','drink','fire','tent','refill','charge','aid','orient','treat'].includes(H.action.kind)?(['eat','drink'].includes(H.action.kind)?'sit':'work'):'walk'}
  return H.moving?'walk':'sit';
}

  drawDecor(g,tm);
  drawFeatures(g,tm);
  drawCamp(g,tm);
  // Charakter
  const cy=groundY(H.x);
  const mode=charMode();
  const sleepHidden=H.sleep.active&&H.camp.pitched&&H.g.shelter&&H.g.shelter.id!=='tarp';
  if(!sleepHidden){
    drawHiker(g,CHAR_SX,cy,1.15,{look:G.look,phase:H.phase,mode,packColor:H.g.pack?H.g.pack.color:'#7f8c8d',poles:H.g.tools.poles,tent:!!H.g.shelter&&!H.camp.pitched});
  }
  if(H.sleep.active){g.fillStyle='#fff';g.font='bold 20px sans-serif';g.textAlign='center';g.fillText('Z'+'z'.repeat(1+Math.floor(tm*1.5)%3),sleepHidden?CHAR_SX-70:CHAR_SX+20,(sleepHidden?groundY(H.camp.x-70)-58:cy-62)-((tm*10)%14))}
  if(H.shot&&H.shot.type==='drone'){sprite(g,'sprites/drone','🛸',CHAR_SX+70,cy-120+Math.sin(tm*5)*6,44)}
  if(H.lost.on){g.fillStyle='#fff';g.font='bold 26px sans-serif';g.textAlign='center';g.fillText('❓',CHAR_SX+4,cy-96+Math.sin(tm*4)*3)}
  drawIcons(g,tm);
  // Dunkelheit, Nebel
  if(env.dark>0.02){g.fillStyle=`rgba(6,10,34,${env.dark*0.58})`;g.fillRect(0,0,CW,CH)}
  if(H.fire.lit||sleepHidden&&env.dark>0.3){/* Feuerschein wird oben gezeichnet */}
  if(env.dark>0.4&&H.g.tools.lamp&&H.moving){
    const gl=g.createRadialGradient(CHAR_SX+90,cy-40,10,CHAR_SX+90,cy-40,190);gl.addColorStop(0,'rgba(255,240,200,0.30)');gl.addColorStop(1,'rgba(255,240,200,0)');
    g.fillStyle=gl;g.beginPath();g.arc(CHAR_SX+90,cy-40,190,0,7);g.fill();
  }
  if(env.fog>0){const f=g.createLinearGradient(0,0,0,CH);f.addColorStop(0,`rgba(210,220,225,${env.fog*0.5})`);f.addColorStop(1,`rgba(210,220,225,${env.fog*0.85})`);g.fillStyle=f;g.fillRect(0,0,CW,CH)}
  drawWeatherFx(g,tm);
  if(H.lost.on){const v=g.createRadialGradient(CW/2,CH/2,CH*0.35,CW/2,CH/2,CH*0.9);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(20,10,30,0.55)');g.fillStyle=v;g.fillRect(0,0,CW,CH);
    g.fillStyle='#fff';g.font='bold 18px sans-serif';g.textAlign='center';g.fillText('Verirrt – '+Math.max(0,H.lost.km).toFixed(1).replace('.',',')+' km Umweg',CW/2,64)}
}

/* ---------- Streckenprofil (Fortschrittsanzeige) ---------- */
function drawProfile(cv){
  const g=cv.getContext('2d'),W=cv.width,Hh=cv.height,R=H.route;
  g.clearRect(0,0,W,Hh);
  let mn=1e9,mx=-1e9;for(let i=0;i<R.elev.length;i+=5){mn=Math.min(mn,R.elev[i]);mx=Math.max(mx,R.elev[i])}
  const px=x=>x/R.totalPx*(W-8)+4,py=e=>Hh-8-(e-mn)/(mx-mn+1)*(Hh-22);
  for(const st of R.stages){
    g.fillStyle=rgb(hex(BIOMES[st.b].ground),0.55);
    g.beginPath();g.moveTo(px(st.x0),Hh);
    for(let x=st.x0;x<=st.x1;x+=40)g.lineTo(px(x),py(R.elev[Math.min(R.elev.length-1,Math.round(x/10))]));
    g.lineTo(px(st.x1),Hh);g.closePath();g.fill();
    g.strokeStyle='rgba(255,255,255,0.25)';g.lineWidth=1;ln(g,px(st.x1),0,px(st.x1),Hh);
  }
  g.strokeStyle='#e8f1ea';g.lineWidth=1.6;g.beginPath();
  for(let x=0;x<=R.totalPx;x+=40){const X=px(x),Y=py(R.elev[Math.round(x/10)]);if(x===0)g.moveTo(X,Y);else g.lineTo(X,Y)}
  g.stroke();
  for(const f of R.feats){
    const X=px(f.x),Y=py(R.elev[Math.round(f.x/10)]);
    if(f.type==='quelle'){g.fillStyle='#4aa8e8';g.beginPath();g.arc(X,Y-3,2.6,0,7);g.fill()}
    else if(f.type==='sight'){g.fillStyle='#ffd54a';g.fillRect(X-2.5,Y-9,5,5)}
    else if(f.type==='fluss'){g.fillStyle='#00bcd4';g.fillRect(X-1.5,Y-6,3,6)}
  }
  if(H.camp.pitched){g.fillStyle='#ff9800';g.fillRect(px(H.camp.x)-3,py(elevAt(H.camp.x))-12,6,6)}
  const X=px(H.x),Y=py(elevAt(H.x));
  g.fillStyle='#fff';g.strokeStyle='#111';g.lineWidth=1.5;g.beginPath();g.arc(X,Y-4,5,0,7);g.fill();g.stroke();
}

let screen='menu',MODAL=false;const MODALQ=[];
function show(id){$$('.screen').forEach(s=>s.classList.toggle('active',s.id==='s-'+id));screen=id;window.scrollTo(0,0)}

/* ---------- Modal & Toast ---------- */
function showModal(o){
  if(MODAL){MODALQ.push(o);return}
  MODAL=true;
  const m=$('#modal');
  m.innerHTML=`<div class="box"><h3>${o.title||''}</h3><p>${o.text||''}</p><div class="mbody">${o.html||''}</div><div class="btns"></div></div>`;
  const bx=$('.btns',m);
  (o.buttons||[{label:'OK'}]).forEach(b=>{const e=document.createElement('button');e.textContent=b.label;e.className=b.cls||'';e.onclick=()=>{closeModal();if(b.fn)b.fn()};bx.appendChild(e)});
  m.classList.add('open');
  if(o.onOpen)o.onOpen(m);
}
function closeModal(){
  $('#modal').classList.remove('open');MODAL=false;
  if(MODALQ.length){const n=MODALQ.shift();setTimeout(()=>showModal(n),50)}
}
function toast(msg,cls){
  if(!H||screen!=='hike')return;
  const box=$('#toasts');if(!box)return;
  const last=box.lastElementChild;
  if(last&&last.textContent===msg&&!last.classList.contains('out')){last.style.animation='none';void last.offsetWidth;last.style.animation='in .25s';return}
  const d=document.createElement('div');d.className='toast '+(cls||'');d.textContent=msg;box.appendChild(d);
  while(box.children.length>6)box.removeChild(box.firstChild);
  setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),600)},7500);
}

let SHOP={tab:'Rucksack',hike:null};
function shopMoney(){return G.money-SHOP.hike.permit}
function totalLoad(){return gearKg()+consKg()+waterCapL()}
function renderShop(hikeId,tab){
  if(hikeId)SHOP.hike=HIKES.find(h=>h.id===hikeId);
  if(tab)SHOP.tab=tab;
  show('shop');
  const hk=SHOP.hike;
  const items=[...GEAR.filter(g=>TAB_OF[g.cat]===SHOP.tab),...CONS.filter(c=>TAB_OF[c.cat]===SHOP.tab)];
  const pack=slotOf('pack');const load=totalLoad();const capC=capacityKg();const capP=pack?pack.max:0;
  const foodPts=FOODS.reduce((a,f)=>a+f.sat*(G.cons[f.id]||0),0);
  const dayNeed=87*(1.3-0.1*G.stats.food);
  const km=hk.stages.reduce((a,s)=>a+s.km,0);
  const warn=[];
  if(load>capP)warn.push(['bad','Rucksack überladen ('+fmtN(load)+' > '+fmtN(capP)+' kg) – größeren Rucksack wählen oder Gewicht reduzieren.']);
  else if(load>capC)warn.push(['warn','Schwerer als du bequem tragen kannst – du wirst langsamer und verbrauchst mehr Energie.']);
  if(foodPts<dayNeed*Math.max(1,km/40))warn.push(['warn','Wenig Proviant für die Tourlänge (≈ '+fmtN(foodPts/dayNeed)+' Tage).']);
  if(!slotOf('shelter'))warn.push(['info','Keine Unterkunft – Schlafen unter freiem Himmel ist unbequem und riskant.']);
  if(!slotOf('bag'))warn.push(['info','Kein Schlafsack.']);
  const hasStove=packedGear().some(g=>g.tool==='stove'),hasFire=packedGear().some(g=>g.tool==='fire');
  if(hasStove&&!(G.cons.gas>0))warn.push(['warn','Gaskocher ohne Gaskartusche.']);
  const cookN=FOODS.filter(f=>f.cook).reduce((a,f)=>a+(G.cons[f.id]||0),0);
  if(cookN>0&&!((hasStove&&G.cons.gas>0)||hasFire))warn.push(['warn','Kochproviant, aber keine Möglichkeit zum Kochen (Gaskocher + Gas oder Feuerstarter).']);
  if(!packedGear().some(g=>g.nav))warn.push(['info','Kein Navigationsgerät (außer Smartphone mit Netz/Offline-Karten).']);
  $('#s-shop').innerHTML=`<div class="wrap shop"><div class="topbar"><div><h2>🛒 Ausrüstung: ${hk.name}</h2></div><div class="chips"><span class="chip">💶 ${eur(G.money)}</span><span class="chip">🎫 ${eur(hk.permit)} Anreise</span><span class="chip">Verfügbar: ${eur(shopMoney())}</span></div></div>
   <div class="shopgrid"><div><div class="tabs">${TABS.map(t=>`<button class="${t===SHOP.tab?'on':''}" data-t="${t}">${t}</button>`).join('')}</div>
   <div class="items">${items.map(it=>{
     const isCons=it.cat==='food'||it.cat==='gas';
     const ic=`<span class="ico">${img('gear/'+it.id)?`<img src="assets/gear/${it.id}.png">`:it.e}</span>`;
     if(isCons){const q=G.cons[it.id]||0;return `<div class="item">${ic}<div class="inf"><b>${it.name}</b><small>${it.kg*1000} g · ${eur(it.price)}${it.sat?' · +'+it.sat+' Sättigung':''}</small></div><div class="ctl"><button data-cm="${it.id}" ${q<=0?'disabled':''}>−</button><span class="qty">${q}</span><button data-cp="${it.id}" ${shopMoney()<it.price?'disabled':''}>+</button></div></div>`}
     const own=!!G.owned[it.id],pk=!!G.packed[it.id];
     const stats=(it.q?`Bild ${Math.round(it.q*100)}% · `:'')+fmtN(it.kg,2)+' kg';
     return `<div class="item ${pk?'packed':''}">${ic}<div class="inf"><b>${it.name}</b><small>${it.desc}</small><small class="dim">${stats}${it.price?' · '+eur(it.price):''}</small></div>
       <div class="ctl">${own?`<button class="${pk?'on':''}" data-pk="${it.id}">${pk?'✓ Eingepackt':'Einpacken'}</button>`:`<button class="primary" data-buy="${it.id}" ${shopMoney()<it.price?'disabled':''}>Kaufen ${eur(it.price)}</button>`}</div></div>`}).join('')}</div></div>
   <div class="card side"><h3>🎒 Packliste</h3>
    <div class="meter"><div class="mlabel">Gewicht ${fmtN(load)} kg</div><div class="mbar"><i style="width:${clamp(load/Math.max(capP,1)*100,0,100)}%" class="${load>capP?'bad':load>capC?'warn':''}"></i><b style="left:${clamp(capC/Math.max(capP,1)*100,0,100)}%"></b></div><small>bequem: ${fmtN(capC)} kg · Rucksack max: ${fmtN(capP)} kg</small></div>

  $$('#s-shop [data-t]').forEach(b=>b.onclick=()=>renderShop(null,b.dataset.t));
  $$('#s-shop [data-buy]').forEach(b=>b.onclick=()=>{const it=gearById(b.dataset.buy);if(shopMoney()<it.price)return;G.money-=it.price;G.owned[it.id]=1;doPack(it,true);save();renderShop()});
  $$('#s-shop [data-pk]').forEach(b=>b.onclick=()=>{const it=gearById(b.dataset.pk);doPack(it,!G.packed[it.id]);renderShop()});
  $$('#s-shop [data-cp]').forEach(b=>b.onclick=()=>{const it=gearById(b.dataset.cp);if(shopMoney()<it.price)return;G.money-=it.price;G.cons[it.id]=(G.cons[it.id]||0)+1;renderShop()});
  $$('#s-shop [data-cm]').forEach(b=>b.onclick=()=>{const it=gearById(b.dataset.cm);if(!G.cons[it.id])return;G.money+=it.price;G.cons[it.id]--;if(!G.cons[it.id])delete G.cons[it.id];renderShop()});
  $('#s-back').onclick=()=>{refundCons();renderHikes()};
  $('#s-go').onclick=()=>{
    if(G.money<hk.permit)return;
    G.money-=hk.permit;
    startHike(hk.id);enterHike();
  };
}
function refundCons(){for(const id in G.cons){const c=gearById(id);G.money+=c.price*G.cons[id]}G.cons={}}
function doPack(it,on){
  if(EXCLUSIVE.includes(it.cat)){
    if(!on&&(it.cat==='pack'||it.cat==='shoes'))return;
    if(on)GEAR.filter(g=>g.cat===it.cat).forEach(g=>delete G.packed[g.id]);
  }
  if(on)G.packed[it.id]=1;else delete G.packed[it.id];
}

function loop(ts){
  requestAnimationFrame(loop);
  if(screen!=='hike'||!H){lastTs=ts;return}
  const dt=Math.min(0.1,(ts-lastTs)/1000);lastTs=ts;tm+=dt;
  let speed=0;
  if(!H.ended&&!MODAL){
    speed=H.speed;if(H.sleep.active&&speed>0)speed=Math.max(speed,30);
    if(speed>0){
      accMin+=dt*10*speed;let n=0;const h=1/6;
      while(accMin>=h&&n<700&&!H.ended&&!MODAL){stepSim(h);accMin-=h;n++}
      if(n>=700)accMin=0;
    }
    updateIcons(speed>0?dt:0);
  }
  if(!H.ended){const d=env.alt-H.camElev;H.camElev=Math.abs(d)>80?env.alt:H.camElev+d*Math.min(1,dt*3);drawScene(ctx,tm)}
  hudT+=dt;if(hudT>0.2){hudT=0;if(!H.ended)updateHUD()}
}

   <div class="card" id="pubcard"><h3>📺 Video schneiden & veröffentlichen</h3>
    ${H.clips.length?`<div class="row"><span class="lbl">Titel</span><input id="vt" value="${hk.name} – Mein Trip"></div>
    <p class="hint">Vielfalt bringt einen Bonus (${sc.groups} verschiedene Motive → ×${fmtN(sc.variety,2)}). Viele gleichartige Clips zählen abnehmend.</p>
    ${promos.length?`<h4>Ausrüstung bewerben <small>(Provision, −4 % Video-Score je Produkt)</small></h4>${promos.map(p=>`<label class="chk"><input type="checkbox" data-pr="${p.id}"> ${p.e} ${p.name} <small>(${eur(p.price)})</small></label>`).join('')}`:''}
    <div id="forecast" class="forecast"></div>
    <button class="big primary" id="r-pub">Video veröffentlichen</button>`:`<p>Ohne Aufnahmen gibt es kein Video und keine Einnahmen.</p><button class="big primary" id="r-home">Zur Basis</button>`}
   </div></div></div>`;
  if(!H.clips.length){$('#r-home').onclick=()=>{H=null;renderHub()};return}
  const calc=()=>{
    const sel=$$('#pubcard [data-pr]').filter(c=>c.checked).map(c=>gearById(c.dataset.pr));
    const score=sc.base*sc.variety*hk.mult*(1-0.04*sel.length);
    const rev=score*1.2*Math.sqrt(1+G.subs/800);
    const promo=sel.reduce((a,p)=>a+p.price*0.08,0)*clamp(rev/120,0.3,3);
    return {score,rev,promo,total:rev+promo,sel};
  };
  const upd=()=>{const c=calc();$('#forecast').innerHTML=`Video-Score <b>${Math.round(c.score)}</b> · erwartete Einnahmen gesamt <b>${eur(c.total)}</b> <small>(davon Werbung ${eur(c.promo)})</small><br><small>Das Geld kommt nicht auf einmal: Die Aufrufe steigen etwa 11 Tage lang und flachen dann über Wochen ab.</small>`};
  upd();$$('#pubcard [data-pr]').forEach(c=>c.onchange=upd);
  $('#r-pub').onclick=()=>{
    const c=calc();
    G.videos.push({title:$('#vt').value||hk.name,day:G.day,score:c.score,total:c.total,earned:0,clips:H.clips.length});
    G.cons={};save();
    $('#pubcard').innerHTML=`<h3>✅ Veröffentlicht!</h3><p>Dein Video ist online. Erwartete Einnahmen insgesamt: <b>${eur(c.total)}</b>. Sie kommen über die nächsten Tage und Wochen herein – sogar während deiner nächsten Wanderung.</p><button class="big primary" id="r-home">Zur Basis</button>`;
    $('#r-home').onclick=()=>{H=null;renderHub()};
  };
}

/* ---------- Start ---------- */
window.addEventListener('DOMContentLoaded',()=>{renderMenu()});
</script>
</body>
</html>
