<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1b15">
<title>Wanderkanal</title>
<style>
:root{--bg:#0e1b15;--panel:#16281f;--panel2:#1d3529;--line:#2c4a3a;--txt:#e8f1ea;--dim:#9db5a5;--acc:#4cc38a;--acc2:#2f9e6b;--warn:#ffb54a;--bad:#ff6b5a;--blue:#4aa8e8;
 --c-en:#f7c948;--c-sat:#ff9142;--c-hyd:#39a0ff;--c-warm:#ff5d73;--c-wet:#a88bff;--c-hp:#3ddc84;--c-batt:#9be564;
 --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;overscroll-behavior:none;touch-action:manipulation}
h1,h2,h3,h4{margin:0 0 .5em}h2{font-size:1.35em}h3{font-size:1.1em}
small,.dim{color:var(--dim)}
button,select,input{font:inherit;color:var(--txt)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;min-height:36px}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--acc2);border-color:var(--acc);color:#fff;font-weight:600}
button.on{background:var(--acc2);border-color:var(--acc)}
button.hl{box-shadow:0 0 0 2px var(--blue)}
button.big{padding:12px 18px;font-size:1.05em}
button.warnb{border-color:var(--warn);color:var(--warn)}
input[type=text],input:not([type]),select{background:#0f2018;border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-height:34px}
input[type=range]{accent-color:var(--acc)}
.screen{display:none;min-height:100vh}.screen.active{display:block}
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px}
.center h1{font-size:2.6em}.sub{color:var(--dim)}
.col{display:flex;flex-direction:column;gap:10px;min-width:240px}
.wrap{max-width:1180px;margin:0 auto;padding:16px calc(16px + var(--sr)) 24px calc(16px + var(--sl))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.two,.three{grid-template-columns:1fr}}
@media(max-width:1000px) and (min-width:700px) and (max-height:600px){.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card.dis>*:not(.badtxt){opacity:.42;filter:grayscale(1)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 12px;white-space:nowrap}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}.row.gap{gap:8px;flex-wrap:wrap}
.lbl{min-width:104px;color:var(--dim)}.val{min-width:70px;text-align:center}
.sw{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid #fff3;vertical-align:middle}
.stat{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.ctl{display:flex;align-items:center;gap:6px}.pips{letter-spacing:1px;color:var(--acc);min-width:110px;text-align:center;font-size:.9em}
.hint{color:var(--dim);font-size:.9em}
#prev{display:block;margin:0 auto 10px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.hike .facts{display:flex;flex-direction:column;gap:3px;margin:8px 0 12px;font-size:.9em;color:var(--dim)}
.risk{display:inline-block;border-radius:8px;padding:1px 8px;font-size:.85em;font-weight:600;color:#0b1a12}
.vbar{height:6px;background:#0f2018;border-radius:4px;margin:5px 0;overflow:hidden}.vbar i{display:block;height:100%;background:var(--acc)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:flex;gap:4px;flex-wrap:wrap}.seg button{padding:5px 10px;min-height:32px}
/* Shop */
.shopgrid{display:grid;grid-template-columns:1fr 350px;gap:14px}@media(max-width:699px){.shopgrid{grid-template-columns:1fr}}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.item.packed{border-color:var(--acc)}.item.broken{border-color:var(--bad)}
.ico{font-size:2em;width:48px;text-align:center}.ico img{width:44px;height:44px;object-fit:contain}
.ico.pk{width:64px}.ico.pk img{width:60px;height:74px}
.pvs{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}.pvs button{width:34px;height:40px;padding:2px;border:2px solid transparent;border-radius:6px;background:rgba(255,255,255,.07);min-width:0}.pvs button.on{background:rgba(255,255,255,.18)}.pvs img{width:100%;height:100%;object-fit:contain}
.ico.wide{width:112px}.ico.wide img{width:104px;height:47px}
.inf{flex:1;display:flex;flex-direction:column;gap:2px}
.qty{min-width:24px;text-align:center}
.side{position:sticky;top:10px;align-self:start}
.pl{list-style:none;padding:0;margin:8px 0;max-height:230px;overflow:auto;font-size:.92em}.pl li{padding:2px 0}
.mbar{position:relative;height:12px;background:#0f2018;border-radius:6px;overflow:visible;margin:4px 0}.mbar i{display:block;height:100%;background:var(--acc);border-radius:6px}.mbar i.warn{background:var(--warn)}.mbar i.bad{background:var(--bad)}.mbar b{position:absolute;top:-3px;width:2px;height:18px;background:#fff}
.warnbox{border-radius:8px;padding:7px 10px;margin:6px 0;font-size:.88em;border:1px solid var(--line)}
.warnbox.bad{background:#4a1f17;border-color:var(--bad)}.warnbox.warn{background:#4a3a17;border-color:var(--warn)}.warnbox.info{background:#173a4a;border-color:var(--blue)}
.badtxt{color:var(--bad);font-weight:600}.goodtxt{color:var(--acc);font-weight:600}
/* Hike */
#s-hike{background:#000}
#s-hike.active{display:block;position:fixed;inset:0;min-height:0;z-index:5;overflow:hidden}
#stage{position:absolute;inset:0;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;pointer-events:none;z-index:3}
.pill{background:rgba(8,16,12,.76);border:1px solid #ffffff1c;border-radius:12px;padding:5px 10px;font-size:14px;color:#fff;line-height:1.35}
#h-tl{left:calc(4px + var(--sl));top:calc(4px + var(--st))}#h-tl .pill{padding:4px 7px;display:flex;gap:8px;align-items:center}#h-tl .st{width:68px;font-size:11px}#h-tl .sb{gap:1px 5px}#h-tl .dogb{margin:0;padding:0 0 0 7px;border-top:0;border-left:1px solid #ffffff22;grid-template-columns:auto;gap:1px}
#h-tc{left:50%;transform:translateX(-50%);top:calc(6px + var(--st));text-align:center}
.dl{font-size:17px;font-weight:700;letter-spacing:.2px;line-height:1.25;margin-bottom:1px}.se{font-size:14px;font-weight:700;margin-left:4px;white-space:nowrap}
.se-Frühling{color:#8fe388}.se-Sommer{color:#ffd54a}.se-Herbst{color:#ff9a4a}.se-Winter{color:#9fd4ff}
#h-tr{right:calc(6px + var(--sr));top:calc(6px + var(--st));text-align:right;max-width:34vw}
.sb{display:grid;grid-template-columns:repeat(2,auto);gap:2px 6px}
.st{display:flex;align-items:center;gap:4px;width:88px;font-size:13px}
.st .ic{width:20px;text-align:center;font-size:17px}
.st .tr{flex:1;height:11px;background:#0008;border-radius:5px;overflow:hidden}
.st .fl{display:block;height:100%;border-radius:5px;transition:width .3s}
.st.low .ic{animation:blink .9s infinite}.st.low .fl{animation:blink .9s infinite}
@keyframes blink{50%{opacity:.35}}
.dev{display:inline-flex;align-items:center;gap:3px;margin-left:6px;font-size:13px}
.dev .bt{display:inline-block;width:28px;height:10px;border:1px solid #fff9;border-radius:2px;position:relative}
.dev .bt i{position:absolute;left:0;top:0;bottom:0;background:var(--c-batt)}
.dev.vm{background:#ffffff1c;border:1px solid #ffffff33;border-radius:9px;padding:0 6px;margin-left:3px;cursor:pointer}
.dev.low .bt i{background:var(--bad)}.dev.dead{color:var(--bad)}
#toasts{position:absolute;right:calc(98px + var(--sr,0px));top:96px;display:flex;flex-direction:column;gap:2px;width:170px;max-width:30%;max-height:50px;text-align:left;overflow:hidden;justify-content:flex-start;pointer-events:none;z-index:3}
.toast{background:rgba(10,20,15,.82);border-left:3px solid var(--dim);padding:3px 6px;border-radius:5px;font-size:11.2px;line-height:1.25;animation:in .25s;transition:opacity .6s}
.toast.good{border-color:var(--acc)}.toast.bad{border-color:var(--bad)}.toast.warn{border-color:var(--warn)}.toast.out{opacity:0}
@keyframes in{from{transform:translateX(-10px);opacity:0}to{transform:none;opacity:1}}
#h-mid{left:50%;transform:translateX(-50%);top:calc(76px + var(--st));text-align:center}
#h-bot{left:calc(6px + var(--sl));right:calc(6px + var(--sr));bottom:calc(4px + var(--sb));display:flex;gap:8px;align-items:center;pointer-events:none}
#h-bot .prow{flex:1;display:flex;gap:8px;align-items:center;background:rgba(8,16,12,.6);border:1px solid #ffffff1c;border-radius:12px;padding:3px 8px}
#prof{flex:1;min-width:0;height:40px}
#ptxt{font-size:13px;white-space:nowrap;text-align:right;color:#fff}
#dock{display:flex;gap:6px;pointer-events:auto}
.rb{width:54px;height:54px;border-radius:50%;padding:0;font-size:23px;display:flex;align-items:center;justify-content:center;background:rgba(8,16,12,.72);border:1px solid #ffffff33;position:relative;color:#fff;flex-direction:column;line-height:1}
.rb small{font-size:10.5px;color:#fff;margin-top:1px}
.rb.act{background:var(--acc2);border-color:var(--acc)}
.rb .bdg{position:absolute;top:-3px;right:-3px;background:var(--warn);color:#000;border-radius:9px;font-size:9px;padding:0 4px;font-weight:700}
#drawer{position:absolute;right:0;top:0;bottom:0;width:min(62vw,400px);transform:translateX(102%);transition:transform .2s;background:rgba(10,20,15,.95);z-index:6;overflow:auto;padding:8px 10px calc(8px + var(--sb)) 10px;border-left:1px solid var(--line)}
#drawer.open{transform:none}
#drawer h4{margin:8px 0 4px;font-size:.9em;color:var(--dim)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:5px}.acts button{font-size:.85em;padding:7px 6px}
.chk{display:flex;gap:6px;align-items:center;font-size:.9em;margin:5px 0}
#recsl{right:calc(8px + var(--sr));top:calc(50% + 8px);transform:translateY(-50%);display:flex;align-items:stretch;gap:6px;background:rgba(8,16,12,.6);border:1px solid #ffffff1c;border-radius:14px;padding:8px 8px 26px 10px;pointer-events:auto;flex-wrap:nowrap}
#spdctl{display:flex;align-items:center;gap:2px;background:#0a1410b0;border:1px solid #ffffff22;border-radius:14px;padding:2px 3px}
#spdctl button{background:transparent;border:0;color:#fff;font-size:15px;width:26px;height:44px;padding:0;cursor:pointer}
#sp-v{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:38px;color:#fff;font-size:19px;line-height:1}#sp-v small{font-size:11px;margin-top:2px}
.ctry{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.cbtn{display:flex;flex-direction:column;align-items:flex-start;padding:8px 14px}.cbtn.on{background:var(--acc);color:#04120a}.cbtn small{opacity:.8}
.grp{margin:16px 0 6px;font-size:16px;color:var(--acc)}
.dogb{display:grid;grid-template-columns:repeat(2,auto);gap:2px 6px;margin-top:4px;padding-top:4px;border-top:1px solid #ffffff22}
#rlab{display:flex;flex-direction:column;justify-content:space-between;height:112px;font-size:12px;text-align:right;color:#fff9}
#rlab span{cursor:pointer;line-height:1}#rlab span.on{color:#fff;font-weight:700}
#rtrk{position:relative;width:30px;height:112px;touch-action:none;cursor:pointer;flex:none}
#rtrk:before{content:"";position:absolute;left:12px;width:6px;top:0;bottom:0;background:#0009;border:1px solid #fff4;border-radius:4px}
#rknob{position:absolute;left:3px;width:24px;height:24px;margin-top:-12px;border-radius:50%;background:var(--acc);border:2px solid #fff;box-shadow:0 0 6px #0008;transition:top .12s}
.rcam{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:17px}
#livepanel .seg button{font-size:12px;padding:5px 7px;min-height:30px}#livepanel{position:absolute;right:calc(188px + var(--sr));bottom:calc(58px + var(--sb));width:min(42vw,270px);z-index:4;pointer-events:auto}
#rot{display:none;position:absolute;inset:0;z-index:9;background:#000d;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:10px;font-size:1.2em}
@media(orientation:portrait){#s-hike.active #rot{display:flex}}
/* Modal */
#modal{display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center;z-index:50;padding:8px}
#modal.open{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--acc);border-radius:14px;padding:16px;max-width:560px;width:100%;max-height:calc(100vh - 16px);overflow:auto}
#modal .box.wide{max-width:860px}
#modal .btns{display:flex;flex-direction:column;gap:7px;margin-top:12px}
#modal .btns.rowb{flex-direction:row;flex-wrap:wrap}
.cliplist{max-height:300px;overflow:auto}.clip{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.9em}
.rar{font-style:normal;font-size:.72em;padding:1px 6px;border-radius:8px;color:#fff;margin-left:4px}
.forecast{background:var(--panel2);border-radius:8px;padding:10px;margin:10px 0}
/* Rucksack */
.pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.pk .cell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:.85em;cursor:pointer}
.pk .cell.static{cursor:default}
.pk .big{font-size:1.9em;line-height:1.1;min-height:36px;word-break:break-all}
.bar{height:8px;background:#0008;border-radius:5px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%}
.bottles{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.bottle{text-align:center;font-size:.8em;cursor:pointer}
/* Studio */
.yt{background:#0f0f0f;border:1px solid #303030;border-radius:12px;overflow:hidden}
.ytban{height:150px;background:linear-gradient(120deg,#1e4d36,#2b6f8f 60%,#6a4c93)}
.ythead{display:flex;gap:14px;align-items:center;padding:12px 16px;margin-top:-34px}
.ytav{width:72px;height:72px;border-radius:50%;border:3px solid #0f0f0f;display:flex;align-items:center;justify-content:center;font-size:34px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0}
.kpi{background:var(--panel2);border-radius:10px;padding:8px 10px}.kpi b{display:block;font-size:1.25em}
.vrow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #2a2a2a}
.vrow canvas{width:150px;height:84px;border-radius:8px;flex:none;background:#222}
.vrow .mt{flex:1;min-width:0}
.badge{display:inline-block;border-radius:6px;font-size:.75em;padding:1px 6px;margin-left:4px;background:#333}.badge.hot{background:#c0392b}
.cmt{padding:6px 0;border-bottom:1px solid #2a2a2a;font-size:.9em}
canvas.chart{width:100%;height:140px;display:block}
/* Landscape phone */
@media(max-height:520px){
 html,body{font-size:13px}
 .wrap{padding:8px calc(10px + var(--sr)) 14px calc(10px + var(--sl))}
 .center{min-height:100vh;gap:8px;padding:8px}.center h1{font-size:1.9em}
 .card{padding:10px}.item{padding:6px}.ico{font-size:1.6em;width:38px}
 button{padding:6px 10px;min-height:32px}
 #modal .box{padding:12px}
 h2{font-size:1.15em}
}
@media(max-height:430px){.st{width:72px;font-size:12px}.st .ic{font-size:15px;width:17px}.st .tr{height:9px}.pill{font-size:13px;padding:4px 8px}.rb{width:49px;height:49px;font-size:20px}#h-mid{top:calc(82px + var(--st))}#h-bot{gap:5px}#dock{gap:4px}}

html[data-scr="menu"],html[data-scr="hub"]{--bg:#26292d;--panel:#31353b;--panel2:#3b4048;--line:#4b525b;--dim:#aab2ba;--acc:#cfd5db;--acc2:#6a7681}
html[data-scr="hikes"]{--bg:#0e1b15;--panel:#16281f;--panel2:#1d3529;--line:#2c4a3a;--acc:#4cc38a;--acc2:#2f9e6b}
html[data-scr="shop"]{--bg:#0c1824;--panel:#13263a;--panel2:#1a3552;--line:#2b4f78;--dim:#9db4cb;--acc:#4aa8e8;--acc2:#2a78c0}
html[data-scr="studio"]{--bg:#141414;--panel:#212121;--panel2:#2b2b2b;--line:#3d3d3d;--dim:#aaaaaa;--acc:#ff3030;--acc2:#cc0000}
.seasonbar{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:14px;margin-bottom:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.seasonbar .sb-e{font-size:46px;line-height:1}
.seasonbar .sb-t{display:flex;flex-direction:column}
.seasonbar .sb-t small{color:rgba(255,255,255,.85);font-size:.8em;text-transform:uppercase;letter-spacing:.08em}
.seasonbar .sb-t b{font-size:1.9em;line-height:1.1}
.seasonbar .sb-d{margin-left:auto;font-size:1.25em;font-weight:600;text-align:right}
.sb-Frühling{background:linear-gradient(120deg,#2e8b57,#9acd32)}
.sb-Sommer{background:linear-gradient(120deg,#f2a01a,#ff6a2b)}
.sb-Herbst{background:linear-gradient(120deg,#b8561b,#7b2d12)}
.sb-Winter{background:linear-gradient(120deg,#3c6c9c,#8fb8de)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:480px){.duo{grid-template-columns:1fr}.seasonbar .sb-d{font-size:1em}}
.card.c-green{border-color:#2f9e6b;background:linear-gradient(160deg,#1f5a3d,#16281f 70%)}
.card.c-blue{border-color:#2a78c0;background:linear-gradient(160deg,#1d4f80,#13263a 70%)}
.card.c-red{border-color:#cc0000;background:linear-gradient(160deg,#5a1414,#212121 70%)}
.card.c-green button.primary{background:#2f9e6b;border-color:#4cc38a}
.card.c-blue button.primary{background:#2a78c0;border-color:#4aa8e8}
.card.c-red button.primary{background:#cc0000;border-color:#ff3030}
.bigact{width:100%;font-size:1.15em;padding:14px 12px;margin-bottom:6px}
.ytav{flex:none;aspect-ratio:1/1;overflow:hidden}
.hk-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:6px;margin:8px 0}
.hk-stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 9px;display:flex;flex-direction:column;gap:3px;min-width:0}
.hk-stat b{font-size:1.08em;line-height:1.2}.hk-stat small{color:var(--dim);font-size:.78em;line-height:1.25}
.hk-stat.bad{border-color:var(--bad)}.hk-stat.bad b{color:var(--bad)}.hk-stat .risk{align-self:flex-start}
.hk-more{margin:6px 0 10px}.hk-more summary{cursor:pointer;color:var(--acc);font-size:.9em;padding:4px 0}.hk-more .facts{margin:6px 0 0}
.chs{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 2px}
.chs .ch{background:#0f2018aa;border:1px solid var(--line);border-radius:12px;padding:1px 8px;font-size:.8em;line-height:1.5;white-space:nowrap}
.chs .ch.bad{border-color:var(--bad);color:var(--bad)}
.inf small.dsc{color:var(--dim);font-size:.85em}
.timebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:0 0 12px 12px;font-size:.85em}
.timebar .seg button{padding:3px 9px;min-height:26px;font-size:.9em}

// P: erzeugt Etappen aus Muster (Buchstabe = Biom, Zahl = km), Höhe linear a0→a1 plus Schwankung
function P(spec,total,a0,a1,wig,seed){
  const tk=spec.split(' ').map(s=>({b:BL[s[0]],w:+s.slice(1)}));
  const out=[];let acc=0,i=0;
  while(acc<total-0.01){const t=tk[i%tk.length];const km=Math.min(t.w,total-acc);out.push({b:t.b,km,alt:0});acc+=km;i++}
  if(out.length>1&&out[out.length-1].km<2){const l=out.pop();out[out.length-1].km+=l.km}
  let cum=0;const r=mulberry32(seed||1);
  out.forEach((s,k)=>{cum+=s.km;const t=cum/total;let a=lerp(a0,a1,t)+wig*Math.sin(k*1.9+seed)*0.6+wig*(r()-0.5)*0.8;

  out[out.length-1].alt=Math.round(a1);
  return out;
}

const MN=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MD=[31,28,31,30,31,30,31,31,30,31,30,31];
const START_DOY0=90;           // Spielstart: 1. April
function dateOf(day){const t=START_DOY0+day;const year=Math.floor(t/365);let d=t%365,m=0;while(d>=MD[m]){d-=MD[m];m++}return{doy0:t%365,m,dom:d+1,year:year+1}}
const dateStr=day=>{const d=dateOf(day);return d.dom+'. '+MN[d.m]+(d.year>1?' (Jahr '+d.year+')':'')};
const seasonOfM=m=>(m===11||m<2)?'Winter':m<5?'Frühling':m<8?'Sommer':'Herbst';
const SEASON_E={Winter:'❄️',Frühling:'🌷',Sommer:'☀️',Herbst:'🍂'};
/* ---- Sonne ---- */
function sunSin(lat,doy0,hour){
  const dec=23.44*Math.sin(2*Math.PI*(doy0-80)/365)*Math.PI/180,la=lat*Math.PI/180;
  return Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos((hour-12)*Math.PI/12);
}
const sunAltDeg=(lat,doy0,hour)=>Math.asin(clamp(sunSin(lat,doy0,hour),-1,1))*180/Math.PI;
const lightOf=alt=>{const t=clamp((alt+6)/14,0,1);return t*t*(3-2*t)};
function dayLightHours(lat,doy0){let n=0;for(let i=0;i<96;i++)if(lightOf(sunAltDeg(lat,doy0,i/4))>0.5)n+=0.25;return n}
/* ---- Klima ---- */
function seasonalT(R,doy0,alt){return R.meanT-R.sAmp*Math.cos(2*Math.PI*(doy0-25)/365)-(alt-R.ref)*0.0065}
function wxWeights(R,m,ext){
  const s=seasonOfM(m),md=R.mod||{};
  const base={Winter:{klar:1.2,wolkig:2.5,nebel:1.5,regen:1.3,sturm:1.4,gewitter:0.02},Frühling:{klar:2,wolkig:3,nebel:1,regen:2,sturm:0.6,gewitter:0.35},Sommer:{klar:3,wolkig:3,nebel:0.5,regen:1.5,sturm:0.35,gewitter:1},Herbst:{klar:1.5,wolkig:3,nebel:1.6,regen:3,sturm:1.1,gewitter:0.2}}[s];
  const o={};for(const k in base){o[k]=base[k]*(md[k]||1);if(k==='sturm'||k==='gewitter'||k==='regen')o[k]*=ext;if(k==='sturm'||k==='gewitter')o[k]*=0.55;else if(k==='regen')o[k]*=0.65;else if(k==='nebel')o[k]*=0.8;else if(k==='klar')o[k]*=1.3}
  return o;
}

function ES(id){ // effektive Fähigkeit (mit Körperbau/Talent, Streckenkenntnis)
  let v=G.stats[id]+((BUILD_BONUS[G.look.build]||{})[id]||0);

  const t=G.talent&&TALENT_BONUS[G.talent];if(t&&t[id])v+=t[id];
  return Math.max(0.5,v);
}

function skillAvg(hk){const ids=['trag','aus','tempo','kalt','nav'];let s=0;ids.forEach(i=>{s+=ES(i)+(i==='nav'&&hk?famBonus(hk):0)});return s/ids.length}

// Welche gepackten Wasserbehälter passen in den Rucksack? (einzelne Größe + Gesamtmenge)
function waterFit(){
  const pk=slotOf('pack'),all=packedGear().filter(g=>g.cat==='water'),ok=[],no=[];let tot=0;
  for(const c of all){if(pk&&pk.wbig&&(c.cap>pk.wbig||tot+c.cap>pk.wcap)){no.push(c)}else{ok.push(c);tot+=c.cap}}
  return {ok,no};
}

// Last, die der Spieler wirklich trägt: Hund trägt zuerst sein Futter, dann Ausrüstung
function playerLoad(totalKg,dogFoodKg){
  const cap=dogPackCap();if(!cap)return totalKg;
  const carriedFood=Math.min(cap,dogFoodKg);
  const relief=Math.min(cap-carriedFood,totalKg-dogFoodKg);
  return totalKg-carriedFood-Math.max(0,relief);
}

function drawForkPaths(g,tm,f){
  const F=forkOf(f);

    if(k===F.main)continue;
    const mine=!!(H.side&&H.side.f===f&&H.side.d===k);if(H.side&&H.side.f===f&&!mine)continue;
    const mm=mine?forkM():0;

    g.lineCap='round';g.lineJoin='round';

    const fadeFrom=f.x+len-160,bodyEnd=Math.min(e,fadeFrom);
    if(bodyEnd>a){g.beginPath();for(let x=a;x<=bodyEnd;x+=12){const sx=x-camX,y=yy(x);if(x===a)g.moveTo(sx,y);else g.lineTo(sx,y)}g.lineTo(bodyEnd-camX,yy(bodyEnd));g.stroke()}

function netAt(x){
  if(featNear('village',x,900)||featNear('lodge',x,450)||x<500||(H.route&&x>H.route.totalPx-500))return true;
  return hash(Math.floor(x/300)+77)<BIOMES[stageAt(x).b].net;
}

/* ---- Wetter ---- */
function wxRand(){if(typeof COOP!=='undefined'&&COOP&&COOP.seed&&H){H.wxN=(H.wxN||0)+1;return hash(COOP.seed*0.0137+H.wxN*7.331+0.5)}return Math.random()}
function nextWeather(prev){
  const d=dateOf(G.day),w=wxWeights(H.hk.regD,d.m,H.hk.ext);let tot=0;
  const ent=Object.entries(w).map(([k,v])=>{v=k===prev?v*2.4:v;tot+=v;return [k,v]});
  let r=wxRand()*tot;for(const [k,v] of ent){r-=v;if(r<=0)return k}return 'wolkig';
}
function setWeather(type){
  const rnd=(a,b)=>a+wxRand()*(b-a);
  const hk=H.hk,W=WEATHER[type];
  H.weather={type,until:H.t+rnd(260,760),wind:W.wind*rnd(0.75,1.3)*hk.regD.wind*(0.85+0.15*hk.ext),rainI:W.rain?W.rain*rnd(0.6,1.2)*(0.7+hk.ext*0.4):0};
  H.nextW=nextWeather(type);H.wxWarned=false;
  if((type==='gewitter'||type==='sturm')&&H.started)spawnIcon({kind:'storm',x:H.x+320,e:type==='gewitter'?'⛈️':'🌪️',label:type==='gewitter'?'Gewitter':'Sturm',base:30,life:12});
}
function updateWeather(){
  if(H.lodge&&H.lodge.until&&H.t>=H.lodge.until&&!(H.sleep.active&&H.indoor==='lodge')){H.lodge=null;toast('🏨 Check-out: Dein Zimmer ist nicht mehr gebucht.')}
  if(H.t>=H.weather.until){setWeather(H.nextW||nextWeather(H.weather.type));return}
  if(!H.wxWarned&&H.weather.until-H.t<110&&(H.nextW==='gewitter'||H.nextW==='sturm')){
    H.wxWarned=true;toast(H.nextW==='sturm'?'⚠️ Der Wind frischt auf – ein Sturm zieht in etwa 1½ Stunden auf!':'⚠️ Dunkle Wolken bauen sich auf – ein Gewitter naht.','warn');sfx('warn');
  }
}
function computeEnv(){
  const hk=H.hk,R=hk.regD;const d=dateOf(G.day);const hour=(H.t/60)%24;
  const st=stageAt(H.x),B=BIOMES[st.b];
  env.hour=hour;env.stage=st;env.biome=st.b;env.alt=elevAt(H.x);env.grade=gradeAt(H.x);
  env.doy0=d.doy0;env.month=d.m;env.season=seasonOfM(d.m);
  env.sunAlt=sunAltDeg(R.lat,d.doy0,hour);
  const W=WEATHER[H.weather.type];
  env.sun=lightOf(env.sunAlt);env.light=env.sun*W.dim;env.dark=1-env.light;
  env.gold=clamp(1-Math.abs(env.sunAlt-3)/9,0,1)*(env.sunAlt>-7?1:0);
  const sT=seasonalT(R,d.doy0,env.alt);env.seasonT=sT;
  const daily=R.dAmp*(0.35+0.65*env.sun)*Math.sin((hour-9)/24*2*Math.PI);
  const syn=R.syn*(0.6*Math.sin(H.t/1440*0.83+H.synPh[0])+0.4*Math.sin(H.t/1440*2.1+H.synPh[1]));
  env.temp=sT+daily+syn+W.dT;
  if(H.snowDepth==null)H.snowDepth=clamp((1.5-sT)/5,0,1)*30;
  env.snow=clamp(H.snowDepth/30,0,1);
  env.frozen=sT<-4;
  env.wind=H.weather.wind*B.wind;
  env.rainI=H.weather.rainI;
  env.precip=H.weather.rainI>0.05?(env.temp<1.5?'snow':'rain'):null;
  env.fog=H.weather.type==='nebel'?0.55:0;
  env.net=netAt(H.x);
  env.midnightSun=R.lat>66&&env.sunAlt>-2&&(hour<3||hour>21);
  env.aurora=(R.lat>62&&env.dark>0.85&&(H.weather.type==='klar'||H.weather.type==='wolkig')&&d.m!==5&&d.m!==6&&d.m!==7)?1:0;
}

function xpAdd(stat,amt){
  if(!amt||amt<=0)return;
  if(H&&H.hk)amt*=0.6+0.4*H.hk.diff;   // anspruchsvollere Touren geben mehr Erfahrung
  G.xp[stat]=(G.xp[stat]||0)+amt;
  const need=55*G.stats[stat];
  if(G.xp[stat]>=need&&G.stats[stat]<STAT_MAX){
    G.xp[stat]-=need;G.stats[stat]++;
    const d=STAT_DEFS.find(s=>s.id===stat);
    toast('💪 '+d.name+' steigt auf Stufe '+G.stats[stat]+'!','good');sfx('success');
    if(H)H.levelups=(H.levelups||[]).concat(d.name);
  }
}
const cf=id=>{const c=condOf(id);return c<=0?0:0.55+0.45*c/100};

  const ds=dogSize();

    x:0,km:0,phase:0,t:startH*60,dayIdx:0,awakeSince:startH*60-60,cond,startDay:G.day,
    speed:1,wood:0,woodX:0,thrill:0,flags:{},walking:true,auto:true,autoStop:true,autoNight:hk.km>=60,autoWake:false,sleptTonight:false,

    water:{clean:g.waterCap,dirty:0},
    rec:1,activeDev:handhelds[0]?handhelds[0].id:null,droneOn:true,droneTimer:DRONE_INT[1],shot:null,
    action:null,sleep:{active:false},camp:{pitched:false,x:0},fire:{lit:false,left:0,x:0},
    inj:{blister:0,sprain:0},sick:0,lost:{on:false,km:0},safeJunction:false,
    stim:{boostEnd:0,crashStart:0,crashEnd:0,mul:1,crash:1},charging:null,live:null,stalker:null,

    dog:ds?{def:ds,hunger:85,thirst:85,fat:0,mood:78,paw:0,fed:0,leash:true,away:false,trust:G.dog&&G.dog.bond||0}:null,

H.weather={type:'klar',until:0,wind:2,rainI:0};
computeEnv0();
  {let w0=nextWeather('');for(let k=0;k<6&&(w0==='sturm'||w0==='gewitter');k++)w0=nextWeather('');if(w0==='sturm'||w0==='gewitter')w0='wolkig';setWeather(w0)}

function computeEnv0(){ // erste Umgebung braucht Wetter-Grundwerte
  H.weather={type:'klar',until:0,wind:2,rainI:0};computeEnv();
}

/* ---------- Hilfsfunktionen ---------- */
function loadKg(){ // Last, die der Spieler trägt
  let k=H.g.gearKg;
  for(const id in H.food)k+=gearById(id).kg*H.food[id];
  k+=H.gas*(GAS.kg/5);
  k+=H.water.clean+H.water.dirty;
  k+=H.dogfood;
  return playerLoad(k,H.dogfood);
}
const waterTotal=()=>H.water.clean+H.water.dirty;
function forageMul(){const D=H.dog;if(D&&!D.away)return D.leash?1.1:1.45;return H.hk.km>=100?0.6:0.85}
const nearFire=()=>H.fire.lit&&Math.abs(H.x-H.fire.x)<110;
const woodAvail=()=>H.wood+(H.carry||0);
function useWood(){if(H.wood>0)H.wood--;else if(H.carry>0)H.carry--}
const fireCovered=x=>!!H.fireTarp&&Math.abs(H.fireTarp.x-x)<40;
function nearWater(){const q=featNear('quelle',H.x,90)||featNear('fluss',H.x,90);if(q)return q;if(!H.side)for(const l of (H.route.lakes||[]))if(H.x>l.xl-140&&H.x<l.xr+140)return {type:'fluss',lake:true,x:H.x,id:-7};return null}
function nearSight(){for(const f of featsIn(H.x-250,H.x+250))if(f.type==='sight'&&/see|fjord|loch|lac|lago|älv|elv/i.test(f.s.n))return f;return null}
function isInjured(){return H.inj.blister>H.t||H.inj.sprain>H.t||H.sick>H.t}
function fillContainers(){ // Verteilt Wasser auf Flaschen (sauber zuerst, dann unbehandelt)
  let c=H.water.clean,d=H.water.dirty;
  return H.g.containers.map(def=>{const a=Math.min(def.cap,c);c-=a;const b=Math.min(def.cap-a,d);d-=b;return {def,clean:a,dirty:b}});
}
function deviceOK(id){const d=H.dev[id];return !!d&&!d.broken&&d.batt>0}
function lightSource(){
  if(deviceOK('torch'))return 'torch';
  if(deviceOK('lamp'))return 'lamp';
  if(H.g.phones.some(p=>deviceOK(p.id)))return 'phone';
  return null;
}
function lampInUse(){return env.dark>0.55&&H.moving}
function navPhone(){ // Smartphone, das gerade zur Navigation genutzt wird
  if(H.g.gps&&deviceOK('gps'))return null;
  const ok=H.g.phones.filter(p=>deviceOK(p.id)&&(H.g.offline||env.net));
  if(!ok.length)return null;
  return ok.find(p=>p.id!==H.activeDev)||ok[0];
}
function navInfo(){
  const g=H.g;let best={q:0.12,label:'Kein Navi – nach Gefühl',src:null,live:false,note:''};
  const light=lightSource()==='lamp'||lightSource()==='torch';
  if(g.map){let q=0.6;if(env.fog)q-=0.15;if(env.dark>0.6&&!light)q-=0.2;if(H.body.wet>70)q-=0.1;if(q>best.q)best={q,label:'Landkarte & Kompass',src:'map',live:false,note:''}}
  let note='';
  const anyPhone=g.phones.length>0;
  if(anyPhone){
    const np=g.phones.some(p=>deviceOK(p.id)&&(g.offline||env.net));
    if(np){if(0.82>best.q)best={q:0.82,label:'Smartphone-Navi',src:'phone',live:true,note:''}}
    else if(!g.phones.some(p=>!H.dev[p.id].broken))note='Smartphone kaputt';
    else if(!g.phones.some(p=>deviceOK(p.id)))note='Handy-Akku leer';
    else note='Kein Netz (Offline-Karten fehlen)';
  }
  if(g.gps){const d=H.dev.gps;if(d.broken)note='GPS kaputt';else if(d.batt<=0)note='GPS-Akku leer';else if(0.92>best.q)best={q:0.92,label:'GPS-Gerät',src:'gps',live:true,note:''}}
  if(best.q<=0.6&&note&&!best.note)best.note=note;
  return best;
}

/* ---------- Kamera ---------- */
function handheld(){
  if(H.activeDev&&deviceOK(H.activeDev)&&H.dev[H.activeDev].def.kind!=='drone')return H.dev[H.activeDev];
  const alt=Object.keys(H.dev).find(id=>{const k=H.dev[id].def.kind;return (k==='phone'||k==='cam')&&deviceOK(id)});
  if(alt){H.activeDev=alt;toast('Wechsel auf '+H.dev[alt].def.name);return H.dev[alt]}
  return null;
}
function shotQ(def,scenic){
  const lightF=0.55+0.45*env.light;
  const wF={klar:1.08,wolkig:1,nebel:0.72,regen:0.8,gewitter:0.85,sturm:0.8}[H.weather.type];
  const wl=env.gold>0.3?1.12:1; // goldenes Licht
  return def.q*lightF*wF*wl*scenic*(hasT('foto')?1.1:1)*rnd(0.85,1.15);
}
function scenicNow(){
  let s=BIOMES[env.biome].scenic;
  if(featsIn(H.x-450,H.x+450).some(f=>f.type==='sight'))s*=1.5;
  if(env.gold>0.4)s*=1.1;
  return s;
}
function addClip(o){if(o.rar>=3)H.thrill+=2;else if(o.rar===2)H.thrill+=0.7;o.day=G.day;o.biome=env.biome;o.t=H.t;H.clips.push(o);return o}
function startShot(dev){
  const types=['selfie','landschaft','video','talk'];const w=[2,3,3,2];
  if(H.dog&&H.dog.mood>35){types.push('hund');w.push(2)}
  const tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot,ti=0;for(;ti<types.length-1;ti++){r-=w[ti];if(r<=0)break}
  const type=types[ti];
  const dur=CLIP_TYPES[type].dur*1.4*dev.def.time*rnd(0.85,1.15);
  H.shot={type,left:dur,dur,dev:dev.def.id};
}
function launchDrone(){
  if(env.wind>9||H.weather.type==='gewitter'||env.precip==='snow'){
    if(H.t-H.droneToast>120){toast('🛸 Zu windig/ungünstig für die Drohne.');H.droneToast=H.t}
    H.droneTimer=40;return;
  }
  H.dev.drone.batt-=18;
  if(H.dev.drone.batt<35)toast('🛸 Drohnen-Akku niedrig – lade ihn über die Powerbank.','warn');
  H.shot={type:'drone',left:12,dur:12,dev:'drone'};
  H.droneTimer=DRONE_INT[H.rec];
}
function finishShot(){
  const s=H.shot;H.shot=null;if(!s||s.noclip)return;
  const T=CLIP_TYPES[s.type];const d=H.dev[s.dev];if(!d)return;
  if(s.type==='drone'&&env.wind>6&&Math.random()<0.04){d.broken=true;H.cond.drone=0;toast('💥 Die Drohne ist abgestürzt!','bad');sfx('bad');return}
  const q=shotQ(d.def,s.type==='selfie'||s.type==='hund'?1:scenicNow());
  addClip({key:s.type,type:s.type,name:T.n,e:T.e,q,value:T.base*q,rar:-1});
  sfx('shutter');
}
function rollShots(hr){
  if(env.light<0.2||H.rec===0)return;
  if(!H.shot){const dev=handheld();if(dev&&Math.random()<SHOT_RATE[H.rec]*hr)startShot(dev)}
  if(!H.shot&&H.droneOn&&H.g.drone&&H.dev.drone&&deviceOK('drone')&&H.dev.drone.batt>=35){
    H.droneTimer=Math.min(H.droneTimer,DRONE_INT[H.rec]);
    H.droneTimer-=hr*60;
    if(H.droneTimer<=0)launchDrone();
  }
}
function setRec(v){H.rec=v;H.droneTimer=Math.min(H.droneTimer,DRONE_INT[v])}

/* ---------- Symbole (Kamera, Laden, Sammeln …) ---------- */
function askWalker(ic){
  const W=ic.W;if(W)W.wait=true;H.walking=false;
  const resume=()=>{if(W)W.wait=false;if(!H.camp.pitched&&!H.action&&!H.sleep.active)H.walking=true};
  const st=W||{};
  showModal({title:'🙋 Wanderer ansprechen',text:'Du sprichst den Wanderer an. Was möchtest du fragen?',buttons:[
    {label:'🍫 Nach etwas zu essen fragen',fn:()=>{
      if(st.fAsked){toast('🥾 „Ich hab dir doch eben schon geantwortet …“');resume();return}
      st.fAsked=true;st.asked=true;
      if(Math.random()<0.55){const f=pick(FOODS.filter(x=>x.shop&&!x.cook&&x.sat));H.food[f.id]=(H.food[f.id]||0)+1;toast('🥾 „Klar, nimm ruhig!“ Du bekommst '+f.e+' '+f.name+'.','good')}
      else toast(pick(['🥾 „Tut mir leid, ich habe selbst kaum etwas übrig.“','🥾 „Leider nein, mein Proviant reicht gerade so für mich.“','🥾 „Nein, sorry – frag besser im nächsten Ort.“']));
      resume()}},
    {label:'💧 Nach Wasser fragen',fn:()=>{
      if(st.wAsked){toast('🥾 „Ich hab dir doch eben schon geantwortet …“');resume();return}
      st.wAsked=true;st.asked=true;
      const room=Math.max(0,H.g.waterCap-waterTotal());
      if(room<0.05){toast('💧 Deine Behälter sind schon voll.');resume();return}
      if(Math.random()<0.65){const a=Math.min(room,Math.round(rnd(2,5))/10);H.water.clean+=a;sfx('drink');toast('🥾 „Hier, ein paar Schlucke für dich!“ +'+fmtN(a,1)+' L Wasser.','good')}
      else toast(pick(['🥾 „Tut mir leid, mein Wasser wird knapp.“','🥾 „Ich brauche selbst jeden Tropfen, sorry.“']));
      resume()}},
    {label:'Nichts, danke',fn:resume}]});
}
function spawnIcon(o){if(o&&o.kind==='animal'&&Math.random()<0.7)setTimeout(()=>{try{dogBark()}catch(e){}},rnd(300,900));o.max=o.life;o.born=tm;H.icons.push(o);return o}
const TAP_KINDS=['shop','forage','fish','special','summit','ask'];
function captureIcon(ic){
  if(ic.taken)return;
  if(TAP_KINDS.includes(ic.kind))return tapIcon(ic);
  const dev=handheld();
  if(!dev){toast('📷 Kein funktionierendes Aufnahmegerät!','bad');return}
  ic.taken=true;if(ic.f)ic.f.capt=true;
  const q=shotQ(dev.def,1.1);
  let name,e,value,rar=-1,key;
  if(ic.kind==='animal'){name=ic.a.name;e=ic.a.e;rar=ic.a.r;value=RARITY[rar].base*q*rnd(0.95,1.2);key='tier:'+ic.a.id;H.stats.animals++}
  else if(ic.kind==='sight'){name=ic.label;e=ic.e;value=ic.base*q*1.15;key='sight:'+ic.fid}
  else if(ic.kind==='storm'){name=ic.label;e=ic.e;value=ic.base*q;key='storm:'+ic.label}
  else if(ic.kind==='sky'){name=ic.label;e=ic.e;value=ic.base*q;key='sky:'+ic.label}
  else if(ic.kind==='aurora'){name=ic.label;e=ic.e;value=ic.base*Math.pow(Math.min(q,1.3),1.7)*1.5;key='aurora:'+G.day}

function beginAction(kind,label,dur,done,opts={}){

  if(ACTION_CLIPS[kind]){const d0=done;done=()=>{try{actionClip(kind)}catch(e){}if(d0)d0()}}

  S.mul=kind==='coffee'?0.84:0.78;S.crash=Math.max(S.crash>1&&t<S.crashEnd?S.crash:1,kind==='coffee'?1.16:1.38);

function act(kind,arg){

if(H.fork){toast('🪧 Wähle zuerst eine Richtung an der Wegscheide.');return}

    case 'drink':

        if(H.water.dirty>0.05){showModal({title:'Unbehandeltes Wasser',text:'Du hast nur unbehandeltes Wasser. Trinken kann dich krank machen (ca. 40 %). Trotzdem trinken?',buttons:[{label:'Trinken',fn:()=>beginAction('drink','Trinkt …',2,()=>drinkWater(true))},{label:'Abbrechen'}]});return}
        toast('Kein Wasser dabei!','bad');return}
      beginAction('drink','Trinkt …',2,()=>drinkWater(false));break;
    case 'refill':{
      const f=nearWater();if(!f){toast('Keine Wasserstelle in der Nähe.');return}
      if(waterTotal()>=g.waterCap-0.05){toast('Deine Behälter sind schon voll.');return}
      const frozen=env.frozen&&f.type==='quelle';
      if(frozen){
        beginAction('refill','Sammelt Schnee …',10,()=>{H.water.dirty+=Math.min(g.waterCap-waterTotal(),2);toast('❄️ Die Quelle ist zugefroren – du hast Schnee gesammelt. Er muss geschmolzen werden („Wasser behandeln“, Kocher+Gas oder Feuer).')},{force:H.stopReason==='water'});break}
      const autoF=f.type==='fluss'&&g.tools.filter;
      beginAction('refill','Füllt Wasser auf …',8+(autoF?6:0),()=>{
        const room=g.waterCap-waterTotal();
        if(f.type==='quelle'){H.water.clean+=room;toast('💧 Quelle: '+fmtN(room)+' L sauberes Wasser aufgefüllt.','good')}
        else if(autoF){H.water.clean+=room;toast('🚰 Flusswasser aufgefüllt und gefiltert ('+fmtN(room)+' L).','good')}
        else{H.water.dirty+=room;toast('💧 Flusswasser aufgefüllt (unbehandelt!) – filtern oder abkochen.')}
        sfx('drink');
      },{force:H.stopReason==='water'});break}
    case 'treat':{
      if(H.water.dirty<=0.05){toast('Kein unbehandeltes Wasser.');return}
      if(g.tools.filter&&!env.frozen)beginAction('treat','Filtert Wasser …',8,()=>{H.water.clean+=H.water.dirty;H.water.dirty=0;toast('🚰 Wasser gefiltert.','good')},{force:H.stopReason==='water'});
      else if(canCook())beginAction('treat','Kocht/Schmilzt Wasser …',14,()=>{if(!nearFire())H.gas=Math.max(0,H.gas-1);H.water.clean+=H.water.dirty;H.water.dirty=0;toast('♨️ Wasser aufbereitet.','good')});
      else toast('Zum Abkochen/Schmelzen brauchst du Kocher + Gas oder ein Feuer, zum Filtern einen Wasserfilter.','bad');break}
    case 'aid':
      if(!g.tools.kit||H.kit<=0){toast('Kein Erste-Hilfe-Set.');return}
      if(!isInjured()){toast('Du brauchst gerade keine Behandlung.');return}
      beginAction('aid','Versorgt Verletzung …',10,()=>{H.kit--;H.inj.blister=0;H.inj.sprain=0;H.sick=0;toast('🩹 Versorgt.','good')});break;
    case 'fix':{
      if(!g.tools.repair||H.repairs<=0){toast('Kein Reparaturset (oder aufgebraucht).');return}
      const ids=repairable();if(!ids.length||condOf(ids[0])>=95){toast('Gerade ist nichts reparaturbedürftig.');return}
      beginAction('fix','Flickt Ausrüstung …',15,()=>{const id=ids[0];H.cond[id]=Math.min(100,condOf(id)+35);H.repairs--;H.stats.repairs++;reviveGear(id);toast('🧵 '+gearById(id).name+' notdürftig repariert.','good')});break}
    case 'orient':
      if(H.fork){checkNav(H.fork);return}
if(H.side){orientSide();return}
if(!H.lost.on&&atSummit()){summitLook();return}
if(!H.lost.on){toast('Du bist auf dem richtigen Weg.');return}
      showOrient();break;
    case 'reverse':reverseDir();break;
case 'live':startLiveDialog();break;
    case 'shop':{
      const f=featNear('village',H.x,330);if(!f){toast('Hier ist kein Laden in der Nähe.');return}
      openVillageShop(f);break}
    case 'forage':{
      const f=(H.side?(H.side.feats||[]):H.route.feats).find(f=>f.type==='forage'&&!f.done&&Math.abs(f.x-H.x)<190*forageMul()&&FORAGE[f.f].months.includes(env.month));
      if(!f){toast('Hier gibt es gerade nichts zu sammeln.');return}
      doForage(f);break}
    case 'fish':startFishDialog();break;
    case 'rescue':
      showModal({title:'Tour abbrechen?',text:'Du lässt dich abholen. Das kostet etwa 40 € und deine bisherigen Aufnahmen bleiben erhalten.',buttons:[{label:'Abbrechen & abholen lassen',fn:()=>endHike('abort')},{label:'Weiterwandern'}]});break;
  }
}
function repairable(){ // Kandidaten für Notreparatur, schlechtester zuerst
  const ids=[];
  const g=H.g;
  [g.shoes,g.shelter,g.shell,g.bag,g.mid].forEach(x=>{if(x)ids.push(x.id)});
  if(g.tools.poles)ids.push('poles');
  return ids.sort((a,b)=>condOf(a)-condOf(b));
}
function reviveGear(id){ // repariertes Teil wieder einsatzbereit
  const def=gearById(id);if(!def)return;
  if(def.cat==='shoes')H.g.shoes=def;else if(def.cat==='shelter')H.g.shelter=def;else if(def.cat==='shell')H.g.shell=def;
  else if(def.cat==='bag')H.g.bag=def;else if(def.cat==='mid')H.g.mid=def;else if(id==='poles')H.g.tools.poles=true;
}
function breakGear(id){
  const def=gearById(id);if(!def)return;
  H.cond[id]=0;
  if(def.cat==='shoes')H.g.shoes=null;else if(def.cat==='shelter'){H.g.shelter=null;H.camp.pitched=false}else if(def.cat==='shell')H.g.shell=null;
  else if(id==='poles')H.g.tools.poles=false;
  toast('💥 '+def.name+' ist kaputt!'+(H.repairs>0?' Mit dem Reparaturset kannst du es flicken.':''),'bad');sfx('bad');
}
function wear(id,amt){
  if(H&&H.hk&&H.hk.km<=30)amt*=0.1;   // kleine Wanderungen: kaum Verschleiß
  if(!id||H.cond[id]===undefined||H.cond[id]<=0)return;
  H.cond[id]=Math.max(0,H.cond[id]-amt);
  if(H.cond[id]<=0)breakGear(id);
  else if(H.cond[id]<25&&!H['w_'+id]){H['w_'+id]=1;toast('⚠️ '+gearById(id).name+' ist stark abgenutzt ('+Math.round(H.cond[id])+' %).','warn')}
}

    let n=Math.round(rnd(F.min,F.max));if(hasT('natur'))n*=2;
    if(f.f==='beeren'&&env.month===5)n=Math.max(1,Math.round(n/2));

    toast('🧺 '+n+'× '+gearById(F.food).name.replace(/ \((kochen|garen)\)/,'')+' gesammelt.','good');sfx('notify');
    if(F.risky&&!hasT('natur')&&Math.random()<0.17-0.012*ES('food')){
      H.sick=H.t+600;toast('🤢 Ein Pilz war doch nicht bekömmlich – du bist krank (10 h). Talent „Naturkundler“ verhindert das.','bad');injuryAlert('Mir wird übel – der Pilz war wohl nicht gut.');
    }

function fishSpot(){
  if(featNear('fluss',H.x,90))return 'fluss';
  if(!H.side)for(const l of (H.route.lakes||[]))if(H.x>l.xl-140&&H.x<l.xr+140)return 'see';
  return null;
}
function fishPick(w){
  const mul=w==='fluss'?{trout:1.6,salmon:1.4,perch:0.7,pike:0.4}:{perch:1.4,pike:1.8,trout:0.7,salmon:0.1};
  const pool=FOODS.filter(x=>x.fish),wt=x=>x.w*(mul[x.id]||1);
  let r=Math.random()*pool.reduce((a,x)=>a+wt(x),0),fish=pool[0];
  for(const x of pool){r-=wt(x);if(r<=0){fish=x;break}}
  return fish;
}
function fishLand(fish){
  const nm=fish.name.replace(/ \((kochen|garen)\)/,'');
  H.food[fish.id]=(H.food[fish.id]||0)+1;H.stats.fish++;
  toast('🎣 Gefangen! '+fish.e+' '+nm+' – zum Essen musst du ihn garen.','good');sfx('success');
  const dev=handheld();if(dev&&H.rec>0)addClip({key:'fang:'+fish.id,type:'fang',name:'Fang: '+nm,e:fish.e,q:shotQ(dev.def,1),value:fish.clip*shotQ(dev.def,1),rar:-1});
}
function fishSession(w,mins){
  const seasonF={Sommer:1.15,Herbst:1.0,Frühling:0.85,Winter:0.4}[env.season]||1;
  const luck=rnd(0.5,1.5)*seasonF*(hasT('natur')?1.25:1)*(w==='fluss'?1.1:1);
  let bite=false;
  beginAction('fish','Angelt …',mins,()=>{if(!bite)toast('🎣 Nichts gebissen – heute ist wohl nichts los.')},{tick:h=>{
    if(!H.action||bite)return;
    if(Math.random()<0.0105*luck*h*1.5){bite=true;const rem=H.action.left;H.action.left=0;setTimeout(()=>fishFight(w,fishPick(w),rem),60)}
  }});
}
function fishFight(w,fish,rem){
  const str={perch:0.45,trout:0.75,pike:1.0,salmon:1.15}[fish.id]||0.7,wide=hasT('natur')?1.25:1;
  let ph='wait',pt=rnd(1.8,4.5),fake=Math.random()<0.5,T=35,P=18,pull=0.1,pullT=1,surge=false,slack=0,hold=false,msg='Warte auf einen Biss …',endT=0,result=null,t0=0,done=false,lt=0,lbl='';
  const html='<canvas id="fg" width="340" height="190" style="width:100%;max-width:340px;display:block;margin:0 auto 8px;border-radius:10px;background:#0e3a52;touch-action:none"></canvas><p id="fg-msg" class="hint" style="text-align:center;min-height:2.6em"></p><button id="fg-btn" class="primary" style="width:100%;height:56px;font-size:1.05rem;touch-action:none;user-select:none">🪝 Anschlagen!</button><p class="hint" style="text-align:center">Biss abwarten, dann anschlagen. Beim Drill gedrückt halten = einholen, loslassen = Schnur entlasten. Zeiger im grünen Bereich halten!</p>';
  const kd=e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();press()}},ku=e=>{if(e.code==='Space'){e.preventDefault();hold=false}};
  const finish=res=>{
    if(done)return;done=true;document.removeEventListener('keydown',kd);document.removeEventListener('keyup',ku);
    if(MODAL===me)closeModal();
    setTimeout(()=>{
      if(res==='win')fishLand(fish);

      else toast('🎣 Du packst die Angel ein.');
    },80);
  };
  const press=()=>{
    if(done)return;
    if(ph==='bite'){ph='fight';T=42;P=20;surge=false;pullT=0.5;pull=0.1*str;hold=true;msg='Hängt! Halte gedrückt zum Einholen.'}
    else if(ph==='wait'||ph==='nibble'){ph='over';result='lost';msg='Zu früh angeschlagen – der Fisch ist verschreckt.';endT=1.4}
    else if(ph==='fight')hold=true;
  };
  const draw=()=>{
    const c=document.getElementById('fg');if(!c)return;const x=c.getContext('2d'),W=340,Hh=190;
    x.fillStyle='#bfe3f5';x.fillRect(0,0,W,70);
    const wg=x.createLinearGradient(0,70,0,Hh);wg.addColorStop(0,'#3d95b8');wg.addColorStop(1,'#0e3a52');x.fillStyle=wg;x.fillRect(0,70,W,Hh-70);
    x.fillStyle='#4f7a3a';x.fillRect(0,56,70,16);x.strokeStyle='#5b3b1f';x.lineWidth=3;x.beginPath();x.moveTo(8,60);x.lineTo(78,18);x.stroke();
    let bx=200+Math.sin(t0*1.3)*3,by=72+Math.sin(t0*2.1)*1.5;
    if(ph==='nibble')by+=Math.abs(Math.sin(t0*14))*3;
    if(ph==='bite')by+=10+Math.sin(t0*22)*2;
    if(ph==='fight'){bx=250-P*1.55;by=74+Math.sin(t0*9)*pull*4}
    x.strokeStyle='rgba(255,255,255,0.8)';x.lineWidth=1;x.beginPath();x.moveTo(78,18);x.quadraticCurveTo((78+bx)/2,Math.min(by,18)+(ph==='fight'&&T>70?-4:10),bx,by-4);x.stroke();
    x.fillStyle='#e74c3c';x.beginPath();x.arc(bx,by-4,5,Math.PI,0);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(bx,by-4,5,0,Math.PI);x.fill();
    if(ph==='fight'||ph==='bite'){const fx=bx+(ph==='fight'?10+pull*14:0),fy=by+36+Math.sin(t0*(4+pull*10))*10*(ph==='fight'?pull+0.2:0.3),sz=9+str*7;
      x.fillStyle='rgba(20,40,60,0.55)';x.beginPath();x.ellipse(fx,fy,sz*1.6,sz*0.7,0,0,Math.PI*2);x.fill();x.beginPath();x.moveTo(fx+sz*1.4,fy);x.lineTo(fx+sz*2.3,fy-sz*0.7);x.lineTo(fx+sz*2.3,fy+sz*0.7);x.fill()}
    if(ph==='fight'){
      x.fillStyle='rgba(0,0,0,0.45)';x.fillRect(312,20,16,150);x.fillStyle='rgba(60,200,90,0.55)';x.fillRect(312,20+150*0.3,16,150*0.4);
      const ty=170-150*T/100;x.fillStyle=T>85||T<12?'#ff5a4a':'#fff';x.fillRect(308,ty-2,24,4);
      x.fillStyle='rgba(0,0,0,0.45)';x.fillRect(20,176,260,8);x.fillStyle='#f1c40f';x.fillRect(20,176,260*P/100,8);
      x.fillStyle='#fff';x.font='11px sans-serif';x.fillText('Schnurspannung',250,14);

    document.getElementById('fg-msg').textContent=msg;
    const b=document.getElementById('fg-btn'),nl=ph==='fight'?'⚙️ Einholen (gedrückt halten)':'🪝 Anschlagen!';if(b&&lbl!==nl){lbl=nl;b.textContent=nl}
  };
  const step=ts=>{
    if(done)return;

    if(ph==='wait'){pt-=dt;if(pt<=0){if(fake){fake=false;ph='nibble';pt=rnd(0.7,1.3);msg='Da zupft was …'}else{ph='bite';pt=rnd(0.85,1.15)*wide*(1.1-0.2*Math.min(str,1.3));msg='BISS! Jetzt anschlagen!';sfx('success')}}}
    else if(ph==='nibble'){pt-=dt;if(pt<=0){ph='wait';pt=rnd(1.2,3);msg='Nur ein Zupfer – abwarten …'}}

    else if(ph==='fight'){
      pullT-=dt;if(pullT<=0){surge=!surge;pullT=surge?rnd(0.7,1.5):rnd(0.8,1.8);pull=surge?str*rnd(0.7,1):0.12*str}
      if(hold){T+=(24+24*pull)*dt;P+=(13-7*Math.min(1,pull))*dt}

      else{

        else msg=surge?'Er zieht! Nachlassen!':'Er ruht – jetzt einholen!';

  };
  const me={title:'🎣 Angeln – '+(w==='fluss'?'am Fluss':'am See'),html,buttons:[{label:'Angel einpacken',fn:()=>finish('quit')}],

      requestAnimationFrame(step);
    }};
  showModal(me);
}

function comfortTemp(sleeping){
  const g=H.g;
  let c=17-4-(g.mid?g.mid.ins*cf(g.mid.id):0)-(g.shell?g.shell.ins:0)-1.3*ES('kalt');
  if(sleeping)c-=(17-(g.bag?g.bag.rating:17))*0.6*(g.bag?(0.7+0.3*cf(g.bag.id)):1);
  return c;
}
const VEST_HEAT=[0,3,5,8],VEST_DRAIN=[0,100/24,100/16,100/10],VEST_NAME=['Aus','Schwach','Mittel','Stark'];
const vestOn=()=>!!H.dev.vest&&H.vestMode>0&&deviceOK('vest');
function effTemp(mode){
  if(H.indoor==='lodge')return 17+(H.lodge?H.lodge.tier*1.5:0);
  if(H.indoor==='shelter'){let E=env.temp+3-env.wind*0.5*0.35-H.body.wet/100*9;if(mode!=='walk'&&H.g.mat)E+=H.g.mat.warm;if(nearFire())E+=6;if(H.dog&&mode!=='walk')E+=1.5;if(vestOn())E+=VEST_HEAT[H.vestMode];return E}
  const g=H.g,sh=H.camp.pitched?g.shelter:null;
  let E=env.temp;
  const windP=Math.max(sh?sh.wind*cf(sh.id):0,g.shell?g.shell.wind:0);
  E-=env.wind*0.5*(1-windP);
  E-=H.body.wet/100*9;
  if(mode==='walk')E+=11;
  if(sh&&mode!=='walk')E+=sh.warm*cf(sh.id);
  if((mode==='sleep'||(sh&&mode!=='walk'))&&g.mat)E+=g.mat.warm;
  if(mode!=='walk'&&nearFire())E+=H.fire.left>110?10:6;
  if(H.dog&&mode!=='walk')E+=1.5;
  if(vestOn())E+=VEST_HEAT[H.vestMode];
  return E;
}
function sleepQuality(){
  const g=H.g,B=H.body,sh=H.camp.pitched?g.shelter:null;
  const deficit=comfortTemp(true)-effTemp('sleep');
  let q=1-0.12*Math.max(0,deficit);
  if(H.indoor==='lodge'){q=0.86+(H.lodge?H.lodge.tier*0.04:0)}
  else if(H.indoor==='shelter'){q-=0.04}
  else if(!sh){q-=0.15;if(env.precip)q-=0.2;if(env.wind>12)q-=0.1}
  if(!g.mat)q-=0.1;
  if(B.wet>40&&!H.indoor)q-=(B.wet-40)/100*0.5;
  if(isInjured())q-=0.05;
  if(B.sat<25||B.hyd<25)q-=0.1;
  if(env.sun>0.6&&!env.midnightSun&&!H.indoor)q*=0.8;
  if(H.dog)q+=0.04;
  if(H.stalker)q-=0.15;

function sleepNeedH(){
  const hour=env.hour,bed=hour<12?hour+24:hour;
  const late=0.5*Math.max(0,bed-22);
  const awakeH=(H.t-H.awakeSince)/60;
  const extra=0.15*Math.max(0,awakeH-16);
  return clamp(4+(100-H.body.energy)/100*4+late+extra+H.fatigue*0.06-(hasT('frueh')?1:0),3.5,11.5);
}
function startSleep(rest){
  if(H.sleep.active)return;
  const need=rest===true?1.5:sleepNeedH();
  if(!H.camp.pitched)H.camp.x=H.x;
  H.sleep={active:true,need,q:sleepQuality(),startE:H.body.energy,p:0,elapsed:0,qsum:0,begun:H.t,rest:rest===true};
  H.walking=false;H.charging=H.charging;
  toast(rest===true?'🛌 Du ruhst dich im Schutz deines Lagers aus … (ca. 1,5 h)':'😴 Du schläfst ein … (Bedarf ca. '+fmtN(need)+' h bei Qualität '+Math.round(H.sleep.q*100)+' %)');
}
function stepSleep(h){
  const S=H.sleep;S.q=sleepQuality();S.elapsed+=h;S.qsum+=S.q*h;

  H.fatigue=Math.max(0,H.fatigue-h/60*0.42*S.q*(S.rest?0.3:1));
  H.body.energy=lerp(S.startE,S.rest?lerp(S.startE,100-H.fatigue,0.4):100-H.fatigue,clamp(S.p,0,1));
  if(S.p>=1||S.elapsed>14*60)wakeUp();
}

function autoNightTick(){

function pbTotal(){return H.pbs.reduce((a,p)=>a+p.left,0)}
function pbCapTotal(){return H.pbs.reduce((a,p)=>a+p.cap,0)}
function pbDraw(units){let need=units;for(const p of H.pbs){const t=Math.min(p.left,need);p.left-=t;need-=t;if(need<=0)break}return units-need}
function solarEff(){const SU=H.solarUp;if(!SU)return 0;let d=Math.abs(((env.hour-SU.aim+12)%24+24)%24-12);return clamp(1-d/3,0,1)}
function pbFill(units){let rest=units;for(const p of H.pbs){const t=Math.min(p.cap-p.left,rest);p.left+=t;rest-=t;if(rest<=0)break}}
function deviceTick(hr,mode){

    else if(d.batt<=15&&d.batt>0&&!d.lowW){d.lowW=true;toast('🪫 Akku fast leer: '+def.name+' ('+Math.round(d.batt)+' %)','warn');sfx('batt')}
    if(d.batt>20)d.lowW=false;
    if(d.batt>10)d.warned=false;
    if(drain>0){const p=0.5*(def.fragile||0.0004)*(env.precip?3:1)*(hasWaterProof(id)?1:1)*hr;
      if(Math.random()<p){d.broken=true;H.cond[id]=0;toast('💥 '+def.name+' ist kaputtgegangen!','bad');sfx('bad')}}

  if(H.charging){
    const d=H.dev[H.charging];
    if(!d||d.broken||d.batt>=99.9){if(d&&!d.broken)toast('🔋 '+d.def.name+' ist voll geladen.','good');H.charging=null}

  }
}

function lodgeFull(f,tier,dayIdx,walkin){
  let h=5381;for(const ch of H.hk.id+':'+f.id+':'+tier+':'+dayIdx)h=((h*33)^ch.charCodeAt(0))>>>0;
  const r=mulberry32(h)();

  const pop=H.hk.diff>=4?1.15:1;

  return r<p;

function walkSpeedKmh(){

  {const bs=BIOMES[env.biome].spd;if(bs){m*=(BIOMES[env.biome].snowfield&&g.tools.snowshoes)?Math.min(1,bs+0.2):bs}}
  m*=[1.07,1.035,1,0.95][H.rec]||1; // wenige Clips = zügiger unterwegs

  }

  if(env.precip)m*=env.precip==='snow'?0.85:0.93;
  m*=1-0.3*env.snow*(g.tools.snowshoes?0.35:1);

const AU={ctx:null,master:null,noise:null,loops:{},ok:false,birdT:2,popT:0,lastStep:0,unlocked:false};
function auInit(){
  if(AU.ctx)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.connect(AU.ctx.destination);
    const n=AU.ctx.sampleRate*2,b=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate),d=b.getChannelData(0);
    let last=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=w*0.5+last*3}
    AU.noise=b;AU.ok=true;
    const loop=(type,f,q,extra)=>{
      const s=AU.ctx.createBufferSource();s.buffer=b;s.loop=true;
      const fl=AU.ctx.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;
      let node=fl;const g=AU.ctx.createGain();g.gain.value=0;
      s.connect(fl);if(extra){const f2=AU.ctx.createBiquadFilter();f2.type=extra.type;f2.frequency.value=extra.f;fl.connect(f2);node=f2}
      node.connect(g);g.connect(AU.master);s.start();return {g,fl};
    };
    AU.loops.wind=loop('bandpass',420,0.7);
    AU.loops.rain=loop('highpass',1400,0.5,{type:'lowpass',f:7500});
    AU.loops.fire=loop('lowpass',330,0.8);
    auVol();
  }catch(e){AU.ok=false}
}
function auVol(){if(AU.master)AU.master.gain.value=G&&G.mute?0:(G?G.vol:0.7)*0.85}
function auUnlock(){
  if(!AU.ctx)auInit();
  if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();
}
['pointerdown','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,auUnlock,{passive:true}));
function tone(freq,dur,type='sine',vol=0.25,delay=0,slide=0){
  if(!AU.ok||(G&&G.mute))return;
  const t=AU.ctx.currentTime+delay,o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+dur+0.05);
}
function burst(dur,ftype,freq,vol=0.3,delay=0,q=1,sweep=0){
  if(!AU.ok||(G&&G.mute))return;
  const t=AU.ctx.currentTime+delay,s=AU.ctx.createBufferSource();s.buffer=AU.noise;
  const f=AU.ctx.createBiquadFilter();f.type=ftype;f.frequency.setValueAtTime(freq,t);f.Q.value=q;
  if(sweep)f.frequency.exponentialRampToValueAtTime(Math.max(30,freq+sweep),t+dur);
  const g=AU.ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(0.02,dur/3));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(AU.master);s.start(t,Math.random()*1.5);s.stop(t+dur+0.05);
}
function sfx(name,arg){
  if(!AU.ok)return;
  switch(name){
    case 'click':tone(820,0.05,'sine',0.12);break;
    case 'shutter':burst(0.03,'highpass',3000,0.3);burst(0.05,'bandpass',1800,0.25,0.07,2);break;
    case 'drink':for(let i=0;i<3;i++)tone(260+i*70,0.09,'sine',0.14,i*0.11,160);break;
    case 'eat':for(let i=0;i<3;i++)burst(0.05,'bandpass',2200,0.22,i*0.09,2);break;
    case 'success':[523,659,784,1047].forEach((f,i)=>tone(f,0.22,'triangle',0.2,i*0.09));break;
    case 'notify':tone(880,0.14,'sine',0.14);tone(1175,0.16,'sine',0.1,0.08);break;
    case 'discover':tone(660,0.25,'sine',0.16);tone(990,0.4,'sine',0.14,0.12);break;
    case 'warn':tone(440,0.14,'square',0.08);tone(330,0.2,'square',0.08,0.16);break;
    case 'bad':tone(300,0.3,'sawtooth',0.1,0,-150);break;case 'batt':[880,660,440].forEach((f,i)=>tone(f,0.13,'square',0.11,i*0.16));break;case 'bark':tone(420,0.08,'sawtooth',0.13,0,-160);burst(0.06,'bandpass',1100,0.12);tone(360,0.1,'sawtooth',0.12,0.15,-140);break;
    case 'coin':tone(1250,0.06,'square',0.07);tone(1680,0.18,'square',0.07,0.06);break;
    case 'tent':burst(0.35,'bandpass',2800,0.18,0,0.8);break;
    case 'fire':burst(0.5,'lowpass',300,0.35,0,0.7,1200);break;
    case 'thunder':{const d=arg||0;burst(2.6,'lowpass',260,0.7,d,0.8,-200);burst(1.2,'lowpass',120,0.6,d+0.3,0.8);break}
  }
}
function stepSound(){
  const soft=env.snow>0.5?0.5:1;
  if(env.biome==='berg')burst(0.05,'bandpass',1500,0.12*soft,0,2);
  else if(env.biome==='fjaell')burst(0.07,'lowpass',900,0.14*soft);
  else burst(0.07,'lowpass',700+Math.random()*250,0.16*soft);
}
function chirp(){
  const base=1900+Math.random()*1800,n=2+Math.floor(Math.random()*4);
  for(let i=0;i<n;i++)tone(base*(1+Math.random()*0.25),0.07,'sine',0.055,i*0.11,base*0.25*(Math.random()>0.5?1:-1));
}
function ambientUpdate(dt){
  if(!AU.ok||!H||H.ended)return;
  const t=AU.ctx.currentTime,mute=G&&G.mute,k=0.35;
  const setG=(l,v)=>l.g.gain.setTargetAtTime(mute?0:v,t,k);
  const gust=0.75+0.25*Math.sin(tm*0.9)+0.1*Math.sin(tm*2.3);
  setG(AU.loops.wind,clamp(env.wind/24,0,0.55)*0.55*gust);
  AU.loops.wind.fl.frequency.setTargetAtTime(280+env.wind*35,t,0.5);
  setG(AU.loops.rain,env.precip==='rain'?clamp(0.06+env.rainI*0.2,0,0.3):env.precip==='snow'?0.02:0);
  const nf=nearFire();setG(AU.loops.fire,nf?0.09:0);
  if(nf||H.fire.lit&&Math.abs(H.x-H.fire.x)<450){
    AU.popT-=dt;if(AU.popT<=0){AU.popT=0.08+Math.random()*0.5;if(nf)burst(0.03+Math.random()*0.03,'highpass',2500+Math.random()*2500,0.16)}
  }
  if(H.speed>0&&H.speed<=4&&H.moving){
    const idx=Math.floor(H.phase/Math.PI);
    if(idx!==AU.lastStep){AU.lastStep=idx;stepSound()}
  }
  AU.birdT-=dt;
  if(AU.birdT<=0){
    AU.birdT=3+Math.random()*(env.biome==='wald'?6:12);
    if(env.light>0.45&&!env.precip&&env.wind<9&&env.temp>2&&H.speed>0&&H.speed<=4&&!H.sleep.active)chirp();
  }
}

/* ---------- Hund ---------- */
function drawDog(g,x,y,D,gd,mode,ph,t,packCol){
  const s=D.scale*1.35,col=DOG_COLORS[gd.color],dk=shade(col,-0.28),lt=shade(col,0.3);
  g.save();g.translate(x,y);g.scale(s,s);g.lineCap='round';g.lineJoin='round';
  if(mode==='sleep'){
    g.fillStyle=col;g.beginPath();g.ellipse(0,-7,17,8,0,0,7);g.fill();
    g.fillStyle=dk;g.beginPath();g.ellipse(-14,-9,7,5.5,0.4,0,7);g.fill();
    g.beginPath();g.ellipse(-19,-6,4,3,0,0,7);g.fill();
    if(gd.patch){g.fillStyle=lt;g.beginPath();g.ellipse(2,-3,9,3.5,0,0,7);g.fill()}
    g.restore();return;
  }
  const sit=mode==='sit';
  const cyc=mode==='walk'?ph:0;
  const wag=Math.sin(t*(mode==='walk'?11:7))*0.5;
  // Schwanz
  g.strokeStyle=dk;g.lineWidth=3.4;g.beginPath();
  if(sit){g.moveTo(-14,-4);g.quadraticCurveTo(-24,-4,-26+wag*4,-9)}
  else{g.moveTo(-16,-19);g.quadraticCurveTo(-25,-27+wag*4,-24+wag*5,-33)}
  g.stroke();
  // Beine
  g.strokeStyle=dk;g.lineWidth=4.2;
  if(sit){ln(g,-8,-8,-6,-1);ln(g,10,-9,12,-1);ln(g,4,-9,6,-1)}
  else{
    const a=Math.sin(cyc)*7,b=Math.sin(cyc+Math.PI)*7;
    ln(g,-11,-12,-11+a,-1);ln(g,-6,-12,-6+b,-1);ln(g,9,-12,9+b,-1);ln(g,14,-12,14+a,-1);
  }
  // Körper
  g.fillStyle=col;
  if(sit){g.beginPath();g.ellipse(-2,-13,15,10,-0.5,0,7);g.fill()}
  else{g.beginPath();g.ellipse(0,-19+(mode==='walk'?Math.sin(cyc*2)*0.7:0),18,8.5,0,0,7);g.fill()}
  if(gd.patch){g.fillStyle=lt;g.beginPath();g.ellipse(sit?0:2,sit?-9:-15,10,3.6,sit?-0.5:0,0,7);g.fill()}
  // Rucksack
  if(packCol){g.fillStyle=packCol;rr(g,sit?-8:-8,sit?-25:-30,15,9,3);g.fill();g.fillStyle='rgba(0,0,0,.25)';g.fillRect(sit?-8:-8,sit?-19:-24,15,1.6)}
  // Kopf
  const hxx=sit?13:19,hyy=sit?-27:-27+(mode==='walk'?Math.sin(cyc*2)*0.7:0);
  g.fillStyle=col;g.beginPath();g.arc(hxx,hyy,7,0,7);g.fill();
  g.fillStyle=lt;g.beginPath();g.ellipse(hxx+6,hyy+2.5,5,3.5,0.1,0,7);g.fill();
  g.fillStyle='#111';g.beginPath();g.arc(hxx+10,hyy+1.4,1.5,0,7);g.fill();
  g.beginPath();g.arc(hxx+2.5,hyy-1.5,1.2,0,7);g.fill();
  g.fillStyle=dk;g.beginPath();g.moveTo(hxx-4,hyy-4);g.lineTo(hxx-1,hyy-13+Math.sin(t*3)*0.6);g.lineTo(hxx+3,hyy-5);g.closePath();g.fill();
  g.restore();
}

function drawLeaves(g,tm,dt){

    let rate=pal.k*(0.12+12*Math.pow(wk,1.8))*(env.precip?0.6:1)*Math.min(1,nC/6);
    let n=rate*dt;
    while(n>0){

        const i=Math.floor(Math.random()*nC)*4,cx=CROWNS[i],cy=CROWNS[i+1],r=CROWNS[i+2],far=CROWNS[i+3];
        const wx=cx+camX+rnd(-r,r),gyy=groundY(wx);

  }

function packIsDown(){
  if(!H||!H.g||!H.g.pack||H.moving||H.ended)return false;
  const k=H.action?H.action.kind:null;
  const now=H.camp.pitched||H.sleep.active||nearFire()||(k&&['fire','feed','cook','tent','ftarp','wood'].includes(k));
  if(now)H.packHold=H.t+25;
  const down=now||(H.packHold!=null&&H.t<H.packHold);
  if(!down)H.packX=null;
  return !!down;
}

function blowAway(){

  H.tentFly={x:H.camp.x-70,id:sh.id,t0:0,closed:!!H.tarpClosed};
  H.wake=H.sleep.active?{x:H.camp.x-70,t0:tm}:null;
  if(H.sleep.active){wakeUp(true);H.walking=false}
  const c=condOf(sh.id)-(15+Math.random()*25);
  H.cond[sh.id]=Math.max(0,c);
  H.g.shelter=null;H.camp.pitched=false;
  H.body.wet=Math.min(100,H.body.wet+(env.precip?22:6));
  toast('💨 Eine Böe hat dein '+sh.name+' mitgerissen! Es ist für diese Tour verloren'+(c<=0?' und völlig zerfetzt.':' und nach der Tour beschädigt.')+(sh.wres<14?' Teure Zelte halten deutlich mehr Wind aus.':''),'bad');sfx('bad');

}

  let wr=sh.wres;if(sh.id==='tarp'&&H.tarpClosed)wr*=1.15;
  const gust=env.wind*(0.9+Math.random()*0.3);

  if(gust>wr){const p=clamp(0.12+(gust-wr)/wr*1.5,0,0.9);if(Math.random()<1-Math.pow(1-p,hr))blowAway()}
}

function drawProfile(cv){
  if(!H)return;const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;
  if(cv.width!==w*2||cv.height!==h*2){cv.width=w*2;cv.height=h*2}
  const g=cv.getContext('2d');g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,w,h);
  const R=H.route,N=Math.min(160,Math.floor(w/2));let lo=1e9,hi=-1e9;const ys=[];
  for(let i=0;i<=N;i++){const e=mainElevAt(R.totalPx*i/N);ys.push(e);lo=Math.min(lo,e);hi=Math.max(hi,e)}
  const span=Math.max(60,hi-lo);
  g.beginPath();g.moveTo(0,h);ys.forEach((e,i)=>g.lineTo(i/N*w,h-3-(e-lo)/span*(h-8)));g.lineTo(w,h);g.closePath();g.fillStyle='rgba(76,195,138,0.35)';g.fill();
  g.strokeStyle='#4cc38a';g.lineWidth=1.2;g.beginPath();ys.forEach((e,i)=>i?g.lineTo(i/N*w,h-3-(e-lo)/span*(h-8)):g.moveTo(0,h-3-(e-lo)/span*(h-8)));g.stroke();
  // Orte & Meilensteine
  for(const f of R.feats){if(f.type==='village'){g.fillStyle='#ffb54a';g.fillRect(f.x/R.totalPx*w-1,h-9,2,9)}else if(f.type==='lodge'){g.fillStyle='#6cb8ff';g.fillRect(f.x/R.totalPx*w-1,h-7,2,7)}else if(f.type==='sight'){g.fillStyle='#ffd54a';g.beginPath();g.arc(f.x/R.totalPx*w,6,2.2,0,7);g.fill()}}

function pickChannelImg(kind,cb){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();
      im.onload=()=>{
        const bs=kind==='banner'?Math.min(1,1600/im.width,1200/im.height):1;const W=kind==='avatar'?256:Math.round(im.width*bs),Hh=kind==='avatar'?256:Math.round(im.height*bs),c=document.createElement('canvas');c.width=W;c.height=Hh;
        const x=c.getContext('2d'),sc=Math.max(W/im.width,Hh/im.height),w=im.width*sc,h=im.height*sc;
        x.fillStyle='#000';x.fillRect(0,0,W,Hh);x.drawImage(im,(W-w)/2,(Hh-h)/2,w,h); // Mitte zuschneiden
        const old=G[kind];G[kind]=c.toDataURL('image/jpeg',0.85);
        try{localStorage.setItem(SAVE_KEY,JSON.stringify(G))}catch(e){G[kind]=old;toast('Das Bild ist zu groß für den Speicher – bitte ein kleineres wählen.','bad');return}
        toast(kind==='avatar'?'📷 Profilbild gesetzt.':'🖼️ Kanalbanner gesetzt.','good');if(kind==='banner'){G.bannerFit='cover';G.bannerPos=50;save();bannerAdjust(cb)}else if(cb)cb()};
      im.onerror=()=>toast('Diese Datei konnte nicht als Bild gelesen werden.','bad');im.src=fr.result};
    fr.readAsDataURL(f)};
  inp.click();
}

async function fbEnsureCode(db){

function imgShrink(src,maxW,maxH,sq,q){
  return new Promise(res=>{
    if(!src)return res('');
    const im=new Image();
    im.onload=()=>{
      let sx=0,sy=0,sw=im.width,sh=im.height,cw,ch;
      if(sq){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m;cw=ch=maxW}
      else{const k=Math.min(1,maxW/sw,maxH/sh);cw=Math.max(1,Math.round(sw*k));ch=Math.max(1,Math.round(sh*k))}
      const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');
      x.fillStyle='#000';x.fillRect(0,0,cw,ch);x.drawImage(im,sx,sy,sw,sh,0,0,cw,ch);
      res(c.toDataURL('image/jpeg',q));
    };
    im.onerror=()=>res('');im.src=src;
  });
}

  if(defSl>3){w.push({l:'bad',t:`Nachts bis ca. ${Math.round(tNight)} °C – dein Schlaf-Setup reicht nicht (Schlafsack/Zelt/Matte). Erfrierungsgefahr!`});score+=2}
  else if(defSl>0){w.push({l:'warn',t:`Nachts bis ca. ${Math.round(tNight)} °C – du wirst frieren. Wärmerer Schlafsack oder Zelt empfohlen.`});score+=0.8}
  if(defWalk>3){w.push({l:'bad',t:`Tagsüber nur ca. ${Math.round(tDay)} °C: deine Kleidung ist zu dünn (Isolationsjacke/Parka, Hardshell).`});score+=1.5}

  if(sT<-4){w.push({l:'warn',t:'Quellen sind zugefroren: Du brauchst Kocher + Gas (oder Feuer), um Schnee zu schmelzen.'});if(!tools.has('stove'))score+=0.8}
  if(sT<-1&&hk.diff>=4)w.push({l:'info',t:'Winterbedingungen: Stürme und Kälteeinbrüche möglich. Beste Ausrüstung (Winterschlafsack/Parka/Winterzelt) ist Pflicht.'});
  if(dl<9&&!(tools.has('lamp')||tools.has('torch')))w.push({l:'bad',t:`Nur ca. ${fmtN(dl,0)} h Tageslicht – ohne Stirnlampe kommst du kaum voran.`});

  {const gap=skillGap(hk),avg=skillAvg(hk);
   if(gap>=2.5){w.push({l:'bad',t:`Deine Fähigkeiten (Ø ${fmtN(avg,1)}) sind für diese Route viel zu niedrig (empfohlen Ø ${SKILL_REQ[hk.diff]}). Du wirst schnell erschöpfen und kaum vorankommen – auch mit bester Ausrüstung.`});score+=gap*0.45}
   else if(gap>0.4){w.push({l:'warn',t:`Deine Fähigkeiten (Ø ${fmtN(avg,1)}) liegen unter dem Empfohlenen (Ø ${SKILL_REQ[hk.diff]}): mehr Erschöpfung und langsameres Tempo.`});score+=gap*0.35}
   else if(famBonus(hk)>=1)w.push({l:'info',t:'Du kennst diese Strecke oder ähnliche Gegenden – das hilft bei der Orientierung.'})}

  return {tDay,tNight,dl,days,w,score,lbl,col,start:dateStr(G.day),end:dateStr(G.day+days),load,sT};

const START_C={nordkalott:'Schweden',gr20:'Frankreich',camino:'Spanien'};

const HOMES={Deutschland:[51,10],Österreich:[47.5,14.5],Schweiz:[46.8,8.2],Schweden:[59.3,18],Norwegen:[59.9,10.7],Schottland:[55.9,-3.2],England:[51.5,-0.1],Irland:[53.3,-6.3],Italien:[45.5,9.2],Frankreich:[48.9,2.4],Spanien:[40.4,-3.7],Island:[64.1,-21.9]};
const REG_XY={harz:[51.8,10.6],thuer:[50.7,10.7],sachsen:[50.9,14.2],hoga:[63.0,18.3],alpen:[47.4,10.3],dolo:[46.6,12.0],scot:[56.2,-4.6],mtblanc:[45.9,6.9],island:[63.9,-19.3],lappland:[68.4,18.8],nordkalott:[69.3,20.0],norwegen:[61.5,8.8],eng:[51.9,-1.8],irland:[52.05,-9.5],korsika:[42.5,8.9],camino:[43.2,-1.2]};
function travelInfo(hk){
  if(hk.trav!=null&&startCountry(hk)===(G.home||'Deutschland'))return {cost:hk.trav,days:0,mode:hk.trav?'Bus / Bahn':'Zu Fuß',km:hk.trav?10+hk.trav*3:0};
  const home=G.home||'Deutschland',a=HOMES[home]||HOMES.Deutschland,b=REG_XY[hk.reg]||a;
  const R=6371,rad=x=>x*Math.PI/180,dl=rad(b[0]-a[0]),dn=rad(b[1]-a[1]);
  const h=Math.sin(dl/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dn/2)**2;
  const d=Math.round(2*R*Math.asin(Math.sqrt(h)));
  const isl=['Schottland','England','Irland','Island'].includes(home),hisl=['scot','eng','irland','island'].includes(hk.reg);
  const sea=(home==='Island')!==(hk.reg==='island')||(isl!==hisl&&d>300)||(isl&&hisl&&home!=={scot:'Schottland',eng:'England',irland:'Irland',island:'Island'}[hk.reg]&&d>400);
  if(d<60)return {cost:12,days:0,mode:'Bus & Bahn',km:d};
  let mode,cost;
  if(sea||d>2300){mode='Flug';cost=2*(45+0.03*d)}else{mode='Zug';cost=2*0.07*d}
  cost=Math.round(Math.max(25,cost)/5)*5;

  if(d.broken){toast('💥 '+d.def.name+' ist defekt.','bad');return}
  if(!H.pbs.length){toast('Du hast keine Powerbank dabei.','warn');return}
  if(H.charging===id){H.charging=null;toast('Ladevorgang beendet.')}
  else if(pbTotal()<=0.5)toast('🪫 Powerbank ist leer.','bad');
  else if(d.batt>=99){toast(d.def.name+' ist schon voll.')}
  else{H.charging=id;toast('⚡ Lädt jetzt: '+d.def.name+' (Powerbank '+Math.round(pbTotal()/pbCapTotal()*100)+' %)','good')}
  sfx('click');updateHUD(true);
}
function updateLivePanel(){
  const p=$('#livepanel');if(!p)return;
  const L=H.live;
  if(!L){if(livePanelOn){p.innerHTML='';livePanelOn=false}return}
  if(!livePanelOn){
    livePanelOn=true;
    p.innerHTML=`<div class="pill" style="padding:8px"><b style="color:#ff5d5d">🔴 LIVE</b> <span id="lv-v"></span><div class="bar"><i id="lv-m" style="background:#ff5d73;width:50%"></i></div><small class="dim" style="color:#cde">Stimmung der Zuschauer</small>
     <div id="lv-c" style="height:48px;overflow:hidden;font-size:11px;margin:4px 0;display:flex;flex-direction:column;justify-content:flex-end"></div>
     <div class="seg"><button id="lv-t">🗣️ Plaudern</button><button id="lv-d" class="warnb">🙏 Um Spenden bitten</button><button id="lv-e">⏹</button></div></div>`;
    $('#lv-t').onclick=()=>{liveTalk()};
    $('#lv-d').onclick=()=>{liveCall()};
    $('#lv-e').onclick=()=>{if(H.action&&H.action.kind==='live'){H.action=null;liveEnd()}};
  }
  $('#lv-v').innerHTML=`👁 <b>${fmtN(L.viewers,0)}</b> Zuschauer · 💶 ${eur(L.donations)}`;
  $('#lv-m').style.width=L.mood+'%';
  $('#lv-c').innerHTML=L.chat.slice(-5).map(c=>`<div style="color:${c.cls==='bad'?'#ff9a8a':c.cls==='don'?'#ffd54a':c.cls==='sys'?'#9be564':'#fff'}">${esc(c.t)}</div>`).join('');
}

const TH={cur:null,next:0,chk:0,k:{}};
function thoughtList(){

  const ahead=(t,r)=>featsIn(H.x,H.x+r).find(f=>f.type===t);

  P('hunger2',3,['Oh Mann, ich kipp gleich um vor Hunger.','Ich brauch SOFORT was zu essen!','Mir wird schwarz vor Augen … Essen!'],1,B.sat<10);
  P('hunger',2,['Mein Magen knurrt lauter als der Wald.','Zeit für einen Snack.','Ich könnt einen Bären verdrücken.'],0,B.sat<24&&B.sat>=10);
  P('durst2',3,['Ich verdurste hier noch, so ein Rotz!','Wasser … irgendwo muss doch welches sein!'],1,B.hyd<10);
  P('durst',2,['Meine Zunge klebt am Gaumen.','Ich sollte bald Wasser auffüllen.','Hmm, die Flasche wird leer.'],0,B.hyd<24&&B.hyd>=10);

  P('knoechel',2,['Mein Knöchel macht Ärger.','Auweia, das zwickt gewaltig.'],0,H.inj.sprain>H.t);
  P('krank',2,['Mir ist hundeelend.','Ich glaub, ich hab mir was eingefangen.'],0,H.sick>H.t||H.sick===true);
  P('hp',3,['Oh shit, das sieht gar nicht gut aus.','Ich sollte das hier nicht unterschätzen …'],1,B.hp<30);
  P('verirrt',3,['Hier bin ich wohl falsch.','Wo zum Teufel bin ich eigentlich?','Karte raus – und zwar schnell.'],1,H.lost.on);
  P('seite1',1,['Hm, ich hab lange keine Markierung mehr gesehen …','War da nicht eben noch ein Wegzeichen?'],0,!!S&&!S.realized&&S.pos>PPK*0.45);
  P('seite2',2,['So ein Rotz auch – falsch abgebogen!','Das war wohl der falsche Weg.'],1,!!S&&S.realized&&S.kind!=='town');
  P('wegweiser',2,['Kein Wegweiser … na toll.','Und welchen Weg jetzt? Karte oder Bauchgefühl?'],1,!!H.fork&&H.fork.fork&&H.fork.fork.sign==='missing');

  P('unmark',1,['Keine Markierung mehr – besser mal auf die Karte schauen.'],0,H.inUnm&&!S);
  P('nacht',1,['Es wird verdammt dunkel. Stirnlampe an?','Im Dunkeln laufen ist nicht mein Ding.'],0,env.dark>0.65&&!H.camp.pitched);
  P('nebel',1,['Nebel … ich seh kaum die eigene Hand.'],0,env.fog>0.4);
  P('steil',1,['Puh, wann hört dieser Anstieg endlich auf?','Wer hat sich diesen Berg ausgedacht?'],0,env.grade>0.12);
  P('bergab',1,['Bergab geht’s leicht, aber meine Knie schreien.'],0,env.grade<-0.13);
  P('dorf',1,['Da vorne ist ein Ort – Vorräte auffüllen?','Ein Dorf! Vielleicht gibt’s dort Kaffee.'],0,!S&&!!ahead('village',700));
  P('huette',1,['Eine Hütte! Vielleicht gibt’s was Warmes.'],0,!S&&!!ahead('lodge',700));
  P('see',1,['Ein See. Mal sehen, wie ich da rüberkomme.'],0,!S&&!!ahead('see',900));

function thoughtTick(dt){
  if(!H||H.ended||MODAL||H.sleep.active||(H.action&&H.action.kind!=='live')||H.speed>2)return;
  if(TH.cur){if(tm-TH.cur.t0>TH.cur.dur){TH.cur=null;TH.next=tm+14+Math.random()*26}return}
  TH.chk-=dt;if(TH.chk>0)return;TH.chk=1.5;
  if(tm<TH.next)return;
  const L=thoughtList().filter(c=>!(TH.k[c.key]>tm));
  if(!L.length)return;
  const top=Math.max(...L.map(c=>c.pri)),pool=L.filter(c=>c.pri===top);
  if(top<3&&Math.random()>(top>=2?0.5:0.3))return;
  const c=pool[Math.floor(Math.random()*pool.length)],txt=c.txts[Math.floor(Math.random()*c.txts.length)];
  TH.cur={txt,say:c.say,t0:tm,dur:3.8+txt.length*0.045};
  TH.k[c.key]=tm+(c.pri>=3?70:c.pri>=2?110:170);
}
function drawThought(g,sx,y){
  const T=TH.cur;if(!T)return;
  const a=tm-T.t0;if(a>T.dur){return}
  const al=Math.min(1,a/0.25,(T.dur-a)/0.5),pop=0.88+0.12*Math.min(1,a/0.25);
  g.save();g.globalAlpha=al;g.font='600 13px system-ui,"Segoe UI",sans-serif';g.textAlign='left';g.textBaseline='middle';
  const words=T.txt.split(' '),lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(g.measureText(t).width>158&&cur){lines.push(cur);cur=w}else cur=t}lines.push(cur);
  const wd=Math.max(...lines.map(l=>g.measureText(l).width))+20,hh=lines.length*16+12,r=10;
  const rt=sx+wd+34<CW,bx=rt?sx+30:sx-30-wd,by=y-hh/2-12,dr=rt?1:-1,ex=bx+(rt?0:wd);
  g.translate(sx,y);g.scale(pop,pop);g.translate(-sx,-y);
  g.fillStyle='rgba(255,255,255,0.96)';g.strokeStyle='rgba(30,40,35,0.35)';g.lineWidth=1.5;
  g.beginPath();g.moveTo(bx+r,by);g.arcTo(bx+wd,by,bx+wd,by+hh,r);g.arcTo(bx+wd,by+hh,bx,by+hh,r);g.arcTo(bx,by+hh,bx,by,r);g.arcTo(bx,by,bx+wd,by,r);g.closePath();g.fill();g.stroke();
  if(T.say){g.beginPath();g.moveTo(ex,by+hh-14);g.lineTo(sx+dr*11,y+2);g.lineTo(ex,by+hh-4);g.closePath();g.fill();g.stroke();g.fillRect(ex-dr*2-(rt?0:2),by+hh-13,4,9)}
  else{g.beginPath();g.arc(ex-dr*4,by+hh+3,3.8,0,7);g.fill();g.stroke();g.beginPath();g.arc(sx+dr*15,y+4,2.4,0,7);g.fill();g.stroke();g.beginPath();g.arc((ex+sx+dr*15)/2-dr*2,by+hh+9,3,0,7);g.fill();g.stroke()}
  g.fillStyle='#1c2a22';lines.forEach((l,i)=>g.fillText(l,bx+10,by+12+i*16));
  g.restore();
}
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(0.1,(ts-lastTs)/1000||0.016);lastTs=ts;
  tm+=dt;
  if(screen!=='hike'||!H)return;
  const cv=$('#cv');if(!cv)return;
  if(H.speed>4)H.speed=4;
  if(!H.ended&&!MODAL&&!(COOP&&COOP.wait)){
    let mult=SPEEDS[H.speed]*3;
    if(H.walking&&!H.camp.pitched&&!H.action&&!H.fork&&!H.sleep.active)mult/=STRETCH; // beim Gehen läuft die Uhr langsamer, damit der längere Weg gleich schnell vorbeizieht
    if(H.sleep.active&&mult>0)mult=Math.max(mult,14);
    accum+=dt*TIME_SCALE*mult/1.15;
    let n=0;const x0=H.x,ph0=H.phase;
    while(accum>=1/6&&n<70&&!MODAL&&!H.ended){stepSim(1/6);accum-=1/6;n++}
    if(n>0){H.vdx=(H.x-x0)/n;H.vdph=(H.phase-ph0)/n;if(Math.abs(H.vdx)>40)H.vdx=0}
    if(accum>2)accum=0;
    updateIcons(dt*Math.min(SPEEDS[H.speed],4));
    thoughtTick(dt);
    if(H.speed>0&&!H.sleep.active)ambientUpdate(dt);
  }
  if(!H)return;
  H.camElev+=(elevAt(H.x)-H.camElev)*Math.min(1,dt*2.2);
if(H.side&&H.side.kind==='climb')H.camElev=clamp(H.camElev,elevAt(H.x)-55,elevAt(H.x)+55);
H.cd=(H.cd||0)+(((H.dir||1)<0?1:0)-(H.cd||0))*Math.min(1,dt*2.2);
  const rx=H.x,rph=H.phase;
  if(H.moving&&!MODAL&&SPEEDS[H.speed]>0&&!H.ended&&H.vdx&&SPEEDS[H.speed]<=6&&!H.sleep.active){const f=clamp(accum*6,0,1);H.x=rx+H.vdx*f;H.phase=rph+(H.vdph||0)*f}
  drawScene(cv.getContext('2d'),tm,dt);
  H.x=rx;H.phase=rph;
  hudT-=dt;if(hudT<=0){hudT=0.2;try{updateHUD()}catch(e){console.error(e)}try{updateLivePanel()}catch(e){}}
  if(Math.floor(tm*0.2)%15===0&&Math.floor(tm)%25===0&&!H.ended&&!H._sv){H._sv=1;save()}else if(Math.floor(tm)%25===1)H._sv=0;
}
window.addEventListener('keydown',e=>{
  if(screen!=='hike'||!H)return;
  if(e.key==='Escape'){if(MODAL&&!MODAL.locked)closeModal();else $('#drawer').classList.remove('open')}
  else if(e.key===' '&&!MODAL){e.preventDefault();actClick('walk')}
  else if((e.key==='+'||e.key==='.')&&!MODAL){H.speed=Math.min(4,H.speed+1);updateHUD(true)}
  else if((e.key==='-'||e.key===',')&&!MODAL){H.speed=Math.max(1,H.speed-1);updateHUD(true)}
});

function bottleSVG(cap,cl,di){
  const w=30+cap*8,h=54+cap*22,iw=w-8,ih=h-16,ch=ih*cl/cap,dh=ih*di/cap;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect x="${w/2-6}" y="0" width="12" height="7" rx="2" fill="#667"/><rect x="4" y="8" width="${iw}" height="${h-10}" rx="8" fill="#0f2018" stroke="#9db5a5" stroke-width="2"/>
   <rect x="6" y="${8+ (ih-ch-dh)+4}" width="${iw-4}" height="${dh}" fill="#8a6a3a"/><rect x="6" y="${8+(ih-ch)+4}" width="${iw-4}" height="${ch}" fill="#39a0ff"/>
   <text x="${w/2}" y="${h-6}" text-anchor="middle" font-size="10" fill="#fff">${fmtN(cl+di)}/${cap}</text></svg>`;
}

    <div style="margin-top:6px;font-size:.9em">${tools.join(' · ')}</div>${wear.length?`<div style="margin-top:6px;font-size:.88em"><span class="badtxt">Abgenutzt:</span> ${wear.join(' · ')}</div>`:''}</div>`,

function mapPoints(){
  if(H.mapPts)return H.mapPts;
  const N=Math.ceil(H.route.totalKm*3)+1,r=mulberry32(H.route.totalPx|0);
  const pts=[];let x=0,y=0,a=-0.3+r()*0.6,wob=r()*6;
  for(let i=0;i<N;i++){pts.push([x,y]);wob+=0.11;a+=Math.sin(wob)*0.09+(r()-0.5)*0.22;a+=(-a)*0.012;x+=Math.cos(a);y+=Math.sin(a)}
  H.mapPts=pts;return pts;
}
function openMap(){
  const nav=navInfo(),hk=H.hk;const known=nav.q>=0.5;
  const R=H.route,ahead=(t)=>{const f=featsIn(H.x,H.x+60*PPK).find(t);return f?(f.x-H.x)/PPK:null};
  const dW=ahead(f=>f.type==='quelle'||(f.type==='fluss'&&f.bridge)),dV=ahead(f=>f.type==='village'&&!f.left),dS=ahead(f=>f.type==='sight'&&!f.reached);
  const fmtD=v=>known?(v===null?'> 60 km':fmtN(v)+' km'):'unbekannt';
  const goal=R.totalKm-H.km;
  showModal({wide:true,title:'🗺️ Karte & Navigation',html:`<div class="two"><div><canvas id="mapcv" width="560" height="330" style="width:100%;border-radius:10px;background:#12281d"></canvas></div>
   <div><p><b>${nav.label}</b>${nav.live?' <span class="goodtxt">· Live-Position</span>':nav.src==='map'?' · <span>Position aus Zeit &amp; Tempo geschätzt</span>':''}</p>
   ${nav.note?`<div class="warnbox warn">${esc(nav.note)}</div>`:''}

function clipScore(clips){
  const v=clips.map(c=>c.value).sort((a,b)=>b-a);let s=0;v.slice(0,30).forEach((x,i)=>s+=x*Math.pow(0.94,i));
  const types=new Set(clips.map(c=>c.type)),rar=clips.filter(c=>c.rar>=3).length;
  // Kameraqualität zählt zusätzlich: gute Geräte (Ø-Qualität der besten Clips) heben den Gesamteindruck, billige Kameras drücken ihn
  const top=[...clips].sort((a,b)=>b.value-a.value).slice(0,12),aq=top.length?top.reduce((a,c)=>a+(c.q||0.7),0)/top.length:0.7;
  const camF=0.7+0.45*clamp(aq,0.3,1.35);
  // Abwechslung belohnen: viele verschiedene Motive (Tiere, Sehenswürdigkeiten, Alltag am Lager)
  const names=new Set(clips.map(c=>c.name)).size,variety=1+0.012*Math.min(names,14);
  return s*(1+0.04*Math.min(types.size,6)+0.08*Math.min(rar,3))*camF*variety*0.86;
}

  if(ratio>=0.32&&ratio<=0.5)sc+=0.3;else if(ratio<0.2||ratio>0.62)sc-=0.4;

  if(/(wander|trail|berg|weg|pfad|fjäll|fjell|nord|wild|hike|gipfel|tour|fern|horizont|kompass|stille|wald)/.test(l))sc+=0.25;

}
