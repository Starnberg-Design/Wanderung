<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1b15">
<title>Wanderkanal</title>
<style>
:root{--bg:#0e1b15;--panel:#16281f;--panel2:#1d3529;--line:#2c4a3a;--txt:#e8f1ea;--dim:#9db5a5;--acc:#4cc38a;--acc2:#2f9e6b;--warn:#ffb54a;--bad:#ff6b5a;--blue:#4aa8e8;
 --c-en:#f7c948;--c-sat:#ff9142;--c-hyd:#39a0ff;--c-warm:#ff5d73;--c-wet:#a88bff;--c-hp:#3ddc84;--c-batt:#9be564;
 --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;overscroll-behavior:none;touch-action:manipulation}
h1,h2,h3,h4{margin:0 0 .5em}h2{font-size:1.35em}h3{font-size:1.1em}
small,.dim{color:var(--dim)}
button,select,input{font:inherit;color:var(--txt)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;min-height:36px}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--acc2);border-color:var(--acc);color:#fff;font-weight:600}
button.on{background:var(--acc2);border-color:var(--acc)}
button.hl{box-shadow:0 0 0 2px var(--blue)}
button.big{padding:12px 18px;font-size:1.05em}
button.warnb{border-color:var(--warn);color:var(--warn)}
input[type=text],input:not([type]),select{background:#0f2018;border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-height:34px}
input[type=range]{accent-color:var(--acc)}
.screen{display:none;min-height:100vh}.screen.active{display:block}
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px}
.center h1{font-size:2.6em}.sub{color:var(--dim)}
.col{display:flex;flex-direction:column;gap:10px;min-width:240px}
.wrap{max-width:1180px;margin:0 auto;padding:16px calc(16px + var(--sr)) 24px calc(16px + var(--sl))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.two,.three{grid-template-columns:1fr}}
@media(max-width:1000px) and (min-width:700px) and (max-height:600px){.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 12px;white-space:nowrap}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}.row.gap{gap:8px;flex-wrap:wrap}
.lbl{min-width:104px;color:var(--dim)}.val{min-width:70px;text-align:center}
.sw{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid #fff3;vertical-align:middle}
.stat{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.ctl{display:flex;align-items:center;gap:6px}.pips{letter-spacing:1px;color:var(--acc);min-width:110px;text-align:center;font-size:.9em}
.hint{color:var(--dim);font-size:.9em}
#prev{display:block;margin:0 auto 10px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.hike .facts{display:flex;flex-direction:column;gap:3px;margin:8px 0 12px;font-size:.9em;color:var(--dim)}
.risk{display:inline-block;border-radius:8px;padding:1px 8px;font-size:.85em;font-weight:600;color:#0b1a12}
.vbar{height:6px;background:#0f2018;border-radius:4px;margin:5px 0;overflow:hidden}.vbar i{display:block;height:100%;background:var(--acc)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:flex;gap:4px;flex-wrap:wrap}.seg button{padding:5px 10px;min-height:32px}
/* Shop */
.shopgrid{display:grid;grid-template-columns:1fr 350px;gap:14px}@media(max-width:699px){.shopgrid{grid-template-columns:1fr}}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.item.packed{border-color:var(--acc)}.item.broken{border-color:var(--bad)}
.ico{font-size:2em;width:48px;text-align:center}.ico img{width:44px;height:44px;object-fit:contain}
.ico.pk{width:64px}.ico.pk img{width:60px;height:74px}
.pvs{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}.pvs button{width:34px;height:40px;padding:2px;border:2px solid transparent;border-radius:6px;background:rgba(255,255,255,.07);min-width:0}.pvs button.on{background:rgba(255,255,255,.18)}.pvs img{width:100%;height:100%;object-fit:contain}
.ico.wide{width:112px}.ico.wide img{width:104px;height:47px}
.inf{flex:1;display:flex;flex-direction:column;gap:2px}
.qty{min-width:24px;text-align:center}
.side{position:sticky;top:10px;align-self:start}
.pl{list-style:none;padding:0;margin:8px 0;max-height:230px;overflow:auto;font-size:.92em}.pl li{padding:2px 0}
.mbar{position:relative;height:12px;background:#0f2018;border-radius:6px;overflow:visible;margin:4px 0}.mbar i{display:block;height:100%;background:var(--acc);border-radius:6px}.mbar i.warn{background:var(--warn)}.mbar i.bad{background:var(--bad)}.mbar b{position:absolute;top:-3px;width:2px;height:18px;background:#fff}
.warnbox{border-radius:8px;padding:7px 10px;margin:6px 0;font-size:.88em;border:1px solid var(--line)}
.warnbox.bad{background:#4a1f17;border-color:var(--bad)}.warnbox.warn{background:#4a3a17;border-color:var(--warn)}.warnbox.info{background:#173a4a;border-color:var(--blue)}
.badtxt{color:var(--bad);font-weight:600}.goodtxt{color:var(--acc);font-weight:600}
/* Hike */
#s-hike{background:#000}
#s-hike.active{display:block;position:fixed;inset:0;min-height:0;z-index:5;overflow:hidden}
#stage{position:absolute;inset:0;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;pointer-events:none;z-index:3}
.pill{background:rgba(8,16,12,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid #ffffff1c;border-radius:12px;padding:5px 10px;font-size:14px;color:#fff;line-height:1.35}
#h-tl{left:calc(4px + var(--sl));top:calc(4px + var(--st))}#h-tl .pill{padding:4px 6px}
#h-tc{left:50%;transform:translateX(-50%);top:calc(6px + var(--st));text-align:center}
.dl{font-size:17px;font-weight:700;letter-spacing:.2px;line-height:1.25;margin-bottom:1px}.se{font-size:14px;font-weight:700;margin-left:4px;white-space:nowrap}
.se-Frühling{color:#8fe388}.se-Sommer{color:#ffd54a}.se-Herbst{color:#ff9a4a}.se-Winter{color:#9fd4ff}
#h-tr{right:calc(6px + var(--sr));top:calc(6px + var(--st));text-align:right;max-width:34vw}
.sb{display:grid;grid-template-columns:repeat(2,auto);gap:2px 6px}
.st{display:flex;align-items:center;gap:3px;width:62px;font-size:11px}
.st .ic{width:14px;text-align:center;font-size:12px}
.st .tr{flex:1;height:7px;background:#0008;border-radius:5px;overflow:hidden}
.st .fl{display:block;height:100%;border-radius:5px;transition:width .3s}
.st.low .ic{animation:blink .9s infinite}.st.low .fl{animation:blink .9s infinite}
@keyframes blink{50%{opacity:.35}}
.dev{display:inline-flex;align-items:center;gap:3px;margin-left:6px;font-size:13px}
.dev .bt{display:inline-block;width:28px;height:10px;border:1px solid #fff9;border-radius:2px;position:relative}
.dev .bt i{position:absolute;left:0;top:0;bottom:0;background:var(--c-batt)}
.dev.vm{background:#ffffff1c;border:1px solid #ffffff33;border-radius:9px;padding:0 6px;margin-left:3px;cursor:pointer}
.dev.low .bt i{background:var(--bad)}.dev.dead{color:var(--bad)}
#toasts{position:absolute;right:calc(114px + var(--sr,0px));top:6px;display:flex;flex-direction:column;gap:2px;width:190px;max-width:24%;max-height:74px;overflow:hidden;justify-content:flex-start;pointer-events:none;z-index:3}
.toast{background:rgba(10,20,15,.82);border-left:3px solid var(--dim);padding:3px 6px;border-radius:5px;font-size:11.2px;line-height:1.25;animation:in .25s;transition:opacity .6s}
.toast.good{border-color:var(--acc)}.toast.bad{border-color:var(--bad)}.toast.warn{border-color:var(--warn)}.toast.out{opacity:0}
@keyframes in{from{transform:translateX(-10px);opacity:0}to{transform:none;opacity:1}}
#h-mid{left:50%;transform:translateX(-50%);top:calc(76px + var(--st));text-align:center}
#h-bot{left:calc(6px + var(--sl));right:calc(6px + var(--sr));bottom:calc(4px + var(--sb));display:flex;gap:8px;align-items:center;pointer-events:none}
#h-bot .prow{flex:1;display:flex;gap:8px;align-items:center;background:rgba(8,16,12,.6);border:1px solid #ffffff1c;border-radius:12px;padding:3px 8px}
#prof{flex:1;min-width:0;height:40px}
#ptxt{font-size:13px;white-space:nowrap;text-align:right;color:#fff}
#dock{display:flex;gap:6px;pointer-events:auto}
.rb{width:54px;height:54px;border-radius:50%;padding:0;font-size:23px;display:flex;align-items:center;justify-content:center;background:rgba(8,16,12,.72);border:1px solid #ffffff33;position:relative;color:#fff;flex-direction:column;line-height:1}
.rb small{font-size:10.5px;color:#fff;margin-top:1px}
.rb.act{background:var(--acc2);border-color:var(--acc)}
.rb .bdg{position:absolute;top:-3px;right:-3px;background:var(--warn);color:#000;border-radius:9px;font-size:9px;padding:0 4px;font-weight:700}
#drawer{position:absolute;right:0;top:0;bottom:0;width:min(62vw,400px);transform:translateX(102%);transition:transform .2s;background:rgba(10,20,15,.95);z-index:6;overflow:auto;padding:8px 10px calc(8px + var(--sb)) 10px;border-left:1px solid var(--line)}
#drawer.open{transform:none}
#drawer h4{margin:8px 0 4px;font-size:.9em;color:var(--dim)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:5px}.acts button{font-size:.85em;padding:7px 6px}
.chk{display:flex;gap:6px;align-items:center;font-size:.9em;margin:5px 0}
#recsl{right:calc(8px + var(--sr));top:calc(50% + 8px);transform:translateY(-50%);display:flex;align-items:stretch;gap:6px;background:rgba(8,16,12,.6);border:1px solid #ffffff1c;border-radius:14px;padding:8px 8px 26px 10px;pointer-events:auto;flex-wrap:nowrap}
#spdctl{display:flex;align-items:center;gap:2px;background:#0a1410b0;border:1px solid #ffffff22;border-radius:14px;padding:2px 3px}
#spdctl button{background:transparent;border:0;color:#fff;font-size:15px;width:26px;height:44px;padding:0;cursor:pointer}
#sp-v{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:38px;color:#fff;font-size:19px;line-height:1}#sp-v small{font-size:11px;margin-top:2px}
.ctry{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.cbtn{display:flex;flex-direction:column;align-items:flex-start;padding:8px 14px}.cbtn.on{background:var(--acc);color:#04120a}.cbtn small{opacity:.8}
.grp{margin:16px 0 6px;font-size:16px;color:var(--acc)}
.dogb{display:grid;grid-template-columns:repeat(2,auto);gap:2px 6px;margin-top:4px;padding-top:4px;border-top:1px solid #ffffff22}
#rlab{display:flex;flex-direction:column;justify-content:space-between;height:112px;font-size:12px;text-align:right;color:#fff9}
#rlab span{cursor:pointer;line-height:1}#rlab span.on{color:#fff;font-weight:700}
#rtrk{position:relative;width:30px;height:112px;touch-action:none;cursor:pointer;flex:none}
#rtrk:before{content:"";position:absolute;left:12px;width:6px;top:0;bottom:0;background:#0009;border:1px solid #fff4;border-radius:4px}
#rknob{position:absolute;left:3px;width:24px;height:24px;margin-top:-12px;border-radius:50%;background:var(--acc);border:2px solid #fff;box-shadow:0 0 6px #0008;transition:top .12s}
.rcam{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:17px}
#livepanel{position:absolute;right:calc(8px + var(--sr));bottom:calc(58px + var(--sb));width:min(46vw,310px);z-index:4;pointer-events:auto}
#rot{display:none;position:absolute;inset:0;z-index:9;background:#000d;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:10px;font-size:1.2em}
@media(orientation:portrait){#s-hike.active #rot{display:flex}}
/* Modal */
#modal{display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center;z-index:50;padding:8px}
#modal.open{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--acc);border-radius:14px;padding:16px;max-width:560px;width:100%;max-height:calc(100vh - 16px);overflow:auto}
#modal .box.wide{max-width:860px}
#modal .btns{display:flex;flex-direction:column;gap:7px;margin-top:12px}
#modal .btns.rowb{flex-direction:row;flex-wrap:wrap}
.cliplist{max-height:300px;overflow:auto}.clip{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.9em}
.rar{font-style:normal;font-size:.72em;padding:1px 6px;border-radius:8px;color:#fff;margin-left:4px}
.forecast{background:var(--panel2);border-radius:8px;padding:10px;margin:10px 0}
/* Rucksack */
.pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.pk .cell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:.85em;cursor:pointer}
.pk .cell.static{cursor:default}
.pk .big{font-size:1.9em;line-height:1.1;min-height:36px;word-break:break-all}
.bar{height:8px;background:#0008;border-radius:5px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%}
.bottles{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.bottle{text-align:center;font-size:.8em;cursor:pointer}
/* Studio */
.yt{background:#0f0f0f;border:1px solid #303030;border-radius:12px;overflow:hidden}
.ytban{height:90px;background:linear-gradient(120deg,#1e4d36,#2b6f8f 60%,#6a4c93)}
.ythead{display:flex;gap:14px;align-items:center;padding:12px 16px;margin-top:-34px}
.ytav{width:72px;height:72px;border-radius:50%;border:3px solid #0f0f0f;display:flex;align-items:center;justify-content:center;font-size:34px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0}
.kpi{background:var(--panel2);border-radius:10px;padding:8px 10px}.kpi b{display:block;font-size:1.25em}
.vrow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #2a2a2a}
.vrow canvas{width:150px;height:84px;border-radius:8px;flex:none;background:#222}
.vrow .mt{flex:1;min-width:0}
.badge{display:inline-block;border-radius:6px;font-size:.75em;padding:1px 6px;margin-left:4px;background:#333}.badge.hot{background:#c0392b}
.cmt{padding:6px 0;border-bottom:1px solid #2a2a2a;font-size:.9em}
canvas.chart{width:100%;height:140px;display:block}
/* Landscape phone */
@media(max-height:520px){
 html,body{font-size:13px}
 .wrap{padding:8px calc(10px + var(--sr)) 14px calc(10px + var(--sl))}
 .center{min-height:100vh;gap:8px;padding:8px}.center h1{font-size:1.9em}
 .card{padding:10px}.item{padding:6px}.ico{font-size:1.6em;width:38px}
 button{padding:6px 10px;min-height:32px}
 #modal .box{padding:12px}
 h2{font-size:1.15em}
}
@media(max-height:430px){.st{width:56px;font-size:10px}.pill{font-size:13px;padding:4px 8px}.rb{width:49px;height:49px;font-size:20px}#h-mid{top:calc(82px + var(--st))}#h-bot{gap:5px}#dock{gap:4px}}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   WANDERKANAL v2 – Teil 1: Daten
   ===================================================================== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=0,b=1)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hash=n=>{n=Math.imul((n|0)^0x9e3779b9,0x85ebca6b);n^=n>>>13;n=Math.imul(n,0xc2b2ae35);n^=n>>>16;return (n>>>0)/4294967295};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const eur=v=>v.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const eur0=v=>Math.round(v).toLocaleString('de-DE')+' €';
const fmtTime=t=>{const m=Math.floor(((t%1440)+1440)%1440);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const fmtN=(v,d=1)=>(+v).toFixed(d).replace('.',',');
const fmtInt=v=>Math.round(v).toLocaleString('de-DE');
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- Optionale eigene Grafiken: assets/<pfad>.png (oder .svg, z. B. img('Zelte_Tarp','svg')) ---- */
const IMG={};
function img(path,ext='png'){
  const key=ext==='png'?path:path+'.'+ext;
  if(!(key in IMG)){IMG[key]=null;const i=new Image();i.onload=()=>{IMG[key]=i};i.onerror=()=>{IMG[key]=false};i.src='assets/'+path.split('/').map(encodeURIComponent).join('/')+'.'+ext;}
  return IMG[key]||null;
}

/* ---- Charakter ---- */
const STAT_DEFS=[
  {id:'trag',name:'Tragkraft',desc:'Wie viel Gewicht du bequem trägst.'},
  {id:'aus',name:'Ausdauer',desc:'Weniger Energieverbrauch beim Gehen.'},
  {id:'tempo',name:'Tempo',desc:'Höchstgeschwindigkeit auf ebenem Weg.'},
  {id:'kalt',name:'Kälteresistenz',desc:'Du frierst später.'},
  {id:'food',name:'Nahrungsbedarf',desc:'Mehr Punkte = du brauchst weniger Essen.'},
  {id:'water',name:'Wasserbedarf',desc:'Mehr Punkte = du brauchst weniger Wasser.'},
  {id:'nav',name:'Orientierung',desc:'Du verläufst dich seltener.'}];
const STAT_POOL=24,STAT_MIN=1,STAT_START_MAX=6,STAT_MAX=10;
const LOOKS={
  skin:['#f6d3b3','#e8b98f','#c68b59','#8d5a35','#5a3921'],
  hair:['#2b1d12','#6b4423','#c98a3c','#e8d18b','#a3361f','#8a8f96','#111'],
  jacket:['#d9534f','#f0ad4e','#2e86c1','#27ae60','#8e44ad','#2c3e50','#e84393','#16a085'],
  pants:['#33465a','#4b3b2a','#2d2d2d','#556b2f','#6b7b8c'],
  styles:['Kurz','Lang','Mütze','Zopf','Glatze','Locken'],
  beards:['Keiner','Stoppel','Vollbart'],
  glasses:['Keine','Brille','Sonnenbrille'],
  builds:['Schlank','Normal','Kräftig']};
const BUILD_BONUS={0:{tempo:1,trag:-1},1:{},2:{trag:1,kalt:1,tempo:-1}};
const BUILD_DESC=['Schlank: +1 Tempo, −1 Tragkraft','Normal: ausgewogen','Kräftig: +1 Tragkraft, +1 Kälteresistenz, −1 Tempo'];
const TALENTS=[
  {id:'pfad',name:'Pfadfinder',e:'🧭',desc:'+2 Orientierung, findest verlorene Wege schneller wieder.'},

/* ---- Wanderungen ---- */
const BL={w:'wald',m:'wiese',t:'tal',b:'berg',f:'fjaell',s:'sand',k:'kies',e:'schnee'};
// P: erzeugt Etappen aus Muster (Buchstabe = Biom, Zahl = km), Höhe linear a0→a1 plus Schwankung
function P(spec,total,a0,a1,wig,seed){
  const tk=spec.split(' ').map(s=>({b:BL[s[0]],w:+s.slice(1)}));
  const out=[];let acc=0,i=0;
  while(acc<total-0.01){const t=tk[i%tk.length];const km=Math.min(t.w,total-acc);out.push({b:t.b,km,alt:0});acc+=km;i++}
  if(out.length>1&&out[out.length-1].km<2){const l=out.pop();out[out.length-1].km+=l.km}
  let cum=0;const r=mulberry32(seed||1);
  out.forEach((s,k)=>{cum+=s.km;const t=cum/total;let a=lerp(a0,a1,t)+wig*Math.sin(k*1.9+seed)*0.6+wig*(r()-0.5)*0.8;
    if(s.b==='berg')a+=wig*0.7;if(s.b==='tal')a-=wig*0.5;s.alt=Math.max(5,Math.round(a/10)*10)});
  out[out.length-1].alt=Math.round(a1);
  return out;
}

/* ---- Sonne ---- */
function sunSin(lat,doy0,hour){
  const dec=23.44*Math.sin(2*Math.PI*(doy0-80)/365)*Math.PI/180,la=lat*Math.PI/180;
  return Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos((hour-12)*Math.PI/12);
}
const sunAltDeg=(lat,doy0,hour)=>Math.asin(clamp(sunSin(lat,doy0,hour),-1,1))*180/Math.PI;
const lightOf=alt=>{const t=clamp((alt+6)/14,0,1);return t*t*(3-2*t)};
function dayLightHours(lat,doy0){let n=0;for(let i=0;i<96;i++)if(lightOf(sunAltDeg(lat,doy0,i/4))>0.5)n+=0.25;return n}
/* ---- Klima ---- */
function seasonalT(R,doy0,alt){return R.meanT-R.sAmp*Math.cos(2*Math.PI*(doy0-25)/365)-(alt-R.ref)*0.0065}
function wxWeights(R,m,ext){

  const o={};for(const k in base){o[k]=base[k]*(md[k]||1);if(k==='sturm'||k==='gewitter'||k==='regen')o[k]*=ext}
  return o;
}

function waterFit(){
  const pk=slotOf('pack'),all=packedGear().filter(g=>g.cat==='water'),ok=[],no=[];let tot=0;
  for(const c of all){if(pk&&pk.wbig&&(c.cap>pk.wbig||tot+c.cap>pk.wcap)){no.push(c)}else{ok.push(c);tot+=c.cap}}

}

// Last, die der Spieler wirklich trägt: Hund trägt zuerst sein Futter, dann Ausrüstung
function playerLoad(totalKg,dogFoodKg){
  const cap=dogPackCap();if(!cap)return totalKg;
  const carriedFood=Math.min(cap,dogFoodKg);
  const relief=Math.min(cap-carriedFood,totalKg-dogFoodKg);
  return totalKg-carriedFood-Math.max(0,relief);
}

/* ---- Route erzeugen ---- */
function stageIndexAt(S,x){let lo=0,hi=S.length-1;while(lo<hi){const mid=(lo+hi)>>1;if(x<S[mid].x1)hi=mid;else lo=mid+1}return lo}
const FEAT_RAD={see:140,lodge:300,village:380,sight:260,animal:170,forage:160,special:200,hiker:130,junction:120,quelle:130,fluss:160};
function stageWaterF(hk,i){let h=0;for(const ch of hk.id)h=(h*31+ch.charCodeAt(0))>>>0;const r=mulberry32(h+i*131)();return r<0.3?0.15:r<0.62?0.7:1.5}
function stageSprings(hk,st){const B=BIOMES[st.b];let n=Math.round(st.km/(B.water*1.7)*stageWaterF(hk,st.i));if(hk.stages.length<=4||st.km>=13)n=Math.max(n,1);return n}
function waterInfo(hk){let n=0,dry=0,maxDry=0;hk.stages.forEach((s,i)=>{const c=stageSprings({stages:hk.stages,id:hk.id},{i,b:s.b,km:s.km});n+=c;if(c===0){dry++;maxDry=Math.max(maxDry,s.km)}});const per10=n/hk.km*10;return {n,per10,dry,maxDry,lbl:per10<0.55?'wenige Wasserstellen':per10<1.0?'mäßig viele Wasserstellen':'viele Wasserstellen'}}
function buildRoute(hk,seed){
  const rng=mulberry32(seed);
  const stages=[];let acc=0,prev=hk.startAlt;
  hk.stages.forEach((s,i)=>{stages.push({i,b:s.b,km0:acc,km:s.km,x0:acc*PPK,x1:(acc+s.km)*PPK,a0:prev,a1:s.alt});acc+=s.km;prev=s.alt});
  const totalPx=acc*PPK,totalKm=acc;
  const N=Math.ceil((totalPx+3200)/10)+2;const elev=new Float32Array(N);
  const ph=[rng()*6.28,rng()*6.28,rng()*6.28];let si=0;const rough=1+0.1*hk.diff;
  for(let i=0;i<N;i++){
    const x=i*10;while(si<stages.length-1&&x>=stages[si].x1)si++;
    const st=stages[si];const t=clamp((x-st.x0)/(st.x1-st.x0),0,1);const s=t*t*(3-2*t);
    const amp=BIOMES[st.b].noise*rough;
    elev[i]=lerp(st.a0,st.a1,s)+amp*(0.6*Math.sin(x*0.0055+ph[0])+0.3*Math.sin(x*0.0135+ph[1])+0.1*Math.sin(x*0.03+ph[2]));
  }
  const feats=[];let fid=0;const add=o=>{o.id=fid++;feats.push(o);return o};
  const reg=hk.regD;
  // Wasserstellen, Flüsse, Wegkreuzungen
  stages.forEach(st=>{
    const L=st.x1-st.x0,B=BIOMES[st.b];
    const nW=stageSprings(hk,st);
    for(let k=0;k<nW;k++)add({type:'quelle',x:st.x0+L*((k+0.25+rng()*0.5)/nW)});
    if(st.b!=='berg'){
      const nR=st.b==='tal'?1+(rng()<0.5?1:0):(rng()<0.5?1:0);
      for(let k=0;k<nR;k++)add({type:'fluss',x:st.x0+L*(0.12+rng()*0.76),bridge:rng()<0.55});
    }
    let jx=st.x0+(2+rng()*2)*PPK;const jsp=4.5+hk.diff*0.6;
    while(jx<st.x1-PPK){add({type:'junction',x:jx});jx+=(jsp+rng()*3)*PPK}
  });
  // Sehenswürdigkeiten = seltene Meilensteine
  const sl=hk.sights&&hk.sights.length?hk.sights:null;
  const nS=sl?sl.length:Math.max(1,Math.round(totalKm/38));
  const peakCount=sl?sl.filter(q=>q.e==='⛰️').length:0;
  for(let k=0;k<nS;k++){
    let x=totalPx*(0.1+0.8*((k+0.35+rng()*0.4)/nS));
    const st=stages[stageIndexAt(stages,x)];
    const s=sl?sl[k]:(()=>{const g=SIGHTS[st.b];return g[Math.floor(rng()*g.length)]})();
    const summit=s.e==='⛰️';
    if(summit){ // Gipfel liegen nur auf echten Höhepunkten der Route (bei einem einzigen Gipfel: höchster Punkt der ganzen Tour)
      const W=(peakCount===1&&sl)?totalPx:Math.max(3*PPK,Math.min(totalPx*0.2,8*PPK));
      const i0=Math.max(30,Math.floor((x-W)/10)),i1=Math.min(Math.floor((totalPx-150)/10),Math.ceil((x+W)/10));
      let bi=-1,bv=-1e9;for(let i=i0;i<=i1;i++){if(elev[i]>bv){bv=elev[i];bi=i}}
      if(bi>=0)x=bi*10;
    }
    add({type:'sight',x,s,summit});
  }
  // Tiere: wenige Highlights entlang der Route
  const tags=reg.tags;
  const ADENS={wald:1.3,wiese:1,tal:1,berg:0.8,fjaell:0.9};
  const nA=Math.max(1,Math.round(totalKm/16));
  for(let k=0;k<nA;k++){
    const x=totalPx*(0.04+0.92*((k+rng())/nA));
    const st=stages[stageIndexAt(stages,x)];
    if(rng()>ADENS[st.b]/1.3*0.7)continue;
    const cand=ANIMALS.filter(a=>a.b.includes(st.b)&&(!a.tags||a.tags.some(t=>tags.includes(t))));
    if(!cand.length)continue;
    let tot=cand.reduce((s,a)=>s+a.w,0),r=rng()*tot,a=cand[0];
    for(const c of cand){r-=c.w;if(r<=0){a=c;break}}
    add({type:'animal',x,a});
  }
  // Wanderer, Dörfer, Sammelstellen, Sonderereignisse
  // Begegnungen: auf leichten Touren öfter, auf schweren selten bis sehr selten (Winter seltener, Sommer etwas häufiger)
  const hSpacing=[18,18,32,55,90,140,200][Math.min(hk.diff,6)]||18;
  const hSeason=(()=>{const m=dateOf(G.day).m;return (m===11||m<2)?0.45:(m>=5&&m<=7)?1.2:1})();
  const expH=totalKm/hSpacing*hSeason,nH=Math.floor(expH)+(rng()<expH-Math.floor(expH)?1:0);
  for(let k=0;k<nH;k++)add({type:'hiker',x:totalPx*(0.08+0.84*((k+0.2+rng()*0.6)/nH))});
  if(TOWNS[hk.id]){TOWNS[hk.id].forEach(t=>{if(t[1]<totalKm-3)add({type:'village',x:t[1]*PPK,name:t[0],town:true})})}
  else if(hk.villageEvery>0){
    for(let km=hk.villageEvery*(0.55+rng()*0.25);km<totalKm-6;km+=hk.villageEvery*(0.85+rng()*0.3))
      add({type:'village',x:km*PPK,name:pick(['Dorfladen','Kiosk','Butik','Alimentari','Épicerie','Kaufmannsladen','Kjøpmann'])});
  }
  // Hütten, Stugas, Bothys und Windschutz an echten Wanderrouten (Stil je nach Region)
  {const tg=(hk.regD&&hk.regD.tags)||[],alp=tg.includes('alpen'),nor=tg.includes('nord'),sco=tg.includes('scot'),isl=tg.includes('isl');
   const ov=hk.lodgeKind;

function featsIn(a,b){ // sortiert nach x; Features im Bereich (a,b]
  if(H.side)return [];
  const F=H.route.feats;let lo=0,hi=F.length;
  while(lo<hi){const m=(lo+hi)>>1;if(F[m].x<=a)lo=m+1;else hi=m}
  const out=[];for(let i=lo;i<F.length&&F[i].x<=b;i++)out.push(F[i]);return out;
}
function inLake(x){const L=H.route.lakes;if(!L)return false;for(const l of L)if(x>l.xl-30&&x<l.xr+30)return true;return false}
function featNear(type,x,r){for(const f of featsIn(x-r,x+r)){if(f.type===type)return f}return null}
function elevAt(x){const r=H.route.elev;const f=clamp(x,0,(r.length-2)*10)/10;const i=Math.floor(f);return lerp(r[i],r[i+1],f-i)+climbLift(x)}
function gradeAt(x){return (elevAt(x+10)-elevAt(x-10))/(20*1000/PPK)}
function stageAt(x){const S=H.route.stages;return S[stageIndexAt(S,x)]}
function netAt(x){
  if(featNear('village',x,900))return true;
  return hash(Math.floor(x/300)+77)<BIOMES[stageAt(x).b].net;
}

/* ---- Wetter ---- */
function nextWeather(prev){
  const d=dateOf(G.day),w=wxWeights(H.hk.regD,d.m,H.hk.ext);let tot=0;
  const ent=Object.entries(w).map(([k,v])=>{v=k===prev?v*0.4:v;tot+=v;return [k,v]});
  let r=Math.random()*tot;for(const [k,v] of ent){r-=v;if(r<=0)return k}return 'wolkig';
}
function setWeather(type){
  const hk=H.hk,W=WEATHER[type];
  H.weather={type,until:H.t+rnd(150,480),wind:W.wind*rnd(0.75,1.3)*hk.regD.wind*(0.85+0.15*hk.ext),rainI:W.rain?W.rain*rnd(0.6,1.2)*(0.7+hk.ext*0.4):0};
  H.nextW=nextWeather(type);H.wxWarned=false;
  if((type==='gewitter'||type==='sturm')&&H.started)spawnIcon({kind:'storm',x:H.x+320,e:type==='gewitter'?'⛈️':'🌪️',label:type==='gewitter'?'Gewitter':'Sturm',base:30,life:12});
}
function updateWeather(){
  if(H.t>=H.weather.until){setWeather(H.nextW||nextWeather(H.weather.type));return}
  if(!H.wxWarned&&H.weather.until-H.t<110&&(H.nextW==='gewitter'||H.nextW==='sturm')){
    H.wxWarned=true;toast(H.nextW==='sturm'?'⚠️ Der Wind frischt auf – ein Sturm zieht in etwa 1½ Stunden auf!':'⚠️ Dunkle Wolken bauen sich auf – ein Gewitter naht.','warn');sfx('warn');
  }
}
function computeEnv(){
  const hk=H.hk,R=hk.regD;const d=dateOf(G.day);const hour=(H.t/60)%24;
  const st=stageAt(H.x),B=BIOMES[st.b];
  env.hour=hour;env.stage=st;env.biome=st.b;env.alt=elevAt(H.x);env.grade=gradeAt(H.x);
  env.doy0=d.doy0;env.month=d.m;env.season=seasonOfM(d.m);
  env.sunAlt=sunAltDeg(R.lat,d.doy0,hour);
  const W=WEATHER[H.weather.type];
  env.sun=lightOf(env.sunAlt);env.light=env.sun*W.dim;env.dark=1-env.light;
  env.gold=clamp(1-Math.abs(env.sunAlt-3)/9,0,1)*(env.sunAlt>-7?1:0);
  const sT=seasonalT(R,d.doy0,env.alt);env.seasonT=sT;
  const daily=R.dAmp*(0.35+0.65*env.sun)*Math.sin((hour-9)/24*2*Math.PI);
  const syn=R.syn*(0.6*Math.sin(H.t/1440*0.83+H.synPh[0])+0.4*Math.sin(H.t/1440*2.1+H.synPh[1]));
  env.temp=sT+daily+syn+W.dT;
  if(H.snowDepth==null)H.snowDepth=clamp((1.5-sT)/5,0,1)*30;
  env.snow=clamp(H.snowDepth/30,0,1);
  env.frozen=sT<-4;
  env.wind=H.weather.wind*B.wind;
  env.rainI=H.weather.rainI;
  env.precip=H.weather.rainI>0.05?(env.temp<1.5?'snow':'rain'):null;
  env.fog=H.weather.type==='nebel'?0.55:0;
  env.net=netAt(H.x);
  env.midnightSun=R.lat>66&&env.sunAlt>-2&&(hour<3||hour>21);
  env.aurora=(R.lat>62&&env.dark>0.85&&(H.weather.type==='klar'||H.weather.type==='wolkig')&&d.m!==5&&d.m!==6&&d.m!==7)?1:0;
}

function loadKg(){ // Last, die der Spieler trägt
  let k=H.g.gearKg;
  for(const id in H.food)k+=gearById(id).kg*H.food[id];
  k+=H.gas*(GAS.kg/5);
  k+=H.water.clean+H.water.dirty;
  k+=H.dogfood;
  return playerLoad(k,H.dogfood);
}
const waterTotal=()=>H.water.clean+H.water.dirty;
function forageMul(){const D=H.dog;if(D&&!D.away)return D.leash?1.1:1.45;return H.hk.km>=100?0.6:0.85}
const nearFire=()=>H.fire.lit&&Math.abs(H.x-H.fire.x)<110;
const woodAvail=()=>H.wood+(H.carry||0);
function useWood(){if(H.wood>0)H.wood--;else if(H.carry>0)H.carry--}
const fireCovered=x=>!!H.fireTarp&&Math.abs(H.fireTarp.x-x)<40;
function nearWater(){return featNear('quelle',H.x,90)||featNear('fluss',H.x,90)}
function nearSight(){for(const f of featsIn(H.x-250,H.x+250))if(f.type==='sight'&&/see|fjord|loch|lac|lago|älv|elv/i.test(f.s.n))return f;return null}
function isInjured(){return H.inj.blister>H.t||H.inj.sprain>H.t||H.sick>H.t}
function fillContainers(){ // Verteilt Wasser auf Flaschen (sauber zuerst, dann unbehandelt)
  let c=H.water.clean,d=H.water.dirty;
  return H.g.containers.map(def=>{const a=Math.min(def.cap,c);c-=a;const b=Math.min(def.cap-a,d);d-=b;return {def,clean:a,dirty:b}});
}
function deviceOK(id){const d=H.dev[id];return !!d&&!d.broken&&d.batt>0}
function lightSource(){
  if(deviceOK('lamp'))return 'lamp';
  if(H.g.phones.some(p=>deviceOK(p.id)))return 'phone';
  return null;
}
function lampInUse(){return env.dark>0.55&&H.moving}
function navPhone(){ // Smartphone, das gerade zur Navigation genutzt wird
  if(H.g.gps&&deviceOK('gps'))return null;
  const ok=H.g.phones.filter(p=>deviceOK(p.id)&&(H.g.offline||env.net));
  if(!ok.length)return null;
  return ok.find(p=>p.id!==H.activeDev)||ok[0];

function navInfo(){
  const g=H.g;let best={q:0.12,label:'Kein Navi – nach Gefühl',src:null,live:false,note:''};
  const light=lightSource()==='lamp';
  if(g.map){let q=0.6;if(env.fog)q-=0.15;if(env.dark>0.6&&!light)q-=0.2;if(H.body.wet>70)q-=0.1;if(q>best.q)best={q,label:'Landkarte & Kompass',src:'map',live:false,note:''}}
  let note='';
  const anyPhone=g.phones.length>0;
  if(anyPhone){
    const np=g.phones.some(p=>deviceOK(p.id)&&(g.offline||env.net));
    if(np){if(0.82>best.q)best={q:0.82,label:'Smartphone-Navi',src:'phone',live:true,note:''}}
    else if(!g.phones.some(p=>!H.dev[p.id].broken))note='Smartphone kaputt';
    else if(!g.phones.some(p=>deviceOK(p.id)))note='Handy-Akku leer';
    else note='Kein Netz (Offline-Karten fehlen)';
  }
  if(g.gps){const d=H.dev.gps;if(d.broken)note='GPS kaputt';else if(d.batt<=0)note='GPS-Akku leer';else if(0.92>best.q)best={q:0.92,label:'GPS-Gerät',src:'gps',live:true,note:''}}
  if(best.q<=0.6&&note&&!best.note)best.note=note;

}

function shotQ(def,scenic){
  const lightF=0.55+0.45*env.light;
  const wF={klar:1.08,wolkig:1,nebel:0.72,regen:0.8,gewitter:0.85,sturm:0.8}[H.weather.type];
  const wl=env.gold>0.3?1.12:1; // goldenes Licht
  return def.q*lightF*wF*wl*scenic*(hasT('foto')?1.1:1)*rnd(0.85,1.15);
}
function scenicNow(){
  let s=BIOMES[env.biome].scenic;
  if(featsIn(H.x-450,H.x+450).some(f=>f.type==='sight'))s*=1.5;
  if(env.gold>0.4)s*=1.1;

}
function addClip(o){if(o.rar>=3)H.thrill+=2;else if(o.rar===2)H.thrill+=0.7;o.day=G.day;o.biome=env.biome;o.t=H.t;H.clips.push(o);return o}
function startShot(dev){
  const types=['selfie','landschaft','video','talk'];const w=[2,3,3,2];
  if(H.dog&&H.dog.mood>35){types.push('hund');w.push(2)}
  const tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot,ti=0;for(;ti<types.length-1;ti++){r-=w[ti];if(r<=0)break}
  const type=types[ti];
  const dur=CLIP_TYPES[type].dur*1.4*dev.def.time*rnd(0.85,1.15);
  H.shot={type,left:dur,dur,dev:dev.def.id};
}
function launchDrone(){
  if(env.wind>9||H.weather.type==='gewitter'||env.precip==='snow'){
    if(H.t-H.droneToast>120){toast('🛸 Zu windig/ungünstig für die Drohne.');H.droneToast=H.t}
    H.droneTimer=40;return;
  }
  H.dev.drone.batt-=18;
  if(H.dev.drone.batt<35)toast('🛸 Drohnen-Akku niedrig – lade ihn über die Powerbank.','warn');
  H.shot={type:'drone',left:12,dur:12,dev:'drone'};

}
function finishShot(){
  const s=H.shot;H.shot=null;if(!s||s.noclip)return;
  const T=CLIP_TYPES[s.type];const d=H.dev[s.dev];if(!d)return;
  if(s.type==='drone'&&env.wind>6&&Math.random()<0.04){d.broken=true;H.cond.drone=0;toast('💥 Die Drohne ist abgestürzt!','bad');sfx('bad');return}
  const q=shotQ(d.def,s.type==='selfie'||s.type==='hund'?1:scenicNow());
  addClip({key:s.type,type:s.type,name:T.n,e:T.e,q,value:T.base*q,rar:-1});
  sfx('shutter');
}
function rollShots(hr){
  if(env.light<0.2||H.rec===0)return;
  if(!H.shot){const dev=handheld();if(dev&&Math.random()<SHOT_RATE[H.rec]*hr)startShot(dev)}
  if(!H.shot&&H.droneOn&&H.g.drone&&H.dev.drone&&deviceOK('drone')&&H.dev.drone.batt>=35){
    H.droneTimer=Math.min(H.droneTimer,DRONE_INT[H.rec]);

const ACTION_CLIPS={eat:['🍕','Essen im Ort',3],fire:['🔥','Lagerfeuer entfachen',4.5],cook:['🍲','Kochen am Lagerplatz',4],tent:['⛺','Zeltaufbau im Zeitraffer',4.5],forage:['🫐','Sammeln am Wegesrand',3.5],fish:['🎣','Angeln am Wasser',4.5],ftarp:['🏕️','Tarp über dem Feuer',3.5],solar:['☀️','Solarpanel aufstellen',3]};
function actionClip(kind){
  const a=ACTION_CLIPS[kind];if(!a||H.rec===0||!H.dev)return;
  const dev=handheld();if(!dev)return;
  const key='act:'+kind+':'+G.day;
  if(H.clips.some(c=>c.key===key))return;
  const q=shotQ(dev.def,0.9);
  const hiding=env.dark>0.6&&kind!=='fire'&&kind!=='cook'&&kind!=='tent'?0.6:1;
  addClip({key,type:'video',name:a[1],e:a[0],q,value:a[2]*q*hiding*(env.dark>0.6&&kind==='fire'?1.25:1),rar:-1});
}
function beginAction(kind,label,dur,done,opts={}){
  if(ACTION_CLIPS[kind]){const d0=done;done=()=>{try{actionClip(kind)}catch(e){}if(d0)d0()}}
  H.action={kind,label,dur,left:dur,done,tick:opts.tick,resume:opts.force?true:(!!opts.resume&&H.walking)};
  H.walking=false;
}
function stepAction(h){
  const a=H.action;a.left-=h;
  if(a.tick)a.tick(h);
  if(a.left<=0&&H.action===a){H.action=null;if(a.done)a.done();if(a.resume&&!H.action&&!H.camp.pitched&&!H.sleep.active)H.walking=true}
}
function stimFx(kind){
  const S=H.stim,t=H.t,inBoost=t<S.boostEnd;
  const dur=kind==='coffee'?180:220,crashLen=kind==='coffee'?110:170;
  S.boostEnd=(inBoost?S.boostEnd:t)+dur*(inBoost?0.8:1);
  S.crashStart=S.boostEnd;S.crashEnd=Math.max(S.crashEnd,S.crashStart+crashLen);
  S.mul=kind==='coffee'?0.84:0.78;S.crash=Math.max(S.crash>1&&t<S.crashEnd?S.crash:1,kind==='coffee'?1.16:1.38);
  H.body.energy=Math.min(100-H.fatigue,H.body.energy+(kind==='coffee'?14:24));
  toast('⚡ '+(kind==='coffee'?'Kaffee':'Energydrink')+': du bist wach – aber in etwa '+(kind==='coffee'?'3':'3½')+' h kommt das Tief.','good');
}
function eatFood(id){
  const f=FOODS.find(x=>x.id===id);if(!f||!H.food[id])return;

}
function drinkWater(dirtyOK){
  const w=H.water;const need=(100-H.body.hyd)/33;
  let amt=Math.min(need,0.6);
  const c=Math.min(amt,w.clean);w.clean-=c;let dirt=0;
  if(dirtyOK&&c<amt){dirt=Math.min(amt-c,w.dirty);w.dirty-=dirt}

function act(kind,arg){
  if(H.action||H.sleep.active||H.ended)return;
  const g=H.g;
  switch(kind){
    case 'walk':
if(H.fork){toast('🪧 Wähle zuerst eine Richtung an der Wegscheide.');return}
if(H.camp.pitched){toast('Baue zuerst dein Lager ab.');return}
      if(H.body.energy<=0){toast('Du bist zu erschöpft – rasten oder schlafen!','bad');return}
      H.stopReason=null;H.walking=!H.walking;break;
    case 'tent':
      if(H.camp.pitched){beginAction('tent','Baut Lager ab …',(H.g.shelter&&H.g.shelter.down)||15,()=>{H.camp.pitched=false;toast('Lager abgebaut. Du machst eine Pause – tippe auf „Gehen“, wenn es weitergehen soll.')});sfx('tent');return}
      if(!g.shelter){toast('Du hast keine Unterkunft dabei.');return}

      if(Math.abs(env.grade)>0.09){toast('Hier ist es zu steil zum Zelten.','bad');return}
      beginAction('tent','Baut '+g.shelter.name+' auf …',g.shelter.setup,()=>{H.camp.pitched=true;H.tarpClosed=false;H.camp.x=H.x;H.stats.camps++;toast('⛺ Lager steht.','good')});sfx('tent');break;
    case 'sleep':
      if(!H.camp.pitched&&g.shelter){toast('Baue zuerst dein Lager auf – oder schlafe ohne Schutz (Knopf „Draußen schlafen“).');return}
      startSleep();break;
    case 'sleepOut':startSleep();break;
    case 'wood':{
      if(H.moving||H.walking&&!H.camp.pitched){}
      const B_=BIOMES[env.biome];
      // Wald: schnell und reichlich. Kahle Regionen (Gebirge, Fjäll, Strand, Schnee): sehr zeitaufwendig und spärlich.
      const tMul=({wald:1,tal:1.25,wiese:1.7,berg:3.2,fjaell:3.4,kies:3.8,sand:4,schnee:5}[env.biome])||1.5;
      const yMul=({wald:1,tal:0.9,wiese:0.8,berg:0.4,fjaell:0.4,kies:0.3,sand:0.3,schnee:0.2}[env.biome])||0.7;
      let mins=25*tMul;
      if(env.precip)mins*=1.25;
      const D=H.dog&&!H.dog.away?H.dog:null;
      if(D)mins*=D.leash?0.85:0.55;
      mins=Math.round(mins);
      beginAction('wood','Sammelt Feuerholz …',mins,()=>{
        let n=Math.round(rnd(2,4)*(env.precip?0.7:1)*yMul+(D&&!D.leash?(yMul<0.5?0.4:1):0));
        if(n<1)n=(yMul<0.5&&Math.random()<0.5)?0:1;
        if(n<1){toast('🪵 Nur nasse, dürre Zweige – hier findest du kaum brauchbares Holz. Nimm beim nächsten Mal eigenes Brennholz mit.','warn');return}
        H.wood=Math.min(10,H.wood+n);H.woodX=H.x;
        toast('🪵 '+n+' Bündel Feuerholz gesammelt (insgesamt '+H.wood+').'+(yMul<0.5?' Hier ist Holz rar.':'')+(D&&!D.leash?' '+G.dog.name+' hat mitgeholfen.':''),'good')
      });break}
    case 'feed':
      if(!H.fire.lit||!nearFire()){toast('Es brennt kein Feuer in der Nähe.');return}
      if(woodAvail()<1){toast('Du hast kein Feuerholz – erst „Holz sammeln“.','bad');return}
      beginAction('feed','Legt Holz nach …',3,()=>{useWood();H.fire.left=Math.min(320,H.fire.left+55);toast('🔥 Das Feuer wird größer.','good');sfx('fire')});break;
    case 'fire':
      if(!g.tools.fire||H.fireUses<=0){toast('Kein Feuerstarter.');return}
      if(H.fire.lit&&nearFire()){toast('Das Feuer brennt bereits. Du kannst Holz nachlegen.');return}
      if(woodAvail()<1){toast('Für ein Feuer brauchst du zuerst Feuerholz – „Holz sammeln“.','bad');return}
      beginAction('fire','Macht Feuer …',20,()=>{
        const dryWood=H.wood<1&&H.carry>0; // mitgebrachtes Holz ist trocken
        H.fireUses--;useWood();
        let p=env.precip?(H.camp.pitched||env.biome==='wald'?0.6:0.3):0.92;
        if(env.precip&&fireCovered(H.x+70))p=Math.max(p,0.85);

        if(Math.random()<p){H.fire={lit:true,left:60,x:H.x+70};H.stats.fires++;toast('🔥 Ein kleines Feuer brennt. Mit mehr Holz wird es größer und hält länger.','good');sfx('fire')}else toast('Das Holz ist zu nass – Feuer fehlgeschlagen.','bad');
      });break;
    case 'ftarp':{
      if(H.fireTarp){beginAction('ftarp','Nimmt das Tarp vom Feuer …',4,()=>{H.fireTarp=null;toast('🏕️ Tarp abgebaut.')});break}

      const spot=H.fire.lit?H.fire.x:H.x+70;

      beginAction('cook','Bereitet '+f.name.replace(/ \((kochen|garen)\)/,'')+' zu …',f.fish?20:15,()=>{if(!nearFire())H.gas=Math.max(0,H.gas-1);eatFood(arg)});break}
    case 'leash':{const D=H.dog;if(!D||D.away)return;D.leash=!D.leash;toast(D.leash?'🦮 '+G.dog.name+' ist wieder an der Leine.':'🐕 '+G.dog.name+' läuft frei'+(D.trust<90?' – bei wenig Vertrauen kann er weglaufen.':'.'),D.leash||D.trust>=90?'':'warn');break}

    case 'drink':

      if(H.fork){checkNav(H.fork);return}
if(H.side){orientSide();return}
if(!H.lost.on){toast('Du bist auf dem richtigen Weg.');return}

case 'live':startLiveDialog();break;

      const f=H.route.feats.find(f=>f.type==='forage'&&!f.done&&Math.abs(f.x-H.x)<190*forageMul()&&FORAGE[f.f].months.includes(env.month));
      if(!f){toast('Hier gibt es gerade nichts zu sammeln.');return}

      showModal({title:'Tour abbrechen?',text:'Du lässt dich abholen. Das kostet etwa 40 € und deine bisherigen Aufnahmen bleiben erhalten.',buttons:[{label:'Abbrechen & abholen lassen',fn:()=>endHike('abort')},{label:'Weiterwandern'}]});break;
  }
}
function repairable(){ // Kandidaten für Notreparatur, schlechtester zuerst
  const ids=[];
  const g=H.g;
  [g.shoes,g.shelter,g.shell,g.bag,g.mid].forEach(x=>{if(x)ids.push(x.id)});
  if(g.tools.poles)ids.push('poles');
  return ids.sort((a,b)=>condOf(a)-condOf(b));
}
function reviveGear(id){ // repariertes Teil wieder einsatzbereit
  const def=gearById(id);if(!def)return;
  if(def.cat==='shoes')H.g.shoes=def;else if(def.cat==='shelter')H.g.shelter=def;else if(def.cat==='shell')H.g.shell=def;
  else if(def.cat==='bag')H.g.bag=def;else if(def.cat==='mid')H.g.mid=def;else if(id==='poles')H.g.tools.poles=true;
}
function breakGear(id){
  const def=gearById(id);if(!def)return;
  H.cond[id]=0;
  if(def.cat==='shoes')H.g.shoes=null;else if(def.cat==='shelter'){H.g.shelter=null;H.camp.pitched=false}else if(def.cat==='shell')H.g.shell=null;
  else if(id==='poles')H.g.tools.poles=false;
  toast('💥 '+def.name+' ist kaputt!'+(H.repairs>0?' Mit dem Reparaturset kannst du es flicken.':''),'bad');sfx('bad');
}
function wear(id,amt){
  if(H&&H.hk&&H.hk.km<=30)amt*=0.1;   // kleine Wanderungen: kaum Verschleiß
  if(!id||H.cond[id]===undefined||H.cond[id]<=0)return;
  H.cond[id]=Math.max(0,H.cond[id]-amt);
  if(H.cond[id]<=0)breakGear(id);
  else if(H.cond[id]<25&&!H['w_'+id]){H['w_'+id]=1;toast('⚠️ '+gearById(id).name+' ist stark abgenutzt ('+Math.round(H.cond[id])+' %).','warn')}
}

  showModal({title:'🎣 Angeln',text:'Angeln ist Glückssache und kostet Zeit. Wie lange willst du es versuchen? Bei einem Fang hörst du sofort auf. Fisch muss gegart werden (Kocher oder Feuer). Bei Kälte/im Winter beißt kaum etwas.',

/* =====================================================================
   Teil 3b: Schlaf, Körper, Geräte, Hund, Ereignisse, Livestream, Hauptschritt
   ===================================================================== */
function comfortTemp(sleeping){
  const g=H.g;
  let c=17-4-(g.mid?g.mid.ins*cf(g.mid.id):0)-(g.shell?g.shell.ins:0)-1.3*ES('kalt');
  if(sleeping)c-=(17-(g.bag?g.bag.rating:17))*0.6*(g.bag?(0.7+0.3*cf(g.bag.id)):1);
  return c;
}
const VEST_HEAT=[0,3,5,8],VEST_DRAIN=[0,100/24,100/16,100/10],VEST_NAME=['Aus','Schwach','Mittel','Stark'];
const vestOn=()=>!!H.dev.vest&&H.vestMode>0&&deviceOK('vest');
function effTemp(mode){
  if(H.indoor==='lodge')return 17+(H.lodge?H.lodge.tier*1.5:0);
  if(H.indoor==='shelter'){let E=env.temp+3-env.wind*0.5*0.35-H.body.wet/100*9;if(mode!=='walk'&&H.g.mat)E+=H.g.mat.warm;if(nearFire())E+=6;if(H.dog&&mode!=='walk')E+=1.5;if(vestOn())E+=VEST_HEAT[H.vestMode];return E}
  const g=H.g,sh=H.camp.pitched?g.shelter:null;
  let E=env.temp;
  const windP=Math.max(sh?sh.wind*cf(sh.id):0,g.shell?g.shell.wind:0);
  E-=env.wind*0.5*(1-windP);
  E-=H.body.wet/100*9;
  if(mode==='walk')E+=11;
  if(sh&&mode!=='walk')E+=sh.warm*cf(sh.id);
  if((mode==='sleep'||(sh&&mode!=='walk'))&&g.mat)E+=g.mat.warm;
  if(mode!=='walk'&&nearFire())E+=H.fire.left>110?10:6;
  if(H.dog&&mode!=='walk')E+=1.5;
  if(vestOn())E+=VEST_HEAT[H.vestMode];
  return E;
}
function sleepQuality(){
  const g=H.g,B=H.body,sh=H.camp.pitched?g.shelter:null;
  const deficit=comfortTemp(true)-effTemp('sleep');
  let q=1-0.12*Math.max(0,deficit);
  if(H.indoor==='lodge'){q=0.86+(H.lodge?H.lodge.tier*0.04:0)}
  else if(H.indoor==='shelter'){q-=0.04}
  else if(!sh){q-=0.15;if(env.precip)q-=0.2;if(env.wind>12)q-=0.1}
  if(!g.mat)q-=0.1;
  if(B.wet>40&&!H.indoor)q-=(B.wet-40)/100*0.5;
  if(isInjured())q-=0.05;
  if(B.sat<25||B.hyd<25)q-=0.1;
  if(env.sun>0.6&&!env.midnightSun&&!H.indoor)q*=0.8;
  if(H.dog)q+=0.04;
  if(H.stalker)q-=0.15;
  if(H.stim.crash>1&&H.t<H.stim.crashEnd)q-=0.04;
  return clamp(q,0.2,1);
}
function sleepNeedH(){
  const hour=env.hour,bed=hour<12?hour+24:hour;
  const late=0.5*Math.max(0,bed-22);
  const awakeH=(H.t-H.awakeSince)/60;
  const extra=0.15*Math.max(0,awakeH-16);
  return clamp(4+(100-H.body.energy)/100*4+late+extra+H.fatigue*0.06-(hasT('frueh')?1:0),3.5,11.5);
}
function startSleep(rest){
  if(H.sleep.active)return;
  const need=rest===true?1.5:sleepNeedH();
  H.sleep={active:true,need,q:sleepQuality(),startE:H.body.energy,p:0,elapsed:0,qsum:0,begun:H.t,rest:rest===true};
  H.walking=false;H.charging=H.charging;
  toast(rest===true?'🛌 Du ruhst dich im Schutz deines Lagers aus … (ca. 1,5 h)':'😴 Du schläfst ein … (Bedarf ca. '+fmtN(need)+' h bei Qualität '+Math.round(H.sleep.q*100)+' %)');
}
function stepSleep(h){
  const S=H.sleep;S.q=sleepQuality();S.elapsed+=h;S.qsum+=S.q*h;
  S.p+=h/(S.need*60)*S.q;
  if(H.indoor==='lodge')H.body.wet=Math.max(0,H.body.wet-h*0.25);
  H.fatigue=Math.max(0,H.fatigue-h/60*0.42*S.q*(S.rest?0.3:1));
  H.body.energy=lerp(S.startE,S.rest?lerp(S.startE,100-H.fatigue,0.4):100-H.fatigue,clamp(S.p,0,1));
  if(S.p>=1||S.elapsed>14*60)wakeUp();
}
function wakeUp(early){
  const S=H.sleep;const hrs=S.elapsed/60,avg=S.qsum/Math.max(1,S.elapsed);
  const wasIn=H.indoor;H.indoor=false;
  if(wasIn==='lodge'){const T=H.lodge?H.lodge.tier:1;H.body.wet=Math.min(H.body.wet,8);
    if(T>=2)for(const id in H.dev)if(!H.dev[id].broken)H.dev[id].batt=100;
    if(T>=3)H.body.sat=Math.min(100,H.body.sat+30);
    if(T>=2)toast('🔌 Über Nacht sind alle Geräte aufgeladen.'+(T>=3?' Frühstück inklusive (+30 Nahrung).':''),'good');
    H.lodge=null}
  H.sleep={active:false};H.awakeSince=H.t;H.stats.sleepH+=hrs;if(!S.rest)H.sleptTonight=true;
  if(wasIn==='shelter')toast('🛖 Du hast im Windschutz geschlafen ('+fmtN(hrs)+' h, Qualität Ø '+Math.round(avg*100)+' %).','good');else if(wasIn)toast('🏨 Du hast in der Herberge geschlafen ('+fmtN(hrs)+' h, Qualität Ø '+Math.round(avg*100)+' %). Ausgecheckt.','good');else toast(S.rest?'🛌 Ausgeruht nach '+fmtN(hrs)+' h. Lager abbauen nicht vergessen.':(early?'⏰ Schlaf abgebrochen nach ':'☀️ Aufgewacht nach ')+fmtN(hrs)+' h (Qualität Ø '+Math.round(avg*100)+' %).'+(early&&S.p<0.9?' Du bist noch müde.':'')+(H.autoNight?'':' Lager abbauen nicht vergessen.'),'good');sfx('notify');
  if(S.p<1)H.body.energy=Math.min(100-H.fatigue,lerp(S.startE,S.rest?lerp(S.startE,100-H.fatigue,0.4):100-H.fatigue,clamp(S.p,0,1)));
  if(H.autoNight&&!S.rest){H.autoWake=true}
}
function autoNightTick(){
  if(!H.autoNight||H.action||H.sleep.active||H.ended||MODAL||H.live)return;
  if(H.camp.pitched&&H.coldCamp&&H.body.warm>=92){H.coldCamp=false;act('tent');return}
  if(H.body.warm<48&&H.deficit>2.5&&!H.moving&&!H.camp.pitched&&H.g.shelter&&!H.fire.lit&&Math.abs(env.grade)<0.09&&H.t-(H.coldTent||-999)>240){H.coldTent=H.t;H.coldCamp=true;toast('🥶 Notfall: Du baust bei Kälte das Zelt auf, um dich aufzuwärmen.','warn');act('tent');return}
  const hr=env.hour;
  const need=((hr>=21||hr<5)&&!H.sleptTonight)||H.body.energy<6;
  if(need&&!H.lost.on&&!H.camp.pitched&&Math.abs(env.grade)<0.08){
    if(H.g.shelter)act('tent');else startSleep();
  }else if(need&&H.camp.pitched)startSleep();
  else if(H.camp.pitched&&H.autoWake&&!need){H.autoWake=false;act('tent')}
}
/* ---------- Koffein ---------- */
function stimDrain(){
  const S=H.stim;
  if(H.t<S.boostEnd)return S.mul;
  if(H.t>=S.crashStart&&H.t<S.crashEnd)return S.crash;
  return 1;
}

/* ---------- Körper ---------- */
function bodyTick(mode,hr){
  const B=H.body,g=H.g,hk=H.hk;
  const lf=loadKg()/capacityKg();const gr=env.grade;
  const sick=H.sick>H.t,blister=H.inj.blister>H.t,sprain=H.inj.sprain>H.t;
  if(mode==='walk'){
    let d=(7+40*Math.max(0,gr)+9*Math.max(0,-gr-0.08))*Math.max(0.45,1.45-0.09*ES('aus'))*(0.6+0.8*clamp(lf,0,1.4));
    if(g.tools.poles&&gr>0.03)d*=0.88;
    d*=1+0.35*env.snow*(g.tools.snowshoes?0.3:1);
    if(B.sat<20)d*=1.3;if(B.hyd<25)d*=1.4;if(B.warm<50)d*=1+(50-B.warm)/120;if(sick)d*=1.3;
    if(blister)d*=1.32;if(sprain)d*=1.18;
    if(H.shot&&H.shot.type!=='drone')d*=0.9;
    d*=lerp(1,hk.hard,0.5)*stimDrain();
    if(H.dog)d*=H.dog.mood>60?0.96:H.dog.mood<30?1.03:1;
    if(H.stalker)d*=1.08;
    B.energy-=d*(1+0.08*H.gap)*hr;
  }else if(mode==='rest'){
    let r=14;if(B.sat<10||B.hyd<10)r*=0.4;if(sick)r*=0.6;
    B.energy+=r*hr;
  }
  B.energy=clamp(B.energy,0,100-H.fatigue);
  if(mode==='walk')H.fatigue=Math.min(45+Math.min(30,8*H.gap),H.fatigue+hr*(0.26*hk.hard*(B.sat<30?1.4:1)+0.10*H.gap));
  else if(mode==='rest')H.fatigue=Math.max(0,H.fatigue-hr*0.05);
  const fm=1.35-0.1*ES('food'),wm=1.35-0.1*ES('water');
  const heat=env.temp>24?1+(env.temp-24)*0.04:1;
  B.sat-=({walk:6.5,rest:2.8,sleep:1.6}[mode])*Math.max(0.5,fm)*hr;
  B.hyd-=({walk:8,rest:3,sleep:1.2}[mode])*Math.max(0.5,wm)*heat*(sick?1.6:1)*hr;
  B.sat=clamp(B.sat,0,100);B.hyd=clamp(B.hyd,0,100);
  // Nässe
  const sh=H.camp.pitched?g.shelter:null;
  let gain=0;
  if(env.precip){
    const protect=sh?sh.rain*cf(sh.id):(g.shell?g.shell.rain*cf(g.shell.id):0);
    gain=22*env.rainI*(1-protect)*BIOMES[env.biome].rain*(1-(g.shoes?g.shoes.wetRes*0.2:0));
    if(mode!=='sleep'&&g.shell&&!sh)wear(g.shell.id,0.45*hr);
  }
  let dry=2.5+(env.sun>0.8&&(H.weather.type==='klar'||H.weather.type==='wolkig')?6:0)+(mode==='walk'?3:0)+(mode!=='walk'&&nearFire()?22:0)+(sh?(mode==='sleep'?4.5:2):0);
  if(gain>0)dry*=0.3;
  B.wet=clamp(B.wet+(gain-dry)*hr,0,100);
  // Wärme
  const inBag=mode==='sleep'||(mode==='rest'&&sh&&g.bag);
  const E=effTemp(mode),c=comfortTemp(inBag);
  H.deficit=c-E;
  if(H.deficit>0){B.warm-=H.deficit*2*hr;xpAdd('kalt',0.05*hr*60)}else B.warm+=15*hr;
  B.warm=clamp(B.warm,0,100);
  if(E>c+18)B.hyd=clamp(B.hyd-2*hr,0,100);
  if(B.warm<45&&H.t-H.coldCd>150&&!H.sleep.active){H.coldCd=H.t;toast('🥶 Dir wird kalt (Wärme '+Math.round(B.warm)+' %). Wärmere Kleidung, Feuer, Zelt oder Bewegung helfen.','warn');sfx('warn')}
  // Verletzungen
  if(mode==='walk'){
    const shoeF=g.shoes?g.shoes.blister*(1+(1-cf(g.shoes.id))*1.2):1.8;
    if(!blister&&Math.random()<0.02*shoeF*(1+B.wet/50)*(0.85+0.15*hk.hard)*hr){H.inj.blister=H.t+(hasT('zaeh')?900:1440);toast('🩹 Du hast dir eine Blase gelaufen – das kostet spürbar Energie und Tempo.','bad');sfx('bad')}
    const ls=lightSource();
    const risky=(gr<-0.12?1:0)+(env.dark>0.6?(ls==='lamp'?0.2:ls==='phone'?0.9:1.8):0)+(B.wet>60?0.5:0)+(env.precip?0.3:0)+env.snow*0.4;
    if(!sprain&&Math.random()<0.018*risky*(1+0.12*H.gap)*(g.tools.poles?0.5:1)*hk.hard*hr){H.inj.sprain=H.t+1440;toast('🦶 Du bist umgeknickt – langsameres Gehen.','bad');if(g.tools.poles&&Math.random()<0.2)wear('poles',60)}
  }
  let dhp=0;
  if(B.sat<=0)dhp-=3;if(B.hyd<=0)dhp-=6;if(B.warm<15)dhp-=4;if(B.warm<=0)dhp-=6;if(sick)dhp-=0.8;
  if(dhp===0&&B.sat>40&&B.hyd>40&&B.warm>50)dhp+=(mode==='sleep'?5:mode==='rest'?2.5:1)*(hasT('zaeh')?1.5:1);
  B.hp=clamp(B.hp+dhp*hr,0,100);
  if(B.hp<=0&&!H.ended)endHike('rescue');
}
/* ---------- Geräte, Akkus, Powerbank ---------- */
function pbTotal(){return H.pbs.reduce((a,p)=>a+p.left,0)}
function pbCapTotal(){return H.pbs.reduce((a,p)=>a+p.cap,0)}
function pbDraw(units){let need=units;for(const p of H.pbs){const t=Math.min(p.left,need);p.left-=t;need-=t;if(need<=0)break}return units-need}
function solarEff(){const SU=H.solarUp;if(!SU)return 0;let d=Math.abs(((env.hour-SU.aim+12)%24+24)%24-12);return clamp(1-d/3,0,1)}
function pbFill(units){let rest=units;for(const p of H.pbs){const t=Math.min(p.cap-p.left,rest);p.left+=t;rest-=t;if(rest<=0)break}}
function deviceTick(hr,mode){
  const walking=mode==='walk',live=H.live&&H.action&&H.action.kind==='live';
  const np=navPhone();
  for(const id in H.dev){
    const d=H.dev[id],def=d.def;if(d.broken)continue;
    let drain=0;
    // Geräte, die nicht genutzt werden, sind aus bzw. im Flugmodus: kein Verbrauch
    if(def.kind==='phone'||def.kind==='cam'){
      if(H.activeDev===id&&H.rec>0&&(walking||H.shot))drain+=def.rate*H.rec;
      if(live&&H.activeDev===id)drain+=def.rate*2.5;
      if(walking&&np&&np.id===id)drain+=0.9;
      if(walking&&env.dark>0.55&&!deviceOK('lamp')&&lightSource()==='phone'&&H.g.phones.find(p=>deviceOK(p.id)).id===id)drain+=13;
    }else if(id==='gps'){if(walking)drain=0.8}
    else if(id==='lamp'){if(walking&&env.dark>0.55)drain=5.5}
    else if(id==='vest'){drain=VEST_DRAIN[H.vestMode]||0}
    d.batt=Math.max(0,d.batt-drain*hr);
    if(d.batt<=0&&!d.warned){d.warned=true;toast('🪫 Akku leer: '+def.name,'bad');sfx('bad')}
    if(d.batt>10)d.warned=false;
    if(drain>0){const p=0.5*(def.fragile||0.0004)*(env.precip?3:1)*(hasWaterProof(id)?1:1)*hr;
      if(Math.random()<p){d.broken=true;H.cond[id]=0;toast('💥 '+def.name+' ist kaputtgegangen!','bad');sfx('bad')}}
  }
  // Solar → Powerbank (Mini-Panel nur beim Gehen, großes Panel nur aufgestellt und zur Sonne ausgerichtet)
  if(H.pbs.length&&pbTotal()<pbCapTotal()&&env.sun>0.35&&(H.weather.type==='klar'||H.weather.type==='wolkig')){
    const klar=H.weather.type==='klar',sf=Math.min(1,env.sun+0.25);
    if(H.g.solar&&walking)pbFill((klar?6:2)*sf*hr);
    const SU=H.solarUp;
    if(H.g.solarBig&&SU){const eff=solarEff();pbFill((klar?45:16)*eff*sf*hr)}
  }
  // Laden (Auswahl des Spielers)
  if(H.charging){
    const d=H.dev[H.charging];
    if(!d||d.broken||d.batt>=99.9){if(d&&!d.broken)toast('🔋 '+d.def.name+' ist voll geladen.','good');H.charging=null}
    else if(pbTotal()<=0.5){toast('🪫 Powerbank leer – Ladevorgang beendet.','warn');H.charging=null}
    else{const add=Math.min(100-d.batt,1.6*60*hr);const got=pbDraw(add/0.9)*0.9;d.batt=Math.min(100,d.batt+got)}
  }
}
const hasWaterProof=()=>false;
/* ---------- Hund ---------- */
function dogTick(mode,hr,dkm){
  const D=H.dog;if(!D)return;const def=D.def;
  if(D.away)return;
  D.trust=Math.min(100,(D.trust||0)+(D.leash?0.5:0.3)*hr);
  if(mode==='walk'&&!D.leash&&!H.action&&D.trust<90&&Math.random()<(0.03+0.45*(90-D.trust)/90)*hr){
    D.away=true;const mins=Math.round(20+(90-D.trust)*1.1+rnd(0,30));
    toast('🐕 '+G.dog.name+' ist abgehauen! Du musst ihn suchen …','bad');sfx('bad');
    beginAction('search','Sucht '+G.dog.name+' …',mins,()=>{D.away=false;D.leash=true;D.mood=Math.max(0,D.mood-10);D.trust=Math.max(0,D.trust-2);toast('🐕 '+G.dog.name+' ist wieder da – du legst ihm die Leine an.','good');sfx('success')},{resume:true});
    return;
  }
  D.hunger=clamp(D.hunger-(mode==='walk'?6.4:3.2)*hr,0,100);
  D.thirst=clamp(D.thirst-(mode==='walk'?7:3)*hr,0,100);
  if(mode==='walk')D.fat=Math.min(100,D.fat+dkm*100/(def.stam*1.8)*(D.leash?1.4:1));
  else D.fat=Math.max(0,D.fat-(mode==='sleep'?9:4)*hr);
  const ration=def.food*0.5;
  if(D.hunger<45){
    if(H.dogfood>=ration){H.dogfood-=ration;D.hunger=Math.min(100,D.hunger+50);toast('🐕 '+G.dog.name+' frisst sein Futter.');sfx('eat')}
    else if(D.hunger<18){const id=Object.keys(H.food).filter(i=>H.food[i]>0&&!FOODS.find(f=>f.id===i).cook)[0];
      if(id){H.food[id]--;D.hunger=Math.min(100,D.hunger+16);toast('🐕 Kein Hundefutter mehr – du teilst '+gearById(id).name+' mit '+G.dog.name+'.','warn')}}
  }
  if(D.thirst<50){
    const w=nearWater();
    if(w){D.thirst=100;if(!D.drankMsg||H.t-D.drankMsg>240){D.drankMsg=H.t;toast('🐕 '+G.dog.name+' trinkt am Wasser.')}}
    else if(H.water.clean>=def.water*0.25){H.water.clean-=def.water*0.25;D.thirst=Math.min(100,D.thirst+45)}
  }
  let m=0;
  if(D.hunger<25)m-=6;if(D.thirst<25)m-=8;if(D.fat>85)m-=5;if(D.paw>H.t)m-=3;
  if(m===0){m=mode==='walk'?0.6:1.6;if(env.precip)m-=0.6}
  D.mood=clamp(D.mood+m*hr*(m<0?1:1),0,100);
  if(D.fat>85&&H.t-(D.fatMsg||-999)>240){D.fatMsg=H.t;toast('🐕 '+G.dog.name+' ist erschöpft – eine Pause würde ihm guttun.','warn')}
  if(mode==='walk'&&D.paw<=H.t&&Math.random()<0.005*hr*(1+env.snow)){D.paw=H.t+240;toast('🐕 '+G.dog.name+' humpelt – vermutlich eine wunde Pfote. Etwas Rast hilft.','warn')}
}

function checkFeatures(a,b){
  for(const f of featsIn(a,b)){
    if(f.type==='quelle'||(f.type==='fluss'&&f.bridge)){
      toast(f.type==='quelle'?(env.frozen?'❄️ Eine zugefrorene Quelle – du kannst Schnee sammeln.':'💧 Quelle – hier kannst du Wasser auffüllen.'):'🌉 Du überquerst einen Fluss über eine Brücke (Wasser entnehmbar, unbehandelt).');
      if(H.autoStop&&(waterTotal()<H.g.waterCap*0.75)){H.walking=false;H.stopReason='water';toast('⏸ Gestoppt an der Wasserstelle – „Wasser auffüllen“ und es geht automatisch weiter.')}
    }else if(f.type==='fluss')riverFord(f);
    else if(f.type==='junction'){}
  }
  for(const f of featsIn(a-200,b+200)){if(f.type==='see'&&!f.done&&f.lake.xl-90>=a&&f.lake.xl-90<b){f.done=true;lakeDialog(f.lake)}}
  for(const f of featsIn(a+175,b+175)){
    if(f.type==='village'&&!f.left){
      f.left=true;H.stats.villages++;
      if(H.autoStop||true){H.walking=false;toast('🏘️ Du erreichst '+f.name+'. Tippe auf 🏪 oder wähle „Laden betreten“, um einzukaufen und Geräte zu laden.','good');sfx('notify')}
    }
  }
}

function lodgeFull(f,tier,dayIdx,walkin){
  let h=5381;for(const ch of H.hk.id+':'+f.id+':'+tier+':'+dayIdx)h=((h*33)^ch.charCodeAt(0))>>>0;
  const r=mulberry32(h)();

  const base=f.type==='village'?0.10:f.kind==='stuga'?0.22:f.kind==='huette'?0.28:f.kind==='bothy'?0.32:0.28;
  const pop=H.hk.diff>=4?1.15:1;
  const p=clamp(base*seas*pop+(tier===1?0.07:0)+(walkin?0.12:0),0.03,0.85);
  return r<p;
}

  const B=H.body;
  const emerg=B.hyd<25||B.sat<20||B.warm<40||B.hp<45||(B.hyd<45&&B.warm<55);
  const size=clamp(0.2+G.subs/3000,0.2,1);
  return emerg?Math.sqrt(size)*0.6:size*0.08;
}
function liveMsg(t,cls){const L=H.live;if(!L)return;L.chat.push({t,cls:cls||''});if(L.chat.length>40)L.chat.shift()}
function liveBase(){
  const hour=env.hour;
  const hourF=(hour>=18&&hour<=23)?1.45:(hour>=8&&hour<18)?0.9:0.45;
  const heat=clamp(G.begHeat*0.06,0,0.6);
  return (G.subs*0.017+1.2)*hourF*(1-heat)*(0.7+0.3*BIOMES[env.biome].scenic)*(env.light>0.3?1:0.85);
}
function liveTick(h){
  const L=H.live;if(!L)return;
  const tgt=liveBase()*(L.mood/70)*(L.begMul||1);
  L.viewers+=(tgt-L.viewers)*clamp(h*0.12,0,1)+rnd(-0.3,0.3)*Math.sqrt(tgt+1)*h*0.1;
  L.viewers=Math.max(0,L.viewers);L.peak=Math.max(L.peak,L.viewers);L.sumV+=L.viewers*h;L.n+=h;
  L.mood+=(60-L.mood)*h*0.004;L.mood=clamp(L.mood,0,100);
  if(Math.random()<0.0025*L.viewers*(L.mood/70)*h*Math.min(1,donF()*3)){const a=+(rnd(1,4)*Math.max(0.15,donF()*2)).toFixed(2);L.donations+=a;G.money+=a;G.liveEarned+=a;liveMsg('💶 Kleine Spende: '+eur(a),'don');sfx('coin')}
  L.msgCd-=h;
  if(L.msgCd<=0){L.msgCd=rnd(2.5,5);if(L.viewers>=0.6)liveMsg((L.viewers<3?pick(CHAT_SMALL):pick(CHAT_GOOD)))}
}
function liveTalk(){
  const L=H.live;if(!L)return;
  if(H.t-L.lastTalk<3){toast('Kurz durchatmen – gleich wieder.');return}
  L.lastTalk=H.t;L.mood=Math.min(100,L.mood+9);L.begMul=Math.min(1.15,(L.begMul||1)+0.03);
  liveMsg('🗣️ Du plauderst über die Tour.','sys');sfx('notify');
}
function liveCall(){
  const L=H.live;if(!L)return;
  if(H.t-L.lastCall<6){toast('Warte einen Moment, bevor du erneut aufrufst.');return}
  const since=H.t-L.lastCall;L.lastCall=H.t;L.begs++;
  G.begHeat=Math.min(20,G.begHeat+1.2);
  let amt=L.viewers*rnd(0.05,0.13)*rnd(1.6,5.5)*(L.mood/65)*donF();
  if(L.begs>1){
    amt*=Math.pow(0.45,L.begs-1);L.mood=Math.max(0,L.mood-18);L.begMul=(L.begMul||1)*0.84;
    const loss=Math.max(0,Math.round(L.viewers*0.08*(L.begs-1)+(since<20?1:0)));
    G.subs=Math.max(0,G.subs-loss);L.subsLoss+=loss;
    liveMsg(pick(CHAT_BEG),'bad');toast('😒 Die Zuschauer sind genervt: '+(loss?'−'+loss+' Abonnenten. ':'')+'Stimmung sinkt.','bad');sfx('bad');
  }else{liveMsg('🙏 Du bittest um Unterstützung für deinen Kanal.','sys');sfx('notify')}
  amt=+amt.toFixed(2);L.donations+=amt;G.money+=amt;G.liveEarned+=amt;H.stats.donations+=amt;
  if(amt>0.05)liveMsg('💶 Spenden eingegangen: '+eur(amt),'don');
}
function liveEnd(){
  const L=H.live;if(!L)return;
  const avg=L.n>0?L.sumV/L.n:0;
  const heat=clamp(G.begHeat*0.05,0,0.5);
  let gain=Math.round(L.peak*0.14*(L.mood/65)*(1-heat)*(hasT('charme')?1.25:1));
  if(L.begs>=3)gain=0;
  G.subs+=gain;L.subsGain=gain;
  const dev=handheld();
  if(dev&&L.n>=10)addClip({key:'live',type:'live',name:'Livestream',e:'📡',q:1,value:4+L.peak*0.1,rar:-1});
  G.lives.push({day:G.day,avg,peak:L.peak,don:L.donations,gain,loss:L.subsLoss,begs:L.begs});if(G.lives.length>40)G.lives.shift();
  const live=L;H.live=null;
  showModal({title:'📡 Livestream beendet',html:`<p>Ø Zuschauer: <b>${fmtN(avg)}</b> · Spitze: <b>${Math.round(live.peak)}</b><br>Spenden: <b>${eur(live.donations)}</b><br>Abonnenten: <b class="goodtxt">+${live.subsGain}</b>${live.subsLoss?' · <b class="badtxt">−'+live.subsLoss+' (genervt)</b>':''}</p><p class="hint">${live.begs>1?'Zu viele Spendenaufrufe haben Zuschauer vergrault. Dein Kanal-Ruf ist für ein paar Tage schlechter, Zuschauerzahlen und Reichweite leiden.':live.peak<5?'Dein Kanal ist noch klein – mit mehr Videos kommen auch mehr Zuschauer.':'Gut gemacht! Ein Aufruf pro Stream ist fair.'}</p>`,buttons:[{label:'OK'}]});
  sfx('success');
}
/* ---------- Hauptschritt ---------- */
function walkSpeedKmh(){
  const g=H.g,B=H.body;let v=2.5+0.32*ES('tempo');
  const gr=env.grade;let m;
  if(gr>=0)m=1-2.3*gr;else m=gr>-0.1?1-gr:1.1-2.2*(-gr-0.1);
  m=clamp(m,0.3,1.15);
  m*=Math.max(0.65,1-0.03*H.gap);   // zu wenig Fähigkeiten für die Route
  const lf=loadKg()/capacityKg();
  m*=1-clamp(lf-0.45,0,1.2)*0.5*(1-0.5*(g.pack?g.pack.comfort:0));
  m*=clamp(1.1-0.012*loadKg(),0.78,1.1); // leichter Rucksack = schneller
  {const bs=BIOMES[env.biome].spd;if(bs){m*=(BIOMES[env.biome].snowfield&&g.tools.snowshoes)?Math.min(1,bs+0.2):bs}}
  m*=[1.07,1.035,1,0.95][H.rec]||1; // wenige Clips = zügiger unterwegs
  if(g.tools.poles&&gr>0.03)m*=1.05;
  m*=g.shoes?g.shoes.spd*(0.9+0.1*cf(g.shoes.id)):0.85;
  if(H.inj.blister>H.t)m*=0.86;if(H.inj.sprain>H.t)m*=0.75;if(H.sick>H.t)m*=0.9;
  if(env.dark>0.3){
    const ls=lightSource(),f=ls==='lamp'?0.96:ls==='phone'?0.6:0.3;
    m*=lerp(1,f,clamp((env.dark-0.3)/0.4,0,1));
  }
  if(B.energy<15)m*=0.6;if(B.warm<35)m*=0.9;
  if(env.precip)m*=env.precip==='snow'?0.85:0.93;
  m*=1-0.3*env.snow*(g.tools.snowshoes?0.35:1);
  if(env.wind>12)m*=0.85;
  if(H.stim.crash>1&&H.t>=H.stim.crashStart&&H.t<H.stim.crashEnd)m*=0.95;
  if(H.dog){if(H.dog.fat>92)m*=0.85;else if(H.dog.fat>75)m*=0.94;if(H.dog.paw>H.t)m*=0.92}
  if(H.shot)m*=H.shot.type==='drone'?0:0.25;
  return v*m;
}
function stepSim(h){
  const hr=h/60,B=H.body;
  H.t+=h;
  const dIdx=Math.floor(H.t/1440);
  if(dIdx>H.dayIdx){
    H.dayIdx=dIdx;G.day++;
    const r=advanceDay();H.passive+=r.income||0;
    if(r.paid>0)toast('💶 Auszahlung vom Kanal: +'+eur(r.paid),'good');
    (r.notes||[]).forEach(n=>toast(n,'good'));
    G.begHeat=Math.max(0,G.begHeat-0.25);
    if(H.stalker&&H.t>H.stalker.until){H.stalker=null;toast('Der Fremde ist nicht mehr zu sehen.')}
  }
  const hh=(H.t/60)%24;if(hh>=12&&hh<12.2)H.sleptTonight=false;
  updateWeather();computeEnv();
  if(H.fire.lit){
    const big=H.fire.left>110,shel=H.camp.pitched&&Math.abs(H.x-H.camp.x)<200;
    let rate=1,extra=0;
    if(big)extra=(env.wind>10?0.4:0)+(env.precip&&!shel?0.9*env.rainI:0);
    else extra=(env.wind>6?0.9:0)+(env.precip?(shel?0.6:0.7+1.3*env.rainI):0);
    rate+=extra*(fireCovered(H.fire.x)?0.2:1); // Tarp hält Regen und Wind vom Feuer ab
    H.fire.left-=h*rate;
    if(H.fire.left<=0){H.fire.lit=false;toast(big?'Das Feuer ist erloschen.':'Das kleine Feuer ist '+(env.precip||env.wind>6?'im '+(env.precip?'Regen':'Wind')+' ':'')+'ausgegangen – mit mehr Holz hält es länger.','warn')}
  }
  if(H.fireTarp&&Math.abs(H.x-H.fireTarp.x)>250&&!H.action){H.fireTarp=null;toast('🏕️ Du packst das Tarp von der Feuerstelle ein.')}
  if(H.solarUp&&Math.abs(H.x-H.solarUp.x)>250&&!H.action){H.solarUp=null;toast('☀️ Das Solarpanel wird beim Weitergehen eingepackt.')}
  if(H.wood>0&&Math.abs(H.x-H.woodX)>180&&!H.action){H.wood=0;toast('🪵 Das Feuerholz bleibt zurück – du kannst es nicht mitnehmen.')}
  if(H.fork&&H.walking)H.walking=false;
let mode='rest',dkm=0;
  if(H.sleep.active){mode='sleep';stepSleep(h)}
  else if(H.action){stepAction(h)}
  else{
    autoConsume();
    if(H.shot){H.shot.left-=h;if(H.shot.left<=0)finishShot()}
    if(H.walking&&B.energy<=0){H.walking=false;H.autoResumeE=true;toast('Erschöpft! Du rastest, bis du wieder fit bist – dann geht es automatisch weiter.','bad')}
    else if(H.walking&&!H.camp.pitched&&!H.action&&!H.fork){
      const v=walkSpeedKmh();
      if(v>0.01){
        mode='walk';dkm=v*hr;const dpx=dkm*PPK,prev=H.x;
        H.phase+=dpx*0.06;H.stats.walkMin+=h;
        {const ROUGH={wald:1,wiese:0.8,tal:0.9,berg:1.5,fjaell:1.2,sand:1.3,kies:1.6,schnee:1.4}[env.biome]||1;
         const wx=1+(env.precip?0.5:0)+(env.precip==='snow'||env.snow>0.4?0.4:0)+(env.wind>12?0.3:0)+Math.max(0,B.wet-40)/150;
         if(H.g.shoes)wear(H.g.shoes.id,dkm*0.11*ROUGH*wx*(1+B.wet/120)*(H.g.tools.gaiters?0.8:1));
         if(H.g.pack)wear(H.g.pack.id,dkm*0.035*ROUGH*wx*(H.g.pack.tough||1));
         // Kleidung ohne Schutzschicht nutzt sich bei Nässe, Wind und rauem Gelände stärker ab
         if(H.g.mid&&(env.precip||env.wind>10)&&!H.g.shell)wear(H.g.mid.id,dkm*0.09*ROUGH*wx);
         else if(H.g.mid)wear(H.g.mid.id,dkm*0.012*ROUGH);
         if(H.g.shell&&(env.precip||env.wind>10))wear(H.g.shell.id,dkm*0.05*ROUGH*wx);}
        xpAdd('aus',dkm*(1+5*Math.max(0,env.grade)));xpAdd('nav',dkm*0.3*(1+0.3*famBonus(H.hk)));
        const lf=loadKg()/capacityKg();if(lf>0.7)xpAdd('trag',dkm);else if(lf>0.5)xpAdd('trag',dkm*0.4);
        if(env.grade<0.03)xpAdd('tempo',dkm*0.6);
        if(B.sat<35||B.hyd<35){xpAdd('food',dkm*0.3);xpAdd('water',dkm*0.3)}
        if(H.lost.on){H.lost.km-=dkm;H.wasted+=dkm;if(H.lost.km<=0){H.lost.on=false;toast('🧭 Du hast wieder auf den Weg gefunden.','good')}}
        else{
          walkStep(dpx);
          if(H.x>=H.route.totalPx&&!H.ended)endHike('goal');
        }
      }
      rollShots(hr);
    }
    if(!H.action&&!H.sleep.active)autoNightTick();
  }
  H.moving=mode==='walk';
  if(H.camp.pitched&&H.g.shelter)windTent(hr);
  if(H.camp.pitched&&H.g.shelter){wear(H.g.shelter.id,0.05*hr*(1+env.wind/8+(env.precip?1:0)+(env.precip==='snow'?1.2:0))+(env.wind>13&&Math.random()<0.01*hr?12:0))}
  trackFeatures();trackSky(hr);updateWalkers(h);snowTick(hr);spoilTick();
  deviceTick(hr,mode);dogTick(mode,hr,dkm);
  bodyTick(mode,hr);
  {const F=H.flags,Bd=H.body;
   if((H.weather.type==='gewitter'||H.weather.type==='sturm')&&!H.sleep.active&&H.moving){H.stormT=(H.stormT||0)+hr;if(H.stormT<12)H.thrill+=0.35*hr}
   if(Bd.hp<25&&!F.hp){F.hp=1;H.thrill+=2}if(Bd.warm<25&&!F.cold){F.cold=1;H.thrill+=1.5}
   if(Bd.hyd<8&&!F.dehy){F.dehy=1;H.thrill+=1}if(Bd.sat<8&&!F.hunger)F.hunger=1;
   if(H.stats.junctionsLost>=2)F.lost=1;}
  if(H.autoResumeE&&mode==='rest'&&B.energy>=70&&!H.camp.pitched&&!H.action&&!H.sleep.active&&!H.walking&&!MODAL){H.autoResumeE=false;H.walking=true;toast('💪 Wieder fit – es geht weiter.','good')}
}
function autoConsume(){
  if(!H.auto||H.action||H.sleep.active)return;
  const B=H.body;
  if(B.hyd<45&&H.water.clean>0.05){beginAction('drink','Trinkt …',2,()=>drinkWater(false),{resume:true});return}
  if(B.hyd<12&&H.water.dirty>0.05){beginAction('drink','Trinkt (unbehandelt) …',2,()=>drinkWater(true),{resume:true});return}
  if(B.sat<40){
    const f=FOODS.filter(f=>!f.cook&&!f.stim&&(H.food[f.id]||0)>0).sort((a,b)=>b.sat-a.sat)[0];
    if(f)beginAction('eat','Isst …',4,()=>eatFood(f.id),{resume:true});
  }
}
function endHike(reason){
  if(H.ended)return;
  H.ended=true;H.live=null;
  const hk=H.hk;
  if(reason!=='goal'){
    const cost=reason==='bus'?(H.busCost||15):reason==='abort'?40:80;
    H.rescueCost=Math.min(cost,G.money);G.money-=H.rescueCost;
    if(reason==='rescue'){
      const d=handheld();
      if(d){const q=shotQ(d.def,1.2);H.thrill+=3;H.clips.push({key:'rescue',type:'drama',name:'Dramatische Rettung',e:'🚁',q,value:40*q,rar:-1,day:G.day,biome:env.biome,t:H.t})}
    }
  }
  H.reason=reason;
  const frac=H.km/H.route.totalKm;
  G.km+=H.km;
  if(frac>=0.3){G.routeN=G.routeN||{};G.regN=G.regN||{};G.routeN[hk.id]=(G.routeN[hk.id]||0)+1;G.regN[hk.reg]=(G.regN[hk.reg]||0)+1;xpAdd('nav',H.km*0.1)}
  // Zustand der Ausrüstung dauerhaft speichern – nach kleinen Wanderungen entsteht kein Schaden
  if(hk.km>30){
    for(const id in H.cond)G.cond[id]=Math.round(H.cond[id]*10)/10;
    for(const id in H.dev){
      if(H.dev[id].broken)G.cond[id]=0;
      else if(H.dev[id].def.cat==='rec'||id==='gps'||id==='lamp')G.cond[id]=Math.max(1,Math.round(((G.cond[id]===undefined?100:G.cond[id])-rnd(1,4))*10)/10);
    }
  }
  H.damaged=Object.keys(G.cond).filter(id=>G.owned[id]&&G.cond[id]<60).map(id=>gearById(id).name);
  if(G.dog){G.dog.bond=Math.min(100,(H.dog?H.dog.trust:(G.dog.bond||0))+Math.round(H.km/30))}
  const days=Math.floor(H.t/1440)+1;
  G.pending={teaser:Math.min(0.06,H.teaserBoost||0),hikeId:hk.id,name:hk.name,mult:hk.mult,diff:hk.diff,km:H.km,total:H.route.totalKm,days,reason,day:G.day,
    thrill:H.thrill,risk:H.startRisk,flags:H.flags,lostN:H.stats.junctionsLost,hadDog:!!H.dog,
    clips:H.clips.map(c=>({key:c.key,type:c.type,name:c.name,e:c.e,q:c.q,value:c.value,rar:c.rar,biome:c.biome,day:c.day,t:c.t||0}))};
  H.pendingSummary={clips:H.clips.length};
  save();
  onHikeEnd(reason);
}

/* =====================================================================
   Teil 4: Sound (WebAudio, alles synthetisch – keine Dateien nötig)
   ===================================================================== */
const AU={ctx:null,master:null,noise:null,loops:{},ok:false,birdT:2,popT:0,lastStep:0,unlocked:false};
function auInit(){
  if(AU.ctx)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.connect(AU.ctx.destination);
    const n=AU.ctx.sampleRate*2,b=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate),d=b.getChannelData(0);
    let last=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=w*0.5+last*3}
    AU.noise=b;AU.ok=true;
    const loop=(type,f,q,extra)=>{
      const s=AU.ctx.createBufferSource();s.buffer=b;s.loop=true;
      const fl=AU.ctx.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;
      let node=fl;const g=AU.ctx.createGain();g.gain.value=0;
      s.connect(fl);if(extra){const f2=AU.ctx.createBiquadFilter();f2.type=extra.type;f2.frequency.value=extra.f;fl.connect(f2);node=f2}
      node.connect(g);g.connect(AU.master);s.start();return {g,fl};
    };
    AU.loops.wind=loop('bandpass',420,0.7);
    AU.loops.rain=loop('highpass',1400,0.5,{type:'lowpass',f:7500});
    AU.loops.fire=loop('lowpass',330,0.8);
    auVol();
  }catch(e){AU.ok=false}
}
function auVol(){if(AU.master)AU.master.gain.value=G&&G.mute?0:(G?G.vol:0.7)*0.85}
function auUnlock(){
  if(!AU.ctx)auInit();
  if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();
}
['pointerdown','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,auUnlock,{passive:true}));
function tone(freq,dur,type='sine',vol=0.25,delay=0,slide=0){
  if(!AU.ok||(G&&G.mute))return;
  const t=AU.ctx.currentTime+delay,o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+dur+0.05);
}
function burst(dur,ftype,freq,vol=0.3,delay=0,q=1,sweep=0){
  if(!AU.ok||(G&&G.mute))return;
  const t=AU.ctx.currentTime+delay,s=AU.ctx.createBufferSource();s.buffer=AU.noise;
  const f=AU.ctx.createBiquadFilter();f.type=ftype;f.frequency.setValueAtTime(freq,t);f.Q.value=q;
  if(sweep)f.frequency.exponentialRampToValueAtTime(Math.max(30,freq+sweep),t+dur);
  const g=AU.ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(0.02,dur/3));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(AU.master);s.start(t,Math.random()*1.5);s.stop(t+dur+0.05);
}
function sfx(name,arg){
  if(!AU.ok)return;
  switch(name){
    case 'click':tone(820,0.05,'sine',0.12);break;
    case 'shutter':burst(0.03,'highpass',3000,0.3);burst(0.05,'bandpass',1800,0.25,0.07,2);break;
    case 'drink':for(let i=0;i<3;i++)tone(260+i*70,0.09,'sine',0.14,i*0.11,160);break;
    case 'eat':for(let i=0;i<3;i++)burst(0.05,'bandpass',2200,0.22,i*0.09,2);break;
    case 'success':[523,659,784,1047].forEach((f,i)=>tone(f,0.22,'triangle',0.2,i*0.09));break;
    case 'notify':tone(880,0.14,'sine',0.14);tone(1175,0.16,'sine',0.1,0.08);break;
    case 'discover':tone(660,0.25,'sine',0.16);tone(990,0.4,'sine',0.14,0.12);break;
    case 'warn':tone(440,0.14,'square',0.08);tone(330,0.2,'square',0.08,0.16);break;
    case 'bad':tone(300,0.3,'sawtooth',0.1,0,-150);break;
    case 'coin':tone(1250,0.06,'square',0.07);tone(1680,0.18,'square',0.07,0.06);break;
    case 'tent':burst(0.35,'bandpass',2800,0.18,0,0.8);break;
    case 'fire':burst(0.5,'lowpass',300,0.35,0,0.7,1200);break;
    case 'thunder':{const d=arg||0;burst(2.6,'lowpass',260,0.7,d,0.8,-200);burst(1.2,'lowpass',120,0.6,d+0.3,0.8);break}
  }
}
function stepSound(){
  const soft=env.snow>0.5?0.5:1;
  if(env.biome==='berg')burst(0.05,'bandpass',1500,0.12*soft,0,2);
  else if(env.biome==='fjaell')burst(0.07,'lowpass',900,0.14*soft);
  else burst(0.07,'lowpass',700+Math.random()*250,0.16*soft);
}
function chirp(){
  const base=1900+Math.random()*1800,n=2+Math.floor(Math.random()*4);
  for(let i=0;i<n;i++)tone(base*(1+Math.random()*0.25),0.07,'sine',0.055,i*0.11,base*0.25*(Math.random()>0.5?1:-1));
}
function ambientUpdate(dt){
  if(!AU.ok||!H||H.ended)return;
  const t=AU.ctx.currentTime,mute=G&&G.mute,k=0.35;
  const setG=(l,v)=>l.g.gain.setTargetAtTime(mute?0:v,t,k);
  const gust=0.75+0.25*Math.sin(tm*0.9)+0.1*Math.sin(tm*2.3);
  setG(AU.loops.wind,clamp(env.wind/24,0,0.55)*0.55*gust);
  AU.loops.wind.fl.frequency.setTargetAtTime(280+env.wind*35,t,0.5);
  setG(AU.loops.rain,env.precip==='rain'?clamp(0.06+env.rainI*0.2,0,0.3):env.precip==='snow'?0.02:0);
  const nf=nearFire();setG(AU.loops.fire,nf?0.09:0);
  if(nf||H.fire.lit&&Math.abs(H.x-H.fire.x)<450){
    AU.popT-=dt;if(AU.popT<=0){AU.popT=0.08+Math.random()*0.5;if(nf)burst(0.03+Math.random()*0.03,'highpass',2500+Math.random()*2500,0.16)}
  }
  if(H.speed>0&&H.speed<=4&&H.moving){
    const idx=Math.floor(H.phase/Math.PI);
    if(idx!==AU.lastStep){AU.lastStep=idx;stepSound()}
  }
  AU.birdT-=dt;
  if(AU.birdT<=0){
    AU.birdT=3+Math.random()*(env.biome==='wald'?6:12);
    if(env.light>0.45&&!env.precip&&env.wind<9&&env.temp>2&&H.speed>0&&H.speed<=4&&!H.sleep.active)chirp();
  }
}

const mix=(a,b,t)=>a.map((v,i)=>Math.round(lerp(v,b[i],t)));
const rgb=(a,al)=>al===undefined?`rgb(${a[0]},${a[1]},${a[2]})`:`rgba(${a[0]},${a[1]},${a[2]},${al})`;
const shade=(h,amt)=>{const c=hex(h);return rgb(amt>=0?mix(c,[255,255,255],amt):mix(c,[0,0,0],-amt))};

function emoji(g,ch,x,y,size,alpha=1){g.save();g.globalAlpha=alpha;g.font=size+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';g.textAlign='center';g.textBaseline='alphabetic';g.fillText(ch,x,y);g.restore()}
function sprite(g,path,ch,x,y,size,alpha=1){

  else emoji(g,ch,x,y,size,alpha);

function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
