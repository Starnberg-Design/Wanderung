<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Wanderkanal</title>
<style>
:root{--bg:#0e1b15;--panel:#16281f;--panel2:#1d3529;--line:#2c4a3a;--txt:#e8f1ea;--dim:#9db5a5;--acc:#4cc38a;--acc2:#2f9e6b;--warn:#ffb54a;--bad:#ff6b5a;--blue:#4aa8e8;
 --c-en:#f7c948;--c-sat:#ff9142;--c-hyd:#39a0ff;--c-warm:#ff5d73;--c-wet:#a88bff;--c-hp:#3ddc84;--c-batt:#9be564;
 --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;overscroll-behavior:none;touch-action:manipulation}
h1,h2,h3,h4{margin:0 0 .5em}h2{font-size:1.35em}h3{font-size:1.1em}
small,.dim{color:var(--dim)}
button,select,input{font:inherit;color:var(--txt)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;min-height:36px}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--acc2);border-color:var(--acc);color:#fff;font-weight:600}
button.on{background:var(--acc2);border-color:var(--acc)}
button.hl{box-shadow:0 0 0 2px var(--blue)}
button.big{padding:12px 18px;font-size:1.05em}
button.warnb{border-color:var(--warn);color:var(--warn)}
input[type=text],input:not([type]),select{background:#0f2018;border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-height:34px}
input[type=range]{accent-color:var(--acc)}
.screen{display:none;min-height:100vh}.screen.active{display:block}
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px}
.center h1{font-size:2.6em}.sub{color:var(--dim)}
.col{display:flex;flex-direction:column;gap:10px;min-width:240px}
.wrap{max-width:1180px;margin:0 auto;padding:16px calc(16px + var(--sr)) 24px calc(16px + var(--sl))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.two,.three{grid-template-columns:1fr}}
@media(max-width:1000px) and (min-width:700px) and (max-height:600px){.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card.dis>*:not(.badtxt){opacity:.42;filter:grayscale(1)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 12px;white-space:nowrap}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}.row.gap{gap:8px;flex-wrap:wrap}
.lbl{min-width:104px;color:var(--dim)}.val{min-width:70px;text-align:center}
.sw{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid #fff3;vertical-align:middle}
.stat{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.ctl{display:flex;align-items:center;gap:6px}.pips{letter-spacing:1px;color:var(--acc);min-width:110px;text-align:center;font-size:.9em}
.hint{color:var(--dim);font-size:.9em}
#prev{display:block;margin:0 auto 10px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.hike .facts{display:flex;flex-direction:column;gap:3px;margin:8px 0 12px;font-size:.9em;color:var(--dim)}
.risk{display:inline-block;border-radius:8px;padding:1px 8px;font-size:.85em;font-weight:600;color:#0b1a12}
.vbar{height:6px;background:#0f2018;border-radius:4px;margin:5px 0;overflow:hidden}.vbar i{display:block;height:100%;background:var(--acc)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:flex;gap:4px;flex-wrap:wrap}.seg button{padding:5px 10px;min-height:32px}
/* Shop */
.shopgrid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px}@media(max-width:699px){.shopgrid{grid-template-columns:minmax(0,1fr)}}
.shopgrid>*,.items,.item,.inf{min-width:0}.item{max-width:100%}.inf small,.inf b{overflow-wrap:anywhere}.item .seg,.item .ctl{flex-shrink:0}
@media(max-width:560px){.item{flex-wrap:wrap;gap:8px}.item .inf{flex:1 1 130px}.item .seg,.item .ctl{margin-left:auto}.ico.sq{width:56px}.ico.sq img{width:52px;height:52px}.ico.wide{width:84px}.ico.wide img{width:80px;height:36px}.ico.pk{width:50px}.ico.pk img{width:46px;height:58px}#s-shop .wrap{overflow-x:hidden}}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}

.ico{font-size:2em;width:48px;text-align:center}.ico img{width:44px;height:44px;object-fit:contain}
.ico.pk{width:64px}.ico.pk img{width:60px;height:74px}
.pvs{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}.pvs button{width:34px;height:40px;padding:2px;border:2px solid transparent;border-radius:6px;background:rgba(255,255,255,.07);min-width:0}.pvs button.on{background:rgba(255,255,255,.18)}.pvs img{width:100%;height:100%;object-fit:contain}
.ico.wide{width:112px}.ico.wide img{width:104px;height:47px}
.ico.sq{width:76px}.ico.sq img{width:72px;height:72px}
.pl .lp img{width:24px;height:24px;vertical-align:middle;margin-right:2px;object-fit:contain}
.inf{flex:1;display:flex;flex-direction:column;gap:2px}
.qty{min-width:24px;text-align:center}
.side{position:sticky;top:10px;align-self:start}

.mbar{position:relative;height:12px;background:#0f2018;border-radius:6px;overflow:visible;margin:4px 0}.mbar i{display:block;height:100%;background:var(--acc);border-radius:6px}.mbar i.warn{background:var(--warn)}.mbar i.bad{background:var(--bad)}.mbar b{position:absolute;top:-3px;width:2px;height:18px;background:#fff}
.warnbox{border-radius:8px;padding:7px 10px;margin:6px 0;font-size:.88em;border:1px solid var(--line)}
.warnbox.bad{background:#4a1f17;border-color:var(--bad)}.warnbox.warn{background:#4a3a17;border-color:var(--warn)}.warnbox.info{background:#173a4a;border-color:var(--blue)}
.badtxt{color:var(--bad);font-weight:600}.goodtxt{color:var(--acc);font-weight:600}
/* Hike */
#s-hike{background:#000}
#s-hike.active{display:block;position:fixed;inset:0;min-height:0;z-index:5;overflow:hidden}
#stage{position:absolute;inset:0;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;pointer-events:none;z-index:3}
.pill{background:rgba(8,16,12,.76);border:1px solid #ffffff1c;border-radius:12px;padding:5px 10px;font-size:14px;color:#fff;line-height:1.35}
#h-tl{left:calc(4px + var(--sl));top:calc(4px + var(--st))}#h-tl .pill{padding:4px 7px;display:flex;gap:8px;align-items:center}#h-tl .st{width:56px;font-size:11px}#h-tl .st .tr{min-width:0;flex:1}@media(max-height:430px){#h-tc .pill{padding:3px 8px}}#h-tl .sb{gap:1px 5px}#h-tl .dogb{margin:0;padding:0 0 0 7px;border-top:0;border-left:1px solid #ffffff22;grid-template-columns:auto;gap:1px}
#h-tc{left:50%;transform:translateX(-50%);top:calc(6px + var(--st));text-align:center}
.dl{font-size:17px;font-weight:700;letter-spacing:.2px;line-height:1.25;margin-bottom:1px}.se{font-size:14px;font-weight:700;margin-left:4px;white-space:nowrap}
.se-Frühling{color:#8fe388}.se-Sommer{color:#ffd54a}.se-Herbst{color:#ff9a4a}.se-Winter{color:#9fd4ff}
#h-tr{right:calc(6px + var(--sr));top:calc(6px + var(--st));text-align:right;max-width:34vw}
.sb{display:grid;grid-template-columns:repeat(2,auto);gap:2px 6px}
.st{display:flex;align-items:center;gap:4px;width:88px;font-size:13px}

.dev{display:inline-flex;align-items:center;gap:3px;margin-left:6px;font-size:13px}
.dev .bt{display:inline-block;width:28px;height:10px;border:1px solid #fff9;border-radius:2px;position:relative}
.dev .bt i{position:absolute;left:0;top:0;bottom:0;background:var(--c-batt)}
.dev.vm{background:#ffffff1c;border:1px solid #ffffff33;border-radius:9px;padding:0 6px;margin-left:3px;cursor:pointer}
.dev.low .bt i{background:var(--bad)}.dev.dead{color:var(--bad)}
#toasts{position:absolute;right:calc(98px + var(--sr,0px));top:96px;display:flex;flex-direction:column;gap:2px;width:170px;max-width:30%;max-height:50px;text-align:left;overflow:hidden;justify-content:flex-start;pointer-events:none;z-index:3}
.toast{background:rgba(10,20,15,.82);border-left:3px solid var(--dim);padding:3px 6px;border-radius:5px;font-size:11.2px;line-height:1.25;animation:in .25s;transition:opacity .6s}
.toast.good{border-color:var(--acc)}.toast.bad{border-color:var(--bad)}.toast.warn{border-color:var(--warn)}.toast.out{opacity:0}
@keyframes in{from{transform:translateX(-10px);opacity:0}to{transform:none;opacity:1}}

#prof{flex:1;min-width:0;height:40px}
#ptxt{font-size:13px;white-space:nowrap;text-align:right;color:#fff}
#dock{display:flex;gap:6px;pointer-events:auto}
.rb{width:54px;height:54px;border-radius:50%;padding:0;font-size:23px;display:flex;align-items:center;justify-content:center;background:rgba(8,16,12,.72);border:1px solid #ffffff33;position:relative;color:#fff;flex-direction:column;line-height:1}

.rb.act{background:var(--acc2);border-color:var(--acc)}

#drawer{position:absolute;right:0;top:0;bottom:0;width:min(62vw,400px);transform:translateX(102%);transition:transform .2s;background:rgba(10,20,15,.95);z-index:6;overflow:auto;padding:8px 10px calc(8px + var(--sb)) 10px;border-left:1px solid var(--line)}
#drawer.open{transform:none}
#drawer h4{margin:8px 0 4px;font-size:.9em;color:var(--dim)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:5px}.acts button{font-size:.85em;padding:7px 6px}
.chk{display:flex;gap:6px;align-items:center;font-size:.9em;margin:5px 0}
#recsl{flex:none;display:flex;align-items:center;gap:6px;background:rgba(8,16,12,.6);border:1px solid #ffffff1c;border-radius:12px;padding:4px 10px 4px 8px;pointer-events:auto;width:min(34vw,236px);height:48px}
#rwrap{flex:1;min-width:0}
#spdctl{display:flex;align-items:center;gap:2px;background:#0a1410b0;border:1px solid #ffffff22;border-radius:14px;padding:2px 3px}
#spdctl button{background:transparent;border:0;color:#fff;font-size:15px;width:26px;height:44px;padding:0;cursor:pointer}
#sp-v{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:38px;color:#fff;font-size:19px;line-height:1}#sp-v small{font-size:11px;margin-top:2px}
.ctry{display:flex;flex-wrap:nowrap;gap:8px;margin-bottom:8px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 9px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#ffffff40 transparent}.ctry::-webkit-scrollbar{height:6px}.ctry::-webkit-scrollbar-thumb{background:#ffffff40;border-radius:3px}.cbtn{display:flex;flex-direction:column;align-items:flex-start;padding:8px 14px;flex:none;scroll-snap-align:start;white-space:nowrap}
.hk-tz{display:inline-block;margin:4px 0 2px;padding:3px 9px;border-radius:10px;background:#2b4a8a;border:1px solid #6f9bff;color:#fff;font-size:12px;font-weight:600}.card.tz{border-color:#6f9bff88;box-shadow:0 0 0 1px #6f9bff44}.hk-btns{display:flex;gap:8px;flex-wrap:wrap}.hk-btns .primary{flex:1;min-width:140px}
.co-pick .co-sel{background:#ffffff0d;border:1px solid #ffffff22;border-radius:12px;padding:10px 12px;margin:6px 0 8px}.co-pick .co-sel h5{margin:0 0 2px;font-size:1.05em}.co-stats{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.co-stats span{background:#ffffff14;border-radius:9px;padding:3px 8px;font-size:.82em}.co-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:210px;overflow:auto;padding:2px}.co-r{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:7px 10px;border-radius:10px}.co-r b{font-size:.88em;line-height:1.2}.co-r span{font-size:.75em;opacity:.8}.co-r.on{background:var(--acc);color:#04120a}.co-r.on span{opacity:.9}.cbtn.on{background:var(--acc);color:#04120a}.cbtn small{opacity:.8}
.grp{margin:16px 0 6px;font-size:16px;color:var(--acc)}
.dogb{display:grid;grid-template-columns:repeat(2,auto);gap:2px 6px;margin-top:4px;padding-top:4px;border-top:1px solid #ffffff22}
#livepanel .seg button{font-size:12px;padding:5px 7px;min-height:30px}#livepanel{position:absolute;right:calc(188px + var(--sr));bottom:calc(58px + var(--sb));width:min(42vw,270px);z-index:4;pointer-events:auto}
#rot{display:none;position:absolute;inset:0;z-index:9;background:#000d;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:10px;font-size:1.2em}
@media(orientation:portrait){#s-hike.active #rot{display:flex}}
/* Drohnen-Minispiel */
#dgui{position:absolute;inset:0;pointer-events:none;z-index:4}
#dg-pan{position:absolute;left:calc(8px + var(--sl));top:calc(90px + var(--st));width:min(48vw,250px);font-size:12px;pointer-events:none}
#dg-ctl{position:absolute;left:calc(8px + var(--sl));right:calc(8px + var(--sr));bottom:calc(8px + var(--sb));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
#dgui button{pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.dgs{display:flex;gap:14px;padding:14px;border-radius:38px;background:rgba(8,16,12,.72);border:1px solid #ffffff33}
.dgs.dgl{flex-direction:column}
.dgs button{width:88px;height:88px;border-radius:50%;font-size:36px;padding:0;background:rgba(40,60,50,.9)}
.dgs button.hold{background:var(--acc2);border-color:var(--acc)}
.dgm{margin-bottom:6px}
#dg-rth{min-width:180px;height:64px;font-size:1.15em;border-radius:32px}
@media(max-height:560px){.dgs{padding:9px;gap:9px}.dgs button{width:70px;height:70px;font-size:30px}#dg-rth{min-width:150px;height:54px}}
@media(max-height:430px){.dgs{padding:7px;gap:7px}.dgs button{width:62px;height:62px;font-size:26px}#dg-pan{font-size:11px;top:calc(76px + var(--st));width:min(40vw,220px)}}
#s-hike.dg #h-bot,#s-hike.dg #recsl,#s-hike.dg #h-mid,#s-hike.dg #livepanel,#s-hike.dg #sosb,#s-hike.dg #drawer{display:none!important}
#rlab{position:relative;height:14px;color:#fff9;font-size:10.5px;margin-top:1px}
#rlab span{position:absolute;top:0;transform:translateX(-50%);cursor:pointer;line-height:14px;white-space:nowrap;padding:0 2px}#rlab span.on{color:#fff;font-weight:700}
#rlab span[data-l="3"]{transform:translateX(-84%)}#rlab span[data-l="0"]{transform:translateX(-14%)}
#rtrk{position:relative;height:24px;touch-action:none;cursor:pointer}
#rtrk:before{content:"";position:absolute;left:12px;right:12px;top:9px;height:6px;background:#0009;border:1px solid #fff4;border-radius:4px}
#rknob{position:absolute;top:0;left:0;width:24px;height:24px;border-radius:50%;background:var(--acc);border:2px solid #fff;box-shadow:0 0 6px #0008;transition:left .12s}
.rcam{font-size:18px;flex:none}
/* Modal */
#modal{display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center;z-index:50;padding:8px}
#modal.open{display:flex}

#modal .btns.rowb{flex-direction:row;flex-wrap:wrap}
.cliplist{max-height:300px;overflow:auto}.clip{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.9em}

.pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}

.bar{height:8px;background:#0008;border-radius:5px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%}
.bottles{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.bottle{text-align:center;font-size:.8em;cursor:pointer}
/* Studio */

.vrow .mt{flex:1;min-width:0}

.cmt{padding:6px 0;border-bottom:1px solid #2a2a2a;font-size:.9em}
.hl-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.hl-live{background:#d22;color:#fff;font-weight:700;font-size:.8em;padding:2px 8px;border-radius:6px;animation:hlp 1.4s infinite}@keyframes hlp{50%{opacity:.55}}

.fr-v{cursor:pointer}.fc-in{display:flex;gap:8px;margin-top:8px}.fc-in input{flex:1}
canvas.chart{width:100%;height:140px;display:block}
/* Landscape phone */

const BL={w:'wald',m:'wiese',t:'tal',b:'berg',f:'fjaell',s:'sand',k:'kies',e:'schnee',p:'sumpf'};
// P: erzeugt Etappen aus Muster (Buchstabe = Biom, Zahl = km), Höhe linear a0→a1 plus Schwankung
function P(spec,total,a0,a1,wig,seed){
  const tk=spec.split(' ').map(s=>({b:BL[s[0]],w:+s.slice(1)}));
  const out=[];let acc=0,i=0;
  while(acc<total-0.01){const t=tk[i%tk.length];const km=Math.min(t.w,total-acc);out.push({b:t.b,km,alt:0});acc+=km;i++}
  if(out.length>1&&out[out.length-1].km<2){const l=out.pop();out[out.length-1].km+=l.km}
  let cum=0;const r=mulberry32(seed||1);
  out.forEach((s,k)=>{cum+=s.km;const t=cum/total;let a=lerp(a0,a1,t)+wig*Math.sin(k*1.9+seed)*0.6+wig*(r()-0.5)*0.8;
    if(s.b==='berg')a+=wig*0.7;if(s.b==='tal')a-=wig*0.5;s.alt=Math.max(5,Math.round(a/10)*10)});
  out[out.length-1].alt=Math.round(a1);
  return out;
}

const MN=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MD=[31,28,31,30,31,30,31,31,30,31,30,31];
const START_DOY0=90;           // Spielstart: 1. April
function dateOf(day){const t=START_DOY0+day;const year=Math.floor(t/365);let d=t%365,m=0;while(d>=MD[m]){d-=MD[m];m++}return{doy0:t%365,m,dom:d+1,year:year+1}}
const dateStr=day=>{const d=dateOf(day);return d.dom+'. '+MN[d.m]+(d.year>1?' (Jahr '+d.year+')':'')};
let HOFF=0;function hday(){return G.day+HOFF} // Tag für Jahreszeit/Wetter während einer Tour (bei gemeinsamer Tour: Admin-Datum)
const seasonOfM=m=>(m===11||m<2)?'Winter':m<5?'Frühling':m<8?'Sommer':'Herbst';
const SEASON_E={Winter:'❄️',Frühling:'🌷',Sommer:'☀️',Herbst:'🍂'};
/* ---- Sonne ---- */
function sunSin(lat,doy0,hour){
  const dec=23.44*Math.sin(2*Math.PI*(doy0-80)/365)*Math.PI/180,la=lat*Math.PI/180;
  return Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos((hour-12)*Math.PI/12);
}
const sunAltDeg=(lat,doy0,hour)=>Math.asin(clamp(sunSin(lat,doy0,hour),-1,1))*180/Math.PI;
const lightOf=alt=>{const t=clamp((alt+6)/14,0,1);return t*t*(3-2*t)};
function dayLightHours(lat,doy0){let n=0;for(let i=0;i<96;i++)if(lightOf(sunAltDeg(lat,doy0,i/4))>0.5)n+=0.25;return n}
/* ---- Klima ---- */
function seasonalT(R,doy0,alt){return R.meanT-R.sAmp*Math.cos(2*Math.PI*(doy0-25)/365)-(alt-R.ref)*0.0065}
function wxWeights(R,m,ext){
  const s=seasonOfM(m),md=R.mod||{};
  const base={Winter:{klar:1.2,wolkig:2.5,nebel:1.5,regen:1.3,sturm:1.4,gewitter:0.02},Frühling:{klar:2,wolkig:3,nebel:1,regen:2,sturm:0.6,gewitter:0.35},Sommer:{klar:3,wolkig:3,nebel:0.5,regen:1.5,sturm:0.35,gewitter:1},Herbst:{klar:1.5,wolkig:3,nebel:1.6,regen:3,sturm:1.1,gewitter:0.2}}[s];
  const o={};for(const k in base){o[k]=base[k]*(md[k]||1);if(k==='sturm'||k==='gewitter'||k==='regen')o[k]*=ext;if(k==='sturm'||k==='gewitter')o[k]*=0.55;else if(k==='regen')o[k]*=0.65;else if(k==='nebel')o[k]*=0.8;else if(k==='klar')o[k]*=1.3}
  return o;
}

function waterFit(){

  toast(F.sign==='missing'?'🪧 Wegscheide – hier fehlt der Wegweiser!':F.sign==='bent'?'🪧 Wegscheide – der Wegweiser ist umgeknickt und kaum lesbar.':'🪧 Wegscheide – folge der Markierung ('+H.markCol[1]+').','warn');
}
function chooseBranch(f,k){
  const F=forkOf(f);H.fork=null;f.decided=true;H.stopReason=null;
  if(k===F.main){H.dir=1;H.walking=true;xpAdd('nav',4);toast('🥾 Du gehst '+DIRN[k]+' weiter.');return}
  const b=F.br[k],x0=H.x;let len=b.len*PPK,kind=b.kind,out=b.out;
  const nav=navInfo();
  let ra=nav.live?(0.2+rnd(0,0.3))*PPK:nav.src==='map'?(0.35+(1-nav.q)*0.7+rnd(0,0.3))*PPK:(0.5+rnd(0,0.7))*PPK*clamp(1.1-0.04*ES('nav'),0.7,1.1);
  ra=clamp(ra,0.15*PPK,len*0.6);
  H.side={f,d:k,ct:tm,kind,out,len,x0,pos:0,gain:b.gain||0,gainF:b.gainF||1,realized:kind==='climb',realizeAt:ra,col:b.col,town:b.name,crux:false,liftM:kind==='climb'?Math.round(len*0.6):0};
  try{buildBranchRoute(H.side,f,k,b)}catch(e){console.warn('branch',e);H.side.R=null;H.side.feats=[]}
  H.dir=1;H.walking=true;
  if(kind==='climb')toast('🧗 Der Pfad wird steil – du musst dich teils mit den Armen hochziehen. Das kostet viel Kraft.');
}
function buildBranchRoute(S,f,k,b){
  const hk=H.hk,x0=S.x0,len=S.len,m0=mainElevAt(x0),bm=stageAt(x0).b;
  const r=mulberry32(((f.id+3)*104729+k.charCodeAt(0)*131+(H.route.totalPx|0))>>>0);
  const b2=bm;
  const km=len/PPK,tk=km+2.2;
  let endAlt;
  if(S.kind==='detour')endAlt=mainElevAt(Math.min(H.route.totalPx-200,f.x+S.gain*PPK));
  else if(S.kind==='town')endAlt=m0-(25+r()*90);
  else endAlt=m0+(r()-0.4)*70;
  const hb=Object.assign({},hk,{id:'branch',stages:[{b:bm,km:tk*0.45,alt:(m0+endAlt)/2},{b:b2,km:tk*0.55,alt:endAlt}],startAlt:m0,km:tk,sights:[],villageEvery:0,lodgeKind:'none'});
  const B=buildRoute(hb,(((f.id+5)*7727+(k==='L'?1:k==='R'?2:3)*911+(H.route.totalPx|0))&0xfffffff)+13);
  const i=Math.min(B.elev.length-2,Math.floor(len/10));
  S.R=B;S.off=m0-B.elev[0];S.corr=endAlt-(B.elev[i]+S.off);
  const fs=[];
  for(const q of B.feats){
    if(q.type==='junction'||q.type==='see'||q.type==='lodge'||q.type==='special'||q.x>len-120||q.x<150)continue;
    if(q.type==='sight'&&(q.summit||r()<0.5))continue;
    fs.push(Object.assign({},q,{x:q.x+x0,id:100000+(f.id+1)*1000+q.id,bridge:q.type==='fluss'?true:q.bridge,side:1}));
  }
  fs.sort((a,b)=>a.x-b.x);S.feats=fs;
}
function atSummit(){
  if(!H||H.side||H.fork)return false;
  if(H.lookX!=null&&Math.abs(H.x-H.lookX)<PPK*0.5)return false;
  if(featsIn(H.x-140,H.x+140).some(f=>f.type==='sight'&&f.summit))return true;
  const e=elevAt(H.x);let mx=-1e9,mn=1e9;
  for(let d=-0.8;d<=0.81;d+=0.1){const v=elevAt(H.x+d*PPK);if(v>mx)mx=v;if(v<mn)mn=v}
  return e>=mx-4&&e-mn>=45;
}
function summitLook(){
  const clear=!(env.fog>0.25||env.precip||env.dark>0.6||(H.weather&&H.weather.type==='nebel'));
  beginAction('orient','Schaut ins Land …',8,()=>{
    H.lookX=H.x;
    if(!clear){toast('🌫️ Die Sicht ist zu schlecht – du erkennst den Wegverlauf nicht.');return}
    const lim=H.x+8*PPK;let n=0;
    for(const f of H.route.feats){
      if(f.type!=='junction'||f.decided||f.x<=H.x+60||f.x>lim)continue;
      const F=forkOf(f);if(!F.hint||F.hint.dir!==F.main)F.hint={dir:F.main,src:'gipfel'};
      if(++n>=2)break;
    }
    if(!n)toast('⛰️ Weite Aussicht – in den nächsten Kilometern liegt keine Wegscheide.');
    else toast('⛰️ Von hier oben erkennst du den Wegverlauf: '+(n>1?'Die nächsten Wegscheiden sind':'Die nächste Wegscheide ist')+' markiert (💡).','good');
    xpAdd('nav',4);
  });
}
function checkNav(f){
  const F=forkOf(f),nav=navInfo();
  beginAction('orient',nav.live?'Prüft '+nav.label+' …':'Liest die Karte …',nav.live?1:6,()=>{
    const ok=Math.random()<clamp(nav.q+0.02*ES('nav'),0.2,0.97);
    F.hint={dir:ok?F.main:F.wrongs[Math.floor(Math.random()*F.wrongs.length)],src:nav.src};
    toast((nav.live?'📡 ':'🗺️ ')+nav.label+': Der Hauptweg führt wohl '+DIRN[F.hint.dir]+'.','good');xpAdd('nav',3);
  });
}
function orientSide(){
  beginAction('orient','Orientiert sich …',10,()=>{
    const S=H.side;if(!S)return;const nav=navInfo();
    if(!S.realized&&Math.random()<clamp(nav.q+0.15+0.02*ES('nav'),0.2,0.97))realizeWrong();
    else toast(S.realized?'🧭 Du weißt, dass du abseits des Hauptwegs bist.':'🧭 Du bist dir nicht sicher, ob das noch der richtige Weg ist …');
  });
}
function reverseDir(){
  if(H.camp.pitched){toast('Baue zuerst dein Lager ab.');return}
  if(H.body.energy<=0){toast('Du bist zu erschöpft – rasten oder schlafen!','bad');return}
  if(!H.side&&(H.dir||1)>0&&H.x<80){toast('Du stehst bereits am Start.');return}
  H.dir=(H.dir||1)>0?-1:1;H.fork=null;H.stopReason=null;H.walking=true;
  toast(H.dir<0?'🔄 Du drehst um und gehst zurück.':'🔄 Du drehst wieder um und gehst weiter.');
}
function atStart(){
  H.walking=false;H.dir=1;
  showModal({title:'🅿️ Zurück am Ausgangspunkt',text:'Du bist wieder am Start der Tour. Möchtest du hier aufgeben und nach Hause fahren – oder noch einmal losgehen?',buttons:[{label:'🚌 Tour hier beenden',fn:()=>{H.busCost=8;endHike('bus')}},{label:'🥾 Wieder losgehen',primary:1,fn:()=>{H.walking=true}}]});
}
function killSideIcons(){H.icons.forEach(i=>{if(i.sideTag)i.dead=true})}
function walkStep(dpx){
  const dir=H.dir||1;
  if(H.side){sideStep(dpx);return}
  const prev=H.x;
  H.x=clamp(H.x+dir*dpx,0,H.route.totalPx);H.km=H.x/PPK;
  if(dir>0){
    checkFeatures(prev,H.x);
    if(!H.fork&&!H.ended)for(const f of featsIn(H.x-1,H.x+140)){if(f.type==='junction'&&!f.decided){openFork(f);break}}
  }else{
    checkFeatures(H.x,prev);
    if(H.x<=0&&!H.ended)atStart();
  }
  const u=inUnmarked(H.x);
  if(u&&!H.inUnm){H.inUnm=true;toast('🪧 Seit einer Weile keine Wegmarkierung mehr – Karte oder GPS helfen.','warn')}
  else if(!u&&H.inUnm){H.inUnm=false;toast('🪧 Wieder Markierungen am Weg.','good')}
}
function sideStep(dpx){
  const S=H.side,dir=H.dir||1,km=dpx/PPK;
  const px0=H.x;S.pos+=dir*dpx;
  if(dir>0&&S.pos>S.len)S.pos=S.len;
  H.x=S.x0+S.pos;
  if(S.R&&S.pos>0){if(dir>0)checkFeatures(px0,H.x);else checkFeatures(H.x,px0)}
  if(S.kind==='climb'){const u=(S.pos/S.len),steep=u>0.12&&u<0.9;if(steep){const lf=clamp(loadKg()/capacityKg()-0.4,0,1);H.body.energy=Math.max(0,H.body.energy-km*(dir>0?1:0.45)*(16-0.7*ES('aus')+8*lf)*((H.body.wet>40||env.precip)?1.2:1));xpAdd('aus',km*5);xpAdd('trag',km*2.5)}}
  if(S.pos<=0){
    killSideIcons();H.side=null;H.x=S.x0;H.km=H.x/PPK;H.dir=1;
    S.f.decided=false;S.f.fork.tried[S.d]=true;H.walking=false;
    toast('↩️ Zurück an der Wegscheide.');openFork(S.f);return;
  }
  if(dir>0){
    if(!S.realized&&S.pos>=S.realizeAt){realizeWrong();return}
    if(S.pos>=S.len)sideEnd();
  }
}
function realizeWrong(){
  const S=H.side;S.realized=true;H.stats.junctionsLost++;H.walking=false;sfx('warn');
  const nav=navInfo(),town=S.kind==='town';
  const txt=nav.live?('📡 '+nav.label+': Du bist vom Hauptweg abgekommen (ca. '+fmtN(S.pos/PPK)+' km). '):'Seit einer Weile hast du keine Markierung mehr gesehen – du bist wohl falsch abgebogen! ';
  showModal({title:'🪧 Falsch abgebogen?',text:txt+(town?'Voraus siehst du allerdings Dächer – dieser Weg führt wohl in einen Ort.':'Du kannst zurückgehen oder darauf hoffen, dass der Pfad irgendwo wieder zum Weg führt.'),buttons:[{label:'🔄 Zurück zur Wegscheide ('+fmtN(S.pos/PPK)+' km)',primary:1,fn:()=>{H.dir=-1;H.walking=true}},{label:'➡️ Weitergehen',fn:()=>{H.walking=true}}]});
}
function climbLift(x){
  const S=H&&H.side;if(!S||S.kind!=='climb')return 0;
  const u=(x-S.x0)/S.len;if(u<=0)return 0;
  let s=u<=0.14?0:u>=0.88?1:(u-0.14)/0.74;
  s=s*0.8+s*s*(3-2*s)*0.2;
  return s*S.liftM;
}
function sideEnd(){
  const S=H.side,f=S.f;H.walking=false;
  if(S.kind==='detour'||(S.kind==='climb'&&S.out==='short')){
    const gp=S.kind==='detour'?S.gain*PPK:S.len*S.gainF;
    killSideIcons();H.side=null;H.dir=1;H.fade=tm;
    H.x=Math.min(H.route.totalPx-200,f.x+gp);H.km=H.x/PPK;f.decided=true;H.walking=true;H.camElev=elevAt(H.x);
    if(S.kind==='detour'){const w=Math.max(0,S.len/PPK-S.gain);H.wasted+=w;toast('🔀 Du triffst wieder auf den Hauptweg – ein Umweg von ca. '+fmtN(w)+' km.','warn')}
    else{const sv=Math.max(0,(S.len*S.gainF-S.len)/PPK);H.thrill+=1.5;xpAdd('aus',8);toast('⛰️ Abkürzung geschafft! Du sparst etwa '+fmtN(sv)+' km – anstrengend, aber effektiv.','good');sfx('success')}
    return;
  }
  if(S.kind==='climb'&&S.out==='summit'){
    if(!S.arrived){S.arrived=true;
      const nm=pick(['Felsnase','Aussichtskanzel','Gratkopf','Steinmann-Gipfel','Kanzelfelsen']);
      S.icon=spawnIcon({kind:'sight',fid:'bonus'+f.id,x:S.x0+S.len,e:'⛰️',label:'Zusatzgipfel – '+nm,base:64,life:1e9,sideTag:1});
      H.stats.milestones++;H.thrill+=2.5;H.body.energy=Math.min(100-H.fatigue,H.body.energy+8);sfx('success');
    }
    showModal({title:'🏔️ Zusatzgipfel erreicht!',text:'Das hat sich gelohnt: ein freier Rundumblick, den nicht jeder Wanderer zu sehen bekommt. Tippe auf das Symbol über dem Gipfel, um den Ausblick zu filmen. Danach geht es auf demselben Weg zurück zur Wegscheide.',buttons:[{label:'🔄 Abstieg zur Wegscheide',primary:1,fn:()=>{H.dir=-1;H.walking=true}},{label:'Noch bleiben'}]});
    return;
  }
  if(S.kind==='town'){
    const cost=Math.round(clamp(6+H.km*0.35,8,45));
    showModal({title:'🏘️ '+(S.town||'Ort'),text:'Der Weg führt in einen kleinen Ort. Von der Haltestelle fährt ein Bus Richtung Bahnhof – du könntest die Tour hier beenden. Oder du gehst zurück zur Wegscheide und suchst den Hauptweg.',buttons:[{label:'🚌 Bus nach Hause (ca. '+eur0(cost)+')',fn:()=>{H.busCost=cost;endHike('bus')}},{label:'🔄 Zurück zur Wegscheide ('+fmtN(S.len/PPK)+' km)',primary:1,fn:()=>{H.dir=-1;H.walking=true}},{label:'Noch bleiben'}]});
    return;
  }
  showModal({title:'🚧 Der Pfad endet',text:S.kind==='climb'?'Der Fels wird zu ausgesetzt – ohne Seil geht es hier nicht weiter. Du musst auf demselben Weg zurück.':'Der Pfad verliert sich im Dickicht – kein Weiterkommen. Das war wohl der falsche Weg. Du musst umkehren.',buttons:[{label:'🔄 Umkehren',primary:1,fn:()=>{H.dir=-1;H.walking=true}}]});
}
function drawTrailMarks(g,tm){
  const step=260,S=H.side,c0=Math.floor((camX-60)/step),c1=Math.ceil((camX+CW+60)/step);
  for(let c=c0;c<=c1;c++){
    const wx=c*step+hash(c*31+7)*70;
    if(wx<200||wx>H.route.totalPx-100)continue;
    let col;
    if(S){if(wx<S.x0+160||wx>S.x0+S.len||S.kind==='dead'||S.kind==='climb'||!S.col)continue;col=S.col}
    else{if(inUnmarked(wx))continue;col=H.markCol[0]}

    g.fillStyle=tc('#6d4726');g.fillRect(sx-1.5,y-22,3,22);g.fillStyle=tc(col);g.fillRect(sx-1.5,y-22,3,8);

}
function drawFork(g,tm,f,sx,y){
  const F=forkOf(f);
  const rib=(dx,dy,w0,col)=>{g.fillStyle=tc(col);g.beginPath();g.moveTo(sx-w0,y+2);g.quadraticCurveTo(sx+dx*0.3,y-dy*0.2,sx+dx,y-dy);g.lineTo(sx+dx+3,y-dy);g.quadraticCurveTo(sx+dx*0.3+w0*1.2,y-dy*0.2+3,sx+w0,y+2);g.closePath();g.fill()};
  if(F.sign!=='missing'){
    const stake=(px,col,al)=>{g.globalAlpha=al;g.fillStyle=tc('#6d4726');g.fillRect(px-2.5,y-34,5,34);g.fillStyle=tc('#f4f1e8');g.fillRect(px-5,y-36,10,16);g.fillStyle=tc(col);g.fillRect(px-4,y-35,8,14);g.globalAlpha=1};
    const pos={L:-60,S:70,R:60};
    F.dirs.forEach(k=>{const b=F.br[k];if(k===F.main)stake(sx+pos[k],H.markCol[0],F.sign==='bent'?0.4:1);else if(b.col)stake(sx+pos[k],b.col,0.9)});
  }
  g.save();g.translate(sx,y);
  if(F.sign==='missing'){
    g.fillStyle=tc('#6d4726');g.fillRect(-3,-13,6,13);g.fillStyle=tc('#8b6a40');g.beginPath();g.moveTo(-3,-13);g.lineTo(-1,-18);g.lineTo(1,-14);g.lineTo(3,-17);g.lineTo(3,-13);g.closePath();g.fill();
    g.fillStyle=tc('#9aa0a6');g.fillRect(8,-3,6,3);
  }else{
    const bent=F.sign==='bent';
    g.rotate(bent?F.lean:0);
    g.fillStyle=tc('#6d4726');g.fillRect(-3,-66,6,66);
    F.dirs.forEach((k,j)=>{
      const isM=bent?(k===F.signDir):(k===F.main),col=isM?H.markCol[0]:(F.br[k].col||'#9aa0a6'),w=48,h=15;
      g.save();g.translate(0,-63+j*19);if(bent)g.rotate(F.bent[j]);
      g.fillStyle=tc('#d9b26f');g.beginPath();
      if(k==='L'){g.moveTo(0,0);g.lineTo(-w+6,0);g.lineTo(-w,h/2);g.lineTo(-w+6,h);g.lineTo(0,h)}
      else if(k==='R'){g.moveTo(0,0);g.lineTo(w-6,0);g.lineTo(w,h/2);g.lineTo(w-6,h);g.lineTo(0,h)}
      else{g.moveTo(-16,h);g.lineTo(-16,3);g.lineTo(0,-3);g.lineTo(16,3);g.lineTo(16,h)}
      g.closePath();g.fill();
      const cx=k==='L'?-w+11:k==='R'?6:-7;
      g.globalAlpha=bent&&isM?0.55:1;g.fillStyle=tc('#f4f1e8');g.fillRect(cx-1.5,1,19,h-2);g.fillStyle=tc(col);g.fillRect(cx,2.5,16,h-5);g.globalAlpha=1;
      if(F.br[k].kind==='climb'){const bx=k==='L'?-w+31:k==='R'?25:10;g.fillStyle='#c0392b';g.beginPath();g.moveTo(bx,h-2);g.lineTo(bx+3,2);g.lineTo(bx+6,h-2);g.closePath();g.fill()}
      g.restore();
    });
  }
  g.restore();
  if(H.fork===f){g.strokeStyle='rgba(255,230,120,'+(0.5+0.4*Math.sin(tm*5)).toFixed(2)+')';g.lineWidth=3;g.beginPath();g.arc(sx,y-30,42,0,7);g.stroke()}
}

/* Pfad-Abzweig: Der gezeichnete Weg spaltet sich an der Wegscheide in einen tieferen (vorderen) Seitenpfad. */
const FORK_SPLIT=480;
function forkLane(F,k){const o=F.dirs.filter(d=>d!==F.main);return Math.max(0,o.indexOf(k))}
function forkDepth(F,k){return 84+forkLane(F,k)*30}
function forkSm(t){t=clamp(t,0,1);return t*t*(3-2*t)}
function forkM(){const S=H&&H.side;return S?clamp((tm-(S.ct||0))/1.5,0,1):0}
function laneOff(F,k,dx,m){return forkDepth(F,k)*forkSm(dx/FORK_SPLIT)*(1-m*forkSm((dx-800)/1000))}
function sideOff(x){const S=H&&H.side;if(!S||!S.f.fork)return 0;return laneOff(S.f.fork,S.d,x-S.f.x,forkM())}
function mainTrailA(x){const S=H&&H.side;if(!S)return 1;return 1-forkM()*forkSm((x-S.f.x-500)/800)}
function drawForkPaths(g,tm,f){
  const F=forkOf(f);
  for(const k of F.dirs){
    if(k===F.main)continue;
    const mine=!!(H.side&&H.side.f===f&&H.side.d===k);if(H.side&&H.side.f===f)continue;
    const mm=mine?forkM():0;
    const b=F.br[k],len=Math.max(0.3,b.len||1)*PPK;
    const a=Math.max(f.x,camX-24),e=Math.min(f.x+len,camX+CW+24);
    if(e<=a)continue;
    const col=b.kind==='climb'?'#8d8d86':'#b9a27a',yy=x=>groundY(x)+2+laneOff(F,k,x-f.x,mm);
    g.lineCap='round';g.lineJoin='round';
    g.strokeStyle=tc(col);g.lineWidth=5;
    const fadeFrom=f.x+len-160,bodyEnd=Math.min(e,fadeFrom);
    if(bodyEnd>a){g.beginPath();for(let x=a;x<=bodyEnd;x+=12){const sx=x-camX,y=yy(x);if(x===a)g.moveTo(sx,y);else g.lineTo(sx,y)}g.lineTo(bodyEnd-camX,yy(bodyEnd));g.stroke()}
    if(e>fadeFrom){
      for(let x=Math.max(a,fadeFrom);x<e;x+=12){
        const al=clamp(1-(x-fadeFrom)/160,0,1);if(al<=0)break;
        g.globalAlpha=al;g.lineWidth=5*(0.4+0.6*al);g.beginPath();g.moveTo(x-camX,yy(x));g.lineTo(x+12-camX,yy(x+12));g.stroke();
      }
      g.globalAlpha=1;
    }
    g.lineCap='butt';
  }
}
function drawForksTop(g,tm){
  if(H.side){const f=H.side.f,fx=f.x-camX;drawForkPaths(g,tm,f);if(fx>-360&&fx<CW+360)drawFork(g,tm,f,fx,groundY(f.x));return}
  for(const f of featsIn(camX-2600,camX+CW+300))if(f.type==='junction'){drawForkPaths(g,tm,f);const fx=f.x-camX;if(fx>-300&&fx<CW+300)drawFork(g,tm,f,fx,groundY(f.x))}
}
function featsIn(a,b){ // sortiert nach x; Features im Bereich (a,b]
  if(H.side){const SF=H.side.feats;return SF?SF.filter(f=>f.x>a&&f.x<=b):[]}
  const F=H.route.feats;let lo=0,hi=F.length;
  while(lo<hi){const m=(lo+hi)>>1;if(F[m].x<=a)lo=m+1;else hi=m}
  const out=[];for(let i=lo;i<F.length&&F[i].x<=b;i++)out.push(F[i]);return out;
}
function inLake(x){const L=H.side?null:H.route.lakes;if(!L)return false;for(const l of L)if(x>l.xl-30&&x<l.xr+30)return true;return false}
function featNear(type,x,r){for(const f of featsIn(x-r,x+r)){if(f.type===type)return f}return null}
function mainElevAt(x){const r=H.route.elev;const f=clamp(x,0,(r.length-2)*10)/10;const i=Math.floor(f);return lerp(r[i],r[i+1],f-i)}
function elevAt(x){
  const S=H.side;
  if(S&&S.R&&x>S.x0){const lx=x-S.x0,r=S.R.elev,f=clamp(lx,0,(r.length-2)*10)/10,i=Math.floor(f),u=clamp(lx/S.len,0,1);return lerp(r[i],r[i+1],f-i)+S.off+S.corr*u*u*(3-2*u)+climbLift(x)}
  return roadFlat(x,mainElevAt(x))+climbLift(x)}
function roadFlat(x,e){ // Straße liegt in einer Ebene: Gelände wird im Straßenabschnitt eingeebnet
  const Z=H.route&&H.route.roads;if(!Z)return e;
  for(const z of Z){if(x<=z.x0||x>=z.x1)continue;if(z.ay===undefined)z.ay=mainElevAt((z.x0+z.x1)/2);const t=clamp(Math.min(x-z.x0,z.x1-x)/260,0,1),w=t*t*(3-2*t);return e+(z.ay-e)*w}
  return e}
function gradeAt(x){const d=10*STRETCH;return (elevAt(x+d)-elevAt(x-d))/(2*d*1000/PPK)}
function stageAt(x){const SD=H.side;if(SD&&SD.R&&x>SD.x0){const S=SD.R.stages;return S[stageIndexAt(S,x-SD.x0)]}const S=H.route.stages;return S[stageIndexAt(S,x)]}
function netAt(x){
  if(featNear('village',x,900)||featNear('lodge',x,450)||x<500||(H.route&&x>H.route.totalPx-500))return true;
  return hash(Math.floor(x/300)+77)<BIOMES[stageAt(x).b].net;
}

/* ---- Wetter ---- */
function wxRand(){if(typeof COOP!=='undefined'&&COOP&&COOP.seed&&H){H.wxN=(H.wxN||0)+1;return hash(COOP.seed*0.0137+H.wxN*7.331+0.5)}return Math.random()}
function nextWeather(prev){
  const d=dateOf(hday()),w=wxWeights(H.hk.regD,d.m,H.hk.ext);let tot=0;
  const ent=Object.entries(w).map(([k,v])=>{v=k===prev?v*2.4:v;tot+=v;return [k,v]});
  let r=wxRand()*tot;for(const [k,v] of ent){r-=v;if(r<=0)return k}return 'wolkig';
}
function setWeather(type){
  const rnd=(a,b)=>a+wxRand()*(b-a);
  const hk=H.hk,W=WEATHER[type];
  H.weather={type,start:H.t,until:H.t+rnd(260,760),wind:W.wind*rnd(0.75,1.3)*hk.regD.wind*(0.85+0.15*hk.ext),rainI:W.rain?W.rain*rnd(0.6,1.2)*(0.7+hk.ext*0.4):0};
  H.wdir=wxRand()<0.5?-1:1;
  H.nextW=nextWeather(type);H.wxWarned=false;
  if((type==='gewitter'||type==='sturm')&&H.started)try{comEv('storm')}catch(e){}
  if((type==='gewitter'||type==='sturm')&&H.started)spawnIcon({kind:'storm',x:H.x+320,e:type==='gewitter'?'⛈️':'🌪️',label:type==='gewitter'?'Gewitter':'Sturm',base:30,life:12});
}
function updateWeather(){
  try{comTick()}catch(e){}
  if(H.lodge&&H.lodge.until&&H.t>=H.lodge.until&&!(H.sleep.active&&H.indoor==='lodge')){H.lodge=null;toast('🏨 Check-out: Dein Zimmer ist nicht mehr gebucht.')}
  if(H.t>=H.weather.until){setWeather(H.nextW||nextWeather(H.weather.type));return}
  if(!H.wxWarned&&H.weather.until-H.t<110&&(H.nextW==='gewitter'||H.nextW==='sturm')){
    H.wxWarned=true;toast(H.nextW==='sturm'?'⚠️ Der Wind frischt auf – ein Sturm zieht in etwa 1½ Stunden auf!':'⚠️ Dunkle Wolken bauen sich auf – ein Gewitter naht.','warn');sfx('warn');
  }
}
function computeEnv(){
  const hk=H.hk,R=hk.regD;const d=dateOf(hday());const hour=(H.t/60)%24;
  const st=stageAt(H.x),B=BIOMES[st.b];
  env.hour=hour;env.stage=st;env.biome=st.b;env.alt=elevAt(H.x);env.grade=gradeAt(H.x);
  env.doy0=d.doy0;env.month=d.m;env.season=seasonOfM(d.m);
  env.sunAlt=sunAltDeg(R.lat,d.doy0,hour);
  const W=WEATHER[H.weather.type];
  env.sun=lightOf(env.sunAlt);env.light=env.sun*W.dim;env.dark=1-env.light;
  env.gold=clamp(1-Math.abs(env.sunAlt-3)/9,0,1)*(env.sunAlt>-7?1:0);
  const sT=seasonalT(R,d.doy0,env.alt);env.seasonT=sT;
  const daily=R.dAmp*(0.35+0.65*env.sun)*Math.sin((hour-9)/24*2*Math.PI);
  const syn=R.syn*(0.6*Math.sin(H.t/1440*0.83+H.synPh[0])+0.4*Math.sin(H.t/1440*2.1+H.synPh[1]));
  env.temp=sT+daily+syn+W.dT;
  if(H.snowDepth==null)H.snowDepth=clamp((1.5-sT)/5,0,1)*30;
  env.snow=clamp(H.snowDepth/30,0,1);
  env.frozen=sT<-4;
  env.wind=H.weather.wind*B.wind;
  env.rainI=H.weather.rainI;
  env.precip=H.weather.rainI>0.05?(env.temp<1.5?'snow':'rain'):null;
  env.fog=H.weather.type==='nebel'?0.55:0;
  env.net=netAt(H.x);
  env.midnightSun=R.lat>66&&env.sunAlt>-2&&(hour<3||hour>21);
  env.aurora=(R.lat>62&&env.dark>0.85&&(H.weather.type==='klar'||H.weather.type==='wolkig')&&d.m!==5&&d.m!==6&&d.m!==7)?1:0;
}

}
const waterTotal=()=>H.water.clean+H.water.dirty;

const nearFire=()=>H.fire.lit&&Math.abs(H.x-H.fire.x)<110;

function nearWater(){const q=featNear('quelle',H.x,90)||featNear('fluss',H.x,90);if(q)return q;if(!H.side)for(const l of (H.route.lakes||[]))if(H.x>l.xl-140&&H.x<l.xr+140)return {type:'fluss',lake:true,x:H.x,id:-7};return null}
function nearSight(){for(const f of featsIn(H.x-250,H.x+250))if(f.type==='sight'&&/see|fjord|loch|lac|lago|älv|elv/i.test(f.s.n))return f;return null}

function fillContainers(){ // Verteilt Wasser auf Flaschen (sauber zuerst, dann unbehandelt)
  let c=H.water.clean,d=H.water.dirty;
  return H.g.containers.map(def=>{const a=Math.min(def.cap,c);c-=a;const b=Math.min(def.cap-a,d);d-=b;return {def,clean:a,dirty:b}});
}
function deviceOK(id){const d=H.dev[id];return !!d&&!d.broken&&d.batt>0}
function lightDev(){let best=null;for(const id in LIGHTS){if(deviceOK(id)){const L=LIGHTS[id];if(!best||L.f>best.L.f)best={id,L}}}return best}
function lightSource(){
  const b=lightDev();if(b)return b.L.kind==='hand'?'torch':'lamp';

// Strassenlaternen: Licht am Wegesrand wirkt wie eine gute Lampe (nur in Ortsnähe)
function lampNear(x){const A=H&&H.route&&H.route.lamps;if(!A||!A.length)return null;let lo=0,hi=A.length-1;while(lo<hi){const m=(lo+hi)>>1;if(A[m].x<x)lo=m+1;else hi=m}let best=null,bd=1e9;for(let i=Math.max(0,lo-2);i<=Math.min(A.length-1,lo+1);i++){const d=Math.abs(A[i].x-x);if(d<bd){bd=d;best=A[i]}}return best?{lamp:best,d:bd}:null}
function streetW(){const n=lampNear(H.x);if(!n||H.side)return 0;return clamp((340-n.d)/160,0,1)}
function streetF(){const w=streetW();if(!w)return 0;const n=lampNear(H.x);return w*(n.lamp.mod?0.985:0.965)}
function lightF(){const b=lightDev();const dv=b?b.L.f:(H.g.phones.some(p=>deviceOK(p.id))?0.6:0.3);return Math.max(dv,streetF())}
function lightRisk(){const b=lightDev();const dv=b?b.L.risk:(H.g.phones.some(p=>deviceOK(p.id))?0.9:1.8);const w=streetW();return w?Math.min(dv,lerp(dv,0.1,w)):dv}

  if(g.map){let q=0.6;if(env.fog)q-=0.15;if(env.dark>0.6&&!light)q-=0.2;if(H.body.wet>70)q-=0.1;if(q>best.q)best={q,label:'Landkarte & Kompass',src:'map',live:false,note:''}}

function shotQ(def,scenic){

  const q=s.type==='drone'?droneQ(d.def,clamp(env.wind/Math.max(1,droneHold(d.def))*0.3,0,1)):shotQ(d.def,s.type==='selfie'||s.type==='hund'?1:scenicNow());

  o=o||{};const b=DSND_BUF[name];if(!b||!AU.ok||!AU.ctx)return null;

  const g=c.createGain(),t0=c.currentTime,off=Math.min(Math.max(0,o.off||0),b.duration-0.2),dur=b.duration-off,vol=o.gain||1,fi=o.fadeIn||0,fo=Math.min(o.fadeOut||0.5,dur*0.5);

const DTARGETS=[

 {id:'eagle',e:'🦅',n:'Adler im Flug',r:2,mv:1,lo:0.55,hi:0.95,ok:()=>['berg','fjaell','wiese','tal','schnee'].includes(env.biome)},
 {id:'cloud',e:'☁️',n:'Wolkenspiel',r:0,mv:0,lo:0.7,hi:0.95},

 {id:'gold',e:'🌅',n:'Goldenes Licht',r:2,mv:0,lo:0.45,hi:0.8,ok:()=>env.gold>0.3},
 {id:'rainbow',e:'🌈',n:'Regenbogen',r:3,mv:0,lo:0.5,hi:0.85,ok:()=>(env.precip||H.weather.type==='wolkig')&&Math.random()<0.25},

 {id:'mount',e:'🏔️',n:'Gipfel von oben',r:1,mv:0,lo:0.35,hi:0.7,ok:()=>['berg','fjaell','schnee'].includes(env.biome)},
 {id:'tree',e:'🌲',n:'Baumwipfel von oben',r:0,mv:0,lo:0.2,hi:0.45,ok:()=>env.biome==='wald'},
 {id:'lake',e:'🏞️',n:'See von oben',r:2,mv:0,lo:0.3,hi:0.6,ok:()=>env.biome==='tal'||env.biome==='sumpf'}];
const DR_RANGE={drone_k:1.5,drone_m:3,drone_u:5}; // Reichweite in km entlang des Hauptwegs

function droneNewTarget(def,wx){
  const mv=!!def.mv,spd=mv?rnd(26,40)+def.r*22:0;
  return {def,wx,x0:wx,span:rnd(220,380),h:DTOP+DSPAN*rnd(def.lo,def.hi),hmin:Math.max(DTOP,DTOP+DSPAN*def.lo*0.9),hmax:Math.min(DTOP+DSPAN*1.15,DTOP+DSPAN*def.hi*1.1),
    vx:mv?(Math.random()<0.5?-1:1)*spd:0,vh:0,tt:rnd(0.5,2),spd,ph:rnd(0,6.28),cap:0,done:false,fade:0,
    R:clamp(40-def.r*4,26,40),hold:0.9+0.45*def.r+(mv?0.25:0),vlim:105-12*def.r,fast:false,inR:false};
}
/* Motive werden abschnittsweise erzeugt, sobald ein Abschnitt zum ersten Mal ins Bild kommt. Abgeflogene Abschnitte bleiben
   für die ganze Tour "leer" – bei einem neuen Flug tauchen dort keine Motive wieder auf. */
function droneGenChunks(){
  const D=DG;if(!D||!H)return;
  const R=H.route,S=H.side,seen=H.dtSeen||(H.dtSeen={});
  const pre=S?'s'+S.f.id+':':'m';
  const lo=S?S.x0+150:150,hi=S?S.x0+S.len-150:R.totalPx-150;
  const a=Math.floor((D.cx-(D.scout?CW*0.6:0))/DCHK),b=Math.floor((D.cx+CW*(D.scout?1.6:1))/DCHK);
  for(let c=a;c<=b;c++){
    const k=pre+c;
    if(seen[k]||(c+1)*DCHK<lo||c*DCHK>hi)continue;
    seen[k]=1;
    const pool=DTARGETS.filter(t=>!t.ok||t.ok());
    const u=Math.random(),n=u<0.3?0:u<0.8?1:2;
    for(let i=0;i<n&&pool.length;i++){
      const ws=pool.map(t=>1/(1+t.r*0.9));let sm=ws.reduce((x,y)=>x+y,0),r=Math.random()*sm,j=0;
      for(;j<pool.length-1;j++){r-=ws[j];if(r<=0)break}
      const def=pool.splice(j,1)[0];
      let wx=clamp(c*DCHK+rnd(40,DCHK-40),lo,hi);
      if(Math.abs(wx-D.padX)<70)wx+=120;
      if(D.targets.some(o=>Math.abs(o.wx-wx)<70))wx+=90;
      D.targets.push(droneNewTarget(def,wx));
    }
  }
}

const BIRD_K={

function birdPos(D,b){return [b.wx-D.cx,groundY(b.wx)-b.h+Math.sin(b.t*b.wf*1.6+b.ph)*b.wob]}

function droneBirdSpawn(D){
  const bm=stageAt(clamp(D.padX+D.x,0,H.route.totalPx)).b,mount=bm==='berg'||bm==='fjaell'||bm==='schnee',u=Math.random();

  if(mount&&D.adlerCd<=0&&Math.random()<0.3){k='adler';D.adlerCd=75}   /* Adler: nur im Gebirge und sehr selten */

  const side=Math.random()<0.5?-1:1,dirx=-side;
  const sp=rnd(K.sp[0],K.sp[1])*(Math.random()<0.25?1.35:1);
  const n=Math.round(rnd(K.flock[0],K.flock[1])),wdir=(H.wdir||1)>0?1:-1;
  const vx=dirx*sp+wdir*env.wind*3;
  const x0=D.cx+(side<0?-(300+(sp>150?120:0)):CW+300+(sp>150?120:0));

  for(let i=0;i<n;i++)D.birds.push({k,wx:x0-dirx*i*26,h:clamp(h0+(i?rnd(-14,14):0),90,DMAXH-40),vx:vx*rnd(0.93,1.07),ph:rnd(0,6.3),wob:K.wob*rnd(0.6,1.2),wf:rnd(0.8,1.8),r:K.r,t:0});
}
function droneBirdHit(b,bx,by){
  const D=DG,K=BIRD_K[b.k],dr=D.dr;D.hitCd=1.6;
  for(let i=0;i<14;i++)D.ptc.push({k:'fea',x:bx,y:by,vx:rnd(-90,90),vy:rnd(-90,30),life:rnd(0.7,1.5),max:1.5,r:rnd(2,4),rot:rnd(0,6)});
  const pc=clamp(K.hit*(BIRD_VULN[D.def.id]||1)*(0.8+0.5*Math.min(1,D.stress+0.2)),0,0.9);
  b.dead=true;
  if(Math.random()<pc){droneCrashNow('bird');return}

function droneCapture(t){

  const shake=clamp(D.stress*1.2+D.wEff/Math.max(1,droneHold(D.def))*0.25,0,1);
  const q=droneQ(D.def,shake);
  const val=RARITY[T.r].base*q*1.9+CLIP_TYPES.drone.base*q;
  addClip({key:'dtgt:'+T.id+':'+Math.round(H.t),type:'drone',name:'Luftaufnahme: '+T.n,e:T.e,q,value:val,rar:T.r});
  D.caught.push({n:T.n,e:T.e,q,r:T.r});D.flash=1;
  droneSay(T.e+' '+T.n+' aufgenommen! Qualität '+Math.round(q*100)+' %'+(shake>0.5?' (verwackelt)':'')+' · '+RARITY[T.r].name);
  sfx('shutter');if(T.r>=2)setTimeout(()=>sfx('success'),180);
}
function droneCrashNow(cause,farAway){
  const D=DG;if(!D)return;
  const blown=cause==='wind';
  const res=droneCrash(D.id,cause);
  D.crash={res,blown,far:!!farAway,why:blown?(farAway?'Der Wind hat die Drohne weggepustet. Sie ist irgendwo auf dem Weg, etwa '+Math.round(rnd(120,520))+' m entfernt, abgestürzt.':'Der Wind hat die Drohne gegen den Boden gedrückt.'):cause==='batt'?'Der Akku war leer – die Drohne ist abgestürzt.':cause==='bird'?'Vogelschlag: Ein Vogel hat die Drohne voll getroffen – sie ist abgestürzt.':cause==='tech'?'Plötzlicher Antriebsausfall: die Drohne ist abgestürzt.':'Zu harte Landung: die Drohne ist am Boden aufgeschlagen.'};
  D.mode='crashed';D.endT=farAway?0.3:1.3;D.vx=D.vy=0;dsndStopAll(D,0.15);
  if(!farAway){for(let i=0;i<26;i++)D.ptc.push({k:'deb',x:D.x,y:groundY(D.padX+D.x),vx:rnd(-160,160),vy:rnd(-220,-40),life:rnd(0.6,1.6),max:1.6,r:rnd(1.5,3.5),rot:rnd(0,6)})}
  sfx('bad');
}
function droneConclude(){
  const D=DG;if(!D)return;
  humStop(D,0.3);
  DG=null;droneUIOff();
  const fm=Math.round(D.t*0.1);
  if(D.mode==='crashed'&&D.crash){
    const c=D.crash;
    beginAction('drone',c.far?'Sucht die Drohne …':'Birgt die Trümmer …',Math.max(5,fm+Math.round(c.far?rnd(25,70):rnd(5,15))+Math.round(Math.abs(D.x)/PPK*12)),()=>updateHUD(true));
    droneCrashModal(c.res,c.why);return;
  }
  let mins=D.dr.pack+fm,label='Packt die Drohne ein …';
  const off=Math.abs(D.x)>40;
  if(off){mins+=Math.round(Math.abs(D.x)/PPK*14);label='Holt die Drohne und packt ein …'}
  if(D.t>15){const q=droneQ(D.def,D.stress*0.5);addClip({key:'dflight:'+Math.round(H.t),type:'drone',name:CLIP_TYPES.drone.n,e:'🛸',q,value:CLIP_TYPES.drone.base*q,rar:-1})}
  const n=D.caught.length;
  toast('🛸 Flug beendet: '+n+' Luftaufnahme'+(n===1?'':'n')+(n?' · Ø '+Math.round(D.caught.reduce((a,c)=>a+c.q,0)/n*100)+' % Qualität':'')+(D.hints?' · '+D.hints+' Wegscheide'+(D.hints===1?'':'n')+' erkundet 💡':'')+' · Akku '+Math.round(D.dev.batt)+' %',n?'good':'');
  beginAction('drone',label,Math.max(2,mins),()=>updateHUD(true));
}
/* --- Zeichnen: Boden-Staub, Luftverwirbelung, Rotoren, Drohne, Ziele --- */
function dustRGB(){
  const b=BIOMES[env.biome]||{};
  if(b.snowfield||(H.snowDepth||0)>=2)return [244,248,252];
  if(b.bare)return [238,224,182];
  let c=mix(hex(b.ground&&b.ground[0]==='#'?b.ground:'#8a8d84'),[222,208,172],0.5);
  if(env.precip)c=mix(c,[130,140,150],0.4);
  return c;
}
function droneDraw(g,tm,dt){
  const D=DG;if(!D)return;
  D.padGY=groundY(D.padX);
  const dr=D.dr,sxb=D.padX-D.cx,px=sxb+D.x,py=D.padGY-D.y;
  const gT=groundY(D.padX+D.x);
  const hT=Math.max(0,D.y-(D.padGY-gT)-D.rest);
  const wd=(H.wdir||1)>0?1:-1,w=D.wEff||env.wind;
  const run=D.mode!=='landed'&&D.mode!=='crashed';
  const k=run?clamp(1-hT/170,0,1):0,kk=Math.pow(k,1.3)*(D.spin<1?D.spin*D.spin:1);
  const dcol=dustRGB(),sdt=Math.min(dt,0.05);
  /* Partikel erzeugen */
  if(run&&MODAL==null){
    if(kk>0.02){const n=Math.floor(sdt*70*kk+Math.random());
      for(let i=0;i<n;i++){const s=Math.random()<0.5?-1:1;
        D.ptc.push({k:'dust',x:px+rnd(-16,16),y:gT-rnd(0,3),vx:s*rnd(40,150)*(0.5+kk)+wd*w*6,vy:-rnd(8,46),life:rnd(0.7,1.7),max:1.7,r:rnd(2.5,6.5),rot:0});
        if(Math.random()<0.08&&['wald','wiese','tal','sumpf','strasse'].includes(env.biome))D.ptc.push({k:'leaf',x:px+rnd(-20,20),y:gT-2,vx:s*rnd(50,150)+wd*w*8,vy:-rnd(30,90),life:rnd(1,2.2),max:2.2,r:rnd(2,3.4),rot:rnd(0,6)});
      }}
    D.ringT-=sdt;if(D.ringT<=0&&hT<330){D.ringT=0.16;D.rings.push({y:py+D.vh*0.35,t:0,x:px})}
    const nw=Math.floor(sdt*(w*2.6)+Math.random()*0.5);
    for(let i=0;i<nw;i++)D.ptc.push({k:'wind',x:wd>0?rnd(-40,CW*0.4):rnd(CW*0.6,CW+40),y:rnd(90,CH-60),vx:wd*(40+w*34)*rnd(0.8,1.3),vy:rnd(-6,6),life:rnd(1.2,2.6),max:2.6,r:6+w*2.2,rot:0});
  }
  /* Bodenschatten + Wirbel am Boden */
  g.save();
  if(run||D.mode==='landed'){
    const sh=clamp(1-hT/340,0.08,0.5);
    g.fillStyle='rgba(0,0,0,'+(0.28*sh).toFixed(3)+')';g.beginPath();g.ellipse(px,gT+1,(dr.w*0.5)*(0.7+0.5*sh),4+4*sh,0,0,7);g.fill();
    if(kk>0.04){ // Staubring am Boden
      g.strokeStyle=rgb(dcol,0.75*kk);g.lineWidth=2.5;
      for(let i=0;i<3;i++){const a=tm*5+i*2.1,rx=(26+70*kk)*(0.55+0.45*Math.sin(tm*3+i)),ry=3+8*kk;g.beginPath();g.ellipse(px,gT-1,rx,ry,0,a,a+2.1);g.stroke()}
      const gr=g.createRadialGradient(px,gT-2,4,px,gT-2,40+110*kk);gr.addColorStop(0,rgb(dcol,0.6*kk));gr.addColorStop(1,rgb(dcol,0));
      g.fillStyle=gr;g.beginPath();g.ellipse(px,gT-3,40+110*kk,12+30*kk,0,0,7);g.fill();
    }
  }
  /* Landeplatz und Windsack */
  g.fillStyle='rgba(60,60,60,0.55)';rr(g,sxb-26,D.padGY-1,52,4,2);g.fill();
  g.fillStyle='#f7c948';g.font='bold 9px sans-serif';g.textAlign='center';g.fillText('H',sxb,D.padGY+10);
  {const wsx=sxb+(D.dir>0?66:-66),wsy=D.padGY;
   g.strokeStyle='#cfd5d9';g.lineWidth=2;g.beginPath();g.moveTo(wsx,wsy);g.lineTo(wsx,wsy-48);g.stroke();
   const up=clamp(w/7,0,1),droop=(1-up)*1.25;let ax=wsx,ay=wsy-48,ang=wd>0?droop:Math.PI-droop;
   for(let i=0;i<4;i++){const L=9-i*1.4,fl=Math.sin(tm*(5+w)+i*0.9)*0.12*(0.3+up);ang+=(wd>0?1:-1)*0+fl*(wd>0?1:-1);
     const nx=ax+Math.cos(ang)*L,ny=ay+Math.sin(ang)*L+((1-up)*i*1.5);g.strokeStyle=i%2?'#fff':'#ff7a1a';g.lineWidth=7-i*1.1;g.lineCap='butt';g.beginPath();g.moveTo(ax,ay);g.lineTo(nx,ny);g.stroke();ax=nx;ay=ny}
   g.lineCap='butt'}
  g.restore();
  /* Partikel zeichnen */
  for(const p of D.ptc){
    p.life-=sdt;if(p.life<=0)continue;
    p.x+=p.vx*sdt;p.y+=p.vy*sdt;
    const u=p.life/p.max;
    if(p.k==='dust'){p.vx*=1-1.4*sdt;p.vy+=-8*sdt;p.r+=sdt*9;g.fillStyle=rgb(dcol,0.55*u);g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()}
    else if(p.k==='leaf'){p.vy+=140*sdt;p.rot+=sdt*9;g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle=env.biome==='sumpf'?'#6f6a3c':'#5f8f3a';g.globalAlpha=Math.min(1,u*1.5);g.fillRect(-p.r,-p.r*0.5,p.r*2,p.r);g.restore()}
    else if(p.k==='wind'){const a=0.16*Math.min(1,u*2)*Math.min(1,(p.max-p.life)*3);g.strokeStyle='rgba(255,255,255,'+a.toFixed(3)+')';g.lineWidth=1.3;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-Math.sign(p.vx)*p.r*3,p.y+Math.sin(p.x*0.05+tm*2)*1.5);g.stroke()}
    else if(p.k==='fea'){p.vy+=60*sdt;p.vx*=1-1.2*sdt;p.rot+=sdt*6;g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle='#e9e4da';g.globalAlpha=Math.min(1,u*2);g.beginPath();g.ellipse(0,0,p.r*1.6,p.r*0.5,0,0,7);g.fill();g.restore()}
    else if(p.k==='deb'){p.vy+=420*sdt;p.rot+=sdt*8;const hg=groundY(D.padX+p.x);if(p.y>hg){p.y=hg;p.vy*=-0.3;p.vx*=0.6}g.save();g.translate(p.x+sxb,p.y);g.rotate(p.rot);g.fillStyle=p.r>2.5?'#2a2e33':'#e8ecef';g.globalAlpha=Math.min(1,u*2);g.fillRect(-p.r,-p.r*0.5,p.r*2,p.r);g.restore()}
  }
  D.ptc=D.ptc.filter(p=>p.life>0).slice(-420);
  /* Luftverwirbelung unter der Drohne */
  if(run&&hT<330){
    const f=clamp(1-hT/330,0.1,1);
    g.save();g.lineCap='round';
    for(const r of D.rings){r.t+=sdt;r.y+=sdt*(110+60*f);}
    D.rings=D.rings.filter(r=>r.y<gT&&r.t<2);
    for(const r of D.rings){const u=clamp(r.t/1.2,0,1),rx=dr.w*(0.16+0.3*u),ry=2.5+4*u;g.strokeStyle='rgba(255,255,255,'+(0.42*(1-u)*f).toFixed(3)+')';g.lineWidth=1.8;g.beginPath();g.ellipse(px+Math.sin(r.t*6)*3+wd*w*r.t*4,r.y,rx,ry,0,0,7);g.stroke()}
    g.setLineDash([7,11]);g.lineDashOffset=-tm*150;
    for(let i=-2;i<=2;i++){const sx0=px+i*dr.w*0.13,ex=px+i*dr.w*(0.22+0.45*(1-f))+Math.sin(tm*3+i)*5+wd*w*2;
      g.strokeStyle='rgba(255,255,255,'+(0.26*f).toFixed(3)+')';g.lineWidth=2;g.beginPath();g.moveTo(sx0,py+D.vh*0.3);g.quadraticCurveTo(sx0+i*8,(py+gT)/2,ex,gT-2);g.stroke()}
    g.setLineDash([]);g.restore();
  }
  /* Wegscheiden-Hinweise */
  if(D.scout){for(const f of featsIn(D.cx-300,D.cx+CW+300)){
    if(f.type!=='junction'||!f.fork||!f.fork.hint||f.fork.hint.src!=='drohne'||f.decided)continue;
    const fx=f.x-D.cx,F=f.fork,lb='💡 Hauptweg: '+DIRN[F.main];
    g.save();g.font='bold 12px sans-serif';g.textAlign='center';const lw=g.measureText(lb).width+14,fy=groundY(f.x)-190;
    g.fillStyle='rgba(10,20,15,0.78)';rr(g,fx-lw/2,fy,lw,20,8);g.fill();g.fillStyle='#ffe27a';g.fillText(lb,fx,fy+14);g.restore();
  }}
  /* Ziele */
  for(const t of D.targets){
    if(t.done&&t.fade>1.2)continue;
    const bob=Math.sin(tm*1.6+t.ph)*5,tx=t.wx-D.cx,ty=groundY(t.wx)-t.h+bob;
    if(tx<-40||tx>CW+40){
      if(t.done)continue;
      const ex=tx<0?18:CW-18,ey=clamp(ty,80,CH-110);
      g.save();g.fillStyle='rgba(10,20,15,0.6)';g.beginPath();g.arc(ex,ey,15,0,7);g.fill();emoji(g,t.def.e,ex,ey+6,18,0.95);
      g.fillStyle='#fff';g.font='bold 11px sans-serif';g.textAlign='center';g.fillText(tx<0?'◀':'▶',tx<0?ex+22:ex-22,ey+4);g.restore();continue;
    }
    g.save();g.globalAlpha=t.done?Math.max(0,1-t.fade/1.2):1;
    const pulse=1+Math.sin(tm*4+t.ph)*0.06;
    g.fillStyle='rgba(10,20,15,0.38)';g.beginPath();g.arc(tx,ty,25*pulse,0,7);g.fill();
    const col=['#9aa5b1','#4caf50','#2196f3','#a855f7','#ff9800'][t.def.r+0]||'#fff';
    g.strokeStyle=t.fast?'#ff6b5a':col;g.lineWidth=2.5;g.setLineDash([5,5]);g.lineDashOffset=-tm*14;g.beginPath();g.arc(tx,ty,25*pulse,0,7);g.stroke();g.setLineDash([]);
    if(!t.done){g.strokeStyle='rgba(255,255,255,0.22)';g.lineWidth=1;g.beginPath();g.arc(tx,ty,t.R,0,7);g.stroke()}
    g.fillStyle='#fff';emoji(g,t.def.e,tx,ty+9,28,1);
    if(t.cap>0&&!t.done){g.strokeStyle='#4cc38a';g.lineWidth=4;g.lineCap='round';g.beginPath();g.arc(tx,ty,30,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(t.cap,0,1));g.stroke()}
    g.font='bold 10px sans-serif';g.textAlign='center';const lb=t.done?'✔ '+t.def.n:t.fast?'zu schnell!':t.def.n,lw=g.measureText(lb).width+10;g.fillStyle='rgba(10,20,15,0.72)';rr(g,tx-lw/2,ty+31,lw,15,5);g.fill();g.fillStyle=t.fast?'#ffb0a5':'#fff';g.fillText(lb,tx,ty+42);
    g.restore();
  }
  /* Vögel */
  for(const b of D.birds){
    const bp=birdPos(D,b),bx=bp[0],by=bp[1];
    if(bx<-30||bx>CW+30){
      if((bx<0&&b.vx>0)||(bx>CW&&b.vx<0)){
        const ex=bx<0?16:CW-16,ey=clamp(by,80,CH-100),a=0.55+0.4*Math.sin(tm*14);
        g.save();g.globalAlpha=a;g.fillStyle='#ff4d3d';g.beginPath();g.moveTo(ex,ey-13);g.lineTo(ex+13,ey+11);g.lineTo(ex-13,ey+11);g.closePath();g.fill();
        g.fillStyle='#fff';g.font='bold 14px sans-serif';g.textAlign='center';g.fillText('!',ex,ey+9);g.restore();
      }
      continue;
    }
    drawBirdSprite(g,b.k,bx,by,BIRD_K[b.k].sc,b.vx,b.t*(b.k==='spatz'?15:b.k==='adler'?2.4:8)+b.ph,1,b.k==='adler');
  }
  /* Drohne */
  if(D.mode!=='crashed'){
    const im=img(D.def.img,'svg');
    const w0=dr.w,h0=D.vh;
    g.save();g.translate(px,py);
    const wob=run?Math.sin(tm*9+D.wph)*Math.min(2.2,w*0.18*(dr.sway*3)):0;
    g.rotate(D.tilt+(D.mode==='blown'?Math.sin(tm*7)*0.3:0));if(D.stun>0)g.globalAlpha=0.75+0.25*Math.sin(tm*40);g.translate(wob*0.6,wob*0.4);
    if(im)g.drawImage(im,-w0/2,-h0/2,w0,h0);
    else{g.fillStyle='#ddd';rr(g,-w0/2,-h0*0.3,w0,h0*0.5,8);g.fill()}
    /* sichtbare Rotordrehung */
    const spinF=D.mode==='landed'?Math.max(0,Math.min(1,D.endT/0.9)):Math.min(1,(D.spin||1)*1.4);
    for(const r of dr.rotors){
      const hx=(r[0]-0.5)*w0,hy=(r[1]-0.5)*h0,bl=r[2]*w0,ry=bl*0.15;
      g.fillStyle='rgba(236,242,248,'+(0.5*spinF).toFixed(3)+')';g.beginPath();g.ellipse(hx,hy,bl,ry,0,0,7);g.fill();
      for(let j=0;j<4;j++){const a=D.rot*0.9+j*0.55;g.strokeStyle='rgba(25,30,35,'+((0.7-j*0.14)*spinF).toFixed(3)+')';g.lineWidth=2.8-j*0.45;g.beginPath();g.moveTo(hx-Math.cos(a)*bl,hy-Math.sin(a)*ry);g.lineTo(hx+Math.cos(a)*bl,hy+Math.sin(a)*ry);g.stroke()}
    }
    g.restore();
    if(D.flash>0){g.save();g.globalAlpha=clamp(D.flash,0,1)*0.55;g.fillStyle='#fff';g.fillRect(0,0,CW,CH);g.restore()}
  }
  /* Panel aktualisieren (4×/s) */
  D.hudT-=dt;if(D.hudT<=0){D.hudT=0.25;try{droneHUD()}catch(e){}}
}
function droneHUD(){
  const D=DG,p=$('#dg-pan');if(!p||!D)return;
  const def=D.def,hold=droneHold(def),lim=droneLimit(def),w=D.wEff,wd=(H.wdir||1)>0?1:-1;
  const full=lim*1.35,pg=v=>clamp(v/full*100,0,100);
  const st=D.stress>0?'#ff6b5a':w>hold*0.8?'#ffb54a':'#4cc38a';
  const hm=Math.round(Math.max(0,D.y-D.rest)*0.3),dkm=Math.abs(D.x)/PPK,need=Math.round(D.need||0),low=D.dev.batt<=need*1.08+3,dwy=D.x>40?' voraus':D.x<-40?' zurück':'';
  const ph=D.mode==='rth'?(D.ph==='up'?'⬆ steigt auf sichere Höhe':D.ph==='cross'?'↔ fliegt zum Startpunkt':'⬇ landet'):D.mode==='blown'?'💨 weggepustet!':D.mode==='falling'?'⚠ fällt!':D.mode==='landed'?'✔ gelandet':'';
  const got=D.caught.length,seen=D.targets.filter(t=>!t.done).length;
  p.innerHTML=`<div style="display:flex;align-items:center;gap:8px"><span style="font-size:24px;line-height:1">💨${wd>0?'➡️':'⬅️'}</span>
    <div style="flex:1"><b>${kmh(w)} km/h</b> ${wd>0?'nach rechts':'nach links'} <small>· ${windWord(w)}</small>
    <div class="mbar" style="margin:3px 0 1px"><i style="width:${pg(w)}%;background:${st}"></i><b style="left:${pg(hold)}%;background:#4cc38a"></b><b style="left:${pg(lim)}%;background:#ff6b5a"></b></div>
    <small>stabil bis ${kmh(hold)} · Limit ${kmh(lim)} km/h</small></div></div>
   <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 8px;margin-top:4px;white-space:nowrap"><span style="${low?'color:#ff8a7a;font-weight:700':''}">🔋 ${Math.round(D.dev.batt)} %${D.scout?' <small>(zurück ab '+need+' %)</small>':''}</span><span>⬆ ${hm} m</span>${D.scout?`<span>↔ ${fmtN(dkm,1)} km${dwy}</span>`:''}<span>📷 ${got}${seen?' · '+seen+' offen':''}</span>${D.hints?`<span>💡 ${D.hints}</span>`:''}</div>
   ${low&&D.mode==='fly'&&Math.abs(D.x)>120?`<div style="color:#ff8a7a;font-weight:700">🔋 ${D.dev.batt<need?'Akku reicht nicht mehr für den Rückweg!':'Akku reicht gerade noch zurück – jetzt zurückfliegen!'}</div>`:''}${ph?`<div style="color:#ffd54a">${ph}</div>`:''}${D.msgT>0?`<div style="color:#cdeedd;font-size:12px;margin-top:2px">${esc(D.msg)}</div>`:''}`;
  const rb=$('#dg-rth');if(rb){rb.textContent=D.mode==='rth'?'✖ Abbrechen':'🏠 Rückflug';rb.disabled=D.mode==='landed'||D.mode==='crashed'||D.mode==='blown'||D.mode==='falling'}
}

function askWalker(ic){
  const W=ic.W;if(W)W.wait=true;H.walking=false;
  const resume=()=>{if(W)W.wait=false;if(!H.camp.pitched&&!H.action&&!H.sleep.active)H.walking=true};
  const st=W||{};
  showModal({title:'🙋 Wanderer ansprechen',text:'Du sprichst den Wanderer an. Was möchtest du fragen?',buttons:[
    {label:'🍫 Nach etwas zu essen fragen',fn:()=>{
      if(st.fAsked){toast('🥾 „Ich hab dir doch eben schon geantwortet …“');resume();return}

function repairable(){ // Kandidaten für Notreparatur, schlechtester zuerst
  const ids=[];
  const g=H.g;
  [g.shoes,g.shelter,g.shell,g.bag,g.mid].forEach(x=>{if(x)ids.push(x.id)});
  if(g.tools.poles)ids.push('poles');
  return ids.sort((a,b)=>condOf(a)-condOf(b));
}
function reviveGear(id){ // repariertes Teil wieder einsatzbereit
  const def=gearById(id);if(!def)return;
  if(def.cat==='shoes')H.g.shoes=def;else if(def.cat==='shelter')H.g.shelter=def;else if(def.cat==='shell')H.g.shell=def;
  else if(def.cat==='bag')H.g.bag=def;else if(def.cat==='mid')H.g.mid=def;else if(id==='poles')H.g.tools.poles=true;
}
function breakGear(id){
  const def=gearById(id);if(!def)return;
  H.cond[id]=0;
  if(def.cat==='shoes')H.g.shoes=null;else if(def.cat==='shelter'){H.g.shelter=null;H.camp.pitched=false}else if(def.cat==='shell')H.g.shell=null;
  else if(id==='poles')H.g.tools.poles=false;
  toast('💥 '+def.name+' ist kaputt!'+(H.repairs>0?' Mit dem Reparaturset kannst du es flicken.':''),'bad');sfx('bad');
}
function wear(id,amt){
  if(H&&H.hk&&H.hk.km<=30)amt*=0.1;   // kleine Wanderungen: kaum Verschleiß
  if(!id||H.cond[id]===undefined||H.cond[id]<=0)return;
  H.cond[id]=Math.max(0,H.cond[id]-amt);
  if(H.cond[id]<=0)breakGear(id);
  else if(H.cond[id]<25&&!H['w_'+id]){H['w_'+id]=1;toast('⚠️ '+gearById(id).name+' ist stark abgenutzt ('+Math.round(H.cond[id])+' %).','warn')}
}

/* ---------- Sammeln & Angeln ---------- */
function doForage(f){
  const F=FORAGE[f.f];
  beginAction('forage','Sammelt '+F.name+' …',F.time,()=>{
    f.done=true;
    let n=Math.round(rnd(F.min,F.max));if(hasT('natur'))n*=2;
    if(f.f==='beeren'&&env.month===5)n=Math.max(1,Math.round(n/2));
    H.food[F.food]=(H.food[F.food]||0)+n;H.stats.forage+=n;
    toast('🧺 '+n+'× '+gearById(F.food).name.replace(/ \((kochen|garen)\)/,'')+' gesammelt.','good');sfx('notify');
    if(F.risky&&!hasT('natur')&&Math.random()<0.17-0.012*ES('food')){
      H.sick=H.t+600;toast('🤢 Ein Pilz war doch nicht bekömmlich – du bist krank (10 h). Talent „Naturkundler“ verhindert das.','bad');injuryAlert('Mir wird übel – der Pilz war wohl nicht gut.');
    }
  });
}
function fishSpot(){
  if(featNear('fluss',H.x,90))return 'fluss';
  if(!H.side)for(const l of (H.route.lakes||[]))if(H.x>l.xl-140&&H.x<l.xr+140)return 'see';
  return null;
}
function fishPick(w){
  const mul=w==='fluss'?{trout:1.6,salmon:1.4,perch:0.7,pike:0.4}:{perch:1.4,pike:1.8,trout:0.7,salmon:0.1};
  const pool=FOODS.filter(x=>x.fish),wt=x=>x.w*(mul[x.id]||1);
  let r=Math.random()*pool.reduce((a,x)=>a+wt(x),0),fish=pool[0];
  for(const x of pool){r-=wt(x);if(r<=0){fish=x;break}}
  return fish;
}
function fishLand(fish){
  const nm=fish.name.replace(/ \((kochen|garen)\)/,'');
  H.food[fish.id]=(H.food[fish.id]||0)+1;H.stats.fish++;
  toast('🎣 Gefangen! '+fish.e+' '+nm+' – zum Essen musst du ihn garen.','good');sfx('success');
  const dev=handheld();if(dev&&H.rec>0)addClip({key:'fang:'+fish.id,type:'fang',name:'Fang: '+nm,e:fish.e,q:shotQ(dev.def,1),value:fish.clip*shotQ(dev.def,1),rar:-1});
}
function fishSession(w,mins){
  const seasonF={Sommer:1.15,Herbst:1.0,Frühling:0.85,Winter:0.4}[env.season]||1;
  const luck=rnd(0.5,1.5)*seasonF*(hasT('natur')?1.25:1)*(w==='fluss'?1.1:1);
  let bite=false;
  beginAction('fish','Angelt …',mins,()=>{if(!bite)toast('🎣 Nichts gebissen – heute ist wohl nichts los.')},{tick:h=>{
    if(!H.action||bite)return;
    if(Math.random()<0.0105*luck*h*1.5){bite=true;const rem=H.action.left;H.action.left=0;setTimeout(()=>fishFight(w,fishPick(w),rem),60)}
  }});
}

  };
  const step=ts=>{
    if(done)return;

    if(ph==='wait'){pt-=dt;if(pt<=0){if(fake){fake=false;ph='nibble';pt=rnd(0.7,1.3);msg='Da zupft was …'}else{ph='bite';pt=rnd(0.85,1.15)*wide*(1.1-0.2*Math.min(str,1.3));msg='BISS! Jetzt anschlagen!';sfx('success')}}}

      if(hold){T+=(24+24*pull)*dt;P+=(13-7*Math.min(1,pull))*dt}
      else{T-=(28-6*pull)*dt;P-=(pull>0.4?9*pull:1.2)*dt}
      T=clamp(T,0,100);
      if(T>=100){msg='Die Schnur ist gerissen!';ph='over';result='lost';endT=1.4}
      else{
        if(T<6)slack+=dt;else slack=Math.max(0,slack-dt);

      }
      P=clamp(P,0,100);
    }
    else if(ph==='over'){endT-=dt;if(endT<=0){finish(result);return}}
    draw();requestAnimationFrame(step);
  };
  const me={title:'🎣 Angeln – '+(w==='fluss'?'am Fluss':'am See'),html,buttons:[{label:'Angel einpacken',fn:()=>finish('quit')}],

}

function comfortTemp(sleeping){
  const g=H.g;
  let c=17-4-(g.mid?g.mid.ins*cf(g.mid.id):0)-(g.shell?g.shell.ins:0)-1.3*ES('kalt');
  if(sleeping)c-=(17-(g.bag?g.bag.rating:17))*0.6*(g.bag?(0.7+0.3*cf(g.bag.id)):1);
  return c;
}
const VEST_HEAT=[0,3,5,8],VEST_DRAIN=[0,100/24,100/16,100/10],VEST_NAME=['Aus','Schwach','Mittel','Stark'];
const vestOn=()=>!!H.dev.vest&&H.vestMode>0&&deviceOK('vest');
function effTemp(mode){
  if(H.indoor==='lodge')return 17+(H.lodge?H.lodge.tier*1.5:0);
  if(H.indoor==='shelter'){let E=env.temp+3-env.wind*0.5*0.35-H.body.wet/100*9;if(mode!=='walk'&&H.g.mat)E+=H.g.mat.warm;if(nearFire())E+=6;if(H.dog&&mode!=='walk')E+=1.5;if(vestOn())E+=VEST_HEAT[H.vestMode];return E}
  const g=H.g,sh=H.camp.pitched?g.shelter:null;
  let E=env.temp;
  const windP=Math.max(sh?sh.wind*cf(sh.id):0,g.shell?g.shell.wind:0);
  E-=env.wind*0.5*(1-windP);
  E-=H.body.wet/100*9;
  if(mode==='walk')E+=11;
  if(sh&&mode!=='walk')E+=sh.warm*cf(sh.id);
  if((mode==='sleep'||(sh&&mode!=='walk'))&&g.mat)E+=g.mat.warm;
  if(mode!=='walk'&&nearFire())E+=H.fire.left>110?10:6;
  if(H.dog&&mode!=='walk')E+=1.5;
  if(vestOn())E+=VEST_HEAT[H.vestMode];
  return E;
}
function sleepQuality(){
  const g=H.g,B=H.body,sh=H.camp.pitched?g.shelter:null;
  const deficit=comfortTemp(true)-effTemp('sleep');
  let q=1-0.12*Math.max(0,deficit);
  if(H.indoor==='lodge'){q=0.86+(H.lodge?H.lodge.tier*0.04:0)}
  else if(H.indoor==='shelter'){q-=0.04}
  else if(!sh){q-=0.15;if(env.precip)q-=0.2;if(env.wind>12)q-=0.1}
  if(!g.mat)q-=0.1;
  if(B.wet>40&&!H.indoor)q-=(B.wet-40)/100*0.5;
  if(isInjured())q-=0.05;
  if(B.sat<25||B.hyd<25)q-=0.1;
  if(env.sun>0.6&&!env.midnightSun&&!H.indoor)q*=0.8;
  if(H.dog)q+=0.04;
  if(H.stalker)q-=0.15;
  if(H.stim.crash>1&&H.t<H.stim.crashEnd)q-=0.04;
  return clamp(q,0.2,1);
}
function sleepNeedH(){
  const hour=env.hour,bed=hour<12?hour+24:hour;
  const late=0.5*Math.max(0,bed-22);
  const awakeH=(H.t-H.awakeSince)/60;
  const extra=0.15*Math.max(0,awakeH-16);
  return clamp(4+(100-H.body.energy)/100*4+late+extra+H.fatigue*0.06-(hasT('frueh')?1:0),3.5,11.5);
}
function startSleep(rest){
  if(H.sleep.active)return;
  const need=rest===true?1.5:sleepNeedH();
  if(!H.camp.pitched)H.camp.x=H.x;
  H.sleep={active:true,need,q:sleepQuality(),startE:H.body.energy,p:0,elapsed:0,qsum:0,begun:H.t,rest:rest===true};
  H.walking=false;H.charging=H.charging;
  toast(rest===true?'🛌 Du ruhst dich im Schutz deines Lagers aus … (ca. 1,5 h)':'😴 Du schläfst ein … (Bedarf ca. '+fmtN(need)+' h bei Qualität '+Math.round(H.sleep.q*100)+' %)');
}
function stepSleep(h){
  const S=H.sleep;S.q=sleepQuality();S.elapsed+=h;S.qsum+=S.q*h;
  S.p+=h/(S.need*60)*S.q;
  if(H.indoor==='lodge')H.body.wet=Math.max(0,H.body.wet-h*0.25);
  H.fatigue=Math.max(0,H.fatigue-h/60*0.42*S.q*(S.rest?0.3:1));
  H.body.energy=lerp(S.startE,S.rest?lerp(S.startE,100-H.fatigue,0.4):100-H.fatigue,clamp(S.p,0,1));
  if(S.p>=1||S.elapsed>14*60)wakeUp();
}
function wakeUp(early){

    if(T>=2)for(const id in H.dev)if(!H.dev[id].broken)H.dev[id].batt=100;
    if(T>=3&&!(H.lodge&&H.lodge.got))H.body.sat=Math.min(100,H.body.sat+30);
    if(T>=2)toast('🔌 Über Nacht sind alle Geräte aufgeladen.'+(T>=3?' Frühstück inklusive (+30 Nahrung).':''),'good');
    if(!H.lodge||!H.lodge.until||H.t>=H.lodge.until)H.lodge=null;else H.lodge.got=true}
  H.sleep={active:false};H.awakeSince=H.t;H.stats.sleepH+=hrs;if(!S.rest)H.sleptTonight=true;
  if(wasIn==='shelter')toast('🛖 Du hast im Windschutz geschlafen ('+fmtN(hrs)+' h, Qualität Ø '+Math.round(avg*100)+' %).','good');else if(wasIn)toast('🏨 Du hast in der Herberge geschlafen ('+fmtN(hrs)+' h, Qualität Ø '+Math.round(avg*100)+' %).'+(H.lodge?' Das Zimmer bleibt dir bis zum Check-out offen.':' Ausgecheckt.'),'good');else toast(S.rest?'🛌 Ausgeruht nach '+fmtN(hrs)+' h. Lager abbauen nicht vergessen.':(early?'⏰ Schlaf abgebrochen nach ':'☀️ Aufgewacht nach ')+fmtN(hrs)+' h (Qualität Ø '+Math.round(avg*100)+' %).'+(early&&S.p<0.9?' Du bist noch müde.':'')+(H.autoNight?'':' Lager abbauen nicht vergessen.'),'good');sfx('notify');
  if(S.p<1)H.body.energy=Math.min(100-H.fatigue,lerp(S.startE,S.rest?lerp(S.startE,100-H.fatigue,0.4):100-H.fatigue,clamp(S.p,0,1)));
  if(H.autoNight&&!S.rest){H.autoWake=true}

function autoNightTick(){

function stimDrain(){

function bodyTick(mode,hr){
  const B=H.body,g=H.g,hk=H.hk;
  const lf=loadKg()/capacityKg();const gr=env.grade;
  const sick=H.sick>H.t,blister=H.inj.blister>H.t,sprain=H.inj.sprain>H.t;
  if(mode==='walk'){
    let d=(7+40*Math.max(0,gr)+9*Math.max(0,-gr-0.08))*Math.max(0.45,1.45-0.09*ES('aus'))*(0.6+0.8*clamp(lf,0,1.4));
    if(g.tools.poles&&gr>0.03)d*=0.88;
    d*=1+0.35*env.snow*(g.tools.snowshoes?0.3:1);
    if(B.sat<20)d*=1.3;if(B.hyd<25)d*=1.4;if(B.warm<50)d*=1+(50-B.warm)/120;if(sick)d*=1.3;
    if(blister)d*=1.32;if(sprain)d*=1.18;
    if(H.shot&&H.shot.type!=='drone')d*=0.9;
    d*=lerp(1,hk.hard,0.5)*stimDrain();
    if(H.dog)d*=H.dog.mood>60?0.96:H.dog.mood<30?1.03:1;
    if(H.stalker)d*=1.08;
    B.energy-=d*(1+0.08*H.gap)*hr;
  }else if(mode==='rest'){
    let r=14;if(B.sat<10||B.hyd<10)r*=0.4;if(sick)r*=0.6;
    B.energy+=r*hr;
  }
  B.energy=clamp(B.energy,0,100-H.fatigue);
  if(mode==='walk')H.fatigue=Math.min(45+Math.min(30,8*H.gap),H.fatigue+hr*(0.26*hk.hard*(B.sat<30?1.4:1)+0.10*H.gap));
  else if(mode==='rest')H.fatigue=Math.max(0,H.fatigue-hr*0.05);
  const fm=1.35-0.1*ES('food'),wm=1.35-0.1*ES('water');
  const heat=env.temp>24?1+(env.temp-24)*0.04:1;
  B.sat-=({walk:6.5,rest:2.8,sleep:1.6}[mode])*Math.max(0.5,fm)*hr;
  B.hyd-=({walk:8,rest:3,sleep:1.2}[mode])*Math.max(0.5,wm)*heat*(sick?1.6:1)*hr;
  B.sat=clamp(B.sat,0,100);B.hyd=clamp(B.hyd,0,100);
  // Nässe
  const sh=H.camp.pitched?g.shelter:null;
  let gain=(mode==='walk'&&BIOMES[env.biome].feet)?BIOMES[env.biome].feet*(1-(g.shoes?g.shoes.wetRes*0.2:0)):0;
  if(env.precip){
    const protect=sh?sh.rain*cf(sh.id):(g.shell?g.shell.rain*cf(g.shell.id):0);
    gain=22*env.rainI*(1-protect)*BIOMES[env.biome].rain*(1-(g.shoes?g.shoes.wetRes*0.2:0));
    if(mode!=='sleep'&&g.shell&&!sh)wear(g.shell.id,0.45*hr);
  }
  let dry=2.5+(env.sun>0.8&&(H.weather.type==='klar'||H.weather.type==='wolkig')?6:0)+(mode==='walk'?3:0)+(mode!=='walk'&&nearFire()?22:0)+(sh?(mode==='sleep'?4.5:2):0);
  if(gain>0)dry*=0.3;
  B.wet=clamp(B.wet+(gain-dry)*hr,0,100);
  // Wärme
  const inBag=mode==='sleep'||(mode==='rest'&&sh&&g.bag);
  const E=effTemp(mode),c=comfortTemp(inBag);
  H.deficit=c-E;
  if(H.deficit>0){B.warm-=H.deficit*2*hr;xpAdd('kalt',0.05*hr*60)}else B.warm+=15*hr;
  B.warm=clamp(B.warm,0,100);

  if(B.warm<45&&H.t-H.coldCd>150&&!H.sleep.active){H.coldCd=H.t;toast('🥶 Dir wird kalt (Wärme '+Math.round(B.warm)+' %). Wärmere Kleidung, Feuer, Zelt oder Bewegung helfen.','warn');sfx('warn')}
  // Verletzungen
  if(mode==='walk'){
    const shoeF=g.shoes?g.shoes.blister*(1+(1-cf(g.shoes.id))*1.2):1.8;
    if(!blister&&Math.random()<0.02*shoeF*(1+B.wet/50)*(0.85+0.15*hk.hard)*hr){H.inj.blister=H.t+(hasT('zaeh')?900:1440);toast('🩹 Du hast dir eine Blase gelaufen – das kostet spürbar Energie und Tempo.','bad');injuryAlert('Aua – ich glaub, ich hab mir eine Blase gelaufen.');sfx('bad')}
    const ls=lightSource();
    const risky=(gr<-0.12?1:0)+(env.dark>0.6?lightRisk():0)+(B.wet>60?0.5:0)+(env.precip?0.3:0)+env.snow*0.4;
    if(!sprain&&Math.random()<0.018*risky*(1+0.12*H.gap)*(g.tools.poles?0.5:1)*hk.hard*hr){H.inj.sprain=H.t+1440;toast('🦶 Du bist umgeknickt – langsameres Gehen.','bad');injuryAlert('Autsch, umgeknickt!');if(g.tools.poles&&Math.random()<0.2)wear('poles',60)}
  }
  let dhp=0;
  if(B.sat<=0)dhp-=3;if(B.hyd<=0)dhp-=6;if(B.warm<15)dhp-=4;if(B.warm<=0)dhp-=6;if(sick)dhp-=0.8;
  if(dhp===0&&B.sat>40&&B.hyd>40&&B.warm>50)dhp+=(mode==='sleep'?5:mode==='rest'?2.5:1)*(hasT('zaeh')?1.5:1);
  B.hp=clamp(B.hp+dhp*hr,0,100);
  if(B.hp<=0&&!H.ended)endHike('rescue');
}
/* ---------- Geräte, Akkus, Powerbank ---------- */
function pbTotal(){return H.pbs.reduce((a,p)=>a+p.left,0)}
function pbCapTotal(){return H.pbs.reduce((a,p)=>a+p.cap,0)}
function pbDraw(units){let need=units;for(const p of H.pbs){const t=Math.min(p.left,need);p.left-=t;need-=t;if(need<=0)break}return units-need}
function solarEff(){const SU=H.solarUp;if(!SU)return 0;let d=Math.abs(((env.hour-SU.aim+12)%24+24)%24-12);return clamp(1-d/3,0,1)}
function pbFill(units){let rest=units;for(const p of H.pbs){const t=Math.min(p.cap-p.left,rest);p.left+=t;rest-=t;if(rest<=0)break}}
function deviceTick(hr,mode){
  const walking=mode==='walk',live=H.live&&H.action&&H.action.kind==='live';
  const np=navPhone();
  for(const id in H.dev){
    const d=H.dev[id],def=d.def;if(d.broken)continue;
    let drain=0;
    // Geräte, die nicht genutzt werden, sind aus bzw. im Flugmodus: kein Verbrauch
    if(def.kind==='phone'||def.kind==='cam'){
      if(H.activeDev===id&&H.rec>0&&(walking||H.shot))drain+=def.rate*H.rec;
      if(live&&H.activeDev===id)drain+=def.rate*2.5;
      if(walking&&np&&np.id===id)drain+=0.9;
      if(walking&&env.dark>0.55&&!lightDev()&&lightSource()==='phone'&&H.g.phones.find(p=>deviceOK(p.id)).id===id)drain+=13;
    }else if(id==='gps'){if(walking)drain=0.8}
    else if(LIGHTS[id]){const b=lightDev();if(walking&&env.dark>0.55&&b&&b.id===id&&streetF()<b.L.f)drain=LIGHTS[id].drain}
    else if(id==='vest'){drain=VEST_DRAIN[H.vestMode]||0}
    d.batt=Math.max(0,d.batt-drain*hr);
    if(d.batt<=0&&!d.warned){d.warned=true;toast('🪫 Akku leer: '+def.name,'bad');sfx('batt')}
    else if(d.batt<=15&&d.batt>0&&!d.lowW){d.lowW=true;toast('🪫 Akku fast leer: '+def.name+' ('+Math.round(d.batt)+' %)','warn');sfx('batt')}
    if(d.batt>20)d.lowW=false;
    if(d.batt>10)d.warned=false;
    if(drain>0){const p=0.5*(def.fragile||0.0004)*(env.precip?3:1)*(hasWaterProof(id)?1:1)*hr;
      if(Math.random()<p){d.broken=true;H.cond[id]=0;toast('💥 '+def.name+' ist kaputtgegangen!','bad');sfx('bad')}}
  }
  // Solar → Powerbank (Mini-Panel nur beim Gehen, großes Panel nur aufgestellt und zur Sonne ausgerichtet)
  if(H.pbs.length&&pbTotal()<pbCapTotal()&&env.sun>0.35&&(H.weather.type==='klar'||H.weather.type==='wolkig')){
    const klar=H.weather.type==='klar',sf=Math.min(1,env.sun+0.25);
    if(H.g.solar&&walking)pbFill((klar?6:2)*sf*hr);
    const SU=H.solarUp;
    if(H.g.solarBig&&SU){const eff=solarEff();pbFill((klar?45:16)*eff*sf*hr)}
  }
  // Laden (Auswahl des Spielers)
  if(H.charging){
    const d=H.dev[H.charging];
    if(!d||d.broken||d.batt>=99.9){if(d&&!d.broken)toast('🔋 '+d.def.name+' ist voll geladen.','good');H.charging=null}
    else if(pbTotal()<=0.5){toast('🪫 Powerbank leer – Ladevorgang beendet.','warn');H.charging=null}
    else{const add=Math.min(100-d.batt,1.6*60*hr);const got=pbDraw(add/0.9)*0.9;d.batt=Math.min(100,d.batt+got)}
  }
}
const hasWaterProof=()=>false;
/* ---------- Zündquellen, Mücken, Pollen, Thumbnail, Flaggen ---------- */
function pickIgniter(){const g=H.g,wet=(H.mWet||0)>50;

function hopAt(pr){ // Stein-zu-Stein-Sprung: Kontaktphase (Landen/Abstoßen) + Flugphase mit Bogen, Beine wechseln
  const wp=H.crossing.wp,m=wp.length-1,sS=clamp(pr,0,0.99999)*m,i=Math.floor(sS),u=sS-i,fl=clamp((u-0.3)/0.7,0,1),c=clamp(u/0.3,0,1);
  const off=j=>(j>0&&j<m)?-9:0,d=wp[i+1]-wp[i];
  return {x:wp[i]+d*fl,dy:lerp(off(i),off(i+1),fl)-Math.sin(Math.PI*fl)*clamp(9+d*0.1,11,20),air:fl,c,leg:i%2,fly:fl>0}
}
function startCross(L,kind,dur,done){
  const x0=H.x,x1=Math.min(H.route.totalPx,L.xr+70),label={detour:'Umrundet den See …',swim:'Schwimmt durch den See …',boat:'Rudert über den See …',ice:'Geht über das Eis …',wade:'Springt von Stein zu Stein …'}[kind];
  H.crossing={kind,x0,x1,L};H.hopPr=0;H.hop=null;
  if(kind==='wade'&&L.ford){const wp=[x0];for(const st of fordStones(L.ford))if(st.x>wp[wp.length-1]+22&&st.x<x1-30)wp.push(st.x);wp.push(Math.max(x1,wp[wp.length-1]+40));H.crossing.wp=wp}
  const fin=()=>{H.crossing=null;H.hop=null;H.detourDy=0;H.x=x1;H.km=H.x/PPK;if(done)done();H.walking=true};
  beginAction('ford',label,dur,fin,{tick:h=>{const pr=clamp(1-H.action.left/dur,0,1);H.x=lerp(x0,x1,pr);if(H.crossing&&H.crossing.wp){H.hopPr=pr;H.hop=hopAt(pr)}H.km=H.x/PPK;H.phase+=h*0.35;
    H.detourDy=kind==='detour'?34*Math.sin(Math.PI*pr):kind==='swim'?8:0}});
}

function lodgeUntil(){const d0=Math.floor(H.t/1440),h=(H.t/60)%24;return (d0+(h<11?0:1))*1440+660}
function lodgePrice(f,t){const base=f.type==='lodge'?(f.kind==='stuga'?[0,35,70]:[0,32,62,110]):[0,30,58,95];return base[t]||0}
function lodgeTiers(f){return f.type==='lodge'?(f.kind==='stuga'?[1,2]:[1,2,3]):[1,2,3]}
function lodgeBookable(f){return f.type==='village'?!!f.town:(f.type==='lodge'&&(f.kind==='stuga'||f.kind==='huette'))}
function lodgeFreeKind(f){return f.type==='lodge'&&(f.kind==='shelter'||f.kind==='bothy')}
function lodgeFull(f,tier,dayIdx,walkin){
  let h=5381;for(const ch of H.hk.id+':'+f.id+':'+tier+':'+dayIdx)h=((h*33)^ch.charCodeAt(0))>>>0;
  const r=mulberry32(h)();
  const m=dateOf(hday()).m,seas=(m>=5&&m<=8)?1.6:(m===4||m===9)?1.1:(m>=10||m<=2)?0.4:0.8;
  const base=f.type==='village'?0.10:f.kind==='stuga'?0.22:f.kind==='huette'?0.28:f.kind==='bothy'?0.32:0.28;
  const pop=H.hk.diff>=4?1.15:1;
  const p=clamp(base*seas*pop+(tier===1?0.07:0)+(walkin?0.12:0),0.03,0.85);
  return r<p;
}

function strHash(t){let h=5381;for(const ch of String(t))h=((h*33)^ch.charCodeAt(0))>>>0;return h}
function shelterGuests(f){
  if(!H||!H.hk||!lodgeFreeKind(f))return null;
  const hr=(H.t/60)%24,d=Math.floor(H.t/1440),dd=hr<10?d-1:d;
  if(H.shTaken&&H.shTaken[f.id+':'+dd])return null;

  const r=mulberry32(strHash(H.hk.id+'|'+f.id+'|g'+dd)),arr=16.5+r()*2,bed=Math.min(arr+3+r()*1.5,23.5),dep=24+7+r()*2.2,n=r()<0.4?2:1;
  const looks=[];for(let i=0;i<n;i++)looks.push({skin:Math.floor(r()*5),hair:Math.floor(r()*7),style:Math.floor(r()*6),beard:r()<0.3?1+Math.floor(r()*2):0,glasses:r()<0.2?1+Math.floor(r()*2):0,build:Math.floor(r()*3),jacket:Math.floor(r()*8),pants:Math.floor(r()*5)});
  const h2=(H.t-dd*1440)/60;
  if(h2<arr||h2>dep+0.7)return null;
  return {n,looks,arr,bed,dep,h2,dd};
}
function drawShelterGuests(g,tm,f,sx,y){

  else{g.fillStyle=tc('#3a3a3a');for(let k=0;k<5;k++){g.beginPath();g.ellipse(fxw-sx+sx-10+k*5,groundY(fxw)+2,3,1.8,0,0,7);g.fill()}}
  const leaving=S.h2>S.dep-0.4,awake=S.h2<S.bed;
  if(leaving){
    const u=clamp((S.h2-(S.dep-0.4))/1.1,0,1);if(u>=1)return;
    S.looks.forEach((L,i)=>{const wx=f.x+sd*10+i*40+u*760,sx2=wx-camX,gy=groundY(wx);if(sx2<-80||sx2>CW+80)return;g.save();g.translate(sx2,0);drawHiker(g,0,gy,1.15,{look:L,phase:tm*6+i,mode:'walk',packColor:pk[(i+S.dd)%4],tm,poles:false});g.restore()});

  }else{
    const sc=S.n>1?0.42:0.5;

  }
}
