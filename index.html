/* ---------- Hund ---------- */
function drawDog(g,x,y,D,gd,mode,ph,t,packCol){
  const s=D.scale*1.35,col=DOG_COLORS[gd.color],dk=shade(col,-0.28),lt=shade(col,0.3);
  g.save();g.translate(x,y);g.scale(s,s);g.lineCap='round';g.lineJoin='round';
  if(mode==='sleep'){
    g.fillStyle=col;g.beginPath();g.ellipse(0,-7,17,8,0,0,7);g.fill();
    g.fillStyle=dk;g.beginPath();g.ellipse(-14,-9,7,5.5,0.4,0,7);g.fill();
    g.beginPath();g.ellipse(-19,-6,4,3,0,0,7);g.fill();
    if(gd.patch){g.fillStyle=lt;g.beginPath();g.ellipse(2,-3,9,3.5,0,0,7);g.fill()}
    g.restore();return;
  }
  const sit=mode==='sit';
  const cyc=mode==='walk'?ph:0;
  const wag=Math.sin(t*(mode==='walk'?11:7))*0.5;
  // Schwanz
  g.strokeStyle=dk;g.lineWidth=3.4;g.beginPath();
  if(sit){g.moveTo(-14,-4);g.quadraticCurveTo(-24,-4,-26+wag*4,-9)}
  else{g.moveTo(-16,-19);g.quadraticCurveTo(-25,-27+wag*4,-24+wag*5,-33)}
  g.stroke();
  // Beine
  g.strokeStyle=dk;g.lineWidth=4.2;
  if(sit){ln(g,-8,-8,-6,-1);ln(g,10,-9,12,-1);ln(g,4,-9,6,-1)}
  else{
    const a=Math.sin(cyc)*7,b=Math.sin(cyc+Math.PI)*7;
    ln(g,-11,-12,-11+a,-1);ln(g,-6,-12,-6+b,-1);ln(g,9,-12,9+b,-1);ln(g,14,-12,14+a,-1);
  }
  // Körper
  g.fillStyle=col;
  if(sit){g.beginPath();g.ellipse(-2,-13,15,10,-0.5,0,7);g.fill()}
  else{g.beginPath();g.ellipse(0,-19+(mode==='walk'?Math.sin(cyc*2)*0.7:0),18,8.5,0,0,7);g.fill()}
  if(gd.patch){g.fillStyle=lt;g.beginPath();g.ellipse(sit?0:2,sit?-9:-15,10,3.6,sit?-0.5:0,0,7);g.fill()}
  // Rucksack
  if(packCol){g.fillStyle=packCol;rr(g,sit?-8:-8,sit?-25:-30,15,9,3);g.fill();g.fillStyle='rgba(0,0,0,.25)';g.fillRect(sit?-8:-8,sit?-19:-24,15,1.6)}
  // Kopf
  const hxx=sit?13:19,hyy=sit?-27:-27+(mode==='walk'?Math.sin(cyc*2)*0.7:0);
  g.fillStyle=col;g.beginPath();g.arc(hxx,hyy,7,0,7);g.fill();
  g.fillStyle=lt;g.beginPath();g.ellipse(hxx+6,hyy+2.5,5,3.5,0.1,0,7);g.fill();
  g.fillStyle='#111';g.beginPath();g.arc(hxx+10,hyy+1.4,1.5,0,7);g.fill();
  g.beginPath();g.arc(hxx+2.5,hyy-1.5,1.2,0,7);g.fill();
  g.fillStyle=dk;g.beginPath();g.moveTo(hxx-4,hyy-4);g.lineTo(hxx-1,hyy-13+Math.sin(t*3)*0.6);g.lineTo(hxx+3,hyy-5);g.closePath();g.fill();
  g.restore();
}

/* =====================================================================
   Teil 5b: Zeichnen – Himmel, Licht, Gelände, Wälder, Wetter, Lager
   ===================================================================== */
let CC={},NM_=0,NM_cnt=0,LC=null,LG=null;
const NIGHT=[14,22,46];
function tc(h,snow=0){const k=h+snow.toFixed(1)+'|'+Math.round(NM_*20);if(CC[k])return CC[k];if(NM_cnt++>4000){CC={};NM_cnt=0}let c=hex(h);if(snow>0)c=mix(c,[241,244,248],snow);c=mix(c,NIGHT,NM_);return CC[k]=rgb(c)}
const SKYG={klar:0,wolkig:0.2,nebel:0.65,regen:0.5,gewitter:0.72,sturm:0.45};

function sunPos(){
  const az=Math.sin((env.hour-12)*Math.PI/12);
  return {x:CW*(0.5+0.44*az),y:CH*0.68-clamp(env.sunAlt,-4,70)/70*CH*0.52};
}
function skyCols(){
  const L=env.sun,tw=env.gold,gray=SKYG[H.weather.type];
  let top=mix(hex('#050b22'),hex('#3f8fdc'),L),bot=mix(hex('#101b3c'),hex('#b6dff5'),L);
  bot=mix(bot,hex('#ff9a55'),tw*0.78*(1-gray*0.6));top=mix(top,hex('#5d4a94'),tw*0.42*(1-gray*0.6));
  const gc=mix(hex('#333c4a'),hex('#8d9aa5'),L);
  top=mix(top,gc,gray);bot=mix(bot,gc,gray*0.9);
  return {top,bot,gray};
}
function drawSky(g,tm){
  const {top,bot,gray}=skyCols(),L=env.sun,tw=env.gold;
  const gr=g.createLinearGradient(0,0,0,CH*0.78);gr.addColorStop(0,rgb(top));gr.addColorStop(0.62,rgb(mix(top,bot,0.75)));gr.addColorStop(1,rgb(bot));
  g.fillStyle=gr;g.fillRect(0,0,CW,CH);
  const sp=sunPos();
  // Sterne
  if(L<0.65&&gray<0.5){
    g.fillStyle='#fff';
    for(let i=0;i<110;i++){const tw2=0.6+0.4*Math.sin(tm*(1+hash(i)*2)+i);g.globalAlpha=(1-L)*(0.3+0.5*hash(i*5+2))*(1-gray*1.6)*tw2;const s=hash(i+50)>0.92?2.4:1.5;g.fillRect(hash(i)*CW,hash(i+300)*CH*0.58,s,s)}
    g.globalAlpha=1;
  }
  // Nordlicht
  if(env.aurora){
    g.save();g.globalCompositeOperation='lighter';
    for(let c=0;c<3;c++){
      const baseY=CH*(0.16+c*0.07),hue=c===1?[140,255,190]:[90,255,140];
      for(let x=0;x<=CW;x+=7){
        const w=Math.sin(x*0.006+tm*(0.35+c*0.12)+c*2)*0.5+Math.sin(x*0.013-tm*0.5)*0.3;
        const y=baseY+w*38,hgt=90+40*Math.sin(x*0.009+tm*0.6+c);
        const a=0.16*(0.5+0.5*Math.sin(x*0.004+tm*0.3+c*1.7))*(0.5+0.5*env.dark);
        const lg=g.createLinearGradient(0,y,0,y+hgt);lg.addColorStop(0,rgb(hue,0));lg.addColorStop(0.25,rgb(hue,a));lg.addColorStop(1,rgb(hue,0));
        g.fillStyle=lg;g.fillRect(x,y,8,hgt);
      }
    }
    g.restore();
  }
  // Sonne
  if(env.sunAlt>-3.5){
    const a=clamp(env.sunAlt,0,60);
    const col=mix(hex('#fff6c0'),hex('#ff7a2e'),clamp(1-a/16,0,1));
    const rad=70+clamp(1-a/25,0,1)*120;
    const gl=g.createRadialGradient(sp.x,sp.y,4,sp.x,sp.y,rad);gl.addColorStop(0,rgb(col,0.75*(1-gray*0.7)));gl.addColorStop(1,rgb(col,0));
    g.fillStyle=gl;g.fillRect(sp.x-rad,sp.y-rad,rad*2,rad*2);
    if(gray<0.75){g.fillStyle=rgb(col,1-gray*1.1);g.beginPath();g.arc(sp.x,sp.y,20+clamp(1-a/20,0,1)*7,0,7);g.fill()}
    if(tw>0.2&&gray<0.5){ // Horizontglühen
      const hg=g.createRadialGradient(sp.x,CH*0.66,10,sp.x,CH*0.66,CW*0.5);hg.addColorStop(0,rgb([255,150,80],0.35*tw));hg.addColorStop(1,rgb([255,150,80],0));
      g.fillStyle=hg;g.fillRect(0,CH*0.25,CW,CH*0.5);
    }
  }
  // Mond
  const mAlt=-env.sunAlt;
  if(mAlt>-3&&env.dark>0.35&&gray<0.75){
    const az=Math.sin((env.hour-12)*Math.PI/12),mx=CW*(0.5-0.44*az),my=CH*0.66-clamp(mAlt,-4,65)/65*CH*0.5;
    const gl=g.createRadialGradient(mx,my,4,mx,my,70);gl.addColorStop(0,'rgba(200,215,255,0.35)');gl.addColorStop(1,'rgba(200,215,255,0)');
    g.fillStyle=gl;g.fillRect(mx-70,my-70,140,140);
    const ph=((G.day%29.5)/29.5);g.fillStyle=rgb([238,241,250],1-gray);g.beginPath();g.arc(mx,my,15,0,7);g.fill();
    g.fillStyle='rgba(16,24,52,0.85)';const off=(ph<0.5?ph*2:(1-ph)*2);g.beginPath();g.arc(mx+(ph<0.5?-1:1)*(15-off*15)*(1),my,14.5*(1-Math.abs(0.5-ph)*0.2),0,7);if(Math.abs(ph-0.5)>0.05)g.fill();
  }

/* ---------- Wehende & fliegende Blätter ----------
   Blätter lösen sich nur von gezeichneten Laub-/Birkenkronen (also nur in Wäldern bzw. an Bäumen).
   Menge, Tempo und Wirbel wachsen mit dem Wind in Kronenhöhe (H.weather.wind, nicht der abgeschwächte Bodenwind im Wald).
   Farbe und Menge folgen der Jahreszeit; unter Schnee fallen keine Blätter. */
const CROWNS=[],LEAVES=[];
function leafPalette(){
  const m=env.month;
  if(m===9)return{k:1.6,c:['#e0a82a','#d9702a','#c0392b','#e8c63a','#b8541f']};          // Oktober: Laubfärbung
  if(m===10)return{k:1.3,c:['#b8812f','#9a5f25','#8a4a22','#c9a040']};                      // November: braun
  if(m===8)return{k:1.0,c:['#c9b43a','#e0a030','#7ba540','#d98a2b','#5da33f']};             // September: gelb-grün
  if(m===11||m<2)return{k:0.12,c:['#8a6a3a','#7a5a30','#9a7a48']};                          // Winter: nur Restlaub
  if(m===2)return{k:0.22,c:['#8f7a3a','#6f9a3a','#9aa650']};
  if(m===3||m===4)return{k:0.32,c:['#8fc24a','#a6d45a','#7ab83e','#c4dc7a']};               // Frühling: frisches Grün
  return{k:0.42,c:['#5da33f','#4a8f34','#79b84a','#6aa83c']};                                // Sommer
}
function drawLeaves(g,tm,dt){
  dt=Math.min(dt||0.016,0.05);
  const wv=H.weather.wind,wk=clamp(wv/14,0,1),pal=leafPalette(),snowy=snowAmt()>0.5;
  const gw=1; // Windrichtung wie beim Regen: von rechts nach links
  // Neue Blätter aus sichtbaren Kronen
  const nC=CROWNS.length/4;
  if(nC>0&&!snowy&&LEAVES.length<130){
    let rate=pal.k*(0.12+12*Math.pow(wk,1.8))*(env.precip?0.6:1)*Math.min(1,nC/6);
    let n=rate*dt;
    while(n>0){
      if(Math.random()<Math.min(1,n)){
        const i=Math.floor(Math.random()*nC)*4,cx=CROWNS[i],cy=CROWNS[i+1],r=CROWNS[i+2],far=CROWNS[i+3];
        const wx=cx+camX+rnd(-r,r),gyy=groundY(wx);
        LEAVES.push({x:wx,o:Math.max(4,gyy-(cy+rnd(-r*0.5,r*0.5))),ph:rnd(0,6.28),rot:rnd(0,6.28),fl:rnd(0,6.28),
          sz:(far?0.75:1)*rnd(3.4,5.6),col:pick(pal.c),fall:rnd(16,30),land:0,far});
      }

  }

  g.save();

    const L=LEAVES[i];
    const gust=0.65+0.35*Math.sin(tm*0.8+L.x*0.01+L.ph);
    const drift=(4+Math.pow(wv,1.3)*9)*gust;                       // px/s nach links
    if(!L.land){

      L.x+=Math.sin(tm*2.3+L.ph)*(8+wk*26)*dt;                     // Flattern
      const lift=wk*wk*(70*Math.sin(tm*1.3+L.ph)+30);              // Böen wirbeln Blätter auch nach oben
      L.o+=(lift-L.fall*(1-0.35*wk))*dt;

    }else{
      L.life-=dt;L.x-=drift*0.35*wk*dt;                            // am Boden: bei Sturm weiterrutschen
      if(L.life<=0){LEAVES.splice(i,1);continue}
    }
    const sx=L.x-camX;
    if(sx<-40||sx>CW+40||L.o>CH){LEAVES.splice(i,1);continue}
    const sy=groundY(L.x)-L.o-(L.land?1.5:0);
    const a=L.land?clamp(L.life/1.2,0,1)*0.9:0.92;
    g.globalAlpha=a*(L.far?0.8:1);g.fillStyle=tc(L.col);

    g.beginPath();g.ellipse(0,0,L.sz,L.sz*0.52,0,0,7);g.fill();g.restore();
  }
  g.restore();
}

/* ---------- Rucksack abgesetzt ---------- */
function packIsDown(){
  if(!H||!H.g||!H.g.pack||H.moving||H.ended)return false;
  const k=H.action?H.action.kind:null;
  const now=H.camp.pitched||H.sleep.active||nearFire()||(k&&['fire','feed','cook','tent','ftarp','wood'].includes(k));
  if(now)H.packHold=H.t+25;
  const down=now||(H.packHold!=null&&H.t<H.packHold);
  if(!down)H.packX=null;
  return !!down;
}
function drawPackDown(g,tm){
  if(!packIsDown())return;
  const pk=H.g.pack,m=packImg(pk),im=m?img(m,'svg'):null;
  let tx=H.x-62;
  if(H.camp.pitched&&H.g.shelter){const w=140*(H.g.shelter.sc||1);tx=H.camp.x-70-w/2-34}
  if(H.packX==null)H.packX=tx;else H.packX+=(tx-H.packX)*0.12;
  const x=H.packX-camX,y=groundY(H.packX)+2;
  g.save();g.fillStyle='rgba(0,0,0,0.22)';g.beginPath();g.ellipse(x,y,32,5,0,0,7);g.fill();
  if(im){const s=0.16,w=400*s,h=512*s;g.drawImage(im,x-w/2,y-h,w,h)}
  else{g.fillStyle=packCol(pk)||'#7f8c8d';rr(g,x-14,y-38,28,38,6);g.fill()}
  g.restore();
}
/* ---------- Zelt & Wind ---------- */
function blowAway(){
  const sh=H.g.shelter;if(!sh)return;
  H.tentFly={x:H.camp.x-70,id:sh.id,t0:0,closed:!!H.tarpClosed};
  if(H.sleep.active)wakeUp(true);
  const c=condOf(sh.id)-(15+Math.random()*25);
  H.cond[sh.id]=Math.max(0,c);
  H.g.shelter=null;H.camp.pitched=false;
  H.body.wet=Math.min(100,H.body.wet+(env.precip?22:6));
  toast('💨 Eine Böe hat dein '+sh.name+' mitgerissen! Es ist für diese Tour verloren'+(c<=0?' und völlig zerfetzt.':' und nach der Tour beschädigt.')+(sh.wres<14?' Teure Zelte halten deutlich mehr Wind aus.':''),'bad');sfx('bad');
  if(H.stats)H.stats.tentsLost=(H.stats.tentsLost||0)+1;
}
function windTent(hr){
  const sh=H.g.shelter;if(!sh||!sh.wres)return;
  let wr=sh.wres;if(sh.id==='tarp'&&H.tarpClosed)wr*=1.15;
  const gust=env.wind*(0.9+Math.random()*0.3);
  H.windStress=gust/wr;
  if(gust>wr*0.78&&gust<=wr&&H.t-(H.windWarn||-9999)>90){H.windWarn=H.t;toast('💨 Dein '+sh.name+' knattert bedenklich (Wind ~'+Math.round(env.wind*3.6)+' km/h). Bei mehr Wind hält es nicht – abbauen oder Windschutz suchen!','bad')}
  if(gust>wr){const p=clamp(0.12+(gust-wr)/wr*1.5,0,0.9);if(Math.random()<1-Math.pow(1-p,hr))blowAway()}
}
function drawTentFly(g,tm){
  const f=H.tentFly;if(!f)return;
  if(!f.t0)f.t0=tm;
  const a=tm-f.t0;if(a>4.5){H.tentFly=null;return}
  const def=gearById(f.id),nm=f.closed&&def.imgClosed?def.imgClosed:def.img,im=nm?img(nm,'svg'):null;
  const w=140*(def.sc||1),h=w*230/512,x=f.x-camX+110*a+16*a*a,y=groundY(f.x)-30*a-16*a*a-h*0.4;
  g.save();g.globalAlpha=clamp(1-a/4.5,0,1);g.translate(x,y);g.rotate(a*2.6);
  if(im)g.drawImage(im,-w/2,-h/2,w,h);else{g.fillStyle='#d97b2b';g.beginPath();g.moveTo(-40,20);g.lineTo(0,-30);g.lineTo(40,20);g.closePath();g.fill()}
  g.restore();
}
/* ---------- Lager & Feuer ---------- */
const FX={sparks:[],smoke:[]};
function drawCamp(g,tm,dt){
  drawTentFly(g,tm);
  if(H.camp.pitched&&H.g.shelter){
    const sh=H.g.shelter,sx=H.camp.x-70-camX,y=groundY(H.camp.x-70);
    const glow=H.sleep.active||env.dark>0.5;
    // Tarp: bei Sturm oder starkem Regen seitlich zugespannt (mit Hysterese, damit es nicht flackert)
    if(sh.id==='tarp'){
      const hardWx=env.wind>=9||H.weather.wind>=9, hardRain=!!env.precip&&env.rainI>=0.6;
      const calm=env.wind<6&&H.weather.wind<6&&!(env.precip&&env.rainI>=0.3);
      if(hardWx||hardRain)H.tarpClosed=true;else if(calm)H.tarpClosed=false;
    }
    const tim=sh.img?img(sh.id==='tarp'&&H.tarpClosed&&sh.imgClosed?sh.imgClosed:sh.img,'svg'):null;
    if(tim){
      const w=140*(sh.sc||1),h=w*230/512,flap=Math.sin(tm*(3+(H.windStress||0)*4)+sx*0.01)*env.wind*0.0016*(1+Math.max(0,(H.windStress||0)-0.6)*3);
      g.save();g.translate(sx,y+2);g.transform(1,0,flap,1,0,0);g.drawImage(tim,-w/2,-h,w,h);g.restore();
    }else if(sh.id==='tarp'){ // Notbehelf, falls die Grafik nicht lädt
      g.fillStyle=tc('#5f7f55');g.beginPath();g.moveTo(sx-46,y);g.lineTo(sx-30,y-42);g.lineTo(sx+52,y-24);g.lineTo(sx+52,y);g.closePath();g.fill();
      g.strokeStyle='#3d2c1c';g.lineWidth=3;ln(g,sx-30,y-42,sx-30,y);ln(g,sx+52,y-24,sx+52,y);
    }else{
      const col=sh.id==='tentW'?'#c65a2e':sh.id==='tentUL'?'#4a90c8':'#d97b2b';
      const flap=Math.sin(tm*3)*env.wind*0.12;
      g.fillStyle=tc(col);g.beginPath();g.moveTo(sx-50,y);g.lineTo(sx+flap,y-52);g.lineTo(sx+50,y);g.closePath();g.fill();
      g.fillStyle=glow?'#ffd98a':'#2b2b2b';g.beginPath();g.moveTo(sx-14,y);g.lineTo(sx,y-30);g.lineTo(sx+14,y);g.closePath();g.fill();
      g.strokeStyle='rgba(0,0,0,0.3)';g.lineWidth=2;ln(g,sx,y-52,sx,y-30);
    }
  }
  if(H.fireTarp){ // Tarp über der Feuerstelle
    const tx=H.fireTarp.x-camX,ty=groundY(H.fireTarp.x);
    g.strokeStyle=tc('#3d2c1c');g.lineWidth=3;ln(g,tx-50,ty,tx-50,ty-84);ln(g,tx+50,ty,tx+50,ty-66);
    g.fillStyle=tc('#8b8270');g.beginPath();g.moveTo(tx-56,ty-84);g.lineTo(tx+56,ty-66);g.lineTo(tx+56,ty-59);g.lineTo(tx-56,ty-77);g.closePath();g.fill();
    g.fillStyle=tc('#a59c88');g.beginPath();g.moveTo(tx-56,ty-84);g.lineTo(tx+56,ty-66);g.lineTo(tx+56,ty-63);g.lineTo(tx-56,ty-81);g.closePath();g.fill();
  }
  if(H.solarUp){ // Großes Solarpanel im Lager
    const px=H.solarUp.x-camX,py=groundY(H.solarUp.x),eff=solarEff();
    const mis=clamp(((env.hour-H.solarUp.aim+12)%24+24)%24-12,-3,3)/3;
    g.strokeStyle=tc('#555a60');g.lineWidth=3;ln(g,px-10,py,px-2,py-22);ln(g,px+12,py,px+4,py-22);
    g.fillStyle=tc('#1d3a66');g.beginPath();g.moveTo(px-26-mis*8,py-22);g.lineTo(px+30-mis*8,py-22);g.lineTo(px+26,py-46);g.lineTo(px-30,py-46);g.closePath();g.fill();
    g.strokeStyle=tc('#8fb3e8');g.lineWidth=1;g.beginPath();g.moveTo(px-2-mis*4,py-22);g.lineTo(px-2,py-46);g.moveTo(px-28-mis*4,py-34);g.lineTo(px+28-mis*4,py-34);g.stroke();
    g.font='bold 11px sans-serif';g.textAlign='center';g.fillStyle=eff>0.66?'#9be564':eff>0.25?'#ffd54a':'#ff6b5a';g.fillText('☀️ '+Math.round(eff*100)+' %',px,py-52);
  }
  if(H.wood>0&&!H.ended){ // Feuerholz-Stapel
    const wx=H.woodX-52-camX,wy=groundY(H.woodX-52);g.fillStyle=tc('#7a5230');
    for(let k=0;k<Math.min(6,H.wood+1);k++){const r=k%3,row=Math.floor(k/3);g.fillRect(wx-13+r*9-row*4,wy-4-row*6,20,5)}
    g.fillStyle=tc('#5b3d24');for(let k=0;k<Math.min(6,H.wood+1);k++){const r=k%3,row=Math.floor(k/3);g.fillRect(wx-13+r*9-row*4,wy-4-row*6,3,5)}
  }
  const fl=H.fire.lit;
  if(fl){
    const sx=H.fire.x-camX,y=groundY(H.fire.x),fsz=clamp(0.7+H.fire.left/230,0.7,1.6);
    g.fillStyle=tc('#6d4726');g.save();g.translate(sx,y-3);g.rotate(0.3);g.fillRect(-15,-2,30,5);g.rotate(-0.6);g.fillRect(-15,-2,30,5);g.restore();
    g.fillStyle=tc('#8a8d90');for(let k=0;k<7;k++){g.beginPath();g.ellipse(sx-18+k*6,y+1,3.5,2.6,0,0,7);g.fill()}
    g.save();g.globalCompositeOperation='lighter';
    for(let k=0;k<4;k++){
      const f1=Math.sin(tm*(13+k*4)+k*2)*3,h=(24-k*4)*fsz*(0.9+0.15*Math.sin(tm*21+k)),w=(10-k*1.6)*(0.8+0.2*fsz);

    for(let i=0;i<n;i++)FX.sparks.push({x:H.fire.x+rnd(-8,8),y:y-14,vx:rnd(-14,14)+env.wind*2.2,vy:-rnd(50,140),life:0,max:rnd(0.8,2.1),s:rnd(1.2,2.6)});

    p.life+=dt;p.x+=(p.vx+Math.sin(p.life*9+p.x)*12)*dt;p.y+=p.vy*dt;p.vy*=0.985;
    const a=clamp(1-p.life/p.max,0,1);

    g.fillRect(p.x-camX,p.y-(groundY(p.x)-p.y>0?0:0),p.s,p.s);
  }
  g.restore();
  g.save();
  for(const p of FX.smoke){p.life+=dt;p.y-=18*dt;p.x+=env.wind*3*dt;const a=clamp(1-p.life/p.max,0,1)*0.16;g.fillStyle=`rgba(190,190,195,${a})`;g.beginPath();g.arc(p.x-camX,p.y,p.s+p.life*6,0,7);g.fill()}
  g.restore();
  FX.sparks=FX.sparks.filter(p=>p.life<p.max);FX.smoke=FX.smoke.filter(p=>p.life<p.max);
}

const HITS=[];                 // Klickflächen der Symbole (Bildschirmkoordinaten)
const LIGHT={t:0,next:8,flash:0,bolt:null};
function heroY(x){
  const c=H&&H.crossing;if(!c)return groundY(x);
  const ys=380-(c.L.L-H.camElev)*VS;
  if(c.kind==='detour'){const pr=clamp((x-c.x0)/Math.max(1,c.x1-c.x0),0,1);return lerp(groundY(c.x0),groundY(c.x1),pr)+8+30*Math.sin(Math.PI*pr)}
  return Math.min(groundY(x),ys)+(c.kind==='boat'?10:c.kind==='swim'?14:2);
}
function drawLakes(g,tm){
  const R=H.route.lakes;if(!R)return;
  for(const L of R){

/* ---------- Höhenprofil ---------- */
function drawProfile(cv){
  if(!H)return;const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;
  if(cv.width!==w*2||cv.height!==h*2){cv.width=w*2;cv.height=h*2}
  const g=cv.getContext('2d');g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,w,h);
  const R=H.route,N=Math.min(160,Math.floor(w/2));let lo=1e9,hi=-1e9;const ys=[];
  for(let i=0;i<=N;i++){const e=elevAt(R.totalPx*i/N);ys.push(e);lo=Math.min(lo,e);hi=Math.max(hi,e)}
  const span=Math.max(60,hi-lo);
  g.beginPath();g.moveTo(0,h);ys.forEach((e,i)=>g.lineTo(i/N*w,h-3-(e-lo)/span*(h-8)));g.lineTo(w,h);g.closePath();g.fillStyle='rgba(76,195,138,0.35)';g.fill();
  g.strokeStyle='#4cc38a';g.lineWidth=1.2;g.beginPath();ys.forEach((e,i)=>i?g.lineTo(i/N*w,h-3-(e-lo)/span*(h-8)):g.moveTo(0,h-3-(e-lo)/span*(h-8)));g.stroke();
  // Orte & Meilensteine
  for(const f of R.feats){if(f.type==='village'){g.fillStyle='#ffb54a';g.fillRect(f.x/R.totalPx*w-1,h-9,2,9)}else if(f.type==='lodge'){g.fillStyle='#6cb8ff';g.fillRect(f.x/R.totalPx*w-1,h-7,2,7)}else if(f.type==='sight'){g.fillStyle='#ffd54a';g.beginPath();g.arc(f.x/R.totalPx*w,6,2.2,0,7);g.fill()}}
  const px=H.x/R.totalPx*w;g.fillStyle='#fff';g.beginPath();g.arc(px,h-3-(elevAt(H.x)-lo)/span*(h-8),3.4,0,7);g.fill();
}

function pickChannelImg(kind,cb){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;
    const fr=new FileReader();

      im.onload=()=>{
        const W=kind==='avatar'?256:1500,Hh=kind==='avatar'?256:300,c=document.createElement('canvas');c.width=W;c.height=Hh;
        const x=c.getContext('2d'),sc=Math.max(W/im.width,Hh/im.height),w=im.width*sc,h=im.height*sc;
        x.fillStyle='#000';x.fillRect(0,0,W,Hh);x.drawImage(im,(W-w)/2,(Hh-h)/2,w,h); // Mitte zuschneiden
        const old=G[kind];G[kind]=c.toDataURL('image/jpeg',0.85);
        try{localStorage.setItem(SAVE_KEY,JSON.stringify(G))}catch(e){G[kind]=old;toast('Das Bild ist zu groß für den Speicher – bitte ein kleineres wählen.','bad');return}

function avgAlt(hk){return hk.stages.reduce((a,s)=>a+s.alt*s.km,0)/hk.km}
function dayLbl(hk){const f=hk.km/18;return f<0.75?'ca. ½ Tag':f<1.25?'ca. 1 Tag':f<1.75?'ca. 1,5 Tage':'ca. '+Math.ceil(f)+' Tage'}
function estDays(hk){return Math.max(1,Math.ceil(hk.km/(hk.diff>=5?15:hk.diff>=4?16:18)))}
function briefing(hk){
  const R=hk.regD,days=estDays(hk),midDay=G.day+days/2,dm=dateOf(midDay);
  const maxAlt=Math.max(...hk.stages.map(s=>s.alt)),mid=avgAlt(hk);
  const sT=seasonalT(R,dm.doy0,mid),tDay=sT+R.dAmp*0.55,tNight=seasonalT(R,dm.doy0,mid*0.7+maxAlt*0.3)-R.dAmp*0.8-R.syn*0.6;
  const dl=dayLightHours(R.lat,dm.doy0),d0=dateOf(G.day);
  const w=[];let score=hk.diff*1.0;
  const bag=slotOf('bag'),mat=slotOf('mat'),sh=slotOf('shelter'),mid_=slotOf('mid'),shell=slotOf('shell'),pk=slotOf('pack');
  const tools=new Set(packedGear().map(x=>x.tool).filter(Boolean));
  const walkC=13-(mid_?mid_.ins*cf(mid_.id):0)-(shell?shell.ins:0)-1.3*ES('kalt');
  const wind=3.5,windP=Math.max(sh?sh.wind*0.9:0,shell?shell.wind:0);
  const effWalk=tDay-3+11-wind*0.5*(1-windP);
  const defWalk=walkC-effWalk;
  const sleepC=walkC-(17-(bag?bag.rating:17))*0.6*(bag?0.9:1);
  const effSleep=tNight-wind*0.5*(1-windP)+(sh?sh.warm*0.9:0)+(mat?mat.warm:0);
  const defSl=sleepC-effSleep;
  if(!sh){w.push({l:'bad',t:'Keine Unterkunft eingepackt – Nächte draußen sind hart.'});score+=1}
  if(!bag){w.push({l:'bad',t:'Kein Schlafsack eingepackt.'});score+=1.5}
  if(defSl>3){w.push({l:'bad',t:`Nachts bis ca. ${Math.round(tNight)} °C – dein Schlaf-Setup reicht nicht (Schlafsack/Zelt/Matte). Erfrierungsgefahr!`});score+=2}
  else if(defSl>0){w.push({l:'warn',t:`Nachts bis ca. ${Math.round(tNight)} °C – du wirst frieren. Wärmerer Schlafsack oder Zelt empfohlen.`});score+=0.8}
  if(defWalk>3){w.push({l:'bad',t:`Tagsüber nur ca. ${Math.round(tDay)} °C: deine Kleidung ist zu dünn (Isolationsjacke/Parka, Hardshell).`});score+=1.5}
  else if(defWalk>0){w.push({l:'warn',t:`Tagsüber ca. ${Math.round(tDay)} °C: du wirst bei Pausen auskühlen. Mehr Isolation einpacken.`});score+=0.6}
  if(sT<0.5&&!tools.has('snowshoes')&&hk.diff>=3){w.push({l:'warn',t:'Schnee zu erwarten – Schneeschuhe helfen enorm.'});score+=0.5}
  if(sT<-4){w.push({l:'warn',t:'Quellen sind zugefroren: Du brauchst Kocher + Gas (oder Feuer), um Schnee zu schmelzen.'});if(!tools.has('stove'))score+=0.8}
  if(sT<-1&&hk.diff>=4)w.push({l:'info',t:'Winterbedingungen: Stürme und Kälteeinbrüche möglich. Beste Ausrüstung (Winterschlafsack/Parka/Winterzelt) ist Pflicht.'});
  if(dl<9&&!tools.has('lamp'))w.push({l:'bad',t:`Nur ca. ${fmtN(dl,0)} h Tageslicht – ohne Stirnlampe kommst du kaum voran.`});
  else if(dl<9)w.push({l:'info',t:`Nur ca. ${fmtN(dl,0)} h Tageslicht: viel Nachtwanderung, Lampen-Akku beachten.`});
  if(R.lat>66&&dl>20)w.push({l:'info',t:'Mitternachtssonne: kaum Dunkelheit, dafür schlechter Schlaf.'});
  if(R.lat>66&&dl<4)w.push({l:'warn',t:'Polarnacht: fast kein Tageslicht. Stirnlampe und Powerbank sind lebenswichtig.'});
  const stormM=(dm.m>=5&&dm.m<=8&&R.mod&&R.mod.gewitter>1.4);
  if(stormM)w.push({l:'warn',t:'Sommer im Hochgebirge: nachmittags oft Gewitter.'});
  {const gap=skillGap(hk),avg=skillAvg(hk);
   if(gap>=2.5){w.push({l:'bad',t:`Deine Fähigkeiten (Ø ${fmtN(avg,1)}) sind für diese Route viel zu niedrig (empfohlen Ø ${SKILL_REQ[hk.diff]}). Du wirst schnell erschöpfen und kaum vorankommen – auch mit bester Ausrüstung.`});score+=gap*0.45}
   else if(gap>0.4){w.push({l:'warn',t:`Deine Fähigkeiten (Ø ${fmtN(avg,1)}) liegen unter dem Empfohlenen (Ø ${SKILL_REQ[hk.diff]}): mehr Erschöpfung und langsameres Tempo.`});score+=gap*0.35}
   else if(famBonus(hk)>=1)w.push({l:'info',t:'Du kennst diese Strecke oder ähnliche Gegenden – das hilft bei der Orientierung.'})}
  // Proviant
  const satStock=CONS.filter(f=>f.sat).reduce((a,f)=>a+f.sat*(G.cons[f.id]||0),0);
  const perDay=65*Math.max(0.5,1.35-0.1*ES('food'))/1.0;
  const stockDays=satStock/perDay;
  const gapKm=TOWNS[hk.id]?(()=>{const k=[0,...TOWNS[hk.id].filter(t=>t[1]<hk.km-3).map(t=>t[1]),hk.km];let m=0;for(let i=1;i<k.length;i++)m=Math.max(m,k[i]-k[i-1]);return m})():hk.villageEvery>0?hk.villageEvery*1.15:hk.km,gapDays=gapKm/ (hk.diff>=5?15:17);
  if(stockDays<Math.min(gapDays,days)*0.85){w.push({l:stockDays<1?'bad':'warn',t:`Proviant reicht für ca. ${fmtN(stockDays,1)} Tage – ohne Laden brauchst du für die längste Strecke etwa ${fmtN(Math.min(gapDays,days),0)} Tage.`});score+=0.6}

  else if(load/capacityKg()>1)w.push({l:'warn',t:`Schwere Last (${fmtN(load)} kg) – du bist mit deiner Tragkraft grenzwertig.`});
  if(hk.diff>=5)w.push({l:'info',t:'Mega-Tour: '+days+'+ Tage, mehrere Wetterumschwünge, Abbruch möglich. Plane Nachschub-Orte ein (🏪).'});
  if(hk.regD.lat>65&&(dm.m>=10||dm.m<=2)&&hk.diff>=5){score+=1.5}
  if(sT<-8)score+=1.2;else if(sT<-2)score+=0.6;
  const cheap=packedGear().some(g=>g.id==='phone_cheap')&&!packedGear().some(g=>g.kind==='phone'&&g.id!=='phone_cheap');
  if(!tools.has('lamp')&&dl<12)score+=0.5;

  const col=score<2.2?'#4caf50':score<3.4?'#8bc34a':score<4.8?'#f7c948':score<6.2?'#ff9800':score<7.6?'#f4511e':'#c2185b';
  return {tDay,tNight,dl,days,w,score,lbl,col,start:dateStr(G.day),end:dateStr(G.day+days),load,sT};
}

const START_C={nordkalott:'Schweden',gr20:'Frankreich',camino:'Spanien'};
function startCountry(hk){return START_C[hk.id]||hk.country.split(' · ')[0]}
function routeFacts(hk){
  const days=estDays(hk),ms=new Set();for(let d=0;d<=days;d++)ms.add(dateOf(G.day+d).m);
  const R=hk.regD,dm=dateOf(G.day+days/2),tDay=seasonalT(R,dm.doy0,avgAlt(hk))+R.dAmp*0.55;
  const km=b=>hk.stages.filter(s=>s.b===b).reduce((a,s)=>a+s.km,0);

  const fo=key=>{const F=FORAGE[key];return hk.stages.some(s=>F.biomes.includes(s.b))&&F.months.some(m=>ms.has(m))};
  const terr=[];if(km('sand')>0)terr.push('🏖️ Sandstrand '+fmtN(km('sand'),0)+' km');if(km('kies')>0)terr.push('🪨 Steinstrand '+fmtN(km('kies'),0)+' km');if(km('schnee')>0)terr.push('❄️ Schneefelder '+fmtN(km('schnee'),0)+' km');

const HOMES={Deutschland:[51,10],Österreich:[47.5,14.5],Schweiz:[46.8,8.2],Schweden:[59.3,18],Norwegen:[59.9,10.7],Schottland:[55.9,-3.2],England:[51.5,-0.1],Irland:[53.3,-6.3],Italien:[45.5,9.2],Frankreich:[48.9,2.4],Spanien:[40.4,-3.7],Island:[64.1,-21.9]};
const REG_XY={harz:[51.8,10.6],thuer:[50.7,10.7],sachsen:[50.9,14.2],hoga:[63.0,18.3],alpen:[47.4,10.3],dolo:[46.6,12.0],scot:[56.2,-4.6],mtblanc:[45.9,6.9],island:[63.9,-19.3],lappland:[68.4,18.8],nordkalott:[69.3,20.0],norwegen:[61.5,8.8],eng:[51.9,-1.8],irland:[52.05,-9.5],korsika:[42.5,8.9],camino:[43.2,-1.2]};
function travelInfo(hk){
  const home=G.home||'Deutschland',a=HOMES[home]||HOMES.Deutschland,b=REG_XY[hk.reg]||a;
  const R=6371,rad=x=>x*Math.PI/180,dl=rad(b[0]-a[0]),dn=rad(b[1]-a[1]);
  const h=Math.sin(dl/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dn/2)**2;
  const d=Math.round(2*R*Math.asin(Math.sqrt(h)));
  const isl=['Schottland','England','Irland','Island'].includes(home),hisl=['scot','eng','irland','island'].includes(hk.reg);
  const sea=(home==='Island')!==(hk.reg==='island')||(isl!==hisl&&d>300)||(isl&&hisl&&home!=={scot:'Schottland',eng:'England',irland:'Irland',island:'Island'}[hk.reg]&&d>400);
  if(d<60)return {cost:12,days:0,mode:'Bus & Bahn',km:d};
  let mode,cost;
  if(sea||d>2300){mode='Flug';cost=2*(45+0.03*d)}else{mode='Zug';cost=2*0.07*d}
  cost=Math.round(Math.max(25,cost)/5)*5;
  return {cost,days:mode==='Flug'?0:Math.floor(d/900),mode,km:d};
}
function travelText(hk){const t=travelInfo(hk);return `${t.mode} ab ${G.home||'Deutschland'} (${t.km} km, Hin- und Rückfahrt): ${eur0(t.cost)}${t.days?' · '+t.days+' Reisetag'+(t.days>1?'e':''):''}`}
let SELHIKE=null;

/* ---------- Hauptschleife ---------- */
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(0.1,(ts-lastTs)/1000||0.016);lastTs=ts;
  tm+=dt;
  if(screen!=='hike'||!H)return;
  const cv=$('#cv');if(!cv)return;
  if(H.speed>4)H.speed=4;
  if(!H.ended&&!MODAL){
    let mult=SPEEDS[H.speed];
    if(H.sleep.active&&mult>0)mult=Math.max(mult,14);
    accum+=dt*TIME_SCALE*mult;
    let n=0;const x0=H.x,ph0=H.phase;
    while(accum>=1/6&&n<70&&!MODAL&&!H.ended){stepSim(1/6);accum-=1/6;n++}
    if(n>0){H.vdx=(H.x-x0)/n;H.vdph=(H.phase-ph0)/n;if(Math.abs(H.vdx)>40)H.vdx=0}
    if(accum>2)accum=0;
    updateIcons(dt*Math.min(SPEEDS[H.speed],4));
    if(H.speed>0&&!H.sleep.active)ambientUpdate(dt);
  }
  if(!H)return;
  H.camElev+=(elevAt(H.x)-H.camElev)*Math.min(1,dt*2.2);
if(H.side&&H.side.kind==='climb')H.camElev=clamp(H.camElev,elevAt(H.x)-55,elevAt(H.x)+55);
H.cd=(H.cd||0)+(((H.dir||1)<0?1:0)-(H.cd||0))*Math.min(1,dt*2.2);
  const rx=H.x,rph=H.phase;
  if(H.moving&&!MODAL&&SPEEDS[H.speed]>0&&!H.ended&&H.vdx&&SPEEDS[H.speed]<=6&&!H.sleep.active){const f=clamp(accum*6,0,1);H.x=rx+H.vdx*f;H.phase=rph+(H.vdph||0)*f}
  drawScene(cv.getContext('2d'),tm,dt);
  H.x=rx;H.phase=rph;
  hudT-=dt;if(hudT<=0){hudT=0.2;updateHUD()}
  if(Math.floor(tm*0.2)%15===0&&Math.floor(tm)%25===0&&!H.ended&&!H._sv){H._sv=1;save()}else if(Math.floor(tm)%25===1)H._sv=0;
}
window.addEventListener('keydown',e=>{
  if(screen!=='hike'||!H)return;
  if(e.key==='Escape'){if(MODAL&&!MODAL.locked)closeModal();else $('#drawer').classList.remove('open')}
  else if(e.key===' '&&!MODAL){e.preventDefault();actClick('walk')}
  else if((e.key==='+'||e.key==='.')&&!MODAL){H.speed=Math.min(4,H.speed+1);updateHUD(true)}
  else if((e.key==='-'||e.key===',')&&!MODAL){H.speed=Math.max(1,H.speed-1);updateHUD(true)}
});

   <rect x="6" y="${8+ (ih-ch-dh)+4}" width="${iw-4}" height="${dh}" fill="#8a6a3a"/><rect x="6" y="${8+(ih-ch)+4}" width="${iw-4}" height="${ch}" fill="#39a0ff"/>
   <text x="${w/2}" y="${h-6}" text-anchor="middle" font-size="10" fill="#fff">${fmtN(cl+di)}/${cap}</text></svg>`;
}

function mapPoints(){
  if(H.mapPts)return H.mapPts;
  const N=Math.ceil(H.route.totalKm*3)+1,r=mulberry32(H.route.totalPx|0);
  const pts=[];let x=0,y=0,a=-0.3+r()*0.6,wob=r()*6;
  for(let i=0;i<N;i++){pts.push([x,y]);wob+=0.11;a+=Math.sin(wob)*0.09+(r()-0.5)*0.22;a+=(-a)*0.012;x+=Math.cos(a);y+=Math.sin(a)}
  H.mapPts=pts;return pts;
}

   }});
}

function clipScore(clips){
  const v=clips.map(c=>c.value).sort((a,b)=>b-a);let s=0;v.slice(0,30).forEach((x,i)=>s+=x*Math.pow(0.94,i));
  const types=new Set(clips.map(c=>c.type)),rar=clips.filter(c=>c.rar>=3).length;
  // Kameraqualität zählt zusätzlich: gute Geräte (Ø-Qualität der besten Clips) heben den Gesamteindruck, billige Kameras drücken ihn
  const top=[...clips].sort((a,b)=>b.value-a.value).slice(0,12),aq=top.length?top.reduce((a,c)=>a+(c.q||0.7),0)/top.length:0.7;
  const camF=0.7+0.45*clamp(aq,0.3,1.35);
  // Abwechslung belohnen: viele verschiedene Motive (Tiere, Sehenswürdigkeiten, Alltag am Lager)
  const names=new Set(clips.map(c=>c.name)).size,variety=1+0.012*Math.min(names,14);
  return s*(1+0.04*Math.min(types.size,6)+0.08*Math.min(rar,3))*camF*variety*0.86;
}

function advanceDay(){
  const d=dateOf(G.day),notes=[];let views=0,rev=0,paid=0,subs0=G.subs;
  const dow=G.day%7,rep=1-clamp(G.begHeat*0.03,0,0.4);
  const lastUp=G.videos_lastUp===undefined?G.day:G.videos_lastUp;

    const age=G.day-v.day;if(age<0)continue;
    if(age===0){notes.push('▶️ Neues Video online: „'+v.title+'“');addComments(v,2);
      const prev=(G.videos||[]).filter(x=>x!==v&&x.day<v.day&&x.S).slice(-5);
      const base=prev.length?prev.reduce((s,x)=>s+x.S,0)/prev.length:0;
      const exp=Math.max(base*0.8,prev.length?18+Math.min(50,G.subs/250):0);
      let dis=exp>0?clamp((exp-v.S)/exp,0,1):0;if(v.easyAbort)dis=Math.max(dis,0.35);
      if(dis>0.2&&G.subs>30){const loss=Math.max(1,Math.round(G.subs*0.045*dis*dis*3));G.subs=Math.max(0,G.subs-loss);v.disLoss=loss;notes.push('😕 Abonnenten sind enttäuscht: −'+loss);
        G.comments.unshift({day:G.day,vid:v.id,user:pick(NAMES),text:pick(CMT_DIS)});if(G.comments.length>80)G.comments.length=80}
    }
    // Hype

    let dv=v.V*(0.82/v.tau*Math.exp(-age/v.tau)+0.18/90*Math.exp(-age/90))*rnd(0.85,1.15)*(dow>=5?1.08:1)*rep;
    if(v.hype){const hp=age-v.hype.start;
      if(hp===0){notes.push('🚀 „'+v.title+'“ geht viral!');sfxSafe('success')}
      if(hp>=0&&hp<v.hype.len)dv+=v.V*0.12*v.hype.mul*Math.sin(Math.PI*(hp+0.5)/v.hype.len)*rnd(0.85,1.1);
      else if(hp>=v.hype.len&&!v.hype.done){v.hype.done=1;notes.push('📉 Der Hype um „'+v.title+'“ ebbt ab.')}}
    dv=Math.floor(dv+Math.random());
    if(dv<=0){v.h.push(0);continue}
    const rpv=0.0042*rnd(0.85,1.15)*(G.subs>=1000?1.15:G.subs<500?0.6:1)*(v.promo?0.92:1);
    const r=dv*rpv;
    const conv=0.004*(0.6+0.8*clamp(v.S/120,0,1.4))*(hasT('charme')?1.25:1)*rep*(v.promo?0.75:1)*(v.hype&&age-v.hype.start>=0&&age-v.hype.start<v.hype.len?1.4:1);
    const sg=Math.floor(dv*conv+Math.random());
    v.views+=dv;v.rev+=r;v.likes+=Math.round(dv*0.04*rnd(0.7,1.3));v.subsG+=sg;v.h.push(dv);if(v.h.length>150)v.h.shift();
    const sgx=(G.dogSale&&G.day<G.dogSale.day+180)?Math.floor(sg*0.5+Math.random()):sg;   // Kanal wächst 6 Monate 50 % langsamer
    G.subs+=sgx;G.totalViews+=dv;views+=dv;rev+=r;
    if(age<8&&Math.random()<0.06)addComments(v,1);
  }
  if(G.dogSale){ // Reaktionen der Community auf den Hundeverkauf – nur in den Kommentaren zu sehen

  if(ratio>=0.32&&ratio<=0.5)sc+=0.3;else if(ratio<0.2||ratio>0.62)sc-=0.4;

    body=`${idleWarnHTML()}<div class="kpis"><div class="kpi">Abonnenten<b>${fmtInt(G.subs)}</b><small>${sub28>=0?'+':''}${sub28} in 28 Tagen</small></div><div class="kpi">Aufrufe (28 Tage)<b>${fmtInt(v28)}</b></div><div class="kpi">Einnahmen (28 Tage)<b>${eur(r28)}</b></div><div class="kpi">Ausstehend<b>${eur(G.pendCur+G.pendPrev)}</b><small>Auszahlung am 21.</small></div><div class="kpi">Ausgezahlt gesamt<b>${eur(G.earned)}</b></div></div>
     <h4>Aufrufe pro Tag (60 Tage)</h4><canvas class="chart" id="ch1"></canvas>
     ${top?`<h4>Bestes Video</h4><div class="vrow"><canvas id="th-top" width="150" height="84"></canvas><div class="mt"><b>${esc(top.title)}</b><br><small>${fmtInt(top.views)} Aufrufe · ${eur(top.rev)}</small></div></div>`:'<p class="hint">Noch keine Videos. Wandere und veröffentliche dein erstes Video!</p>'}`;
  }else if(STUDIOTAB==='Videos'){
    body=vids.length?[...vids].reverse().map(v=>{const on=v.day<=G.day,age=G.day-v.day;
      return `<div class="vrow"><canvas width="150" height="84" data-v="${v.id}"></canvas><div class="mt"><b>${esc(v.title)}</b>${v.hype&&on&&age>=v.hype.start&&age<v.hype.start+v.hype.len?'<span class="badge hot">🚀 Viral</span>':''}${v.promo?'<span class="badge">📣 beworben</span>':''}<br>
        <small>${on?(age===0?'Heute':'vor '+age+' Tagen')+' · ':'Geplant für '+dateStr(v.day)+' · '}${fmtInt(v.views)} Aufrufe · 👍 ${fmtInt(v.likes)} · +${v.subsG} Abos · ${eur(v.rev)}</small></div></div>`}).join(''):'<p class="hint">Noch keine Videos.</p>';
  }else if(STUDIOTAB==='Analytics'){
    body=`<h4>Abonnenten-Verlauf</h4><canvas class="chart" id="ch2"></canvas><h4>Einnahmen pro Tag (gutgeschrieben)</h4><canvas class="chart" id="ch3"></canvas><h4>Aufrufe pro Tag (120 Tage)</h4><canvas class="chart" id="ch4"></canvas>
     <p class="hint">Videos bringen die meisten Aufrufe in den ersten ein bis zwei Wochen und dann noch lange einen kleinen Rest. Selten läuft ein Video plötzlich viral. Zu häufiges Betteln im Livestream senkt Reichweite und Abos für mehrere Tage (aktuell: ${G.begHeat>2?'<span class="badtxt">Ruf angeschlagen</span>':'okay'}).</p>`;
  }else if(STUDIOTAB==='Community'){
    body=G.comments.length?G.comments.slice(0,30).map(c=>{const v=(G.videos||[]).find(x=>x.id===c.vid);return `<div class="cmt"><b>${esc(c.user)}</b> <small>· ${dateStr(c.day)}${v?' · '+esc(v.title.slice(0,40)):''}</small><br>${esc(c.text)}</div>`}).join(''):'<p class="hint">Noch keine Kommentare.</p>';
  }else if(STUDIOTAB==='Partner'){
    const of=G.offers||[],sp=G.sponsors||[];
    body=`<h4>Anfragen</h4>${of.length?of.map(o=>`<div class="cmt"><b>${esc(o.name)}</b> · ${esc(o.what)}<br><small>${eur0(o.fee)} pro Monat · verlangt mindestens ein Video pro Monat mit gutem Material · Angebot gilt noch ${o.until-G.day} Tage</small><div class="seg" style="margin-top:6px"><button class="primary" data-of="${o.id}" data-ok="1">Annehmen</button><button data-of="${o.id}">Ablehnen</button></div></div>`).join(''):'<p class="hint">Aktuell keine Anfragen. Werbepartner melden sich bei größeren Kanälen von selbst.</p>'}
      <h4>Laufende Partnerschaften</h4>${sp.length?sp.map(s=>`<div class="cmt"><b>${esc(s.name)}</b> · ${eur0(s.fee)} pro Monat<br><small>Nächste Prüfung in ${Math.max(0,s.next-G.day)} Tagen${s.strikes?' · <span class="badtxt">unzufrieden</span>':''}</small></div>`).join(''):'<p class="hint">Keine aktiven Partner.</p>'}
      <p class="hint">Partner erwarten regelmäßig Videos mit gutem Material. Bleiben Videos aus oder sind sie zu schwach, springen sie wieder ab.</p>`;
  }else{
    body=G.lives.length?`<div class="kpis"><div class="kpi">Livestreams<b>${G.lives.length}</b></div><div class="kpi">Spenden gesamt<b>${eur(G.liveEarned)}</b></div><div class="kpi">Ruf<b>${G.begHeat>4?'😠 schlecht':G.begHeat>1.5?'😐 angekratzt':'😊 gut'}</b></div></div>`+[...G.lives].reverse().map(l=>`<div class="cmt"><b>${dateStr(l.day)}</b> · Ø ${fmtN(l.avg,0)} Zuschauer (Spitze ${Math.round(l.peak)}) · Spenden ${eur(l.don)} · +${l.gain}${l.loss?' / −'+l.loss:''} Abos${l.begs>1?' · <span class="badtxt">'+l.begs+'× gebettelt</span>':''}</div>`).join(''):'<p class="hint">Noch kein Livestream. Beim Rasten unterwegs: Menü ☰ → Livestream. Kleine Kanäle haben sehr wenige Zuschauer. Ein Spendenaufruf pro Stream reicht.</p>';
  }
  $('#s-studio').innerHTML=`<div class="wrap"><div class="topbar"><h2>📺 Studio</h2><button id="st-back">◀ Zentrale</button></div>
   <div class="yt"><div class="ytban" style="${G.banner?`background:url(${G.banner}) center/cover`:''}"></div><div class="ythead"><div class="ytav" style="${G.avatar?`background:url(${G.avatar}) center/cover`:`background:${jk}`}">${G.avatar?'':esc((G.chan||'W')[0].toUpperCase())}</div><div><h3 style="margin:0"><span id="ch-rn" style="cursor:pointer;border-bottom:1px dashed #ffffff66" title="Zum Umbenennen anklicken">${esc(G.chan)}</span> </h3><small>@${esc(G.chan.replace(/\s+/g,'').toLowerCase())} · ${fmtInt(G.subs)} Abonnenten · ${live.length} Videos</small><div class="imgbtns" style="margin-top:6px">${imgBtns()}</div></div></div>
    <div class="tabs" style="padding:0 16px">${tabs.map(t=>`<button data-stt="${t}" class="${STUDIOTAB===t?'on':''}">${t}</button>`).join('')}</div>
    <div style="padding:6px 16px 16px">${body}</div></div></div>`;
  $('#st-back').onclick=()=>{renderHub();show('hub')};
  bindImgBtns($('#s-studio'),()=>renderStudio());
  const rnb=$('#ch-rn');if(rnb)rnb.onclick=()=>showModal({title:'Kanal umbenennen',html:'<p class="hint">Die Community reagiert darauf – je nachdem, wie gut der Name klingt.</p><input id="ch-new" maxlength="30" style="width:100%" value="'+esc(G.chan)+'">',buttons:[{label:'Umbenennen',primary:1,fn:()=>{const v=(RNV||'').trim();if(v.length<3||v===G.chan){toast('Bitte einen anderen Namen mit mindestens 3 Zeichen eingeben.');return}renderStudioAfterRename(v)}},{label:'Abbrechen'}],onOpen:m=>{RNV=G.chan;$('#ch-new',m).oninput=e=>RNV=e.target.value}});
  $$('[data-of]').forEach(b=>b.onclick=()=>{const id=+b.dataset.of,o=(G.offers||[]).find(x=>x.id===id);if(!o)return;G.offers=G.offers.filter(x=>x!==o);if(b.dataset.ok){if((G.sponsors||[]).length>=2){toast('Mehr als zwei Partner gleichzeitig sind nicht möglich.');G.offers.push(o);return}(G.sponsors=G.sponsors||[]).push({name:o.name,what:o.what,fee:o.fee,minS:o.minS,next:G.day+30,strikes:0});sfx('coin')}save();renderStudio()});
  $$('[data-stt]').forEach(b=>b.onclick=()=>{STUDIOTAB=b.dataset.stt;renderStudio()});
  $$('canvas[data-v]').forEach(cv=>{const v=vids.find(x=>x.id==cv.dataset.v);if(v)drawThumb(cv,v)});
  const tt=$('#th-top');if(tt){const top=[...live].sort((a,b)=>b.views-a.views)[0];drawThumb(tt,top)}
  if($('#ch1'))lineChart($('#ch1'),G.hist.slice(-60).map(x=>x.views),'#4cc38a',true);
  if($('#ch2'))lineChart($('#ch2'),G.hist.slice(-120).map(x=>x.subs),'#4aa8e8',true);
  if($('#ch3'))lineChart($('#ch3'),G.hist.slice(-90).map(x=>x.rev),'#f7c948',true);
  if($('#ch4'))lineChart($('#ch4'),G.hist.slice(-120).map(x=>x.views),'#ff9142',true);
}
let RNV='';
function renderStudioAfterRename(v){renameChannel(v);STUDIOTAB='Community';renderStudio()}
/* ---------- Start ---------- */
G=null;
renderMenu();show('menu');
requestAnimationFrame(frame);

</script></body></html>
