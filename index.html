const FIRE_VOL={klein:0.8,mittel:0.85,gross:0.9};
const FIREL={cur:null,key:null,t:0,fadeOut:[]};
function fireStage(){if(!H.fire.lit)return null;const l=H.fire.left;return l>110?'gross':l>70?'mittel':'klein'}
function fireDist(){return Math.abs(H.x-H.fire.x)}
function fireGain(){const d=fireDist(),k=clamp(1-d/520,0,1);return k*k*(0.35+0.65*k)}
function fireFilesReady(){return !!(SB[FIRE_F.klein]&&SB[FIRE_F.mittel]&&SB[FIRE_F.gross])}
function fireSet(key){
  if(!AU.ok||!AU.ctx||key===FIREL.key)return;
  const c=AU.ctx,t=c.currentTime,FADE=4;
  if(key&&!SB[FIRE_F[key]])return;
  if(FIREL.cur){const o=FIREL.cur;try{o.g.gain.cancelScheduledValues(t);o.g.gain.setValueAtTime(o.g.gain.value,t);o.g.gain.linearRampToValueAtTime(0.0001,t+FADE);o.s.stop(t+FADE+0.1)}catch(e){}FIREL.cur=null}
  FIREL.key=key;if(!key)return;
  const s=c.createBufferSource();s.buffer=SB[FIRE_F[key]];s.loop=true;
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(1,t+FADE);
  const v=c.createGain();v.gain.value=0;
  s.connect(g);g.connect(v);v.connect(AU.master);s.start(t,Math.random()*Math.max(1,s.buffer.duration-1));
  FIREL.cur={s,g,v,key};
}
function fireUpdate(dt){
  if(!AU.ok||!AU.ctx||!H)return;
  const st=fireStage(),near=st&&fireDist()<560;
  if(near&&!fireFilesReady())Object.values(FIRE_F).forEach(sbLoad);
  FIREL.t-=dt;
  if(FIREL.t<=0){FIREL.t=1;const want=near&&fireFilesReady()?st:null;if(want!==FIREL.key)fireSet(want)}
  if(FIREL.cur){const mute=G&&G.mute;FIREL.cur.v.gain.setTargetAtTime(mute||!st?0:0.55*(FIRE_VOL[FIREL.cur.key]||1)*fireGain(),AU.ctx.currentTime,0.5)}
}
setInterval(()=>{if(FIREL.cur&&(screen!=='hike'||!H||H.ended||!H.fire.lit)){fireSet(null)}},1500);
/* ---------- See: Wellen-Loop, Lautstärke nach Abstand zum Ufer (beim Angeln voll) ---------- */
const LAKE_F='lake-waves-lapping-gently-on-the-beach-01.mp3';
const LAKEL={cur:null,t:0,d:1e9};
function lakeDist(){
  const ls=(H.route&&H.route.lakes)||[];let best=1e9;
  for(const L of ls){const d=H.x<L.xl?L.xl-H.x:H.x>L.xr?H.x-L.xr:0;if(d<best)best=d}
  return best;
}
function lakeUpdate(dt){
  if(!AU.ok||!AU.ctx||!H)return;
  const d=lakeDist(),fish=H.action&&H.action.kind==='fish';LAKEL.d=d;
  const k=fish?1:clamp(1-d/480,0,1),want=k>0.02;
  if(d<800&&SB[LAKE_F]===undefined)sbLoad(LAKE_F);
  const b=SB[LAKE_F];
  if(want&&b&&!LAKEL.cur){
    const c=AU.ctx,s=c.createBufferSource();s.buffer=b;s.loop=true;const v=c.createGain();v.gain.value=0;
    s.connect(v);v.connect(AU.master);s.start(c.currentTime,Math.random()*Math.max(1,b.duration-1));LAKEL.cur={s,v};
  }
  if(LAKEL.cur){
    const mute=G&&G.mute,tgt=mute?0:0.6*k*k*(0.4+0.6*k)*(env.wind>10?0.8:1);
    LAKEL.cur.v.gain.setTargetAtTime(tgt,AU.ctx.currentTime,0.9);
    if(!want&&LAKEL.cur.v.gain.value<0.004){try{LAKEL.cur.s.stop()}catch(e){}LAKEL.cur=null}
  }
}
setInterval(()=>{if(LAKEL.cur&&(screen!=='hike'||!H||H.ended)){try{LAKEL.cur.s.stop()}catch(e){}LAKEL.cur=null}},1500);
function ambUpdate(dt){
  try{if(env.snow>0.2||env.biome==='schnee'||env.biome==='wald'||env.biome==='wiese'||env.biome==='tal'||env.biome==='strasse'||env.biome==='berg'||env.biome==='fjaell'||env.biome==='kies')footLoad()}catch(e){}
  try{owlTick(dt)}catch(e){}
  try{wxUpdate(dt)}catch(e){}
  try{lakeUpdate(dt)}catch(e){}
  try{fireUpdate(dt)}catch(e){}
  try{crowTick(dt)}catch(e){}
  if(!AU.ok||!AU.ctx||!H)return;
  AMB.t-=dt;
  if(AMB.t<=0){AMB.t=2;let k=null;try{k=ambPick()}catch(e){}
    if(k&&AMB.buf[k]===undefined)ambLoad(k);
    if(k!==AMB.key&&(!k||AMB.buf[k]))ambSet(k);
    else if(AMB.want&&AMB.buf[AMB.want])ambSet(AMB.want)}
  if(AMB.cur){const mute=G&&G.mute;const duck=(DG?0.35:H.sleep&&H.sleep.active?0.6:1)*(WXL.cur?(String(WXL.cur.key).indexOf('gew')===0?0.45:0.6):1);
    const stormy=env.wind>12?0.75:1;
    AMB.cur.v.gain.setTargetAtTime(mute?0:AMB.base*(AMB_VOL[AMB.cur.key]||1)*duck*stormy,AU.ctx.currentTime,0.6)}
}
setInterval(()=>{if(AMB.cur&&(screen!=='hike'||!H||H.ended))ambSet(null)},1500);
function ambientUpdate(dt){
  if(!AU.ok||!H||H.ended)return;
  ambUpdate(dt);
  const t=AU.ctx.currentTime,mute=G&&G.mute,k=0.35;
  const setG=(l,v)=>l.g.gain.setTargetAtTime(mute?0:v,t,k);
  const gust=0.75+0.25*Math.sin(tm*0.9)+0.1*Math.sin(tm*2.3);
  setG(AU.loops.wind,clamp(env.wind/24,0,0.55)*0.55*gust);
  AU.loops.wind.fl.frequency.setTargetAtTime(280+env.wind*35,t,0.5);
  setG(AU.loops.rain,WXL.cur?0:env.precip==='rain'?clamp(0.06+env.rainI*0.2,0,0.3):env.precip==='snow'?0.02:0);
  const nf=nearFire();const ff=fireFilesReady();setG(AU.loops.fire,nf&&!ff?0.09:0);
  if(nf||H.fire.lit&&Math.abs(H.x-H.fire.x)<450){
    AU.popT-=dt;if(AU.popT<=0){AU.popT=0.08+Math.random()*0.5;if(nf&&!ff)burst(0.03+Math.random()*0.03,'highpass',2500+Math.random()*2500,0.16)}
  }
  if(STEPS_ON){const walk=H.speed>0&&H.speed<=4&&H.moving&&!H.sleep.active&&(!H.shot||H.shot.type==='video');
    fsUpdate(walk);
    if(walk&&!fsOk()){const idx=Math.floor(H.phase/Math.PI);
    if(idx!==AU.lastStep){AU.lastStep=idx;stepSound()}}}
  AU.birdT-=dt;
  if(AU.birdT<=0){
    AU.birdT=3+Math.random()*(env.biome==='wald'?6:12);
    if(env.light>0.45&&!env.precip&&env.wind<9&&env.temp>2&&H.speed>0&&H.speed<=4&&!H.sleep.active)chirp();
  }
}

/* ---------- Hund ---------- */
function drawDog(g,x,y,D,gd,mode,ph,t,packCol){
  const s=D.scale*1.35,col=DOG_COLORS[gd.color],dk=shade(col,-0.28),lt=shade(col,0.3);
  g.save();g.translate(x,y);g.scale(s,s);g.lineCap='round';g.lineJoin='round';
  if(mode==='sleep'){
    g.fillStyle=col;g.beginPath();g.ellipse(0,-7,17,8,0,0,7);g.fill();
    g.fillStyle=dk;g.beginPath();g.ellipse(-14,-9,7,5.5,0.4,0,7);g.fill();
    g.beginPath();g.ellipse(-19,-6,4,3,0,0,7);g.fill();
    if(gd.patch){g.fillStyle=lt;g.beginPath();g.ellipse(2,-3,9,3.5,0,0,7);g.fill()}
    g.restore();return;
  }
  const sit=mode==='sit';
  const cyc=mode==='walk'?ph:0;
  const wag=Math.sin(t*(mode==='walk'?11:7))*0.5;
  // Schwanz
  g.strokeStyle=dk;g.lineWidth=3.4;g.beginPath();
  if(sit){g.moveTo(-14,-4);g.quadraticCurveTo(-24,-4,-26+wag*4,-9)}
  else{g.moveTo(-16,-19);g.quadraticCurveTo(-25,-27+wag*4,-24+wag*5,-33)}
  g.stroke();
  // Beine
  g.strokeStyle=dk;g.lineWidth=4.2;
  if(sit){ln(g,-8,-8,-6,-1);ln(g,10,-9,12,-1);ln(g,4,-9,6,-1)}
  else{
    const a=Math.sin(cyc)*7,b=Math.sin(cyc+Math.PI)*7;
    ln(g,-11,-12,-11+a,-1);ln(g,-6,-12,-6+b,-1);ln(g,9,-12,9+b,-1);ln(g,14,-12,14+a,-1);
  }
  // Körper
  g.fillStyle=col;
  if(sit){g.beginPath();g.ellipse(-2,-13,15,10,-0.5,0,7);g.fill()}
  else{g.beginPath();g.ellipse(0,-19+(mode==='walk'?Math.sin(cyc*2)*0.7:0),18,8.5,0,0,7);g.fill()}
  if(gd.patch){g.fillStyle=lt;g.beginPath();g.ellipse(sit?0:2,sit?-9:-15,10,3.6,sit?-0.5:0,0,7);g.fill()}
  // Rucksack
  if(packCol){g.fillStyle=packCol;rr(g,sit?-8:-8,sit?-25:-30,15,9,3);g.fill();g.fillStyle='rgba(0,0,0,.25)';g.fillRect(sit?-8:-8,sit?-19:-24,15,1.6)}
  // Kopf
  const hxx=sit?13:19,hyy=sit?-27:-27+(mode==='walk'?Math.sin(cyc*2)*0.7:0);
  g.fillStyle=col;g.beginPath();g.arc(hxx,hyy,7,0,7);g.fill();
  g.fillStyle=lt;g.beginPath();g.ellipse(hxx+6,hyy+2.5,5,3.5,0.1,0,7);g.fill();
  g.fillStyle='#111';g.beginPath();g.arc(hxx+10,hyy+1.4,1.5,0,7);g.fill();
  g.beginPath();g.arc(hxx+2.5,hyy-1.5,1.2,0,7);g.fill();
  g.fillStyle=dk;g.beginPath();g.moveTo(hxx-4,hyy-4);g.lineTo(hxx-1,hyy-13+Math.sin(t*3)*0.6);g.lineTo(hxx+3,hyy-5);g.closePath();g.fill();
  g.restore();
}

        g.fillStyle=lg;g.fillRect(x,y,8,hgt);

    const gl=g.createRadialGradient(sp.x,sp.y,4,sp.x,sp.y,rad);gl.addColorStop(0,rgb(col,0.75*(1-gray*0.7)));gl.addColorStop(1,rgb(col,0));
    g.fillStyle=gl;g.fillRect(sp.x-rad,sp.y-rad,rad*2,rad*2);
    if(gray<0.75){g.fillStyle=rgb(col,1-gray*1.1);g.beginPath();g.arc(sp.x,sp.y,20+clamp(1-a/20,0,1)*7,0,7);g.fill()}
    if(tw>0.2&&gray<0.5){ // Horizontglühen
      const hg=g.createRadialGradient(sp.x,CH*0.66,10,sp.x,CH*0.66,CW*0.5);hg.addColorStop(0,rgb([255,150,80],0.35*tw));hg.addColorStop(1,rgb([255,150,80],0));
      g.fillStyle=hg;g.fillRect(0,CH*0.25,CW,CH*0.5);
    }
  }
  // Mond

  if(mAlt>-3&&env.dark>0.35&&gray<0.75){
    const az=Math.sin((env.hour-12)*Math.PI/12),mx=CW*(0.5-0.44*az),my=CH*0.66-clamp(mAlt,-4,65)/65*CH*0.5;
    const gl=g.createRadialGradient(mx,my,4,mx,my,70);gl.addColorStop(0,'rgba(200,215,255,0.35)');gl.addColorStop(1,'rgba(200,215,255,0)');
    g.fillStyle=gl;g.fillRect(mx-70,my-70,140,140);
    const ph=((G.day%29.5)/29.5);g.fillStyle=rgb([238,241,250],1-gray);g.beginPath();g.arc(mx,my,15,0,7);g.fill();
    g.fillStyle='rgba(16,24,52,0.85)';const off=(ph<0.5?ph*2:(1-ph)*2);g.beginPath();g.arc(mx+(ph<0.5?-1:1)*(15-off*15)*(1),my,14.5*(1-Math.abs(0.5-ph)*0.2),0,7);if(Math.abs(ph-0.5)>0.05)g.fill();
  }
  // Wolken
  const n={klar:3,wolkig:8,nebel:6,regen:11,gewitter:13,sturm:12}[H.weather.type];
  let cc=mix(mix(hex('#ffffff'),hex('#7f8791'),gray*1.1),hex('#2b3244'),(1-L)*0.85);
  cc=mix(cc,[255,175,125],tw*0.5*(1-gray*0.7));

  for(let i=0;i<n;i++){

      g.fillStyle=rgb(u?under:cc,0.86);g.beginPath();g.ellipse(cx+dx*sc,cy+dy*sc,r*sc*1.3,r*sc*0.8,0,0,7);g.fill();
    }

/* ---------- Vogel-Sprites (Seitenansicht, schaut nach rechts) ---------- */
const BSP={
  spatz:{rx:7,ry:3.6,head:3,beak:3,wl:12,chord:6,tail:7,col:'#8d6b49',belly:'#eadfca',wing:'#6e4e32',tip:'#463120',cap:'#7a5a3c',fing:0,eye:'#111'},
  kraehe:{rx:12.5,ry:5,head:4.6,beak:8,wl:24,chord:11,tail:14,col:'#1c2128',belly:'#262d37',wing:'#151a21',tip:'#0b0e12',cap:'#1c2128',fing:5,eye:'#d9dde2',gloss:'#4b5a73'},
  adler:{rx:21,ry:7.4,head:6.4,beak:10,wl:50,chord:22,tail:22,col:'#5a3b22',belly:'#7b5532',wing:'#4b3019',tip:'#241609',cap:'#ead7a2',fing:7,eye:'#f2c744',gloss:'#8a6238',band:'#e9e2cf'}};
function drawBirdSprite(g,k,x,y,s,dir,ph,al,glide){
  const P=BSP[k];if(!P)return;
  const sc=s||1,fl=glide?0.38+0.14*Math.sin(ph):Math.sin(ph);   // fl: -1 (Schlag nach unten) .. 1 (hoch)
  g.save();g.translate(x,y);g.scale(dir>=0?sc:-sc,sc);if(al!=null&&al<1)g.globalAlpha=al;
  g.lineJoin='round';g.lineCap='round';
  const wingAt=(far)=>{
    const ang=glide?fl:fl*0.95+0.05,sh=[P.rx*0.1,-P.ry*0.5];
    const tx=sh[0]-P.wl*0.38*(0.75+0.25*Math.cos(ang)),ty=sh[1]-P.wl*Math.sin(ang)*(far?0.88:1);
    const dx=tx-sh[0],dy=ty-sh[1],len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
    let nx=-uy,ny=ux;if(nx>0){nx=-nx;ny=-ny}                       // Normale nach hinten
    const ch=P.chord*(far?0.92:1),N=P.fing?9:5;
    const L=u=>[sh[0]+dx*u-nx*ch*0.18*(1-u)+nx*Math.sin(u*Math.PI)*0,sh[1]+dy*u-ny*ch*0.18*(1-u)];
    const R=u=>{const w=ch*(0.95*(1-Math.pow(u,1.7))+0.05),sc=Math.sin(u*N*Math.PI)*ch*0.05*(P.fing?1:0.5);return [sh[0]+dx*u+nx*(w+sc),sh[1]+dy*u+ny*(w+sc)]};
    g.fillStyle=far?P.tip:P.wing;
    g.beginPath();let p=L(0);g.moveTo(p[0],p[1]);
    for(let u=0.1;u<=1.001;u+=0.1){p=L(u);g.lineTo(p[0],p[1])}
    for(let u=1;u>=-0.001;u-=0.05){p=R(clamp(u,0,1));g.lineTo(p[0],p[1])}
    g.closePath();g.fill();
    if(P.fing){ // gespreizte Handschwingen am Flügelende
      g.fillStyle=P.tip;
      for(let i=0;i<P.fing;i++){
        const u=0.5+0.5*i/(P.fing-1)*0.95,b=R(u),fl2=ch*(0.75-0.35*i/P.fing),w2=Math.max(1.1,ch*0.1);
        const ex=b[0]+nx*fl2+ux*fl2*0.55*(i/P.fing),ey=b[1]+ny*fl2+uy*fl2*0.55*(i/P.fing);
        const px=-ny*w2*0.5,py=nx*w2*0.5;
        g.beginPath();g.moveTo(b[0]-px,b[1]-py);g.lineTo(ex,ey);g.lineTo(b[0]+px,b[1]+py);g.closePath();g.fill();
      }
    }
    g.strokeStyle='rgba(0,0,0,0.22)';g.lineWidth=0.8;
    for(let i=1;i<4;i++){const u=i/4,a=L(u),b=R(u);g.beginPath();g.moveTo(lerp(a[0],b[0],0.25),lerp(a[1],b[1],0.25));g.lineTo(lerp(a[0],b[0],0.85),lerp(a[1],b[1],0.85));g.stroke()}
  };
  wingAt(true);                                           // ferne Schwinge (dunkler)
  // Schwanz
  {const tl=P.tail,tw=P.ry*(k==='adler'?1.3:0.9),sw=Math.sin(ph*0.5)*0.08;
   g.fillStyle=P.wing;g.beginPath();g.moveTo(-P.rx*0.7,-P.ry*0.2);
   g.lineTo(-P.rx-tl,-tw*0.9+sw*tl);g.quadraticCurveTo(-P.rx-tl*1.05,sw*tl,-P.rx-tl,tw*0.9+sw*tl);g.lineTo(-P.rx*0.7,P.ry*0.4);g.closePath();g.fill();
   if(P.band){g.strokeStyle=P.band;g.lineWidth=tl*0.22;g.beginPath();g.moveTo(-P.rx-tl*0.35,-tw*0.45);g.lineTo(-P.rx-tl*0.35,tw*0.55);g.stroke()}}
  // Körper
  g.fillStyle=P.col;g.beginPath();g.ellipse(0,0,P.rx,P.ry,0,0,7);g.fill();
  g.fillStyle=P.belly;g.beginPath();g.ellipse(P.rx*0.1,P.ry*0.35,P.rx*0.82,P.ry*0.55,0,0,Math.PI);g.fill();
  if(P.gloss){g.strokeStyle=P.gloss;g.globalAlpha*=0.55;g.lineWidth=P.ry*0.35;g.beginPath();g.moveTo(-P.rx*0.5,-P.ry*0.45);g.quadraticCurveTo(0,-P.ry*0.75,P.rx*0.5,-P.ry*0.35);g.stroke();g.globalAlpha=al!=null&&al<1?al:1}
  // Kopf
  const hx=P.rx*0.88,hy=-P.ry*0.28;
  g.fillStyle=k==='adler'?P.cap:P.cap;g.beginPath();g.arc(hx,hy,P.head,0,7);g.fill();
  if(k==='spatz'){g.fillStyle='#4a3a2a';g.beginPath();g.arc(hx+0.6,hy+1.1,P.head*0.55,0,Math.PI);g.fill()}
  // Schnabel
  g.fillStyle=k==='adler'?'#e0b13a':k==='kraehe'?'#101317':'#d9a84a';
  g.beginPath();g.moveTo(hx+P.head*0.7,hy-P.head*0.38);
  if(k==='adler'){g.quadraticCurveTo(hx+P.head+P.beak*0.9,hy-P.head*0.2,hx+P.head+P.beak*0.75,hy+P.head*0.55);g.lineTo(hx+P.head*0.65,hy+P.head*0.3)}
  else{g.lineTo(hx+P.head+P.beak,hy+P.head*0.12);g.lineTo(hx+P.head*0.7,hy+P.head*0.42)}
  g.closePath();g.fill();
  // Auge
  g.fillStyle=P.eye;g.beginPath();g.arc(hx+P.head*0.28,hy-P.head*0.2,Math.max(0.9,P.head*0.2),0,7);g.fill();
  g.fillStyle='#000';g.beginPath();g.arc(hx+P.head*0.34,hy-P.head*0.2,Math.max(0.5,P.head*0.1),0,7);g.fill();
  wingAt(false);                                          // nahe Schwinge (vorn)
  g.restore();
}

const BIRDS=[];let birdT=12,adlerT=200;
const BIRD_SC={spatz:0.9,kraehe:0.8,adler:1.0};
function updateBirds(dt,tm){

  if(m===10)return{k:1.3,c:['#b8812f','#9a5f25','#8a4a22','#c9a040']};                      // November: braun
  if(m===8)return{k:1.0,c:['#c9b43a','#e0a030','#7ba540','#d98a2b','#5da33f']};             // September: gelb-grün
  if(m===11||m<2)return{k:0.12,c:['#8a6a3a','#7a5a30','#9a7a48']};                          // Winter: nur Restlaub
  if(m===2)return{k:0.22,c:['#8f7a3a','#6f9a3a','#9aa650']};
  if(m===3||m===4)return{k:0.32,c:['#8fc24a','#a6d45a','#7ab83e','#c4dc7a']};               // Frühling: frisches Grün

function drawLeaves(g,tm,dt){
  dt=Math.min(dt||0.016,0.05);
  const wv=H.weather.wind,wk=clamp(wv/14,0,1),pal=leafPalette(),snowy=snowAmt()>0.5;
  const gw=1; // Windrichtung wie beim Regen: von rechts nach links
  // Neue Blätter aus sichtbaren Kronen
  const nC=CROWNS.length/4;
  if(nC>0&&!snowy&&LEAVES.length<130){
    let rate=pal.k*(0.12+12*Math.pow(wk,1.8))*(env.precip?0.6:1)*Math.min(1,nC/6);
    let n=rate*dt;
    while(n>0){
      if(Math.random()<Math.min(1,n)){
        const i=Math.floor(Math.random()*nC)*4,cx=CROWNS[i],cy=CROWNS[i+1],r=CROWNS[i+2],far=CROWNS[i+3];
        const wx=cx+camX+rnd(-r,r),gyy=groundY(wx);
        LEAVES.push({x:wx,o:Math.max(4,gyy-(cy+rnd(-r*0.5,r*0.5))),ph:rnd(0,6.28),rot:rnd(0,6.28),fl:rnd(0,6.28),
          sz:(far?0.75:1)*rnd(3.4,5.6),col:pick(pal.c),fall:rnd(16,30),land:0,far});

  }

    const drift=(4+Math.pow(wv,1.3)*9)*gust;                       // px/s nach links

      const lift=wk*wk*(70*Math.sin(tm*1.3+L.ph)+30);              // Böen wirbeln Blätter auch nach oben

  }

function packIsDown(){
  if(!H||!H.g||!H.g.pack||H.moving||H.ended)return false;
  const k=H.action?H.action.kind:null;
  const now=H.camp.pitched||H.sleep.active||nearFire()||(k&&['fire','feed','cook','tent','ftarp','wood'].includes(k));
  if(now)H.packHold=H.t+25;
  const down=now||(H.packHold!=null&&H.t<H.packHold);
  if(!down)H.packX=null;
  return !!down;
}

       g.strokeStyle='rgba(255,255,255,0.12)';g.lineWidth=1;g.textAlign='center';const step=R.totalKm>60?20:R.totalKm>25?10:R.totalKm>10?5:2;
       for(let k=step;k<R.totalKm;k+=step){const x=k/R.totalKm*w;g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke();g.fillText(k+' km',x,h-2)}}catch(e){console.warn(e)}};

function drawProfile(cv){
  if(!H)return;const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;
  if(cv.width!==w*2||cv.height!==h*2){cv.width=w*2;cv.height=h*2}
  const g=cv.getContext('2d');g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,w,h);
  const R=H.route,N=Math.min(160,Math.floor(w/2));let lo=1e9,hi=-1e9;const ys=[];
  for(let i=0;i<=N;i++){const e=mainElevAt(R.totalPx*i/N);ys.push(e);lo=Math.min(lo,e);hi=Math.max(hi,e)}
  const span=Math.max(60,hi-lo);
  g.beginPath();g.moveTo(0,h);ys.forEach((e,i)=>g.lineTo(i/N*w,h-3-(e-lo)/span*(h-8)));g.lineTo(w,h);g.closePath();g.fillStyle='rgba(76,195,138,0.35)';g.fill();
  g.strokeStyle='#4cc38a';g.lineWidth=1.2;g.beginPath();ys.forEach((e,i)=>i?g.lineTo(i/N*w,h-3-(e-lo)/span*(h-8)):g.moveTo(0,h-3-(e-lo)/span*(h-8)));g.stroke();
  // Orte & Meilensteine
  for(const f of R.feats){if(f.type==='village'){g.fillStyle='#ffb54a';g.fillRect(f.x/R.totalPx*w-1,h-9,2,9)}else if(f.type==='lodge'){g.fillStyle='#6cb8ff';g.fillRect(f.x/R.totalPx*w-1,h-7,2,7)}else if(f.type==='sight'){g.fillStyle='#ffd54a';g.beginPath();g.arc(f.x/R.totalPx*w,6,2.2,0,7);g.fill()}}
  if(typeof COOP!=='undefined'&&COOP&&COOP.peers){const nw=Date.now();for(const u in COOP.peers){const p=COOP.peers[u];if(!p||nw-(p.t||0)>60000||p.x==null)continue;const qx=Math.max(3,Math.min(w-3,p.x/R.totalPx*w));g.fillStyle='#4aa8e8';g.strokeStyle='#fff';g.lineWidth=1.2;g.beginPath();g.arc(qx,h-3-(elevAt(p.x)-lo)/span*(h-8),3.6,0,7);g.fill();g.stroke()}}
  const px=H.x/R.totalPx*w;g.fillStyle='#fff';g.beginPath();g.arc(px,h-3-(elevAt(H.x)-lo)/span*(h-8),3.4,0,7);g.fill();
}

        const x=c.getContext('2d'),sc=Math.max(W/im.width,Hh/im.height),w=im.width*sc,h=im.height*sc;
        x.fillStyle='#000';x.fillRect(0,0,W,Hh);x.drawImage(im,(W-w)/2,(Hh-h)/2,w,h); // Mitte zuschneiden

      im.onerror=()=>toast('Diese Datei konnte nicht als Bild gelesen werden.','bad');im.src=fr.result};

function fbRandCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=A[Math.floor(Math.random()*A.length)];return s}
async function fbEnsureCode(db){

    const c=G.fcode||fbRandCode();
    const snap=await db.ref('codes/'+c).get();
    if(snap.exists()&&snap.val()===FB_UID){G.fcode=c;save();return c}
    if(!snap.exists()){try{await db.ref('codes/'+c).set(FB_UID);G.fcode=c;save();return c}catch(e){}}

function imgShrink(src,maxW,maxH,sq,q){
  return new Promise(res=>{
    if(!src)return res('');
    const im=new Image();
    im.onload=()=>{
      let sx=0,sy=0,sw=im.width,sh=im.height,cw,ch;
      if(sq){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m;cw=ch=maxW}
      else{const k=Math.min(1,maxW/sw,maxH/sh);cw=Math.max(1,Math.round(sw*k));ch=Math.max(1,Math.round(sh*k))}
      const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');
      x.fillStyle='#000';x.fillRect(0,0,cw,ch);x.drawImage(im,sx,sy,sw,sh,0,0,cw,ch);
      res(c.toDataURL('image/jpeg',q));
    };
    im.onerror=()=>res('');im.src=src;
  });
}

  if(LOBBY&&LOBBY.host&&LOBBY.room){try{const mr=db.ref('rooms/'+LOBBY.room+'/meta');const old=(await mr.get()).val();if(old&&old.host===FB_UID){await mr.update({hike:hikeId,seed:Math.floor(Math.random()*0xfffffff)+7,day:hDay,gen:(old.gen||0)+1,name:String(G.name||'Wanderer').slice(0,40)});code=LOBBY.room;ok=true}}catch(e){}}
  for(let i=0;i<6&&!ok;i++){
    code=fbRandCode();
    try{await db.ref('rooms/'+code+'/meta').set({host:FB_UID,hike:hikeId,seed:Math.floor(Math.random()*0xfffffff)+7,day:hDay,name:String(G.name||'Wanderer').slice(0,40),created:firebase.database.ServerValue.TIMESTAMP});ok=true}catch(e){}
  }
  if(!ok)throw new Error('Der Raum konnte nicht angelegt werden.');
  const m=(await db.ref('rooms/'+code+'/meta').get()).val();
  lobbySet(code,true,m.gen||0);COOP={room:code,seed:m.seed,hike:hikeId,host:true,live:false,peers:{},vis:{},ok:false,unlocked:false,day:m.day};
  return code;
}
async function coopRead(code){
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length<4)throw new Error('Bitte einen gültigen Raumcode eingeben.');
  const db=await fbLoad(),m=(await db.ref('rooms/'+code+'/meta').get()).val();
  if(!m||!m.hike)throw new Error('Diesen Raum gibt es nicht (mehr).');
  if(!HIKES.find(h=>h.id===m.hike))throw new Error('Diese Tour kennt dein Spiel nicht.');
  return Object.assign({code},m);
}
function coopArm(m,host){
  lobbySet(m.code,host,m.gen||0);
  COOP={room:m.code,seed:m.seed,hike:m.hike,host:!!host,live:false,peers:{},vis:{},ok:false,unlocked:false,day:m.day};

  fbLoad().then(db=>{
    if(!COOP||!COOP.live)return;
    const me=db.ref('rooms/'+COOP.room+'/players/'+FB_UID);
    COOP.me=me;me.onDisconnect().remove();
    COOP.pref=db.ref('rooms/'+COOP.room+'/players');
    COOP.pcb=COOP.pref.on('value',s=>{const v=s.val()||{};delete v[FB_UID];COOP.peers=v;coopCheck()});
    COOP.gref=db.ref('rooms/'+COOP.room+'/go');COOP.gme=db.ref('rooms/'+COOP.room+'/go/'+FB_UID);COOP.gme.onDisconnect().remove();COOP.gcb=COOP.gref.on('value',s=>{try{coopRecv(s.val()||{})}catch(e){console.error(e)}});

  }).catch(e=>{toast('👥 Verbindung zum Freund nicht möglich: '+((e&&e.message)||e),'bad')});

function coopCheck(){
  if(!COOP)return;
  const now=Date.now(),live=Object.values(COOP.peers).filter(p=>p&&now-(p.t||0)<60000);
  const all=live.length>0&&COOP.ok&&live.every(p=>p.sk);
  if(COOP.wait&&live.length>0&&COOP.rd&&live.every(p=>p.rd)){COOP.wait=false;H.walking=false;toast('🥾 Alle sind da – es geht los!','good')}
  if(all&&!COOP.unlocked){COOP.unlocked=true;toast('⏩ Zeitraffer freigegeben – alle sind einverstanden.','good')}
  if(!all&&COOP.unlocked){COOP.unlocked=false;if(H&&H.speed>1)H.speed=1;toast('⏸ Zeitraffer wieder gesperrt.')}
  coopChip();
}
function coopStep(h){

function coopStop(){
  if(!COOP)return;
  try{if(COOP.timer)clearInterval(COOP.timer)}catch(e){}
  try{if(COOP.pref&&COOP.pcb)COOP.pref.off('value',COOP.pcb)}catch(e){}
  try{if(COOP.me){COOP.me.remove();COOP.me.onDisconnect().cancel()}}catch(e){}
  try{if(COOP.gref&&COOP.gcb)COOP.gref.off('value',COOP.gcb)}catch(e){}
  try{if(COOP.gme){COOP.gme.remove();COOP.gme.onDisconnect().cancel()}}catch(e){}
  COOP=null;const el=document.getElementById('coop');if(el)el.remove();
}

function coopSend(m){
  if(!COOP||!COOP.gme)return;
  m.s=++COOP.sq;m.nm=String(G.name||'Wanderer').slice(0,30);COOP.q.push(m);COOP.q=COOP.q.slice(-25);
  COOP.gme.set({q:COOP.q}).catch(()=>{});
}
function coopRecv(all){
  if(!COOP||!H)return;
  for(const u in all){
    if(u===FB_UID)continue;const q=all[u]&&all[u].q;if(!q)continue;
    const arr=(Array.isArray(q)?q:Object.values(q)).filter(Boolean).sort((a,b)=>a.s-b.s);
    for(const m of arr){
      if(m.to!==FB_UID||m.s<=(COOP.seen[u]||0))continue;COOP.seen[u]=m.s;
      const nm=esc(m.nm||'Freund');
      if(m.k==='food'){const f=FOODS.find(x=>x.id===m.i);if(f){H.food[m.i]=(H.food[m.i]||0)+(m.n||1);toast('🤝 '+nm+' gibt dir '+(m.n||1)+'× '+f.e+' '+f.name+'.','good')}}
      else if(m.k==='water'){const room=Math.max(0,(H.g.waterCap||2)-waterTotal()),add=Math.min(m.n||0.5,room);H.water.clean+=add;toast('🤝 '+nm+' gibt dir '+(add<0.2?'100 ml':fmtN(add,1)+' L')+' Wasser.','good')}
      else if(m.k==='tool'){
        const gd=GEAR.find(x=>x.tool===m.i);if(!gd)continue;
        if(H.g.tools[m.i]){coopSend({k:'ret',i:m.i,b:m.b,to:u});continue}
        H.g.tools[m.i]=true;if(m.b!=null)H.dev[m.i]={batt:m.b,broken:false,def:gd};
        COOP.borrowed[m.i]=u;toast('🤝 '+nm+' leiht dir: '+gd.e+' '+gd.name+' (nur für diese Tour).','good');
      }else if(m.k==='ret'){
        if(H.lent&&H.lent[m.i]){H.g.tools[m.i]=true;const d=H.lent[m.i].dev;if(d){if(m.b!=null)d.batt=m.b;H.dev[m.i]=d}delete H.lent[m.i];toast('🤝 '+nm+' gibt dir die Ausrüstung zurück.','good')}
      }
    }
  }
  try{updateHUD(true)}catch(e){}
}

function coopCamp(g,tm,dt,p){
  const cx0=(p.tx||0)-70,cy0=groundY(cx0);
  if(p.tent){
    const sx=cx0-camX;
    if(sx>-160&&sx<CW+160){
      const sh=p.cs?gearById(p.cs):null,nm=sh&&sh.img?(p.cs==='tarp'&&p.cl&&sh.imgClosed?sh.imgClosed:sh.img):null,tim=nm?img(nm,'svg'):null;
      if(tim){const w=140*(sh.sc||1),h=w*230/512,flap=Math.sin(tm*3+sx*0.01)*env.wind*0.0016;g.save();g.translate(sx,cy0+2);g.transform(1,0,flap,1,0,0);g.drawImage(tim,-w/2,-h,w,h);g.restore()}
      else{const col=p.cs==='tentW'?'#c65a2e':p.cs==='tentUL'?'#4a90c8':'#d97b2b',y=cy0;g.fillStyle=col;g.beginPath();g.moveTo(sx-50,y);g.lineTo(sx,y-52);g.lineTo(sx+50,y);g.closePath();g.fill();g.fillStyle=env.dark>0.5?'#ffd98a':'#2b2b2b';g.beginPath();g.moveTo(sx-14,y);g.lineTo(sx,y-30);g.lineTo(sx+14,y);g.closePath();g.fill()}
      if(p.ln){const im=img('Shopprodukte_Lager Lampe','svg'),lx=cx0+104-camX;if(im)g.drawImage(im,lx-20,cy0-40,40,40)}
      if(p.uv){const im=img('Shopprodukte_UV-Insektenfalle','svg'),ux=cx0+150-camX;if(im)g.drawImage(im,ux-17,cy0-36,34,34);
        if(env.dark>0.4){const fl=0.8+0.2*Math.sin(tm*40),gr=g.createRadialGradient(ux,cy0-20,2,ux,cy0-20,60);gr.addColorStop(0,'rgba(170,110,255,'+(0.28*fl)+')');gr.addColorStop(1,'rgba(140,80,255,0)');g.fillStyle=gr;g.fillRect(ux-70,cy0-90,140,140)}}
    }
  }
  if(p.ft){
    const tx=p.ft-camX,ty=groundY(p.ft);
    if(tx>-120&&tx<CW+120){g.strokeStyle=tc('#3d2c1c');g.lineWidth=3;ln(g,tx-50,ty,tx-50,ty-84);ln(g,tx+50,ty,tx+50,ty-66);
      g.fillStyle=tc('#8b8270');g.beginPath();g.moveTo(tx-56,ty-84);g.lineTo(tx+56,ty-66);g.lineTo(tx+56,ty-59);g.lineTo(tx-56,ty-77);g.closePath();g.fill()}
  }
  if(p.so){
    const px=p.so-camX,py=groundY(p.so);
    if(px>-60&&px<CW+60){g.strokeStyle=tc('#555a60');g.lineWidth=3;ln(g,px-10,py,px-2,py-22);ln(g,px+12,py,px+4,py-22);
      g.fillStyle=tc('#1d3a66');g.beginPath();g.moveTo(px-26,py-22);g.lineTo(px+30,py-22);g.lineTo(px+26,py-46);g.lineTo(px-30,py-46);g.closePath();g.fill();
      g.strokeStyle=tc('#8fb3e8');g.lineWidth=1;g.beginPath();g.moveTo(px-2,py-22);g.lineTo(px-2,py-46);g.moveTo(px-28,py-34);g.lineTo(px+28,py-34);g.stroke()}
  }
  if(p.fx&&p.fl>0){
    const sx=p.fx-camX;
    if(sx>-100&&sx<CW+100){
      drawFireGeneric(g,tm,dt,p.fx,p.fl);
      if(env.dark>0.25){const y=groundY(p.fx),r=130+Math.min(p.fl,160)*0.35,gr=g.createRadialGradient(sx,y-14,6,sx,y-14,r);gr.addColorStop(0,'rgba(255,170,70,'+(0.38*env.dark)+')');gr.addColorStop(1,'rgba(255,140,40,0)');g.save();g.globalCompositeOperation='lighter';g.fillStyle=gr;g.fillRect(sx-r,y-14-r,2*r,2*r);g.restore()}
    }

/* Vor-Ort-Anreise im Wanderurlaub: kurzer Bus/Bahn-Weg von der Urlaubsbasis (Mitte der Routen im Land) zum Startpunkt */
function vacLocal(hk,base){
  const c=startCountry(hk),pts=HIKES.filter(h=>startCountry(h)===c).map(h=>REG_XY[h.reg]).filter(Boolean);
  const b=pts.length?[pts.reduce((a,x)=>a+x[0],0)/pts.length,pts.reduce((a,x)=>a+x[1],0)/pts.length]:null,a=REG_XY[hk.reg];
  let d=0;if(a&&b){const R=6371,rad=x=>x*Math.PI/180,dl=rad(a[0]-b[0]),dn=rad(a[1]-b[1]),h=Math.sin(dl/2)**2+Math.cos(rad(b[0]))*Math.cos(rad(a[0]))*Math.sin(dn/2)**2;d=2*R*Math.asin(Math.sqrt(h))}
  const cost=Math.round((4+d*0.06)/5)*5;
  return Math.max(5,Math.min(cost,Math.max(5,Math.round(base.cost*0.35/5)*5)));
}
function vacBook(c,d){
  const q=vacQuote(c);if(!q)return;
  if(vacActive()){toast('🏕️ Du bist schon im Wanderurlaub: '+G.vac.country+'.','warn');return}
  const price=vacPrice(q,d);
  showModal({title:'🏕️ Wanderurlaub in '+esc(c),wide:true,html:`<p><b>${d} Tage</b> in ${flagsHTML(c)} ${esc(c)}.</p>
   <p>Anreisegebühr ins Land (${q.mode}, Hin- und Rückfahrt, ${d} Tage Aufenthalt): <b>${eur0(price)}</b>${q.days?' · '+q.days+' Reisetag'+(q.days>1?'e':'')+' für die Hinreise':''}</p>
   <p class="hint">Solange der Urlaub läuft, zahlst du für <b>alle Routen in ${esc(c)}</b> nur noch eine kleine Vor-Ort-Anreise (meist 5–25 € statt der teuren Einzelreise aus ${esc(G.home||'Deutschland')}). Die Zeit läuft aber weiter: Nach ${d} Tagen ist der Urlaub vorbei.${G.money<price?' <span class="badtxt">Dafür reicht dein Geld nicht.</span>':''}</p>`,
   buttons:[{label:'🏕️ Buchen für '+eur0(price),primary:1,fn:()=>{
     if(G.money<price){toast('💶 Dafür reicht dein Geld nicht.','bad');return}
     G.money-=price;for(let i=0;i<q.days;i++){G.day++;advanceDay()}
     G.vac={country:c,until:G.day+d,days:d,paid:price};save();
     toast('🏕️ Wanderurlaub in '+c+' gebucht – bis '+dateStr(G.vac.until)+' ohne Anreisekosten.','good');sfx('success');
     renderHikes()}},{label:'Abbrechen'}]});
}
function vacPanel(c){

function travelInfo(hk){
  const t=travelInfoBase(hk);
  if(t.mode!=='Zu Fuß'&&vacActive(startCountry(hk)))return {cost:vacLocal(hk,t),days:0,mode:'Wanderurlaub',km:t.km,vac:true,full:t.cost};
  return t;
}
function travelInfoBase(hk){
  if(hk.trav!=null&&startCountry(hk)===(G.home||'Deutschland'))return {cost:hk.trav,days:0,mode:hk.trav?'Bus / Bahn':'Zu Fuß',km:hk.trav?10+hk.trav*3:0};
  const home=G.home||'Deutschland',a=HOMES[home]||HOMES.Deutschland,b=REG_XY[hk.reg]||a;
  const R=6371,rad=x=>x*Math.PI/180,dl=rad(b[0]-a[0]),dn=rad(b[1]-a[1]);
  const h=Math.sin(dl/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dn/2)**2;
  const d=Math.round(2*R*Math.asin(Math.sqrt(h)));
  const isl=['Schottland','England','Irland','Island'].includes(home),hisl=['scot','eng','irland','island'].includes(hk.reg);
  const sea=(home==='Island')!==(hk.reg==='island')||(isl!==hisl&&d>300)||(isl&&hisl&&home!=={scot:'Schottland',eng:'England',irland:'Irland',island:'Island'}[hk.reg]&&d>400);
  if(d<60)return {cost:12,days:0,mode:'Bus & Bahn',km:d};
  let mode,cost;
  if(sea||d>2300){mode='Flug';cost=2*(45+0.03*d)}else{mode='Zug';cost=2*0.07*d}
  cost=Math.round(Math.max(25,cost)/5)*5;
  return {cost,days:mode==='Flug'?0:Math.floor(d/900),mode,km:d};
}

function thoughtTick(dt){
  if(!H||H.ended||MODAL||H.sleep.active||(H.action&&H.action.kind!=='live')||H.speed>2)return;
  if(TH.cur){if(tm-TH.cur.t0>TH.cur.dur){TH.cur=null;TH.next=tm+14+Math.random()*26}return}
  TH.chk-=dt;if(TH.chk>0)return;TH.chk=1.5;
  if(tm<TH.next)return;
  const L=thoughtList().filter(c=>!(TH.k[c.key]>tm));
  if(!L.length)return;
  const top=Math.max(...L.map(c=>c.pri)),pool=L.filter(c=>c.pri===top);
  if(top<3&&Math.random()>(top>=2?0.5:0.3))return;
  const c=pool[Math.floor(Math.random()*pool.length)],txt=c.txts[Math.floor(Math.random()*c.txts.length)];
  TH.cur={txt,say:c.say,t0:tm,dur:3.8+txt.length*0.045};
  TH.k[c.key]=tm+(c.pri>=3?70:c.pri>=2?110:170);
}
function drawThought(g,sx,y){

  const wd=Math.max(...lines.map(l=>g.measureText(l).width))+20,hh=lines.length*16+12,r=10;
  const rt=sx+wd+34<CW,bx=rt?sx+30:sx-30-wd,by=y-hh/2-12,dr=rt?1:-1,ex=bx+(rt?0:wd);

function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(0.1,(ts-lastTs)/1000||0.016);lastTs=ts;
  tm+=dt;
  if(screen!=='hike'||!H)return;
  const cv=$('#cv');if(!cv)return;
  if(H.speed>4)H.speed=4;
  if(!H.ended&&!MODAL&&!DG&&!(COOP&&COOP.wait)){
    let mult=SPEEDS[H.speed]*3;
    if(!H.sleep.active)mult/=STRETCH; // beim Gehen und Rasten läuft die Uhr normal; nur Schlafen/Ausruhen spult vor
    if(H.sleep.active&&mult>0)mult=Math.max(mult,14);
    accum+=dt*TIME_SCALE*mult/1.15;
    let n=0;const x0=H.x,ph0=H.phase,hp0=H.hopPr||0;
    while(accum>=1/6&&n<70&&!MODAL&&!H.ended&&!DG){stepSim(1/6);accum-=1/6;n++}
    if(n>0){H.vdpr=((H.hopPr||0)-hp0)/n;H.vdx=(H.x-x0)/n;H.vdph=(H.phase-ph0)/n;if(Math.abs(H.vdx)>40)H.vdx=0}
    if(accum>2)accum=0;
    updateIcons(dt*Math.min(SPEEDS[H.speed],4));
    thoughtTick(dt);
    if(H.speed>0&&!H.sleep.active)ambientUpdate(dt);
  }
  if(DG)droneStep(dt);
  if(!H)return;
  {const ce=((DG&&DG.scout&&DG.mode!=='blown'&&DG.mode!=='falling')?elevAt(clamp(DG.padX+DG.x,0,H.route.totalPx)):elevAt(H.x))+(DG?DG.vcam:CAMY)/VS;H.camElev+=(ce-H.camElev)*Math.min(1,dt*(DG?5.5:2.2))}
if(H.side&&H.side.kind==='climb')H.camElev=clamp(H.camElev,elevAt(H.x)-55,elevAt(H.x)+55);
H.cd=(H.cd||0)+(((H.dir||1)<0?1:0)-(H.cd||0))*Math.min(1,dt*2.2);
  const rx=H.x,rph=H.phase;
  if((H.moving||H.crossing)&&!MODAL&&SPEEDS[H.speed]>0&&!H.ended&&H.vdx&&SPEEDS[H.speed]<=6&&!H.sleep.active){const f=clamp(accum*6,0,1);H.x=rx+H.vdx*f;H.phase=rph+(H.vdph||0)*f}
  if(H.crossing&&H.crossing.wp&&!MODAL&&SPEEDS[H.speed]>0&&!H.ended){const f=clamp(accum*6,0,1),o=hopAt(clamp((H.hopPr||0)+(H.vdpr||0)*f,0,1));H.x=o.x;H.hop=o}
  drawScene(cv.getContext('2d'),tm,dt);
  H.x=rx;H.phase=rph;
  hudT-=dt;if(hudT<=0){hudT=0.2;try{updateHUD()}catch(e){console.error(e)}try{updateLivePanel()}catch(e){}}
  if(Math.floor(tm*0.2)%15===0&&Math.floor(tm)%25===0&&!H.ended&&!H._sv){H._sv=1;save()}else if(Math.floor(tm)%25===1)H._sv=0;
}
window.addEventListener('keydown',e=>{
  if(screen!=='hike'||!H)return;
  if(e.key==='Escape'){if(MODAL&&!MODAL.locked)closeModal();else $('#drawer').classList.remove('open')}
  else if(e.key===' '&&!MODAL){e.preventDefault();actClick('walk')}
  else if((e.key==='+'||e.key==='.')&&!MODAL){H.speed=Math.min(4,H.speed+1);updateHUD(true)}
  else if((e.key==='-'||e.key===',')&&!MODAL){H.speed=Math.max(1,H.speed-1);updateHUD(true)}
});

   <rect x="6" y="${8+ (ih-ch-dh)+4}" width="${iw-4}" height="${dh}" fill="#8a6a3a"/><rect x="6" y="${8+(ih-ch)+4}" width="${iw-4}" height="${ch}" fill="#39a0ff"/>
   <text x="${w/2}" y="${h-6}" text-anchor="middle" font-size="10" fill="#fff">${fmtN(cl+di)}/${cap}</text></svg>`;
}

function mapPoints(){
  if(H.mapPts)return H.mapPts;
  const N=Math.ceil(H.route.totalKm*3)+1,r=mulberry32(H.route.totalPx|0);
  const pts=[];let x=0,y=0,a=-0.3+r()*0.6,wob=r()*6;
  for(let i=0;i<N;i++){pts.push([x,y]);wob+=0.11;a+=Math.sin(wob)*0.09+(r()-0.5)*0.22;a+=(-a)*0.012;x+=Math.cos(a);y+=Math.sin(a)}
  H.mapPts=pts;return pts;
}

function clipScore(clips){
  const v=clips.map(c=>c.value).sort((a,b)=>b-a);let s=0;v.slice(0,30).forEach((x,i)=>s+=x*Math.pow(0.94,i));
  const types=new Set(clips.map(c=>c.type)),rar=clips.filter(c=>c.rar>=3).length;
  // Kameraqualität zählt zusätzlich: gute Geräte (Ø-Qualität der besten Clips) heben den Gesamteindruck, billige Kameras drücken ihn
  const top=[...clips].sort((a,b)=>b.value-a.value).slice(0,12),aq=top.length?top.reduce((a,c)=>a+(c.q||0.7),0)/top.length:0.7;
  const camF=0.7+0.45*clamp(aq,0.3,1.35);
  // Abwechslung belohnen: viele verschiedene Motive (Tiere, Sehenswürdigkeiten, Alltag am Lager)
  const names=new Set(clips.map(c=>c.name)).size,variety=1+0.012*Math.min(names,14);
  return s*(1+0.04*Math.min(types.size,6)+0.08*Math.min(rar,3))*camF*variety*0.86;
}

function nameScore(nm){
  const s=nm.trim(),l=s.toLowerCase();let sc=0;
  if(s.length<3)return -1;
  if(s.length>=6&&s.length<=22)sc+=0.25;else if(s.length>30)sc-=0.4;else if(s.length<5)sc-=0.1;
  const words=s.split(/\s+/);if(words.length>4)sc-=0.25;
  const letters=l.replace(/[^a-zäöüß]/g,'');
  const v=(letters.match(/[aeiouäöüy]/g)||[]).length,ratio=letters.length?v/letters.length:0;
  if(ratio>=0.32&&ratio<=0.5)sc+=0.3;else if(ratio<0.2||ratio>0.62)sc-=0.4;
  const runs=(l.replace(/sch|ch|ck|pf|st|tsch|ng|nd|nk/g,'x').match(/[bcdfghjklmnpqrstvwxzß]{4,}/g)||[]).length;sc-=0.3*runs;
  const digits=(s.match(/\d/g)||[]).length;if(digits>=3)sc-=0.35;else if(digits>0)sc-=0.1;
  const syms=(s.match(/[^\wäöüÄÖÜß\s.'-]/g)||[]).length;if(syms>=2)sc-=0.3;
  if(s.length>4&&s===s.toUpperCase()&&/[A-Z]/.test(s))sc-=0.25;
  if(words.length>=2&&words[0][0].toLowerCase()===words[1][0].toLowerCase())sc+=0.2;
  if(/(wander|trail|berg|weg|pfad|fjäll|fjell|nord|wild|hike|gipfel|tour|fern|horizont|kompass|stille|wald)/.test(l))sc+=0.25;
  if(/(.)\1\1/.test(l))sc-=0.2;
  return clamp(sc,-1,1);
}
function renameChannel(nm){
  const old=G.chan,sc=nameScore(nm),since=G.day-(G.lastRename===undefined?-999:G.lastRename);
  G.chan=nm;G.lastRename=G.day;
  const pool=sc>=0.45?['Der neue Name klingt richtig gut! 👏','„'+nm+'“ – das hat Wiedererkennungswert.','Starker Name, passt zum Kanal.','Gefällt mir sogar besser als „'+old+'“!']
    :sc>=0.1?['Okay, ich gewöhne mich dran.','Der neue Name ist in Ordnung, aber „'+old+'“ war auch nicht schlecht.','Hm, klingt solide. Mal sehen.']
    :['Kann man „'+nm+'“ überhaupt aussprechen? 😅','Der alte Name „'+old+'“ war besser.','Warum umbenennen? Das klingt komisch.','Ich verstehe den neuen Namen nicht…','Wer denkt sich sowas aus? 🙈'];
  const n=sc>=0.45?3:sc>=0.1?2:3;
  for(let i=0;i<n;i++)G.comments.unshift({day:G.day,vid:null,user:pick(NAMES),text:pick(pool)});
  if(since<21)G.comments.unshift({day:G.day,vid:null,user:pick(NAMES),text:'Schon wieder ein neuer Name? Entscheide dich mal.'});
  const dl=sc>=0.45?Math.round(G.subs*0.01):sc<0?-Math.round(G.subs*(0.01+(since<21?0.02:0.01))):0;
  G.subs=Math.max(0,G.subs+dl);
  if(G.comments.length>80)G.comments.length=80;
  save();
}

function homeLiveStage(chat,sold,peak,showRes){

  mid.forEach((t,i)=>{if(t.charAt(0)==='\u0001')msgs.push({u:'',t:t.slice(1),sys:1});else msgs.push({u:pick(NAMES),t});if(i%3===2)msgs.push({u:pick(NAMES),t:pick(CHAT_HOME)})});
  while(msgs.length<12)msgs.push({u:pick(NAMES),t:pick(CHAT_HOME)});

  const finish=()=>{if(fin)return;fin=true;clearTimeout(tm);sfx('success');showRes()};

    html:'<div class="hl-top"><span class="hl-live">● LIVE</span><span id="hl-v">👁 1 Zuschauer</span></div><div class="hl-chat" id="hl-chat"></div><p class="hint">Der Chat läuft live mit – die Community kommentiert, während du sendest.</p>',
    buttons:[{label:'⏹ Stream beenden',primary:1,fn:finish}]});

    const box=document.getElementById('hl-chat');if(fin)return;if(!box){finish();return}

      const m=msgs[i++],d=document.createElement('div');

      sfx('click');tm=setTimeout(tick,rnd(650,1600));
    }else tm=setTimeout(finish,1800);
  };
  tm=setTimeout(tick,500);
}

   buttons:[{label:'🚀 Veröffentlichen',primary:1,fn:()=>publishVideos()},{label:'Später'}],
   onOpen:m=>{
     $('#p-title',m).oninput=e=>PUB.title=e.target.value;
     const bind=(sel,attr,key,num)=>$$(sel+' button',m).forEach(b=>b.onclick=()=>{PUB[key]=num?+b.dataset[attr]:b.dataset[attr];$$(sel+' button',m).forEach(x=>x.classList.toggle('on',x===b));sfx('click')});
     bind('#p-th','th','thumb');bind('#p-ep','ep','eps',true);bind('#p-ad','ad','ad',true);
   }});
}
function publishVideos(){
  const p=G.pending;if(!p)return;
  const n=PUB.eps,stale=clamp((G.day-p.day-10)*0.01,0,0.4);
  const title=(PUB.title||p.name).trim().slice(0,80);
  const sorted=[...p.clips].sort((a,b)=>b.value-a.value);
  const lists=Array.from({length:n},()=>[]);sorted.forEach((c,i)=>lists[i%n].push(c));
  const adEach=PUB.ad/n;G.money-=Math.min(PUB.ad,G.money);
  const th=PUB.thumb;
  for(let i=0;i<n;i++){
    const cl=lists[i];const S=clipScore(cl)*(1-stale)*Math.pow(p.mult,0.6);
    const bestClip=cl[0];
    let tm2=1;
    if(th==='pano')tm2=cl.some(c=>c.type==='sight'||c.type==='landschaft'||c.type==='drone')?1.08:0.96;
    if(th==='face')tm2=cl.some(c=>c.type==='selfie'||c.type==='hund')?1.08:0.97;
    if(th==='text')tm2=rnd(0.92,1.15);
    if(th==='drama')tm2=S>60?1.16:0.9;
    if(th==='shot')tm2=(cl.some(c=>c.type==='sight'||c.type==='landschaft'||c.type==='drone')?1.08:0.98)*(1.025+0.02*clamp(p.thumbQ||0.7,0.3,1.35)/1.35);
    const tl=title.length>62?0.95:title.length<8?0.93:1;
    const promo=adEach>0?1+0.5*Math.sqrt(adEach/10)*rnd(0.5,1.5):1;
    const exc=(p.thrill||0)>=3;
    const luck=Math.exp(rnd(-0.5,exc?0.6:0.15));   // außergewöhnlich gut nur bei spannenden Ereignissen
    const V=(2500+G.subs*12)*Math.pow(Math.max(S,2)/45,0.8)*(exc?1:0.85)*luck*(1+0.08*(n-1))*tm2*tl*promo*(1+(p.teaser||0));
    const v={id:++G.vid,title:n>1?title+' – Teil '+(i+1)+'/'+n:title,day:G.day+i*3,tour:p.name,S,V,tau:rnd(5,9),views:0,likes:0,dislikes:0,rev:0,subsG:0,h:[],
      thumb:{id:th,biome:thumbBiome(p.hikeId),e:bestClip?bestClip.e:'🥾',seed:Math.floor(rnd(1,1e6)),hikeId:p.hikeId,img:th==='shot'?p.thumbImg:null},promo:adEach>0?adEach:0,stale:stale>0.15,thrill:p.thrill||0,reason:p.reason,easyAbort:p.reason!=='goal'&&p.diff<=2};
    if(exc&&Math.random()<0.05+(cl.some(c=>c.rar>=3)?0.05:0)+Math.min(0.08,(p.thrill-3)*0.02)){v.hype={start:rnd(1,3)|0,len:Math.round(rnd(5,11)),mul:rnd(6,16)};v.hyped=1}
    (G.videos=G.videos||[]).push(v);
    if(i===0)feedbackComments(p,v);
  }
  G.pending=null;G.flags.first=1;
  G.hikesDone=(G.hikesDone||0)+1;
  save();try{fbAuto(true)}catch(e){}
  sfx('success');
  showModal({title:'🚀 Hochgeladen!',html:`<p>${n>1?n+' Videos sind geplant.':'Dein Video geht online.'} Wie es ankommt, siehst du in den nächsten Tagen im Kanal. Die Einnahmen werden erst am <b>21. des Folgemonats</b> ausgezahlt.</p><p class="hint">Tipp: Lass Zeit vergehen (Zentrale ⏳) oder starte die nächste Tour – aber beachte die Jahreszeit.</p>`,buttons:[{label:'📺 Zum Kanal',fn:()=>{STUDIOTAB='Videos';renderStudio();show('studio')}},{label:'Zur Zentrale',fn:()=>{renderHub();show('hub')}}]});
}

function thumbBiome(id){const hk=HIKES.find(h=>h.id===id);const ok=['wald','berg','tal','wiese','fjaell','sand','kies','sumpf'];const bs=(hk?hk.stages.map(s=>s.b):[]).filter(b=>ok.indexOf(b)>=0);return bs.length?bs[Math.floor(Math.random()*bs.length)]:'wald'}
const THUMB_IM={};
function drawThumb(cv,v){
  const g=cv.getContext('2d'),w=cv.width,h=cv.height,r=mulberry32(v.thumb.seed);
  if(v.thumb.img){const key=(v.id||'p')+':'+v.thumb.img.length;let im=THUMB_IM[key];if(!im){im=THUMB_IM[key]=new Image();im.onload=()=>{try{drawThumb(cv,v)}catch(e){}};im.src=v.thumb.img}
    if(im.complete&&im.naturalWidth){g.drawImage(im,0,0,w,h);return}}
  const pal={wald:['#5b9bd5','#2f6a2d'],berg:['#7aa6d6','#7f8794'],tal:['#8fc0e6','#4f8f3d'],wiese:['#8ec9f0','#8dbf4a'],fjaell:['#9cb6c8','#9a9a6a'],sand:['#8fc4e8','#e0cf9c'],sumpf:['#a9b8a0','#7a6a43'],kies:['#9cb6c8','#9d9b95'],schnee:['#b5c9de','#eef2f7']}[v.thumb.biome]||['#8fc0e6','#4f8f3d'];
  const sunset=r()<0.4;
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,sunset?'#f6a35c':pal[0]);gr.addColorStop(1,sunset?'#ffd9a0':'#e6f2fb');g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.fillStyle=shade(pal[1],-0.25);g.beginPath();g.moveTo(0,h);for(let x=0;x<=w;x+=10)g.lineTo(x,h*0.55-Math.abs(Math.sin(x*0.03+v.thumb.seed))*h*0.28-r()*3);g.lineTo(w,h);g.fill();
  g.fillStyle=pal[1];g.fillRect(0,h*0.78,w,h*0.22);
  const t=v.thumb.id;
  if(t==='face'){drawHiker(g,w*0.3,h*0.98,0.9,{look:lookNow(),mode:'idle',phase:0,tm:0,packColor:packCol(slotOf('pack'))||'#c0392b'});g.font=Math.round(h*0.4)+'px "Noto Color Emoji","Segoe UI Emoji",sans-serif';g.textAlign='center';g.fillText(v.thumb.e,w*0.72,h*0.6)}
  else if(t==='text'){g.font='900 '+Math.round(h*0.26)+'px Impact,Arial Black,sans-serif';g.textAlign='center';g.lineWidth=5;g.strokeStyle='#000';g.fillStyle='#ffe14a';const word=(v.tour.split(/[ –-]+/).find(x=>x.length>3)||v.tour).toUpperCase();g.strokeText(word,w/2,h*0.55);g.fillText(word,w/2,h*0.55);g.font=Math.round(h*0.3)+'px "Noto Color Emoji",sans-serif';g.fillText(v.thumb.e,w*0.5,h*0.9)}
  else if(t==='drama'){g.fillStyle='rgba(255,40,40,0.25)';g.fillRect(0,0,w,h);g.strokeStyle='#ff2d2d';g.lineWidth=6;g.strokeRect(3,3,w-6,h-6);g.font=Math.round(h*0.55)+'px "Noto Color Emoji","Segoe UI Emoji",sans-serif';g.textAlign='center';g.fillText(v.thumb.e,w*0.5,h*0.72);g.fillStyle='#ff2d2d';g.font='900 '+Math.round(h*0.3)+'px Arial';g.fillText('➜',w*0.15,h*0.5)}
  else{g.font=Math.round(h*0.5)+'px "Noto Color Emoji","Segoe UI Emoji",sans-serif';g.textAlign='center';g.fillText(v.thumb.e,w*0.5,h*0.72)}
}
function lineChart(cv,vals,col,fill){
  const w=cv.clientWidth||300,h=cv.clientHeight||140;cv.width=w*2;cv.height=h*2;const g=cv.getContext('2d');g.scale(2,2);g.clearRect(0,0,w,h);
  if(!vals.length){g.fillStyle='#777';g.fillText('Noch keine Daten',10,h/2);return}
  const mx=Math.max(1,...vals)*1.1;g.strokeStyle='#333';g.lineWidth=1;for(let i=0;i<4;i++){g.beginPath();g.moveTo(0,h-6-i*(h-14)/3);g.lineTo(w,h-6-i*(h-14)/3);g.stroke()}
  g.beginPath();vals.forEach((v,i)=>{const x=i/Math.max(1,vals.length-1)*(w-4)+2,y=h-6-(v/mx)*(h-14);i?g.lineTo(x,y):g.moveTo(x,y)});
  g.strokeStyle=col;g.lineWidth=2;g.stroke();
  if(fill){g.lineTo(w-2,h-6);g.lineTo(2,h-6);g.closePath();g.fillStyle=col+'44';g.fill()}
  g.fillStyle='#aaa';g.font='10px sans-serif';g.textAlign='left';g.fillText(fmtInt(mx/1.1),4,10);
}
function renderStudio(){
  const vids=G.videos||[],live=vids.filter(v=>v.day<=G.day);
  const last=G.hist.slice(-28),v28=last.reduce((a,x)=>a+x.views,0),r28=last.reduce((a,x)=>a+x.rev,0);
  const sub0=last.length?last[0].subs:G.subs,sub28=G.subs-sub0;
  const tabs=['Übersicht','Videos','Analytics','Community','Live'].concat(G.subs>=2000||(G.sponsors&&G.sponsors.length)||(G.offers&&G.offers.length)||(G.loans&&G.loans.length)||(G.loanOffers&&G.loanOffers.length)?['Partner']:[]);

  let body='';

    const top=[...live].sort((a,b)=>b.views-a.views)[0];
    body=`${idleWarnHTML()}<div class="kpis"><div class="kpi">Abonnenten<b>${fmtInt(G.subs)}</b><small>${sub28>=0?'+':''}${sub28} in 28 Tagen</small></div><div class="kpi">Aufrufe (28 Tage)<b>${fmtInt(v28)}</b></div><div class="kpi">Einnahmen (28 Tage)<b>${eur(r28)}</b></div><div class="kpi">Ausstehend<b>${eur(G.pendCur+G.pendPrev)}</b><small>Auszahlung am 21.</small></div><div class="kpi">Ausgezahlt gesamt<b>${eur(G.earned)}</b></div></div>
     <h4>Aufrufe pro Tag (60 Tage)</h4><canvas class="chart" id="ch1"></canvas>
     ${top?`<h4>Bestes Video</h4><div class="vrow"><canvas id="th-top" width="150" height="84"></canvas><div class="mt"><b>${esc(top.title)}</b><br><small>${fmtInt(top.views)} Aufrufe · ${eur(top.rev)}</small></div></div>`:'<p class="hint">Noch keine Videos. Wandere und veröffentliche dein erstes Video!</p>'}`;
  }else if(STUDIOTAB==='Videos'){
    body=vids.length?[...vids].reverse().map(v=>{const on=v.day<=G.day,age=G.day-v.day;
      return `<div class="vrow"><canvas width="150" height="84" data-v="${v.id}"></canvas><div class="mt"><b>${esc(v.title)}</b>${v.hype&&on&&age>=v.hype.start&&age<v.hype.start+v.hype.len?'<span class="badge hot">🚀 Viral</span>':''}${v.promo?'<span class="badge">📣 beworben</span>':''}<br>
        <small>${on?(age===0?'Heute':'vor '+age+' Tagen')+' · ':'Geplant für '+dateStr(v.day)+' · '}${fmtInt(v.views)} Aufrufe · 👍 ${fmtInt(v.likes)} · 👎 ${fmtInt(v.dislikes||0)} · +${v.subsG} Abos · ${eur(v.rev)}</small></div></div>`}).join(''):'<p class="hint">Noch keine Videos.</p>';
  }else if(STUDIOTAB==='Analytics'){
    body=`<h4>Abonnenten-Verlauf</h4><canvas class="chart" id="ch2"></canvas><h4>Einnahmen pro Tag (gutgeschrieben)</h4><canvas class="chart" id="ch3"></canvas><h4>Aufrufe pro Tag (120 Tage)</h4><canvas class="chart" id="ch4"></canvas>
     <p class="hint">Videos bringen die meisten Aufrufe in den ersten ein bis zwei Wochen und dann noch lange einen kleinen Rest. Selten läuft ein Video plötzlich viral. Zu häufiges Betteln im Livestream senkt Reichweite und Abos für mehrere Tage (aktuell: ${G.begHeat>2?'<span class="badtxt">Ruf angeschlagen</span>':'okay'}).</p>`;
  }else if(STUDIOTAB==='Community'){
    body=G.comments.length?G.comments.slice(0,30).map(c=>{const v=(G.videos||[]).find(x=>x.id===c.vid);return `<div class="cmt"><b>${esc(c.user)}</b>${c.fr?' 👥':''} <small>· ${dateStr(c.day)}${v?' · '+esc(v.title.slice(0,40)):''}</small><br>${esc(c.text)}</div>`}).join(''):'<p class="hint">Noch keine Kommentare.</p>';
  }else if(STUDIOTAB==='Partner'){

    body=`<h4>Anfragen</h4>${of.length?of.map(o=>`<div class="cmt"><b>${esc(o.name)}</b> · ${esc(o.what)}<br><small>${eur0(o.fee)} pro Monat · verlangt mindestens ein Video pro Monat mit gutem Material · Angebot gilt noch ${o.until-G.day} Tage</small><div class="seg" style="margin-top:6px"><button class="primary" data-of="${o.id}" data-ok="1">Annehmen</button><button data-of="${o.id}">Ablehnen</button></div></div>`).join(''):'<p class="hint">Aktuell keine Anfragen. Werbepartner melden sich bei größeren Kanälen von selbst.</p>'}
      <h4>Laufende Partnerschaften</h4>${sp.length?sp.map(s=>`<div class="cmt"><b>${esc(s.name)}</b> · ${eur0(s.fee)} pro Monat<br><small>Nächste Prüfung in ${Math.max(0,s.next-G.day)} Tagen${s.strikes?' · <span class="badtxt">unzufrieden</span>':''}</small></div>`).join(''):'<p class="hint">Keine aktiven Partner.</p>'}
      ${loanHTML()}<p class="hint">Partner erwarten regelmäßig Videos mit gutem Material. Bleiben Videos aus oder sind sie zu schwach, springen sie wieder ab.</p>`;
  }else{
    body=homeLiveCard()+(G.lives.length?`<div class="kpis"><div class="kpi">Livestreams<b>${G.lives.length}</b></div><div class="kpi">Spenden gesamt<b>${eur(G.liveEarned)}</b></div><div class="kpi">Ruf<b>${G.begHeat>4?'😠 schlecht':G.begHeat>1.5?'😐 angekratzt':'😊 gut'}</b></div></div>`+[...G.lives].reverse().map(l=>`<div class="cmt"><b>${dateStr(l.day)}</b> · Ø ${fmtN(l.avg,0)} Zuschauer (Spitze ${Math.round(l.peak)}) ${l.home?'· 🏠 Studio'+(l.aff?' · Provision '+eur(l.aff):''):'· Spenden '+eur(l.don)} · +${l.gain}${l.loss?' / −'+l.loss:''} Abos${l.begs>1?' · <span class="badtxt">'+l.begs+'× gebettelt</span>':''}</div>`).join(''):'<p class="hint">Noch kein Livestream. Beim Rasten unterwegs: Menü ☰ → Livestream. Kleine Kanäle haben sehr wenige Zuschauer. Ein Spendenaufruf pro Stream reicht.</p>');
  }
  $('#s-studio').innerHTML=`<div class="wrap"><div class="topbar"><h2>📺 Studio</h2><button id="st-back">◀ Zentrale</button></div>
   <div class="yt"><div class="ytban" style="${G.banner?`background:#000 url(${G.banner}) 50% ${G.bannerPos==null?50:G.bannerPos}%/${G.bannerFit||'cover'} no-repeat`:''}"></div><div class="ythead"><div class="ytav" style="${G.avatar?`background:url(${G.avatar}) center/cover`:`background:${jk}`}">${G.avatar?'':esc((G.chan||'W')[0].toUpperCase())}</div><div><h3 style="margin:0"><span id="ch-rn" style="cursor:pointer;border-bottom:1px dashed #ffffff66" title="Zum Umbenennen anklicken">${esc(G.chan)}</span> </h3><small>@${esc(G.chan.replace(/\s+/g,'').toLowerCase())} · ${fmtInt(G.subs)} Abonnenten · ${live.length} Videos</small><div class="imgbtns" style="margin-top:6px">${imgBtns()}</div></div></div>
    <div class="tabs" style="padding:0 16px">${tabs.map(t=>`<button data-stt="${t}" class="${STUDIOTAB===t?'on':''}">${t}</button>`).join('')}</div>
    <div style="padding:6px 16px 16px">${body}</div></div></div>`;
  $('#st-back').onclick=()=>{renderHub();show('hub')};
  bindImgBtns($('#s-studio'),()=>renderStudio());
  const rnb=$('#ch-rn');if(rnb)rnb.onclick=()=>showModal({title:'Kanal umbenennen',html:'<p class="hint">Die Community reagiert darauf – je nachdem, wie gut der Name klingt.</p><input id="ch-new" maxlength="30" style="width:100%" value="'+esc(G.chan)+'">',buttons:[{label:'Umbenennen',primary:1,fn:()=>{const v=(RNV||'').trim();if(v.length<3||v===G.chan){toast('Bitte einen anderen Namen mit mindestens 3 Zeichen eingeben.');return}renderStudioAfterRename(v)}},{label:'Abbrechen'}],onOpen:m=>{RNV=G.chan;$('#ch-new',m).oninput=e=>RNV=e.target.value}});

  const hlb=$('#hl-start');if(hlb)hlb.onclick=()=>homeLiveDialog();
  $$('[data-lo]').forEach(b=>b.onclick=()=>{const id=+b.dataset.lo,o=(G.loanOffers||[]).find(x=>x.id===id);if(!o)return;G.loanOffers=G.loanOffers.filter(x=>x!==o);if(b.dataset.ok&&!G.owned[o.gear]){G.owned[o.gear]=1;G.cond[o.gear]=100;(G.loans=G.loans||[]).push({id:o.id,brand:o.brand,gear:o.gear,until:G.day+90,shown:false});sfx('coin')}save();renderStudio()});

  if($('#ch1'))lineChart($('#ch1'),G.hist.slice(-60).map(x=>x.views),'#4cc38a',true);
